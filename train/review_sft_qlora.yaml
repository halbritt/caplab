# LLaMA-Factory QLoRA SFT for the striatum review lane.
#   llamafactory-cli train train/review_sft_qlora.yaml
#
# Hardware: does NOT fit one 24 GiB 3090 at this cutoff_len. Intended for the
# quad-3090 rig (DeepSpeed ZeRO-3 offload, see `deepspeed:` below) or a single
# rented 80 GiB card (drop the deepspeed line).
#
# model_name_or_path: set to the local HF snapshot of the model you will SERVE.
# The standing default endpoint serves Qwen3.6-35B-A3B; the dense 27B is the
# simpler tuning target. Pick one and keep serving + tuning on the same model.

model_name_or_path: /home/halbritt/models/hf/Qwen3.6-27B   # <- place HF weights here
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all
quantization_bit: 4          # QLoRA (bitsandbytes nf4)

dataset_dir: ../sft          # relative to this file's directory
dataset: striatum_review,striatum_planning,striatum_design,striatum_proposal
eval_dataset: striatum_review_eval
template: qwen3
enable_thinking: false       # train no-think; serve with enable_thinking=false
cutoff_len: 40960            # covers the max review prompt (~32k tok) + target
max_samples: 100000
preprocessing_num_workers: 8
packing: false               # long, whole examples; do not pack

output_dir: out/review-sft-r1
logging_steps: 5
save_steps: 100
save_total_limit: 3
plot_loss: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
flash_attn: fa2
gradient_checkpointing: true

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100

deepspeed: ds_zero3_offload.json   # quad-3090 path; remove on a single 80 GiB card
