[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-capability-lab"
version = "0.1.0"
description = "Behavioral capability measurement for software agents"
requires-python = ">=3.12"

[project.urls]
Repository = "https://github.com/halbritt/caplab"
Issues = "https://github.com/halbritt/caplab/issues"

[project.scripts]
caplab = "caplab.__main__:main"

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5", "pyyaml>=6,<7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"caplab" = ["_source_commit.txt"]
"caplab.dashboard" = ["*.css", "*.html", "*.js", "studies/*.json"]
"caplab.revbench" = ["contracts/*"]
"caplab.runtime" = ["requirements.lock", "migrations/*.sql"]
