id: scheduler
kind: policy
policy_version: 1
placement:
  objectives:
    fallback: default
    by_pass:
      fixture-review: highest-quality
  comparator:
    id: fixture-dominance
    latency_worse_ratio_bp: 12500
    cost_worse_ratio_bp: 12500
    adverse_completion_worse_delta_bp: 500
    quality_advantage_delta_bp: 200
  staleness:
    metric: ledger_seq_lag
    unit: records
    max_lag: 5000
    boundary: inclusive
  effort_order: [low, medium, high, xhigh, max]
placement_rules:
  - id: fixture-build-backends
    match: {pass: fixture-build}
    prefer: {backends: [fixture-alpha, fixture-alpha]}
  - id: fixture-gating-review
    match: {pass: fixture-review, gating: true}
    require: {independence: subject}
  - id: fixture-review-quality
    match: {pass: fixture-review}
    prefer: {quality_profile: highest}
telemetry:
  influence: none
  min_samples: 20

