name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            src/caplab/runtime/requirements.lock
            requirements-test.lock
      # Revbench executes subjects under bubblewrap (ADR-0063) and the
      # advisory runner contains every lane with it; the runner image ships
      # without it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap && bwrap --version
      - run: python -m pip install --require-hashes -r src/caplab/runtime/requirements.lock
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: make check
