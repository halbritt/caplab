# Install as /etc/systemd/system/llama-27b.service.d/override.conf.
# The historical unit name is retained so existing monitoring and rollback
# controls keep one service identity.
[Service]
ExecStart=
ExecStart=/home/halbritt/git/llama.cpp/build/bin/llama-server \
    -m /home/halbritt/models/Qwen3.6-35B-A3B-APEX-I-Compact.gguf \
    --lora /home/halbritt/models/Qwen3.6-35B-A3B-Striatum-FT/adapter-f32.gguf \
    -c 262144 \
    -ctk q8_0 \
    -ctv q8_0 \
    -fa on \
    -np 1 \
    --temp 0.6 \
    --top-p 0.95 \
    --top-k 20 \
    --min-p 0.0 \
    --jinja \
    --metrics \
    --host 0.0.0.0 \
    --port 8081 \
    --alias qwen3.6-ft,qwen3.6-35b-a3b
