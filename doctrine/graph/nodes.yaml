- id: performance-cache-validity
  kind: tradeoff
  label: Cache validity, ownership, and bounds
  definition: Caching is earned by repeated expensive work plus a complete key, freshness/invalidation policy, capacity, ownership, concurrency, security context, and measured macro benefit.
  operational_significance: Exposes time-space-consistency costs instead of treating memoization as free speed.
