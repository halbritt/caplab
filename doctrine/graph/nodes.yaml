    owner: concept-record
    source_id: testing-database-production-fidelity
  kind: principle
  label: Test the database with production semantics
  definition: Integration tests against a managed database earn trust only by matching production semantics - the same DBMS vendor (no in-memory substitutes), a separate transaction or unit of work per arrange/act/assert section instead of a shared or umbrella transaction, sequential execution, and leftover-data cleanup at the start of each test.
