- id: operations-synchronized-demand-dispersion
  projection:
    owner: concept-record
    source_id: operations-synchronized-demand-dispersion
  kind: principle
  label: Anticipate and disperse synchronized demand pulses
  definition: Synchronized stimuli - promotions and deep links, mass restarts, on-the-hour cron jobs, cache invalidation storms, and fixed retry intervals - concentrate demand into pulses that require far more than steady-state capacity; anticipate them and disperse the load with communication, waves, jitter, backoff, and pre-scaling.
