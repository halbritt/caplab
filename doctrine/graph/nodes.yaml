  kind: heuristic
  label: Provide runtime control surfaces where replacement is slow
  definition: A service whose instances start slowly needs pre-built, scriptable, access-restricted control interfaces for targeted runtime intervention - resetting circuit breakers, resizing pools, disabling specific integrations, reloading configuration, draining load, toggling features - while fast-restarting instances are better replaced than controlled.
