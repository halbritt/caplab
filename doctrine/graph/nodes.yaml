  label: Treat every request and externally influenced value as untrusted
  definition: Every request and every externally influenced value is untrusted regardless of network position - validate and escape input at each interpreter boundary instead of concatenating strings into queries, markup, or paths; authenticate all callers including internal ones; and authorize each object access per request, since possession of a URL, a session, or an internal IP confers no authority.
