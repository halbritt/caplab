  definition: Stability properties change with instance counts and inter-layer capacity ratios that development and QA environments never reproduce; many-to-one relationships, point-to-point topologies, and shared resources must be evaluated at production multiplicity and designed - not tested - out.
  operational_significance: O(n^2) connection growth and shared-resource saturation emerge only at production scale, where the front end can always overwhelm the back end because their capacities are unbalanced by design.
