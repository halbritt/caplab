  label: Require an unbroken chain of custody for production executables
  definition: Production executables must arrive through an unbroken tamper-resistant chain of custody - version-controlled source, dependencies and build plugins verified against upstream signatures in a private repository, and builds performed only on a clean CI server that writes to a write-protected artifact store.
