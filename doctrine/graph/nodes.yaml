  projection:
    owner: concept-record
    source_id: operations-externalized-configuration
  kind: principle
  label: Keep per-environment configuration outside the artifact
  definition: Per-environment configuration must live outside the deployable artifact and its source repository so identical binaries promote across environments, with per-machine values separated, properties named by function, and a shared configuration service adopted only as an organization-level commitment whose unavailability instances can survive.
  operational_significance: Configuration baked into artifacts forces rebuilds per environment and leaks environment coupling, while a configuration service adopted casually becomes a severity-one hard dependency that can shut down the fleet from one partitioned node.
