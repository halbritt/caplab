  - intervention
  - no-change
  - agent-conduct
- id: universal-preserve-behavior-by-default
  kind: principle
  label: Preserve behavior by default
  definition: Observable behavior remains inside the preservation boundary unless an authorized contract explicitly releases or changes it.
  operational_significance: Makes semantic authority explicit and prevents repair or redesign from hiding inside structural work.
  status: canonical
  confidence: universal
  doctrine_refs:
  - universal-preserve-behavior-by-default
  formulations:
  - F-SRC-REF-C02-TWO-DEFINITIONS
