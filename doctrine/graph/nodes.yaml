- id: operations-integration-point-distrust
  projection:
    owner: concept-record
    source_id: operations-integration-point-distrust
  kind: principle
  label: Treat every integration point as a future failure
  definition: Every out-of-process integration point - socket, HTTP call, database query, vendor client library - will eventually hang, fail slowly, or violate its protocol, so each one requires explicit timeouts, failure-mode handling, and validation of responses as untrusted data.
  operational_significance: Integration points are the leading killer of systems, and slow or protocol-violating failures are worse than fast clean ones because they tie up caller resources.
