nodes:
- id: universal-evidence-before-intervention
  kind: principle
  label: Evidence before intervention
  definition: An engineering intervention is earned only by evidence capable of establishing the claimed problem and distinguishing the proposed response from no change or lower-cost alternatives.
  operational_significance: Prevents smells, aesthetics, fashion, and source prestige from becoming action mandates.
  status: canonical
  confidence: universal
  doctrine_refs:
  - universal-evidence-before-intervention
  formulations:
  - F-SRC-SDX-C01-DEBT-DEPENDS-ON-CHANGE
  - F-SRC-SDX-C02-HOTSPOTS-FOCUS
  - F-SRC-WELC-C01-CHANGE-PRESERVATION
