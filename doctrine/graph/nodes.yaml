  kind: principle
  label: Owned resource and task lifecycle
  definition: Every task, goroutine, executor, connection, file, queue, buffer, or pool has an owner, capacity, completion and error path, cancellation or shutdown, and cleanup semantics.
  operational_significance: Treats leaks and abandoned work as correctness, availability, durability, and performance concerns together.
