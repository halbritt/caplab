- id: universal-change-amplification
  kind: principle
  label: Change amplification
  definition: Structure is costly when one conceptual change forces disproportionate, risky, or cross-owner edits; the signal must be interpreted in context.
  operational_significance: Converts vague maintainability concerns into inspectable change pressure.
  status: canonical
  confidence: universal
  doctrine_refs:
