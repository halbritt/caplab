  - authority
  - change-classification
- id: universal-minimize-simultaneous-uncertainty
  kind: principle
  label: Minimize simultaneous uncertainty
  definition: When causality or preservation matters, change one interpretable variable at a time and keep feedback close enough to locate any failure.
  operational_significance: Supports diagnosis, safe change, review, and rollback by preventing interacting unknowns.
  status: canonical
  confidence: universal
  doctrine_refs:
  - universal-minimize-simultaneous-uncertainty
