    source_id: operations-ephemeral-instance-design
  kind: principle
  label: Treat instance identity, storage, and clock as ephemeral
  definition: Services must treat machine identity, IP address, local storage, and clock as ephemeral and unreliable, tolerating the loss or slowdown of any single instance, avoiding irreplaceable special machines, and letting new instances volunteer for work instead of being individually configured.
