  kind: principle
  label: Design transparency in from the start
  definition: Every instance must be designed from the start to reveal its historical, present, and projected state through operator-aimed logs, metrics, and health checks, with alert thresholds and health-rollup policy held outside the instance, because opaque systems cannot be diagnosed, tuned, or kept funded in production.
