  kind: proof-obligation
  label: Causal bottleneck profile
  definition: Select and interpret a representative resource profile before changing the bottleneck, following direct and cumulative cost across concurrency and runtime boundaries.
  operational_significance: Converts a visible hotspot into ranked causal hypotheses rather than a reflexive edit.
