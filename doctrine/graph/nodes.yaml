- id: refactoring-cochange-evidence
  kind: heuristic
  label: Co-change as coordination evidence
  definition: Repeated coordinated edits reveal temporal coupling or shared change pressure; static, domain, and process evidence must determine whether the coupling is expected, harmful, or incidental.
  operational_significance: Finds invisible dependencies while preventing a heat map from becoming an automatic merge/split plan.
  status: contextual
  confidence: contextual
