- id: performance-algorithm-and-work-first
  kind: principle
  label: Work and algorithm before micro-tuning
  definition: Eliminate work, improve algorithms and representations, and reduce data movement before paying for fragile low-level specialization.
  operational_significance: Directs effort to the largest leverage while preserving simpler options.
