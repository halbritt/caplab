- id: operations-least-privilege
  projection:
    owner: concept-record
    source_id: operations-least-privilege
  kind: principle
  label: Run with least privilege and least exposure
  definition: Every service process runs as a dedicated non-administrative account with the least privilege its task requires and the smallest network exposure its role requires - isolated per application, and binding each listening socket to an explicitly configured interface rather than all interfaces on multihomed hosts.
  operational_significance: Software running as root converts any vulnerability into full-host compromise, and default listening on every interface exposes production services to administrative and backup networks they were never meant to face.
