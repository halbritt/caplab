  projection:
    owner: concept-record
    source_id: operations-bounded-accumulation
  kind: principle
  label: Pair every accumulation with a recycling or bounding mechanism
  definition: Every mechanism that accumulates a resource - database rows, log files, in-memory caches, sessions, queues - must be paired with a mechanism that recycles or bounds it, so the system runs at least a full release cycle without human fiddling; callers must likewise bound how much response they will accept.
