  label: Give tests no privileges production clients lack
  definition: Tests must interact with the system under test exactly as production clients do, with no special privileges - do not publicize private methods or private state for testing, re-derive expected values with the algorithm under test, add test-only switches to production code, or partially mock concrete classes; each pressure signals a missing abstraction or an unseparated responsibility to extract instead.
