- id: legacy-seams-and-enabling-points
  kind: pattern
  label: Seam and enabling point
  definition: A seam is a place where program behavior can vary without editing the core logic; its enabling point is where the alternative behavior is selected or controlled.
  operational_significance: Gives legacy agents a bounded way to test or substitute dependencies before redesigning the system.
  status: canonical
  confidence: strong
  doctrine_refs:
