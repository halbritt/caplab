- id: refactoring-behavior-preservation
  kind: proof-obligation
  label: Refactoring behavior-preservation proof
  definition: A refactoring campaign must identify the observable boundary it claims to preserve and supply feedback capable of detecting relevant regression throughout the transformation.
  operational_significance: Distinguishes refactoring from behavior-changing implementation and limits confidence to exercised properties.
  status: canonical
  confidence: universal
  doctrine_refs:
  - refactoring-behavior-preservation
  formulations:
