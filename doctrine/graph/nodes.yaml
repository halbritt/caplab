- id: performance-target-based-stop
  kind: constraint
  label: Target-based optimization stop
  definition: Retain an isolated optimization only when it materially improves the authorized target without violating preservation or other budgets, and stop once the target is met.
  operational_significance: Limits optimization scope and makes reversion a normal experiment result.
