  projection:
    owner: concept-record
    source_id: operations-chaos-experiment-discipline
  kind: principle
  label: Establish whole-system resilience by disciplined fault injection
  definition: Whole-system resilience is established by hypothesis-driven fault-injection experiments against the real system under a defined healthy steady state, bounded blast radius, request tracing, and a rehearsed recovery plan - not by component tests or staging environments, because safety is not composable.
  operational_significance: Independently safe components compose into unsafe systems - two providers each meeting a 30ms p99.9 break a 50ms client budget in sequence - and well-protected systems stop emitting the failure evidence that would otherwise justify confidence.
