    source_id: operations-liveness-by-external-observation
  kind: principle
  label: Judge liveness by external observation, not process checks
  definition: A running process is not a live system; the dominant failure mode is a process whose threads are all blocked, so health must be judged by externally executed synthetic transactions and business-level metrics, not by process, port, or status-page checks.
