  kind: conflict
  label: Model Fidelity Vs Performance Representation
  definition: 'Contested positions: preserve-domain-representation: Keep code and data shaped around domain language and invariants so policy remains intelligible. | specialize-runtime-representation: Use a different storage, indexing, batching, or computation representation when the domain-shaped form cannot meet an accepted resource objective.'
  operational_significance: Preserve the domain-facing model by default; add the narrowest specialized representation behind an explicit translation boundary only when profiling and representative benchmarks justify it and equivalence, synchronization, recovery, and retirement are protected.
