- id: performance-specialization-evidence
  kind: tradeoff
  label: Evidence-earned hot-path specialization
  definition: Specialized or duplicated fast-path code is justified only by a stable profiled bottleneck, material macro benefit, semantic equivalence, and explicit maintenance and portability cost.
  operational_significance: Preserves the option to specialize without turning it into a universal preference for low-level code.
