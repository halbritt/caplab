- id: refactoring-smells-as-hypotheses
  kind: heuristic
  label: Smells are hypotheses, not verdicts
  definition: A smell names a recurring structural pattern worth inspecting, but local change pressure, risk, and context determine whether action is warranted.
  operational_significance: Retains diagnostic vocabulary without turning a catalog into mandatory aesthetic cleanup.
  status: canonical
  confidence: strong
  doctrine_refs:
