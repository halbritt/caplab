- id: performance-earned-bounded-concurrency
  kind: tradeoff
  label: Earned bounded concurrency
  definition: Add a bounded runtime-appropriate concurrency model only when representative evidence shows sequential waiting or parallelizable work prevents the objective and semantics can be preserved.
  operational_significance: Makes scheduling, capacity, state, ordering, cancellation, errors, and lifecycle part of the performance decision.
  status: canonical
