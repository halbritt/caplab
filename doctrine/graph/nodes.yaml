  kind: heuristic
  label: Experiment level fits the claim
  definition: Microbenchmarks, process/system benchmarks, and production observations answer different questions and require explicit escalation gates between levels.
  operational_significance: Prevents local allocation or speed results from being generalized into system capacity or memory claims.
