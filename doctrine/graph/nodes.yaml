  definition: Keep integration tests few and targeted - cover as many edge cases as possible with unit tests, then use integration tests for the longest happy path that touches all out-of-process dependencies plus only those edge cases unit tests cannot exercise, letting fail-fast crashes stand in for tests of wiring bugs that manifest immediately without corrupting state.
