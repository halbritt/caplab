- id: performance-metric-semantics
  kind: proof-obligation
  label: Measurement semantics
  definition: Evidence is interpretable only when its boundary, unit, population, aggregation, granularity, collection behavior, and observer cost are known.
  operational_significance: Separates CPU from wall time, heap from resident memory, and averages from tails before decisions use them.
