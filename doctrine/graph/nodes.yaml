  kind: principle
  label: Value tests as the product of four attributes
  definition: Evaluate every automated test on four attributes - protection against regressions, resistance to refactoring, fast feedback, and maintainability - whose multiplied scores give the test's value; a zero on any attribute makes the test worthless regardless of the others.
