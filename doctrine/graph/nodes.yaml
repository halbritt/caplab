- id: anti-pattern-aesthetic-technical-debt
  kind: anti-pattern
  label: Aesthetic technical-debt declaration
  definition: Declaring code to be costly debt solely because its static form violates a preferred style, without evidence that it is changed, risky, or impeding work.
  operational_significance: Converts maintainability language back into an evidence question rather than an unbounded cleanup mandate.
  status: canonical
  confidence: strong
