  kind: principle
  label: Mock unmanaged dependencies, use managed ones real
  definition: Replace only unmanaged out-of-process dependencies (those whose communications form externally observable, backward-compatible contracts, such as message buses and SMTP) with mocks; use real instances of managed dependencies such as the application database and verify their final state, never interactions with them.
