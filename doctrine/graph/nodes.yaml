- id: refactoring-demonstrated-pressure
  kind: proof-obligation
  label: Demonstrated structural pressure
  definition: Structural change requires concrete episodes in which the current structure amplifies changes, obscures behavior, increases defects or review cost, or blocks authorized work.
  operational_significance: Establishes why a campaign should occur now and what benefit must be shown.
  status: canonical
  confidence: strong
