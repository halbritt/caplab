  label: The live interface's accepted behavior is the contract
  definition: Once an interface is live, its actually accepted and returned behavior is the de facto contract; a new version may require less, accept more, and return more, but may not reject previously accepted traffic, withhold previously returned data, or require more authorization without a versioned migration.
