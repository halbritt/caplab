- id: legacy-sensing-and-separation
  kind: pattern
  label: Sensing and separation
  definition: Sensing exposes the effects that must be observed; separation isolates the unit from dependencies that prevent execution in a harness.
  operational_significance: Prevents indiscriminate mocking by distinguishing what must be observed from what must be replaced.
  status: canonical
  confidence: strong
