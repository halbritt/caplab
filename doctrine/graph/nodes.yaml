- id: legacy-characterization-surfaces
  kind: pattern
  label: Characterization surface
  definition: Capture what poorly understood code currently does at the narrowest stable boundary capable of detecting unintended effects of the required change.
  operational_significance: Creates a preservation baseline without asserting that observed behavior is ideal or intended.
  status: canonical
  confidence: strong
  doctrine_refs:
