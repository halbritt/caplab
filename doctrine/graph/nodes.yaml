- id: heuristic-code-age
  kind: heuristic
  label: Code age as a stability clue
  definition: Age can suggest stable mental chunks or low defect/change exposure, but must be checked for dead code, stale tests, and domain-specific reasons for different rates of change.
  operational_significance: Helps find candidate stable boundaries without equating old code with good or important code.
  status: contextual
  confidence: contextual
