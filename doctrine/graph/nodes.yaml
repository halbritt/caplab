- id: refactoring-leave-unattractive-code
  kind: constraint
  label: Leave unattractive code alone when change is not earned
  definition: Stable or low-impact code may remain structurally unattractive when intervention cost and regression risk exceed demonstrated future change benefit.
  operational_significance: Resists aesthetic refactoring and focuses effort on change-bearing surfaces.
  status: contextual
  confidence: contextual
  doctrine_refs:
