- id: refactoring-hotspot-prioritization
  kind: heuristic
  label: Hotspot prioritization
  definition: Combine change activity with a complexity proxy to focus scarce inspection on code likely to carry high maintenance interest, then inspect the code and context before selecting a remedy.
  operational_significance: Reduces corpus-scale investigation without pretending the metric diagnoses the design defect.
  status: contextual
  confidence: contextual
