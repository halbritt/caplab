  kind: principle
  label: Bound automation with safeguards proportional to its mechanical advantage
  definition: Control-plane automation acting on a mistaken sensed state or a mistaken desired state amplifies failure at machine speed; automated actuators need sanity bounds on their own observations, rate limits and minimum-capacity floors on destructive change, hysteresis, and human confirmation when observed and expected state diverge widely.
  operational_significance: Automation applies mechanical advantage without judgment, so a small sensing or intent error becomes a fleet-wide outage faster than any human can perceive and intervene.
