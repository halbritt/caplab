- id: operations-load-shedding
  projection:
    owner: concept-record
    source_id: operations-load-shedding
  kind: principle
  label: Refuse work fast when obligations cannot be met
  definition: A slow response is more damaging than a fast failure because it ties up resources in caller and provider alike; when demand exceeds timely capacity a service must refuse work quickly and as close to the system edge as possible, because queues backing up across tiers are how systems fail.
  operational_significance: Every failing system starts with a queue backing up somewhere; sockets, TCP buffers, and listen queues make response degrade nonlinearly exactly at peak load while caller retries make it worse.
