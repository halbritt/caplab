- id: refactoring-small-verified-steps
  kind: transformation
  label: Small verified transformation steps
  definition: Apply one behavior-preserving structural transformation at a time, verify immediately, and backtrack to smaller mechanics when confidence falls.
  operational_significance: Bounds the source of regressions and makes a campaign reversible and reviewable.
  status: canonical
  confidence: strong
  doctrine_refs:
