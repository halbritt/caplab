- id: performance-memory-lifecycle
  kind: principle
  label: Memory metric, ownership, and lifetime
  definition: Diagnose allocation, retention, heap, resident memory, mappings, and GC as distinct phenomena, then trace ownership and lifetime to the retained resource.
  operational_significance: Prevents local allocation wins from hiding process-memory, aliasing, or retention regressions.
