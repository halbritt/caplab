schema_version: agent-doctrine-graph-edges/1
edges:
- id: E-characterization-enables-preservation
  from: legacy-characterization-surfaces
  relation: enables
  to: refactoring-behavior-preservation
  claim: Capturing current behavior at a relevant boundary creates feedback that can detect regressions during structural change.
  conditions:
  - the characterization executes the changed path
  - its oracle covers the properties claimed as preserved
  derivation: corroborated
  confidence: strong
  provenance:
  - F-SRC-WELC-C02-COVER-EDIT
  - F-SRC-REF-C04-SELF-TESTING
- id: E-seams-enable-characterization
  from: legacy-seams-and-enabling-points
  relation: enables
  to: legacy-characterization-surfaces
  claim: A controlled variation point can make otherwise entangled behavior executable and observable in a harness.
  conditions:
  - the seam preserves relevant production semantics
  - the enabling point is controlled by the test or diagnostic environment
  derivation: direct
  confidence: strong
  provenance:
  - F-SRC-WELC-C04-SEAM-MODEL
  - F-SRC-WELC-C02-COVER-EDIT
- id: E-sensing-separation-operationalizes-characterization
  from: legacy-sensing-and-separation
  relation: operationalizes
  to: legacy-characterization-surfaces
  claim: Separating dependency obstacles and sensing effects provides the mechanics for a focused characterization harness.
  conditions:
  - substitutions model only behavior relevant to the observation
  derivation: direct
  confidence: strong
  provenance:
  - F-SRC-WELC-C03-SENSING-SEPARATION
- id: E-preservation-constrains-refactoring
  from: universal-preserve-behavior-by-default
  relation: constrains
  to: term-refactoring
  claim: Structural work qualifies as refactoring only within an explicit behavior-preservation boundary.
  conditions:
  - no separate behavior-change authorization reclassifies the work
  derivation: corroborated
  confidence: universal
  provenance:
  - F-SRC-REF-C02-TWO-DEFINITIONS
  - F-SRC-WELC-C05-REFACTORING-DEFINITION
- id: E-small-steps-preserve-behavior
  from: refactoring-small-verified-steps
  relation: preserves
  to: universal-preserve-behavior-by-default
  claim: Small transformations with immediate feedback reduce the number of possible causes when preservation fails and permit cheap reversal.
  conditions:
  - the feedback is relevant and reliable
  derivation: direct
  confidence: strong
  provenance:
  - F-SRC-REF-C05-SMALL-STEPS
  - F-SRC-REF-C15-STOP-WHEN-UNSURE
- id: E-pressure-prerequisite-refactoring
  from: refactoring-demonstrated-pressure
  relation: prerequisite-of
  to: refactoring-small-verified-steps
  claim: Safe mechanics do not by themselves justify a campaign; a demonstrated structural problem must establish why the transformations should occur.
  conditions:
  - the campaign is discretionary structural improvement rather than a required enabling move for urgent repair
  derivation: synthesized
  confidence: strong
  provenance:
  - F-SRC-REF-C02-WHEN-TO-REFACTOR
  - F-SRC-SDX-C01-DEBT-DEPENDS-ON-CHANGE
- id: E-hotspots-evidence-pressure
  from: refactoring-hotspot-prioritization
  relation: evidence-for
  to: refactoring-demonstrated-pressure
  claim: A hotspot raises the expected value of inspecting a structural candidate but becomes action evidence only after local code, history, and context establish the pressure.
  conditions:
  - history is representative and filtered
  - the hotspot remains relevant to current or expected work
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-SRC-SDX-C02-HOTSPOTS-FOCUS
  - F-SRC-SDX-C02-HOTSPOT-INTEREST
- id: E-cochange-indicates-amplification
  from: refactoring-cochange-evidence
  relation: indicates
  to: universal-change-amplification
  claim: Repeated coordinated edits can reveal that one conceptual change is amplified across multiple units.
  conditions:
  - co-change is surprising rather than an expected test/code or generated relationship
  - bulk and mechanical commits are filtered
  derivation: direct
  confidence: contextual
  provenance:
  - F-SRC-SDX-C03-COCHANGE
  - F-SRC-SDX-C03-SURPRISE
- id: E-smells-motivate-inspection
  from: refactoring-smells-as-hypotheses
  relation: motivates
  to: refactoring-demonstrated-pressure
  claim: A smell can focus the search for change pressure but cannot satisfy the proof obligation without concrete repository evidence.
  conditions:
  - local examples and failure/change consequences are inspected
  derivation: synthesized
  confidence: strong
  provenance:
  - F-SRC-REF-C03-SMELL-STARTING-POINTS
  - F-SRC-SDX-C02-HOTSPOTS-FOCUS
- id: E-aesthetic-debt-threatens-evidence
  from: anti-pattern-aesthetic-technical-debt
  relation: threatens
  to: universal-evidence-before-intervention
  claim: Treating static unattractiveness as debt bypasses the evidence needed to show current cost, risk, or opportunity.
  conditions:
  - no independent safety, correctness, or required-change evidence exists
  derivation: corroborated
  confidence: strong
  provenance:
  - F-SRC-SDX-C01-DEBT-DEPENDS-ON-CHANGE
  - F-SRC-REF-C03-SMELL-STARTING-POINTS
- id: E-code-age-refines-no-change
  from: heuristic-code-age
  relation: evidence-for
  to: refactoring-leave-unattractive-code
  claim: Stable age can lower the expected payoff from intervention, but dead code, latent risk, and future change must be checked before choosing no change.
  conditions:
  - age is not caused by non-use or missing history
  - no high-impact safety or compatibility risk overrides change frequency
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-SRC-SDX-C05-OLD-CODE-HEURISTIC
  - F-SRC-SDX-C05-DEAD-CODE
  - F-SRC-REF-C02-WHEN-NOT-TO-REFACTOR
- id: E-tool-trust-refines-proof
  from: refactoring-behavior-preservation
  relation: requires
  to: universal-evidence-before-intervention
  claim: Preservation claims must be based on tests and tool guarantees that actually model the affected language and runtime mechanisms.
  conditions:
  - reflection, dynamic dispatch, generation, side effects, and external consumers are considered where relevant
  derivation: synthesized
  confidence: strong
  provenance:
  - F-SRC-WELC-C05-TOOL-TRUST
  - F-SRC-REF-C05-SMALL-STEPS
- id: E-objective-prerequisite-baseline
  from: performance-measurable-objective
  relation: prerequisite-of
  to: performance-representative-baseline
  claim: A baseline is representative only relative to the operation, workload, environment, resource, and statistic named by the objective.
  conditions:
  - the objective has an identified owner and correctness precondition
  derivation: synthesized
  confidence: universal
  provenance:
  - F-SRC-EGO-PERF-RAER
  - F-SRC-EGO-PRODUCTION-REPRESENTATION
- id: E-metric-semantics-prerequisite-baseline
  from: performance-metric-semantics
  relation: prerequisite-of
  to: performance-representative-baseline
  claim: A numerical baseline cannot be compared until its boundary, unit, population, aggregation, and sampling meaning are stable.
  conditions:
  - before and after instrumentation share compatible semantics
  derivation: corroborated
  confidence: universal
  provenance:
  - F-SRC-EGO-METRIC-SEMANTICS
  - F-SRC-EGO-EXPERIMENT-RELIABILITY
- id: E-baseline-enables-benchmark-validity
  from: performance-representative-baseline
  relation: enables
  to: performance-benchmark-validity
  claim: Versioned representative baseline artifacts provide the controlled comparator required to interpret candidate benchmark results.
  conditions:
  - candidate and baseline preserve workload and correctness equivalence
  derivation: direct
  confidence: strong
  provenance:
  - F-SRC-EGO-EXPERIMENT-RELIABILITY
  - F-SRC-EGO-BENCHMARK-CORRECTNESS
- id: E-experiment-level-constrains-benchmark
  from: performance-experiment-level-fit
  relation: constrains
  to: performance-benchmark-validity
  claim: A valid experiment may still support only a local claim when it omits system interactions; conclusion scope cannot exceed measurement level.
  conditions:
  - omitted runtime and dependency interactions are named
  derivation: corroborated
  confidence: strong
  provenance:
  - F-SRC-EGO-BENCHMARK-LEVELS
  - F-SRC-EGO-MICRO-MEMORY
- id: E-baseline-enables-profile-causality
  from: performance-representative-baseline
  relation: enables
  to: performance-profile-causal-bottleneck
  claim: A representative baseline workload supplies the context in which profile attribution can answer the actual objective.
  conditions:
  - profile build, workload, and interval match the baseline question
  derivation: synthesized
  confidence: strong
  provenance:
  - F-SRC-EGO-PRODUCTION-REPRESENTATION
  - F-SRC-EGO-PROFILE-FIRST
- id: E-profile-before-algorithm-change
  from: performance-profile-causal-bottleneck
  relation: sequenced-before
  to: performance-algorithm-and-work-first
  claim: Work elimination or algorithm change should target a representative causal bottleneck rather than a merely suspicious implementation.
  conditions:
  - a deliberate optimization campaign rather than an obvious low-risk removal of redundant work
  derivation: synthesized
  confidence: strong
  provenance:
  - F-SRC-EGO-PROFILE-FIRST
  - F-SRC-EGO-DO-LESS
- id: E-metric-semantics-requires-memory-diagnosis
  from: performance-memory-lifecycle
  relation: requires
  to: performance-metric-semantics
  claim: Memory diagnosis must distinguish allocation, retained heap, resident/working-set memory, mappings, and garbage-collection cost before selecting a remedy.
  conditions:
  - runtime and operating-system accounting boundaries are known
  derivation: direct
  confidence: strong
  provenance:
  - F-SRC-EGO-GO-MEMORY
  - F-SRC-EGO-MICRO-MEMORY
- id: E-profile-prerequisite-concurrency
  from: performance-profile-causal-bottleneck
  relation: prerequisite-of
  to: performance-earned-bounded-concurrency
  claim: Concurrency as optimization is earned only after evidence shows waiting or safely parallelizable work limits the target.
  conditions:
  - architecture does not independently require concurrency for responsiveness or isolation
  derivation: corroborated
  confidence: strong
  provenance:
  - F-SRC-EGO-CONCURRENCY-LAST
  - F-SRC-FP-CONCURRENCY-MODELS
- id: E-semantic-preservation-constrains-concurrency
  from: performance-semantic-preservation
  relation: constrains
  to: performance-earned-bounded-concurrency
  claim: A concurrent design must preserve or explicitly authorize changes to ordering, atomicity, fairness, idempotency, errors, cancellation, and durability.
  conditions:
  - a workload-specific concurrency design is under consideration
  derivation: synthesized
  confidence: universal
  provenance:
  - F-SRC-EGO-FUNCTIONALITY-PHASE
  - F-SRC-FP-ASYNC-SEMAPHORE
  - F-SRC-EGO-CONCURRENCY-LATENCY
- id: E-lifecycle-constrains-concurrency
  from: performance-resource-lifecycle
  relation: constrains
  to: performance-earned-bounded-concurrency
  claim: Every worker, task, process, or goroutine requires owned capacity, errors, completion, cancellation, and shutdown.
  conditions:
  - concurrent work or resources are created
  derivation: corroborated
  confidence: universal
  provenance:
  - F-SRC-EGO-GOROUTINE-LIFECYCLE
  - F-SRC-FP-ASYNC-CONTEXT
- id: E-semantic-preservation-constrains-specialization
  from: performance-semantic-preservation
  relation: constrains
  to: performance-specialization-evidence
  claim: A specialized path must remain equivalent to the general contract or carry an explicitly authorized narrower contract.
  conditions:
  - equivalence tests and a rollback/reference path are feasible
  derivation: corroborated
  confidence: strong
  provenance:
  - F-SRC-EGO-DELIBERATE-TRADEOFF
  - F-SRC-FP-SHALLOW-COPY
- id: E-algorithm-before-specialization
  from: performance-algorithm-and-work-first
  relation: sequenced-before
  to: performance-specialization-evidence
  claim: Eliminate work and improve algorithm or representation before paying the maintenance and portability cost of a specialized fast path.
  conditions:
  - higher-level options are feasible for the profiled bottleneck
  derivation: direct
  confidence: strong
  provenance:
  - F-SRC-EGO-DO-LESS
  - F-SRC-EGO-STANDARD-SPECIALIZATION
- id: E-cache-trades-memory-freshness
  from: performance-cache-validity
  relation: trades-off-with
  to: performance-memory-lifecycle
  claim: Caching exchanges recomputation for retained memory and introduces ownership, invalidation, and freshness obligations.
  conditions:
  - repeated expensive work and a meaningful cache lifetime exist
  derivation: corroborated
  confidence: strong
  provenance:
  - F-SRC-FP-LRU-CACHE
  - F-SRC-FP-PROPERTY-CACHE
  - F-SRC-EGO-REUSE-MEMORY
- id: E-semantic-preservation-constrains-cache
  from: performance-semantic-preservation
  relation: constrains
  to: performance-cache-validity
  claim: Cache keys, freshness, tenant or policy scope, errors, and mutable result ownership must preserve the accepted contract.
  conditions:
  - caching is proposed as an internal optimization
  derivation: synthesized
  confidence: strong
  provenance:
  - F-SRC-FP-PROPERTY-CACHE
  - F-SRC-FP-SHALLOW-COPY
  - F-SRC-EGO-FUNCTIONALITY-PHASE
- id: E-target-stop-constrains-optimization
  from: performance-target-based-stop
  relation: constrains
  to: performance-specialization-evidence
  claim: Once the authorized objective is met, further specialization needs a new benefit case rather than technical possibility alone.
  conditions:
  - correctness and non-target budgets pass
  derivation: direct
  confidence: universal
  provenance:
  - F-SRC-EGO-TARGET-STOP
  - F-SRC-EGO-OPTIMIZE-ONE
