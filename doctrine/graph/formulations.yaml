schema_version: agent-doctrine-graph-formulations/1
formulations:
- id: F-SRC-REF-C02-TWO-DEFINITIONS
  source_id: SRC-REF
  locator: books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md#Defining Refactoring
  mappings:
  - node_id: term-refactoring
    relationship_to_canonical: direct_support
  - node_id: universal-preserve-behavior-by-default
    relationship_to_canonical: direct_support
  - node_id: refactoring-behavior-preservation
    relationship_to_canonical: direct_support
  paraphrase: The source distinguishes refactoring as both a behavior-preserving structural change and the disciplined activity of applying such changes.
  conditions: Observable behavior is preserved even though the program may temporarily move through intermediate structures.
  caveats: The examples and terminology assume late-1990s object-oriented, primarily single-process Java practice.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-REF-C02-WHEN-TO-REFACTOR
  source_id: SRC-REF
  locator: books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md#When Should You Refactor?
  mappings:
  - node_id: refactoring-demonstrated-pressure
    relationship_to_canonical: direct_support
  paraphrase: Structural improvement is tied to adding behavior, repairing defects, review, and repeated encounters rather than a detached beautification phase.
  conditions: The source favors continuous opportunistic improvement around real work.
  caveats: The book's threshold examples are heuristics, not repository-independent mandates.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-REF-C02-WHEN-NOT-TO-REFACTOR
  source_id: SRC-REF
  locator: books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md#When Shouldn't You Refactor?
  mappings:
  - node_id: refactoring-leave-unattractive-code
    relationship_to_canonical: direct_support
  paraphrase: Do not refactor code that should be replaced or cannot be made understandable enough for safe incremental change; sometimes a rewrite or leaving it alone is more appropriate.
  conditions: The selection depends on practical change and understanding constraints.
  caveats: Replacement still needs independent authority, migration, and preservation evidence.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-REF-C03-SMELL-STARTING-POINTS
  source_id: SRC-REF
  locator: 'books/refactoring-improving-the-design-of-existing-code/chapters/007-chapter-3-bad-smells-in-code.md#Chapter 3: Bad Smells in Code'
  mappings:
  - node_id: refactoring-smells-as-hypotheses
    relationship_to_canonical: direct_support
  - node_id: anti-pattern-aesthetic-technical-debt
    relationship_to_canonical: derived_inference
  paraphrase: Smells supply experienced starting points for deciding where to inspect and which transformations might help; they are not a mechanical proof of a single remedy.
  conditions: Local context determines whether and how a smell should be addressed.
  caveats: The catalog reflects object-oriented design assumptions and predates modern language/runtime idioms.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-REF-C04-SELF-TESTING
  source_id: SRC-REF
  locator: books/refactoring-improving-the-design-of-existing-code/chapters/008-chapter-4-building-tests.md#The Value of Self-testing Code
  mappings:
  - node_id: refactoring-behavior-preservation
    relationship_to_canonical: direct_support
  paraphrase: Frequent automated feedback is a precondition for safe refactoring because it detects unintended behavior changes close to the transformation that caused them.
  conditions: Tests must exercise the relevant behavior and run often enough to localize failures.
  caveats: The chapter's testing framework mechanics are historically specific; the proof obligation is portable.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-REF-C05-SMALL-STEPS
  source_id: SRC-REF
  locator: books/refactoring-improving-the-design-of-existing-code/chapters/009-chapter-5-toward-a-catalog-of-refactorings.md#Format of the Refactorings
  mappings:
  - node_id: refactoring-small-verified-steps
    relationship_to_canonical: direct_support
  - node_id: universal-minimize-simultaneous-uncertainty
    relationship_to_canonical: refinement
  paraphrase: Refactoring mechanics deliberately use the smallest safe steps with verification after each; larger steps are acceptable only while confidence remains and can be decomposed after failure.
  conditions: A reliable compile/test feedback loop exists.
  caveats: Concurrent, distributed, reflective, and dynamically wired systems require additional preservation checks.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-REF-C15-STOP-WHEN-UNSURE
  source_id: SRC-REF
  locator: books/refactoring-improving-the-design-of-existing-code/chapters/020-chapter-15-putting-it-all-together.md#Stop when you are unsure.
  mappings:
  - node_id: refactoring-small-verified-steps
    relationship_to_canonical: corroboration
  - node_id: universal-minimize-simultaneous-uncertainty
    relationship_to_canonical: corroboration
  paraphrase: When the next structural move is unclear or confidence drops, stop, backtrack, and choose a smaller or better-understood goal.
  conditions: Work is checkpointed so backtracking is cheap.
  caveats: Stopping is a safety mechanism, not abandonment of an authorized outcome.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-PREFACE-CODE-WITHOUT-TESTS
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/004-preface.md#Preface
  mappings:
  - node_id: term-legacy-code
    relationship_to_canonical: direct_support
  - node_id: legacy-characterization-surfaces
    relationship_to_canonical: refinement
  paraphrase: The source adopts a deliberately operational definition of legacy code as code without sufficient tests, because the absence of feedback makes improvement unverifiable regardless of visual cleanliness.
  conditions: The definition is a working change-safety lens rather than a complete historical or sociological definition.
  caveats: Test presence alone is insufficient if the tests are slow, untrustworthy, or fail to cover the change point.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C01-CHANGE-PRESERVATION
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/008-chapter-1-changing-software.md#Four Reasons to Change Software
  mappings:
  - node_id: universal-preserve-behavior-by-default
    relationship_to_canonical: refinement
  - node_id: universal-evidence-before-intervention
    relationship_to_canonical: derived_inference
  paraphrase: Feature addition, defect repair, design improvement, and optimization differ in intent, but all require preserving more existing behavior than the edited code alone suggests.
  conditions: The preservation surface is identified for the specific change type.
  caveats: Optimization may affect timing and resource use intentionally, so those dimensions need an explicit contract.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C02-COVER-EDIT
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/009-chapter-2-working-with-feedback.md#The Legacy Code Change Algorithm
  mappings:
  - node_id: legacy-characterization-surfaces
    relationship_to_canonical: direct_support
  - node_id: universal-minimize-simultaneous-uncertainty
    relationship_to_canonical: refinement
  paraphrase: Find the change point, identify dependencies, cover behavior with tests, make the change, and refactor through a tight feedback loop.
  conditions: The agent can create a harness or otherwise observe the relevant behavior.
  caveats: Coverage is local to the behavior exercised; it does not establish global correctness.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C03-SENSING-SEPARATION
  source_id: SRC-WELC
  locator: 'books/programming-working-effectively-with-legacy-code/chapters/010-chapter-3-sensing-and-separation.md#Chapter 3: Sensing and Separation'
  mappings:
  - node_id: legacy-sensing-and-separation
    relationship_to_canonical: direct_support
  paraphrase: Dependencies obstruct testing either because their effects cannot be observed or because they prevent the target from executing; sensing and separation address these distinct problems.
  conditions: Test doubles reproduce only collaborator behavior relevant to the test.
  caveats: Excess substitution can create a harness that no longer represents the production interaction.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C04-SEAM-MODEL
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/011-chapter-4-the-seam-model.md#Seams
  mappings:
  - node_id: legacy-seams-and-enabling-points
    relationship_to_canonical: direct_support
  paraphrase: A seam permits behavior to change without editing the target text, and an enabling point controls which behavior is active.
  conditions: The selected mechanism must be controllable in the repository's language/build/runtime.
  caveats: A seam is a testing and change mechanism, not automatically a desirable public architecture boundary.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C04-SEAM-TYPES
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/011-chapter-4-the-seam-model.md#Seam Types
  mappings:
  - node_id: legacy-seams-and-enabling-points
    relationship_to_canonical: refinement
  paraphrase: Object seams are usually most explicit, while preprocessing and link seams can intercept pervasive dependencies when language or build constraints leave no cleaner option.
  conditions: The least invasive seam that preserves relevant behavior is preferred.
  caveats: Build/link/preprocessing seams are harder to understand and maintain and should remain exceptional.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C05-TOOL-TRUST
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/012-chapter-5-tools.md#Tests and Automated Refactoring
  mappings:
  - node_id: refactoring-behavior-preservation
    relationship_to_canonical: refinement
  - node_id: universal-evidence-before-intervention
    relationship_to_canonical: refinement
  paraphrase: Automated transformation tools preserve only the properties they model; agents should probe tool limits and retain tests for side effects, inheritance, reflection, and other unmodeled behavior.
  conditions: Tool version and transformation semantics are known.
  caveats: Tool success cannot replace repository-specific behavioral evidence.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-WELC-C05-REFACTORING-DEFINITION
  source_id: SRC-WELC
  locator: books/programming-working-effectively-with-legacy-code/chapters/012-chapter-5-tools.md#Automated Refactoring Tools
  mappings:
  - node_id: term-refactoring
    relationship_to_canonical: corroboration
  paraphrase: The source adopts behavior preservation as the cardinal distinction between a refactoring and a merely structural-looking edit.
  conditions: Existing behavior is defined well enough to test or constrain.
  caveats: Legacy dependency-breaking moves before tests are exceptional enabling steps, not ordinary refactoring proof.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C01-DEBT-DEPENDS-ON-CHANGE
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/006-chapter-1-why-technical-debt-isn-t-technical.md#Interest Rate Is a Function of Time
  mappings:
  - node_id: anti-pattern-aesthetic-technical-debt
    relationship_to_canonical: direct_support
  - node_id: universal-evidence-before-intervention
    relationship_to_canonical: direct_support
  - node_id: refactoring-demonstrated-pressure
    relationship_to_canonical: refinement
  - node_id: refactoring-leave-unattractive-code
    relationship_to_canonical: corroboration
  paraphrase: Poor-looking code incurs technical-debt interest only when the organization must understand or change it; static ugliness alone does not establish current maintenance cost.
  conditions: Current and expected change activity are considered.
  caveats: Low change does not prove safety, use, or absence of latent high-impact risk.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C01-LEGACY-VS-DEBT
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/006-chapter-1-why-technical-debt-isn-t-technical.md#Questioning Technical Debt
  mappings:
  - node_id: term-legacy-code
    relationship_to_canonical: refinement
  paraphrase: The source separates legacy code's feedback problem from technical debt's maintenance-cost or strategic-tradeoff framing, even though the analysis techniques may overlap.
  conditions: Terms are used to select action rather than assign blame.
  caveats: Organizations use these labels inconsistently, so operational definitions should be stated.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C02-HOTSPOT-INTEREST
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/007-chapter-2-identify-code-with-high-interest-rates.md#Prioritize Technical Debt with Hotspots
  mappings:
  - node_id: universal-change-amplification
    relationship_to_canonical: refinement
  - node_id: refactoring-hotspot-prioritization
    relationship_to_canonical: refinement
  paraphrase: Combining change frequency with a complexity proxy estimates where difficult code is most likely to impose recurring maintenance interest.
  conditions: History is representative and mechanical/bulk/generated changes are filtered.
  caveats: The combination prioritizes inspection; it does not prove a structural defect or prescribe a refactoring.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C02-HOTSPOTS-FOCUS
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/007-chapter-2-identify-code-with-high-interest-rates.md#Escape the Technical-Debt Trap
  mappings:
  - node_id: refactoring-hotspot-prioritization
    relationship_to_canonical: direct_support
  - node_id: universal-evidence-before-intervention
    relationship_to_canonical: refinement
  - node_id: refactoring-smells-as-hypotheses
    relationship_to_canonical: corroboration
  paraphrase: Hotspots narrow a large codebase to the small set where manual inspection, testing, and refactoring are most likely to repay effort.
  conditions: Analysis scope and history window match the maintenance question.
  caveats: Untouched but dangerous code and recent repositories can evade hotspot detection.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C02-XRAY
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/007-chapter-2-identify-code-with-high-interest-rates.md#Use X-Rays to Get Deep Insights into Code
  mappings:
  - node_id: refactoring-hotspot-prioritization
    relationship_to_canonical: refinement
  paraphrase: Reapply hotspot analysis at function or method granularity inside a large hotspot so the investigation reaches an actionable scope.
  conditions: Historical revisions can be parsed and mapped to code entities with acceptable accuracy.
  caveats: Renames, overload grouping, language parsing, and generated changes can distort the result.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C03-COCHANGE
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/008-chapter-3-coupling-in-time-a-heuristic-for-the-concept-of-surprise.md#What Is Change Coupling?
  mappings:
  - node_id: refactoring-cochange-evidence
    relationship_to_canonical: direct_support
  - node_id: universal-change-amplification
    relationship_to_canonical: refinement
  - node_id: refactoring-demonstrated-pressure
    relationship_to_canonical: refinement
  paraphrase: Repeated same-change edits reveal a temporal relationship invisible in the static code and can expose hidden coordination or shared knowledge.
  conditions: Minimum occurrence and coupling thresholds, commit discipline, and analysis window are explicit.
  caveats: Same-commit coupling can miss staged changes and can be caused by tests, process, or mechanical edits.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C03-SURPRISE
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/008-chapter-3-coupling-in-time-a-heuristic-for-the-concept-of-surprise.md#Detect Cochanging Files
  mappings:
  - node_id: refactoring-cochange-evidence
    relationship_to_canonical: refinement
  paraphrase: Expected co-change, such as a test with its subject, may be healthy; surprising co-change between supposedly independent concepts is the higher-value investigation target.
  conditions: Maintainers understand the intended relationship well enough to judge surprise.
  caveats: Surprise starts investigation and cannot determine whether to merge, split, duplicate, or document.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C05-OLD-CODE-HEURISTIC
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/010-chapter-5-the-principles-of-code-age.md#Refactor Toward Code of Similar Age
  mappings:
  - node_id: heuristic-code-age
    relationship_to_canonical: direct_support
  - node_id: refactoring-leave-unattractive-code
    relationship_to_canonical: derived_inference
  paraphrase: Different change ages within one package can reveal separate responsibilities or a part that fails to stabilize; domain knowledge and code inspection select the explanation.
  conditions: The repository has enough representative history and age is calculated consistently.
  caveats: Old tests may be stale, and old production code may be unused or merely untouched.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-SDX-C05-DEAD-CODE
  source_id: SRC-SDX
  locator: books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/010-chapter-5-the-principles-of-code-age.md#Dead Code Is Stable Code
  mappings:
  - node_id: heuristic-code-age
    relationship_to_canonical: refinement
  - node_id: refactoring-leave-unattractive-code
    relationship_to_canonical: derived_inference
  paraphrase: Apparent stability can come from non-use, so verify runtime/static consumers before treating an old component as a successful stable boundary.
  conditions: Static, dynamic, generated, and external uses are considered.
  caveats: Absence of observed use is not deletion authority.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-PERF-CLAIM
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/005-chapter-1-software-efficiency-matters.md#Clarify When Someone Uses the Word "Performance"
  mappings:
  - node_id: performance-measurable-objective
    relationship_to_canonical: direct_support
  paraphrase: The source separates accuracy, speed, and resource efficiency and requires a speaker to name which performance property matters.
  conditions: The claim is bound to a concrete operation and stakeholder need.
  caveats: The distinction does not itself supply a target, workload, or authority.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-PERF-RAER
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/007-chapter-3-conquering-efficiency.md#Resource-Aware Efficiency Requirements
  mappings:
  - node_id: performance-measurable-objective
    relationship_to_canonical: refinement
  paraphrase: A performance requirement binds an important operation and input scale to latency and explicit CPU, memory, disk, or other resource limits.
  conditions: The target and trade space are accepted by an owner.
  caveats: The source's template should be adapted to the repository rather than imposed ceremonially on trivial local choices.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-METRIC-SEMANTICS
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/010-chapter-6-efficiency-observability.md#Efficiency Metrics Semantics
  mappings:
  - node_id: performance-metric-semantics
    relationship_to_canonical: direct_support
  paraphrase: A metric must identify what it counts or measures, its boundary, type, aggregation, and collection behavior before its value can guide efficiency work.
  conditions: Instrumentation configuration and system boundary are inspectable.
  caveats: Metric semantics can drift with implementation and deployment changes.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-METRIC-CARDINALITY
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/010-chapter-6-efficiency-observability.md#High Metric Cardinality
  mappings:
  - node_id: performance-metric-semantics
    relationship_to_canonical: refinement
  paraphrase: Measurement design must include storage, aggregation, and cardinality cost; unrestricted labels can make observability itself an outage source.
  conditions: Metric labels and retention reflect a bounded operational need.
  caveats: Temporary detailed traces may be valid under tighter time, privacy, and cost controls.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-EXPERIMENT-RELIABILITY
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md#Reliability of Experiments
  mappings:
  - node_id: performance-representative-baseline
    relationship_to_canonical: direct_support
  - node_id: performance-benchmark-validity
    relationship_to_canonical: direct_support
  paraphrase: Reliable performance comparison records versions, runs nearby A/B trials on controlled infrastructure, repeats enough to expose variance, and retains raw results.
  conditions: Workload and correctness remain equivalent across candidates.
  caveats: Statistical summaries cannot rescue an unstable or unrepresentative experiment.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-PRODUCTION-REPRESENTATION
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md#Reproducing Production
  mappings:
  - node_id: performance-representative-baseline
    relationship_to_canonical: refinement
  paraphrase: A useful baseline reproduces production-relevant data, dependencies, resource limits, and environment closely enough for the claim being made.
  conditions: Omitted production factors are named and bounded.
  caveats: Exact production replication may be unsafe or impossible; the claim must narrow accordingly.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-BENCHMARKS-LIE
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md#Benchmarks Lie
  mappings:
  - node_id: performance-benchmark-validity
    relationship_to_canonical: direct_support
  paraphrase: Benchmark numbers often mislead through harness or interpretation errors, so the experiment and its claim must be audited before use.
  conditions: Review includes setup, workload, environment, compiler/runtime, and result interpretation.
  caveats: The formulation is a warning against uncritical use, not a rejection of benchmarking.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-BENCHMARK-CORRECTNESS
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md#Test Your Benchmark for Correctness!
  mappings:
  - node_id: performance-benchmark-validity
    relationship_to_canonical: refinement
  paraphrase: The benchmark must verify that the intended work ran and produced correct results; otherwise compilers or faulty setup can reward nonexistent work.
  conditions: Oracles cover the operation whose performance is claimed.
  caveats: A correctness check inside the timed region can perturb measurement and may need a separate validated setup.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-BENCHMARK-LEVELS
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md#Benchmarking Levels
  mappings:
  - node_id: performance-experiment-level-fit
    relationship_to_canonical: direct_support
  paraphrase: Production, macro, and micro measurements trade realism for isolation and therefore support different scopes of conclusion.
  conditions: The selected level matches the named system boundary.
  caveats: A project may lack a higher-level harness; this limits confidence rather than authorizing extrapolation.
  context_basis:
    conditions: source-specific
    caveats: source-specific
- id: F-SRC-EGO-MICRO-MEMORY
  source_id: SRC-EGO
  locator: books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md#Microbenchmarks Versus Memory Management
  mappings:
  - node_id: performance-experiment-level-fit
