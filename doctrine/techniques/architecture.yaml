        contribution: Establishes that reuse creates coupling and change amplification rather than free leverage.

  - id: architecture-microservices-style
    candidate_id: TECH-ARC-015
    title: Microservices architecture
    non_universality: A bounded context, team boundary, or fashionable preference does not entail a microservice; irreducible distribution drivers and operational readiness are mandatory.
    problem_solved: Give mature bounded capabilities independent deployment, data authority, scaling, availability, and team ownership.
    activation_evidence:
      - Stable coherent capabilities and explicit data ownership have been exercised in-process.
      - Independent deployment, scaling, availability, geography, security, or technology is measurably valuable.
      - Automated delivery, observability, security, on-call, recovery, and contract governance are ready.
      - Eventual consistency, sagas, and data duplication are explicitly accepted where required.
    costs:
      - Network and contract complexity, partial failure, and distributed data coordination.
      - Eventual consistency, duplicated data, harder tests and debugging, and high cognitive and incident load.
    contraindications:
      - Small, simple, early, or rapidly converging product with uncertain boundaries.
      - Shared transactions and joins are central or uniform scaling suffices.
      - Platform, telemetry, delivery, security, or on-call capability is weak.
    reversal_cost:
      level: high
      exit_path: Merge compatible services behind maintained contracts and migrate data authority with reconciliation and rollback gates.
      cost_drivers: [data separation, protocol consumers, team topology, independent pipelines, event history]
    appropriate_scale: [system, enterprise, selected-capabilities]
    operational_consequences:
      - Requires per-service CI/CD, telemetry, security, compatibility, discovery, capacity, incident response, and data recovery.
      - Every remote edge adds partial-failure and rollout-order obligations.
    preservation_boundaries:
      - Data authority, consistency, transaction, identity, and protocol semantics.
      - Availability, security, recovery, and compatibility promises.
    alternatives:
      - architecture-modular-monolith-technique
      - architecture-service-based-style
      - architecture-domain-feature-packaging
    related_concepts:
      - architecture-distribution-readiness
      - architecture-contextual-style-selection
