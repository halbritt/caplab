  - id: architecture-pipeline-style
    candidate_id: TECH-ARC-008
    title: Pipeline architecture
    non_universality: Pipelines fit ordered transformations; they are not a general substitute for rich transactional or interactive workflows.
    problem_solved: Transform or test a stream through ordered, largely independent stages with narrow data contracts.
    activation_evidence:
      - Processing has a natural sequence of transformations.
      - Stages can expose narrow data contracts and control side effects.
      - Reuse, reordering, streaming, or parallel stage execution matters.
    costs:
      - Intermediate representations and explicit ordering and error semantics.
      - Backpressure, cross-stage debugging, and observability complexity.
    contraindications:
      - Rich shared transactional state spans stages.
      - The workflow is highly interactive or branches around shared context.
      - Transformations cannot be isolated without semantic duplication.
    reversal_cost:
      level: low-to-moderate
      exit_path: Compose adjacent stages or collapse the pipeline into direct application flow.
      cost_drivers: [persisted intermediate formats, distributed stages, external stage contracts]
    appropriate_scale: [application, subsystem, streaming-system]
    operational_consequences:
      - Streaming forms require buffering, backpressure, retries, checkpointing, and ordering controls.
      - Failure diagnosis must connect events across stages.
    preservation_boundaries:
      - Stage ordering and end-to-end transformation semantics.
      - Delivery guarantees, error propagation, and side-effect idempotency.
    alternatives:
      - architecture-direct-in-process-dependency
      - architecture-event-broker-choreography
      - architecture-event-mediator-orchestration
    related_concepts:
      - architecture-contextual-style-selection
      - architecture-change-locality-cohesion
      - architecture-event-temporal-semantics
      - architecture-interaction-synchrony
      - universal-preserve-behavior-by-default
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/017-chapter-11-pipeline-architecture-style.md :: Pipes"
        contribution: Defines the communication links and flow between stages.
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/017-chapter-11-pipeline-architecture-style.md :: Filters"
        contribution: Defines self-contained transformation stages and common stage roles.

  - id: architecture-modular-monolith-technique
    candidate_id: TECH-ARC-009
    title: Modular monolith
    non_universality: A modular monolith is a contextual topology, not a universal target or a mandatory waypoint to microservices.
    problem_solved: Enforce cohesive source and domain boundaries while retaining one deployment and transaction envelope.
    activation_evidence:
      - Cohesive modules and ownership or change boundaries can be demonstrated.
      - Shared deployment, process failure, and transactions are acceptable.
      - Operational simplicity is worth more than independent scaling or release.
    costs:
      - Shared process, deployment, and often database failure domain.
      - Boundary integrity depends on source visibility and automated checks.
      - Scaling is commonly coarse-grained.
    contraindications:
      - Independent availability, geography, security, or deployability is mandatory.
      - One capability has incompatible resource or release needs.
      - No coherent source modules can yet be identified.
    reversal_cost:
      level: moderate
      exit_path: Extract only the modules with proven distributed drivers behind explicit ports and data ownership.
      cost_drivers: [shared transactions, shared tables, cyclic module dependencies]
    appropriate_scale: [product, system]
    operational_consequences:
      - One deployment and observability domain simplifies operation and transactions.
      - Capacity and incidents affect the shared process unless internally isolated.
    preservation_boundaries:
      - Module contracts, data ownership, and accepted shared transactions.
      - End-to-end behavior during any later extraction.
    alternatives:
      - architecture-layered-style
      - architecture-service-based-style
      - architecture-microservices-style
    related_concepts:
      - architecture-modular-monolith
      - architecture-contextual-partitioning
      - architecture-distribution-readiness
      - architecture-change-locality-cohesion
      - domain-bounded-context
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/024-chapter-18-choosing-the-appropriate-architecture-style.md :: Modular Monolith"
        contribution: Retains modular source boundaries without distributed topology costs.
      - source_id: SRC-CA
        relationship: corroboration
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/029-chapter-18-boundary-anatomy.md :: THE DREADED MONOLITH"
        contribution: Distinguishes monolithic deployment from the absence of internal component boundaries.
      - source_id: SRC-CA
        relationship: refinement
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/046-chapter-34-the-missing-chapter.md :: PACKAGE BY COMPONENT"
        contribution: Supplies an enforceable source-organization mechanism for internal modularity.

  - id: architecture-service-based-style
    candidate_id: TECH-ARC-010
    title: Service-based architecture
    non_universality: Coarse services are earned by moderate distribution forces and an accepted shared-data tradeoff, not by a desire to appear service-oriented.
    problem_solved: Give a few coarse domain areas some independent deployment and scaling while retaining simpler operations than finer-grained services.
    activation_evidence:
      - A small number of coarse domains have distinct release or capacity needs.
      - Teams can own services end to end.
      - Shared data coordination and moderate rather than maximal isolation are accepted.
    costs:
      - Network latency and failure, API versioning, orchestration, and distributed logging.
      - Shared-database coupling and cross-service transaction coordination.
    contraindications:
      - Strong data isolation or fine-grained independent scaling is mandatory.
      - Cross-service transaction semantics are unresolved.
      - Delivery, monitoring, security, and on-call maturity are absent.
    reversal_cost:
      level: moderate-to-high
      exit_path: Merge services when distribution is unearned, or split only the evidenced hotspot behind owned data.
      cost_drivers: [protocol consumers, shared database coupling, deployment pipelines]
    appropriate_scale: [system]
    operational_consequences:
      - Requires service deployment, monitoring, security, compatibility, and failure handling.
      - Shared data can simplify joins while coupling schema and availability.
    preservation_boundaries:
      - API, transaction, consistency, authentication, and failure semantics.
      - Data authority during merge, split, and rollout.
    alternatives:
      - architecture-modular-monolith-technique
      - architecture-microservices-style
      - architecture-direct-in-process-dependency
    related_concepts:
      - architecture-contextual-style-selection
      - architecture-distribution-readiness
      - architecture-team-topology-force
      - architecture-contextual-partitioning
      - universal-change-amplification
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/019-chapter-13-service-based-architecture-style.md :: Topology"
        contribution: Defines coarse services and their commonly shared data topology.
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/019-chapter-13-service-based-architecture-style.md :: When to Use This Architecture Style"
        contribution: Supplies contextual selection factors and limits.

  - id: architecture-event-broker-choreography
    candidate_id: TECH-ARC-011
    title: Event broker or choreography
    non_universality: Choreography is appropriate for genuinely independent reactions, not for hiding a workflow that needs explicit completion ownership.
    problem_solved: Enable extensible, high-throughput reactions with loose temporal coupling and no central process controller.
    activation_evidence:
      - No single business process owns global completion.
      - Consumers react independently and new consumers are added frequently.
      - Durable messaging, replay, idempotency, schema governance, and tracing are available.
    costs:
      - Emergent workflow and difficult completion and error visibility.
      - Duplicate, ordering, eventual-consistency, replay, and schema-evolution complexity.
    contraindications:
      - A regulated or deterministic long-running workflow needs audit and compensation.
      - Observability and recovery ownership are weak.
      - Events are imperative commands disguised as facts.
    reversal_cost:
      level: moderate-to-high
      exit_path: Add a process manager for the owned workflow or return selected interactions to direct request-response.
      cost_drivers: [event consumers, persisted event schemas, replay history, distributed ownership]
    appropriate_scale: [subsystem, system]
    operational_consequences:
      - Requires broker availability, dead-letter and replay operations, schema governance, lag monitoring, and tracing.
      - Completion and recovery are distributed unless explicitly assigned.
    preservation_boundaries:
      - Event meaning, ordering, delivery, duplicate, and idempotency semantics.
      - Data consistency, replay safety, and consumer compatibility.
    alternatives:
      - architecture-event-mediator-orchestration
      - architecture-direct-in-process-dependency
      - architecture-pipeline-style
    related_concepts:
      - architecture-event-temporal-semantics
