  - id: architecture-event-mediator-orchestration
    candidate_id: TECH-ARC-012
    title: Event mediator or orchestration
    non_universality: A mediator is earned by explicit workflow completion and recovery policy; it is harmful when it only relays independent reactions.
    problem_solved: Own conditional routing, completion, compensation, audit, and recovery for a multi-step process.
    activation_evidence:
      - A long-running, regulated, branching, or human-involved transaction exists.
      - One business process owns completion and needs restart or recovery.
      - Durable process state and idempotent participants can be implemented.
    costs:
      - Mediator availability and scaling, central coupling, and bottleneck risk.
      - Workflow versioning and persistent process-state complexity.
    contraindications:
      - Reactions are genuinely independent and no completion policy exists.
      - The workflow is short enough for a direct transaction or request.
      - The mediator would merely forward every message without decisions.
    reversal_cost:
      level: moderate-to-high
      exit_path: Decentralize only stable independent reactions while retaining explicit owners for remaining workflows.
      cost_drivers: [persisted process state, workflow versions, participant contracts]
    appropriate_scale: [business-process, system]
    operational_consequences:
      - Requires durable process state, idempotency, compensation, observability, and upgrade strategy.
      - Mediator capacity and availability become explicit system constraints.
    preservation_boundaries:
      - Completion, compensation, audit, ordering, and restart semantics.
      - Participant idempotency and authoritative process state.
    alternatives:
      - architecture-event-broker-choreography
      - architecture-direct-in-process-dependency
      - architecture-pipeline-style
    related_concepts:
      - architecture-event-temporal-semantics
      - architecture-interaction-synchrony
      - architecture-distribution-readiness
      - architecture-contextual-style-selection
      - universal-explicit-invariants
