  - id: architecture-orchestration-driven-soa
    candidate_id: TECH-ARC-014
    title: Orchestration-driven service-oriented architecture
    non_universality: Central enterprise orchestration is justified only by heterogeneous integration and governance forces that can fund its coupling and operational burden.
    problem_solved: Coordinate enterprise processes across heterogeneous systems with centralized integration and policy.
    activation_evidence:
      - Existing heterogeneous systems must participate in shared enterprise workflows.
      - Stable shared services and a real reuse or governance mandate exist.
      - Central governance and orchestration have responsive ownership and budget.
    costs:
      - Enterprise-service coupling and reuse-induced change amplification.
      - Orchestration bottlenecks, governance overhead, and vendor or infrastructure complexity.
    contraindications:
      - Product autonomy and rapid local change dominate.
      - A central team cannot govern contracts responsively.
      - Reuse is merely syntactic or latency and availability budgets are tight.
    reversal_cost:
      level: high
      exit_path: Strangle orchestration flow by flow, assign local ownership, and preserve compatibility during service decomposition.
      cost_drivers: [pervasive shared services, orchestration state, enterprise contracts, vendor-specific infrastructure]
    appropriate_scale: [enterprise]
    operational_consequences:
      - Requires an orchestration engine, registry and governance, monitoring, compatibility, and recovery.
      - Central services and orchestration can amplify incidents and release coordination.
    preservation_boundaries:
      - Enterprise workflow, contract, transaction, and recovery semantics.
      - Governance and acceptance authority during decentralization.
    alternatives:
      - architecture-event-mediator-orchestration
      - architecture-service-based-style
      - architecture-modular-monolith-technique
    related_concepts:
      - architecture-contextual-style-selection
      - architecture-distribution-readiness
      - architecture-team-topology-force
      - universal-change-amplification
      - architecture-risk-analysis
    source_support:
