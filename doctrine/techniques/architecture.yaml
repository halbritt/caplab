  - id: architecture-quantum-analysis
    candidate_id: TECH-ARC-016
    title: Architectural quantum analysis
    non_universality: An architectural quantum scopes analysis; it is not automatically a service or an instruction to split deployment.
    problem_solved: Scope architecture characteristics and deployability to the smallest highly cohesive, synchronously connected functional unit.
    activation_evidence:
      - Different parts of the system need different quality thresholds.
      - Synchronous connascence, functional cohesion, and deployment boundaries can be observed.
      - Per-unit SLO, failure, or scaling analysis would change a decision.
    costs:
      - Dependency analysis and instrumentation effort.
      - Risk of reifying an analytical unit as an unearned deployable boundary.
    contraindications:
      - A small uniform system has no differentiated quality needs.
      - Deployability is not a driver.
      - Units are guessed from organization charts or directories rather than dependencies.
    reversal_cost:
      level: analytical
      exit_path: Revise the analysis scope when dependency or characteristic evidence changes; no structural migration is implied.
      cost_drivers: [monitoring assumptions, decisions derived from an incorrect scope]
    appropriate_scale: [component, subsystem, system]
    operational_consequences:
      - Makes per-quantum SLO, deployment, failure, and recovery implications explicit.
      - Adds no topology by itself.
    preservation_boundaries:
      - Actual dependency and deployment facts.
      - Quality scenarios must remain tied to their smallest evidenced scope.
    alternatives:
      - whole-system-characteristic-analysis
      - architecture-domain-feature-packaging
      - architecture-modular-monolith-technique
    related_concepts:
      - architecture-scoped-characteristics
      - architecture-contextual-style-selection
      - architecture-earned-boundary
      - architecture-interaction-synchrony
      - universal-evidence-before-intervention
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/012-chapter-7-scope-of-architecture-characteristics.md :: Architectural Quanta and Granularity"
        contribution: Defines a quantum through deployability, cohesion, and synchronous connascence.
      - source_id: SRC-FSA
        relationship: refinement
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/013-chapter-8-component-based-thinking.md :: Architecture Quantum Redux: Choosing Between Monolithic Versus Distributed Architectures"
        contribution: Applies quantum analysis to topology selection without equating it to services.

  - id: architecture-fitness-function-technique
    candidate_id: TECH-ARC-017
    title: Architecture fitness function
    non_universality: A fitness function is useful only for an accepted outcome or structural rule with a valid actionable signal; measurement for its own sake is not doctrine.
    problem_solved: Detect drift in a named architecture characteristic or enforceable dependency rule continuously.
    activation_evidence:
      - An accepted measurable outcome or structural constraint exists.
      - The signal has a defensible relationship to the protected outcome.
      - A threshold, cadence, owner, and response are defined.
    costs:
      - Test and monitor maintenance, runtime or build expense, and false positives.
      - Proxy gaming and accidental freezing of implementation detail.
    contraindications:
      - The target is an unmeasurable adjective.
      - The proxy is weakly related to the decision or no owner can act.
      - The check would enforce a superseded or purely aesthetic preference.
    reversal_cost:
      level: low
      exit_path: Delete or supersede the function with the decision it protected, preserving history and replacement coverage.
      cost_drivers: [runtime instrumentation, organizational compliance dependence]
    appropriate_scale: [module, system, enterprise]
    operational_consequences:
      - Build-time checks add feedback and maintenance cost.
      - Runtime telemetry and chaos tests add capacity, safety, and incident-management obligations.
    preservation_boundaries:
      - The accepted outcome, threshold semantics, and owner authority.
      - Production safety and privacy when gathering runtime evidence.
    alternatives:
      - periodic-architecture-review
      - representative-experiment
      - architecture-decision-record-technique
    related_concepts:
      - architecture-fitness-functions
      - architecture-metrics-as-signals
      - architecture-scoped-characteristics
      - universal-measure-claimed-improvement
      - architecture-feedback-loop
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/011-chapter-6-measuring-and-governing-architecture-characteristics.md :: Fitness Functions"
        contribution: Defines objective checks that protect architecture characteristics as systems evolve.
      - source_id: SRC-FSA
