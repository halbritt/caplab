  - id: architecture-risk-storming
    candidate_id: TECH-ARC-019
    title: Architecture risk storming
    non_universality: Risk storming is a proportionate technique for a concrete consequential flow, not a generic workshop or a vote that manufactures certainty.
    problem_solved: Surface and prioritize architecture risk across implementation, operations, security, and domain perspectives.
    activation_evidence:
      - A concrete architecture, flow, and named characteristic can be examined.
      - Consequence or uncertainty warrants cross-role analysis.
      - Participants with implementation and operational knowledge are available.
    costs:
      - Workshop time, subjective scoring, consensus pressure, and mitigation backlog.
      - Scores can disguise disputed assumptions or absent evidence.
    contraindications:
      - Generic brainstorming with no impending decision.
      - A low-risk local change whose evidence is already sufficient.
      - Operators, implementers, or relevant domain experts are absent.
    reversal_cost:
      level: low
      exit_path: Repeat or retire the assessment as mitigations and evidence change; do not preserve stale scores as truth.
      cost_drivers: [participant time, mitigation commitments, false confidence]
    appropriate_scale: [proposal, release, architecture-iteration]
    operational_consequences:
      - High risks should become owned experiments, tests, telemetry, recovery work, or explicit acceptance decisions.
      - Residual risk acceptance must remain with authorized stakeholders.
    preservation_boundaries:
      - Disputed assumptions, confidence, and source evidence.
      - Risk acceptance and mitigation authority.
    alternatives:
      - targeted-failure-analysis
      - architecture-fitness-function-technique
      - architecture-adr-rfc-technique
    related_concepts:
      - architecture-risk-analysis
      - architecture-scoped-characteristics
      - architecture-decision-record
      - universal-evidence-before-intervention
      - universal-minimize-simultaneous-uncertainty
