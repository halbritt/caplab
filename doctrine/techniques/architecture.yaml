schema_version: agent-doctrine-techniques/1
catalog: architecture
scope: specialist
non_universality: >-
  These records are conditional techniques, not architectural defaults or maturity
  stages. Retrieval must carry each technique's activation evidence, costs,
  contraindications, preservation boundaries, and alternatives with the technique.
techniques:
  - id: architecture-direct-in-process-dependency
    candidate_id: TECH-ARC-001
    title: Direct in-process dependency
    non_universality: Direct coupling is the low-cost option only while lifecycle, ownership, failure, and change forces remain aligned.
    problem_solved: Provide local collaboration with minimal indirection, latency, and operational machinery.
    activation_evidence:
      - Same owner, release cadence, process, and failure domain.
      - Concrete semantics are stable and no independent substitution or deployment is required.
      - In-process latency and atomicity are materially useful.
    costs:
      - Compile-time and change coupling between caller and provider.
      - Later extraction may require an adapter, protocol, or data migration.
    contraindications:
      - A volatile provider would control stable consumer policy.
      - The contract is public, cross-team, or independently deployed.
      - Multiple implementations or independent test substitution are demonstrated needs.
    reversal_cost:
      level: low-to-moderate
      exit_path: Introduce a measured seam at the narrowest stable consumer need, then migrate callers incrementally.
      cost_drivers: [spread of concrete types, shared transactions, shared data ownership]
    appropriate_scale: [function, package, module, modular-monolith]
    operational_consequences:
      - Avoids network failure, protocol versioning, and separate deployment machinery.
      - Shares process capacity, availability, and failure behavior with the provider.
    preservation_boundaries:
      - Existing call semantics, transactions, latency expectations, and error behavior.
      - Accepted ownership and release boundaries.
    alternatives:
      - architecture-partial-boundary
      - architecture-dependency-inversion
      - architecture-ports-and-adapters
    related_concepts:
      - architecture-dependency-inversion-gate
      - architecture-boundary-strength
      - architecture-earned-boundary
      - universal-earned-abstraction
      - universal-local-reasoning
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: FACADES"
        contribution: Shows a concrete facade as a lower-cost alternative to a fully inverted boundary.
      - source_id: SRC-FSA
        relationship: corroboration
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/015-chapter-9-foundations.md :: Monolithic"
        contribution: Describes the shared deployment and process characteristics of monolithic topology.

  - id: architecture-layered-style
    candidate_id: TECH-ARC-002
    title: Layered architecture
    non_universality: Technical layering is one contextual partition, not a required architecture for every application.
    problem_solved: Organize technically similar concerns and constrain calls through a familiar monolithic structure.
    activation_evidence:
      - Business workflows are simple or standard and technical partitioning matches team and repository work.
      - One deployment and data envelope is acceptable.
      - Layers have distinct responsibilities rather than pass-through naming.
    costs:
      - Feature changes may traverse many layers and amplify review scope.
      - Sinkhole pass-through and anemic domain behavior can emerge.
      - Deployment, database, and failure isolation remain coarse.
    contraindications:
      - Independent domain change or deployability is a primary driver.
      - Availability, scale, or security isolation must differ by capability.
      - Proposed layers have no independently meaningful policy or mechanism.
    reversal_cost:
      level: moderate
      exit_path: Repartition one evidenced feature at a time behind enforceable module contracts.
      cost_drivers: [feature scattering, cross-layer data shapes, shared database assumptions]
    appropriate_scale: [small-monolith, medium-monolith]
    operational_consequences:
      - Keeps deployment and operations simple.
      - Provides limited fault and scaling isolation.
    preservation_boundaries:
      - Accepted use-case behavior and transaction semantics.
      - Public APIs and persistence compatibility during repartitioning.
    alternatives:
      - architecture-domain-feature-packaging
      - architecture-modular-monolith-technique
      - domain-smart-ui-transaction-script
    related_concepts:
      - architecture-contextual-style-selection
      - architecture-contextual-partitioning
      - architecture-change-locality-cohesion
      - domain-modeling-investment-gate
      - universal-change-amplification
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/016-chapter-10-layered-architecture-style.md :: Topology"
        contribution: Defines the technical layers and their common monolithic topology.
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/016-chapter-10-layered-architecture-style.md :: Why Use This Architecture Style"
        contribution: Supplies the contextual benefits and tradeoffs that earn the style.
      - source_id: SRC-CA
        relationship: refinement
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/046-chapter-34-the-missing-chapter.md :: PACKAGE BY LAYER"
        contribution: Distinguishes package-by-layer from alternatives with stronger source visibility.
      - source_id: SRC-DDD
        relationship: refinement
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: Layered Architecture"
        contribution: Uses layers conditionally to isolate a domain model from technical responsibilities.

  - id: architecture-domain-feature-packaging
    candidate_id: TECH-ARC-003
    title: Package or component by domain feature
    non_universality: A feature folder is not evidence of cohesion; this technique is earned by recurring capability-local change and enforceable visibility.
    problem_solved: Keep a use case or domain capability locally understandable and prevent accidental cross-feature access.
    activation_evidence:
      - Recurring feature changes currently traverse multiple technical packages.
      - A coherent capability, owner, vocabulary, or invariant set can be named.
      - Language, build, or architecture checks can enforce the intended visibility.
    costs:
      - Some technical duplication and adapter placement decisions.
      - Boundary naming, ownership, and dependency enforcement work.
    contraindications:
      - The proposed feature has no coherent semantics or change pattern.
      - The repository cannot enforce access and the team will not add proportional checks.
      - The code is a tiny cross-cutting utility with one stable purpose.
    reversal_cost:
      level: low-to-moderate
      exit_path: Merge or move packages while retaining public behavior; preserve adapters until callers migrate.
      cost_drivers: [public package APIs, cyclic dependencies, duplicated infrastructure]
    appropriate_scale: [package, feature-module, modular-monolith]
    operational_consequences:
      - Has no inherent deployment or network cost.
      - Can clarify ownership and telemetry attribution without creating runtime isolation.
    preservation_boundaries:
      - Feature behavior, public import paths, and dependency rules during moves.
      - Shared infrastructure semantics that remain intentionally common.
    alternatives:
      - architecture-layered-style
      - architecture-direct-in-process-dependency
      - architecture-modular-monolith-technique
    related_concepts:
      - architecture-contextual-partitioning
      - architecture-change-locality-cohesion
      - architecture-structural-constraint-enforcement
      - universal-local-reasoning
      - universal-information-hiding
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/046-chapter-34-the-missing-chapter.md :: PACKAGE BY FEATURE"
        contribution: Presents feature-oriented source organization as an alternative partition.
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/046-chapter-34-the-missing-chapter.md :: PACKAGE BY COMPONENT"
        contribution: Emphasizes enforceable component access and use-case locality.
      - source_id: SRC-FSA
        relationship: corroboration
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/013-chapter-8-component-based-thinking.md :: Domain partitioning"
        contribution: Contrasts domain partitioning with technical partitioning and exposes its tradeoffs.

  - id: architecture-ports-and-adapters
    candidate_id: TECH-ARC-004
    title: Ports and adapters
    non_universality: Policy-detail isolation is warranted only when policy has independent value and mechanisms create demonstrated volatility or substitution pressure.
    problem_solved: Protect stable application or domain policy from delivery, persistence, framework, or device mechanisms.
    activation_evidence:
      - Policy can evolve and be tested independently of a mechanism.
      - Multiple, replaceable, volatile, or externally controlled mechanisms exist.
      - A smaller stable inward contract can express the consumer's semantic need.
    costs:
      - Mapping, indirection, extra types, and composition wiring.
      - Duplicated representations and lifecycle coordination.
    contraindications:
      - Trivial CRUD or a workflow whose semantics are dominated by the mechanism.
      - Portability is hypothetical and no independent change force exists.
      - Testing seams would be exposed as an unnecessarily public API.
    reversal_cost:
      level: moderate
      exit_path: Collapse adapters into direct calls after proving that the protected variation no longer matters.
      cost_drivers: [spread of boundary representations, number of adapters, public contracts]
    appropriate_scale: [module, application, bounded-system]
    operational_consequences:
      - In-process adapters do not themselves change topology.
      - Remote adapters additionally require protocol, failure, security, and observability controls.
    preservation_boundaries:
      - Domain and application semantics across mapping boundaries.
      - Error, identity, transaction, ordering, and data-loss behavior.
    alternatives:
      - architecture-direct-in-process-dependency
      - architecture-partial-boundary
      - architecture-dependency-inversion
    related_concepts:
      - architecture-policy-mechanism-separation
      - architecture-dependency-inversion-gate
      - architecture-earned-boundary
      - universal-information-hiding
      - universal-earned-abstraction
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/033-chapter-22-the-clean-architecture.md :: THE DEPENDENCY RULE"
        contribution: Directs dependencies from volatile mechanisms toward protected policy contracts.
      - source_id: SRC-CA
        relationship: refinement
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/034-chapter-23-presenters-and-humble-objects.md :: THE HUMBLE OBJECT PATTERN"
        contribution: Separates difficult mechanism behavior from testable policy through narrow boundaries.
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/046-chapter-34-the-missing-chapter.md :: PORTS AND ADAPTERS"
        contribution: Describes source organization around an application core and adapters.

  - id: architecture-partial-boundary
    candidate_id: TECH-ARC-005
    title: Partial boundary or facade
    non_universality: A partial seam is neither automatically prudent nor a mandatory step toward a full boundary; it needs a plausible localized force and a deletion or completion trigger.
    problem_solved: Reserve a likely seam or control dependency for less cost than a fully independent boundary.
    activation_evidence:
      - Localized variation or dependency pressure is plausible and costly to defer.
      - Independent deployment or multiple implementations are not yet earned.
      - The facade can hide meaningful complexity or constrain a risky dependency.
    costs:
      - Indirection without full independence.
      - False confidence, reverse coupling, and indefinite scaffolding risk.
    contraindications:
      - No concrete likely variation or protected policy exists.
      - The facade merely renames or mirrors the provider.
      - Current risk already requires process, data, or security isolation.
    reversal_cost:
      level: low
      exit_path: Delete the seam if pressure disappears, or complete the boundary when stronger evidence arrives.
      cost_drivers: [number of callers, leaked provider types, one-way-only dependency control]
    appropriate_scale: [function, package, module]
    operational_consequences:
      - Usually adds little runtime or deployment overhead.
      - Does not provide fault, security, data, or deployment isolation by itself.
    preservation_boundaries:
      - Current behavior and provider error semantics.
      - Explicit completion and deletion criteria.
    alternatives:
      - architecture-direct-in-process-dependency
      - architecture-dependency-inversion
      - architecture-ports-and-adapters
    related_concepts:
      - architecture-boundary-strength
      - architecture-selective-option-preservation
      - architecture-earned-boundary
      - universal-reversible-reviewable-change
      - universal-earned-abstraction
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: SKIP THE LAST STEP"
        contribution: Describes retaining source separation without paying for independent deployment.
      - source_id: SRC-CA
        relationship: refinement
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: ONE-DIMENSIONAL BOUNDARIES"
        contribution: Exposes the weaker protection and reverse-dependency risk of one-dimensional seams.
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: FACADES"
        contribution: Presents a facade as a still-lower-cost partial boundary.

  - id: architecture-dependency-inversion
    candidate_id: TECH-ARC-006
    title: Dependency inversion with a consumer-owned port
    non_universality: An interface is earned by asymmetric change or ownership forces, not by a general preference for indirection or mocks.
    problem_solved: Keep stable consumer policy from depending directly on a more volatile mechanism or provider contract.
    activation_evidence:
      - Consumer needs are narrower and more stable than the provider API.
      - Volatility, substitution, ownership, deployment, or a necessary legacy seam is demonstrated.
      - The repository can place and govern the contract with the consumer.
    costs:
      - Interface ownership and versioning, adapters, navigation, and lifecycle complexity.
      - Mock misuse and abstractions that leak provider semantics.
    contraindications:
      - One stable implementation with no independent variation.
      - The proposed interface mirrors the provider exactly.
      - Repository idiom is clearer with a function or concrete injected value.
    reversal_cost:
      level: low-to-moderate
      exit_path: Collapse the port and adapter to a direct dependency when the independent force disappears.
      cost_drivers: [public consumers, adapter count, contract-specific types]
    appropriate_scale: [function, package, module, component]
    operational_consequences:
      - Source inversion alone adds no network isolation.
      - A remote implementation separately incurs protocol, availability, and operational costs.
    preservation_boundaries:
      - Consumer-visible semantics rather than provider surface shape.
      - Error, lifetime, transaction, and concurrency behavior.
    alternatives:
      - architecture-direct-in-process-dependency
      - architecture-partial-boundary
      - architecture-ports-and-adapters
    related_concepts:
      - architecture-dependency-inversion-gate
      - architecture-policy-mechanism-separation
      - architecture-earned-boundary
      - universal-information-hiding
      - universal-earned-abstraction
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/020-chapter-11-dip-the-dependency-inversion-principle.md :: STABLE ABSTRACTIONS"
        contribution: Relates abstraction direction to stability and volatility.
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/017-chapter-8-ocp-the-open-closed-principle.md :: DIRECTIONAL CONTROL"
        contribution: Uses an interface to reverse source dependency across a demonstrated component boundary.

  - id: architecture-plugin-microkernel
    candidate_id: TECH-ARC-007
    title: Plugin or microkernel architecture
    non_universality: A plugin mechanism is justified by multiple real extensions and a stable small core, not by a hypothetical future ecosystem.
    problem_solved: Support optional, customer-specific, or independently varying capabilities around a stable core.
    activation_evidence:
      - Multiple real plugins or product variants already exist or are committed.
      - A small stable core contract can be governed and versioned.
      - Runtime or configuration-driven extension provides concrete value.
    costs:
      - Discovery and registry machinery, compatibility, security, and versioning.
      - Weaker cross-plugin transactions and harder debugging.
    contraindications:
      - Only one implementation or extension exists.
      - Plugins require pervasive access to core internals.
      - The workflow requires strong atomic coordination across extensions.
    reversal_cost:
      level: moderate-to-high
      exit_path: Fold controlled plugins into the core; preserve compatibility until external consumers migrate.
      cost_drivers: [external plugin authors, versioned contracts, persisted plugin state]
    appropriate_scale: [product, developer-tool, bounded-system]
    operational_consequences:
      - Requires plugin lifecycle, compatibility, isolation, security, and observability controls.
      - Runtime loading can add startup and failure modes.
    preservation_boundaries:
      - Published plugin contract and compatibility promises.
      - Isolation, permissions, lifecycle, and failure containment.
    alternatives:
      - architecture-domain-feature-packaging
      - architecture-modular-monolith-technique
      - architecture-direct-in-process-dependency
    related_concepts:
      - architecture-framework-commitment
      - architecture-contextual-style-selection
      - architecture-earned-boundary
      - architecture-dependency-inversion-gate
      - universal-earned-abstraction
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/028-chapter-17-boundaries-drawing-lines.md :: PLUGIN ARCHITECTURE"
        contribution: Frames plugins as dependencies pointing toward protected business rules.
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/018-chapter-12-microkernel-architecture-style.md :: Plug-In Components"
