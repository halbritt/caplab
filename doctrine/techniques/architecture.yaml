        contribution: Supplies a runtime fitness example whose operational risk must remain explicit.

  - id: architecture-adr-rfc-technique
    candidate_id: TECH-ARC-018
    title: Architecture decision record or request for comments
    non_universality: Decision records belong to significant, consequential choices; forcing every local implementation detail through an ADR creates bureaucracy without preserving useful context.
    problem_solved: Preserve context, authority, alternatives, consequences, compliance, and revisitability of significant decisions.
    activation_evidence:
      - A decision constrains future work, crosses boundaries, or is expensive to reverse or forget.
      - A selection authority and affected reviewers can be named.
      - Rationale, alternatives, consequences, and compliance can be recorded.
    costs:
      - Writing, review, indexing, and supersession upkeep.
      - Stale records and process overhead if scope is indiscriminate.
    contraindications:
      - A trivial reversible implementation detail.
      - No authority exists to select the decision.
      - The artifact would record a conclusion without rationale or consequences.
    reversal_cost:
      level: low-for-record, decision-dependent
      exit_path: Supersede explicitly and link the new evidence, migration, and verification to the prior record.
      cost_drivers: [underlying decision irreversibility, number of governed consumers]
    appropriate_scale: [team, system, enterprise]
    operational_consequences:
      - Operational and compliance obligations require linked tests, telemetry, or runbooks.
      - The record itself does not enforce or accept the decision.
    preservation_boundaries:
      - Decision status, owner, rationale, rejected alternatives, and supersession history.
      - Separation of proposal, selection, execution, verification, and acceptance authority.
    alternatives:
      - local-code-comment
      - issue-or-design-note
      - architecture-fitness-function-technique
    related_concepts:
      - architecture-decision-record
      - architecture-feedback-loop
      - architecture-risk-analysis
