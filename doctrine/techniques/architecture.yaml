        contribution: Contrasts decentralized reactions with explicit orchestration in distributed systems.

  - id: architecture-space-based-style
    candidate_id: TECH-ARC-013
    title: Space-based architecture
    non_universality: This is a high-cost specialist topology for measured extreme concurrency and database contention, not a general scaling precaution.
    problem_solved: Absorb extreme variable load through elastic in-memory processing and distributed partitioned data.
    activation_evidence:
      - Representative measurement shows variable concurrency and database contention dominate the objective.
      - Data can be partitioned and synchronization or collision policies are acceptable.
      - The organization can operate a distributed data grid and recovery machinery.
    costs:
      - Data-grid, replication, collision, data-loss, and cache-coherence complexity.
      - Memory expense, specialized skills, and difficult recovery validation.
    contraindications:
      - Strong centralized transactions or unpartitionable data.
      - Ordinary load, weak operations maturity, or a restrictive cost ceiling.
      - No representative baseline proves the database bottleneck.
    reversal_cost:
      level: high
      exit_path: Migrate authoritative data and processing back behind compatibility stages with reconciliation and rollback proof.
      cost_drivers: [distributed state, persisted partitioning, grid-specific APIs, synchronization semantics]
    appropriate_scale: [specialized-high-scale-system]
    operational_consequences:
      - Requires grid health, data pumps, writers and readers, replication, recovery, capacity, and collision monitoring.
      - Memory capacity and data synchronization become durability concerns.
    preservation_boundaries:
      - Authoritative data, collision resolution, transaction, and loss semantics.
      - Baseline latency and throughput plus correctness under failure and recovery.
    alternatives:
      - performance-algorithm-and-work-first
      - architecture-service-based-style
      - architecture-modular-monolith-technique
    related_concepts:
      - architecture-contextual-style-selection
      - architecture-distribution-readiness
      - architecture-scoped-characteristics
      - performance-measurable-objective
      - performance-semantic-preservation
