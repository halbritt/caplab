  - id: architecture-framework-isolation
    candidate_id: TECH-ARC-020
    title: Framework isolation
    non_universality: Framework isolation is earned by asymmetric commitment and a narrower stable application contract; a wrapper that mirrors the framework provides no protection.
    problem_solved: Limit framework lifecycle and API churn from controlling independently valuable application policy.
    activation_evidence:
      - The framework is invasive, volatile, replaceable, or controls application lifecycle.
      - Application policy can be stated behind a smaller semantic adapter.
      - Upgrade, security, testing, or replacement risk exceeds adapter cost.
    costs:
      - Adapter and translation effort and loss of some framework convenience.
      - Risk of a lowest-common-denominator or mirrored wrapper API.
    contraindications:
      - Framework behavior is the product or essential runtime semantics.
      - Replacement is implausible and lifecycle risk is accepted.
      - The wrapper exposes the same types and operations unchanged.
    reversal_cost:
      level: moderate
      exit_path: Replace the adapter, or deliberately accept direct commitment after recording the changed economics.
      cost_drivers: [framework types leaked into policy, lifecycle callbacks, persistence annotations]
    appropriate_scale: [module, application, system]
    operational_consequences:
      - Upgrades, security patches, startup, lifecycle, and observability remain operational concerns behind the adapter.
      - Isolation can localize but cannot eliminate framework failure and support risk.
    preservation_boundaries:
      - Application policy, lifecycle, error, transaction, and security semantics.
      - Repository framework conventions unless supersession is authorized.
    alternatives:
      - direct-framework-commitment
      - architecture-ports-and-adapters
      - architecture-dependency-inversion
    related_concepts:
      - architecture-framework-commitment
      - architecture-policy-mechanism-separation
