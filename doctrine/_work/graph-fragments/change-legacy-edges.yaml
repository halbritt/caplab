schema_version: agent-doctrine-graph-edges/1
edges:
- id: E-CHANGELEGACY-001-classification-constrains-preservation
  from: refactoring-change-type-classification
  relation: constrains
  to: refactoring-behavior-preservation
  claim: Change classification identifies the authorized semantic delta and therefore the observable behavior that remains inside the refactoring preservation boundary.
  conditions:
  - the work proposes a repository mutation
  - the authorized semantic delta and residual preserved behavior are stated
  derivation: corroborated
  confidence: universal
  provenance:
  - F-CONCEPT-WELC-addd89d29422
  - F-CONCEPT-REF-d35bfd74c496
- id: E-CHANGELEGACY-002-classification-constrains-separation
  from: refactoring-change-type-classification
  relation: constrains
  to: universal-separate-semantic-structural-change
  claim: Classifying each edit exposes mixed purposes so semantic and structural changes can be sequenced and verified as separately attributable slices.
  conditions:
  - the proposed work combines or may combine more than one change purpose
  derivation: corroborated
  confidence: universal
  provenance:
  - F-CONCEPT-WELC-addd89d29422
  - F-CONCEPT-REF-93dea0b4cc46
- id: E-CHANGELEGACY-003-effects-constrain-preservation
  from: legacy-effect-surface
  relation: constrains
  to: refactoring-behavior-preservation
  claim: Reachable values, mutations, failures, I/O, callbacks, and deferred effects determine which observable surfaces a structural change must preserve.
  conditions:
  - the changed path can propagate effects beyond its immediate return value
  - irrelevant internals are not frozen merely because they are reachable statically
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-3a871b9131dd
  - F-CONCEPT-REF-d35bfd74c496
- id: E-CHANGELEGACY-004-single-purpose-constrains-steps
  from: universal-separate-semantic-structural-change
  relation: constrains
  to: refactoring-small-verified-steps
  claim: Each verified transformation step should carry one declared purpose so any failure remains attributable to the last semantic or structural move.
  conditions:
  - causality, rollback, or behavior preservation matters
  derivation: corroborated
  confidence: universal
  provenance:
  - F-CONCEPT-REF-93dea0b4cc46
  - F-CONCEPT-REF-05450931da03
- id: E-CHANGELEGACY-005-small-steps-enable-stopping
  from: refactoring-small-verified-steps
  relation: enables
  to: refactoring-stop-backtrack-escalate
  claim: Frequent known-good checkpoints make it possible to retain an independently useful subset, reverse the last move, or escalate from a precise uncertainty boundary.
  conditions:
  - checks are relevant and trustworthy
  - the campaign retains recoverable checkpoints
  derivation: direct
  confidence: strong
  provenance:
  - F-CONCEPT-REF-29788f5e2e45
  - F-CONCEPT-REF-abf9adc41800
- id: E-CHANGELEGACY-006-pressure-prerequisite-direction
  from: refactoring-demonstrated-pressure
  relation: prerequisite-of
  to: refactoring-directional-campaign
  claim: A broad directional campaign requires stronger demonstrated maintenance pressure than a local enabling refactoring because its duration and coordination cost are higher.
  conditions:
  - the campaign spans multiple independently useful structural steps
  - the pressure is current or credibly imminent
  derivation: synthesized
  confidence: strong
  provenance:
  - F-CONCEPT-REF-75d28cd696bd
  - F-CONCEPT-REF-72d068fb3352
- id: E-CHANGELEGACY-007-metrics-evidence-pressure
  from: architecture-metrics-as-signals
  relation: evidence-for
  to: refactoring-demonstrated-pressure
  claim: Repository-relative metrics can nominate structural pressure for investigation but become action evidence only after source, history, runtime, and task context corroborate the signal.
  conditions:
  - the metric definition, scope, baseline, and confounders are known
  - a current repository consequence is independently established
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-FSA-a8b1df24c4a8
  - F-CONCEPT-SDX-095ab6bf6c80
- id: E-CHANGELEGACY-008-duplication-motivates-abstraction
  from: implementation-duplication-as-evidence
  relation: motivates
  to: universal-earned-abstraction
  claim: Repeated representations of one authoritative rule motivate an abstraction inquiry, but shared meaning, coordinated evolution, and net interface cost must still earn the abstraction.
  conditions:
  - the occurrences may encode the same knowledge rather than merely similar syntax
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-PP-2197b08e3bb2
  - F-CONCEPT-PP-9768c732f35d
- id: E-CHANGELEGACY-009-cochange-evidence-duplication
  from: refactoring-cochange-evidence
  relation: evidence-for
  to: implementation-duplication-as-evidence
  claim: Repeated coordinated edits can corroborate that similar sites encode one evolving rule, while expected test, generation, or process coupling remains a rival explanation.
  conditions:
  - history is fit and logical changes are grouped defensibly
  - actual diffs and semantic ownership are inspected
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-15e6d8564bf0
  - F-CONCEPT-PP-2197b08e3bb2
- id: E-CHANGELEGACY-010-abstraction-enables-locality
  from: universal-earned-abstraction
  relation: enables
  to: architecture-change-locality-cohesion
  claim: An earned abstraction can localize one evolving policy or mechanism when its contract is semantically coherent and cheaper than continued coordinated edits.
  conditions:
  - the abstraction hides a stable decision
  - callers no longer need the hidden knowledge
  - independent responsibilities are not forced together
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-APOSD-2ea5ca3d7275
  - F-CONCEPT-CA-b0c791e81e5f
- id: E-CHANGELEGACY-011-current-work-evidence-locality
  from: legacy-current-work-responsibility-discovery
  relation: evidence-for
  to: architecture-change-locality-cohesion
  claim: The present authorized change can reveal one cohesive responsibility and candidate locality seam without claiming a complete decomposition of the surrounding legacy unit.
  conditions:
  - the current work exercises a recognizable method, data, invariant, or effect cluster
  derivation: corroborated
  confidence: contextual
  provenance:
  - F-CONCEPT-WELC-5cc31083a931
  - F-CONCEPT-CA-b0c791e81e5f
- id: E-CHANGELEGACY-012-migration-implements-preservation
  from: refactoring-compatibility-migration
  relation: implements
  to: refactoring-behavior-preservation
  claim: A phased compatibility path implements behavior preservation across independently released callers, protocols, schemas, and durable data while the new structure is introduced.
  conditions:
  - consumers or stored data cannot move atomically
  - compatibility duration and removal authority are explicit
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-REF-eefb58a34d08
  - F-CONCEPT-REF-d35bfd74c496
- id: E-CHANGELEGACY-013-tool-trust-constrains-steps
  from: refactoring-transformation-tool-trust
  relation: constrains
  to: refactoring-small-verified-steps
  claim: Automation may enlarge a structural step only within the transformation tool's verified semantic coverage and with preview, repository checks, and reversal available.
  conditions:
  - the operation uses an automated refactoring or codemod
  - tool blind spots for the target language and repository are inventoried
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-REF-45d4065277d1
  - F-CONCEPT-REF-05450931da03
- id: E-CHANGELEGACY-014-tool-trust-requires-preservation
  from: refactoring-transformation-tool-trust
  relation: requires
  to: refactoring-behavior-preservation
  claim: A successful tool operation is not a preservation proof; tests and repository evidence must cover behavior the tool does not model.
  conditions:
  - reflection, generation, configuration, serialization, side effects, or external consumers may escape the tool model
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-e618e7af8e9c
  - F-CONCEPT-REF-b5351f415aea
- id: E-CHANGELEGACY-015-pressure-contraindicates-leave-alone
  from: refactoring-demonstrated-pressure
  relation: contraindicates
  to: refactoring-leave-unattractive-code
  claim: Current demonstrated structural pressure defeats the leave-alone disposition when a protected, authorized intervention has a favorable risk-to-benefit case.
  conditions:
  - the pressure is validated rather than aesthetic
  - protection, authority, and a bounded campaign are available
  derivation: synthesized
  confidence: strong
  provenance:
  - F-CONCEPT-REF-75d28cd696bd
  - F-CONCEPT-REF-65e7ba623175
- id: E-CHANGELEGACY-016-cover-modify-requires-effects
  from: legacy-cover-and-modify
  relation: requires
  to: legacy-effect-surface
  claim: Selecting useful test points for poorly characterized code requires tracing the effects reachable from the authorized change point.
  conditions:
  - existing protection does not already prove the complete relevant change surface
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-c9dc66e1055a
  - F-CONCEPT-WELC-3a871b9131dd
- id: E-CHANGELEGACY-017-cover-modify-requires-seam
  from: legacy-cover-and-modify
  relation: requires
  to: legacy-seams-and-enabling-points
  claim: Cover-and-modify requires a controllable seam when a dependency prevents the relevant path from executing or being observed in a harness.
  conditions:
  - a concrete dependency blocks sensing or separation
  - no existing injection or observation point is sufficient
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-WELC-c9dc66e1055a
  - F-CONCEPT-WELC-138c1bc9e17c
- id: E-CHANGELEGACY-018-sensing-constrains-characterization
  from: legacy-sensing-and-separation
  relation: constrains
  to: legacy-characterization-surfaces
  claim: Characterization backed by substitutes proves only the local effects modeled by the sensing and separation harness, not real protocol, timing, persistence, or deployment integration.
  conditions:
  - a fake, stub, mock, or intercepted dependency participates in the observation
  derivation: direct
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-fab853142df6
  - F-CONCEPT-WELC-6445fd919375
- id: E-CHANGELEGACY-019-provisional-break-implements-seam
  from: legacy-provisional-dependency-break
  relation: implements
  to: legacy-seams-and-enabling-points
  claim: A minimum provisional dependency break can implement the first controllable seam when its purpose is to obtain feedback rather than establish final architecture.
  conditions:
  - one dependency blocks required feedback
  - production selection remains unchanged
  - retain or remove criteria are recorded
  derivation: corroborated
  confidence: contextual
  provenance:
  - F-CONCEPT-WELC-22a12be20a07
  - F-CONCEPT-WELC-138c1bc9e17c
- id: E-CHANGELEGACY-020-effects-constrain-characterization
  from: legacy-effect-surface
  relation: constrains
  to: legacy-characterization-surfaces
  claim: The reachable effect surface constrains which observations a characterization suite must capture and where its assertions can detect the intended change.
  conditions:
  - the change path and relevant downstream effects can be sketched
  - the harness avoids freezing unrelated incidental output
  derivation: direct
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-3a871b9131dd
  - F-CONCEPT-WELC-6445fd919375
- id: E-CHANGELEGACY-021-effects-enable-pinch-point
  from: legacy-effect-surface
  relation: enables
  to: legacy-pinch-point
  claim: Tracing several effect paths can reveal a stable convergence point where one observation protects a cluster of planned changes.
  conditions:
  - the paths share a stable observable consequence
  - the broader observation remains sensitive to the intended changes
  derivation: direct
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-3a871b9131dd
  - F-CONCEPT-WELC-a561bd7ea427
- id: E-CHANGELEGACY-022-pinch-trades-localization
  from: legacy-pinch-point
  relation: trades-off-with
  to: legacy-characterization-surfaces
  claim: A broad pinch point reduces dependency-breaking preparation across a cluster but weakens failure localization and may retain more incidental behavior than a narrow characterization surface.
  conditions:
  - both broad and narrow observation surfaces are feasible candidates
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-WELC-b15fce350175
  - F-CONCEPT-WELC-6445fd919375
- id: E-CHANGELEGACY-023-scratch-enables-responsibility-discovery
  from: legacy-scratch-refactoring
  relation: enables
  to: legacy-current-work-responsibility-discovery
  claim: Disposable extraction, renaming, and deletion can expose the responsibility relevant to current work without turning exploratory structure into a production diff.
  conditions:
  - the agent can restore a clean baseline before production implementation
  - scratch conclusions are revalidated against untouched source
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-WELC-5ece628c0bd4
  - F-CONCEPT-WELC-5cc31083a931
- id: E-CHANGELEGACY-024-safety-net-implements-pinch
  from: legacy-provisional-safety-net
  relation: implements
  to: legacy-pinch-point
  claim: A temporary black-box or end-to-end safety net can implement an initial broad convergence surface until narrower characterization becomes feasible.
  conditions:
  - localized tests cannot yet be introduced safely
  - noise is controlled
  - narrowing or removal criteria are explicit
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-cb334d1881c0
  - F-CONCEPT-WELC-a561bd7ea427
- id: E-CHANGELEGACY-025-unprotected-edit-specializes-break
  from: legacy-unprotected-enabling-edit
  relation: specializes
  to: legacy-provisional-dependency-break
  claim: A testless enabling edit is a last-resort specialization of provisional dependency breaking, permitted only to create the first trustworthy protection when no safer seam exists.
  conditions:
  - the edit is singular, mechanical, reversible, and production-signature-preserving where possible
  - protection follows immediately
  derivation: synthesized
  confidence: contested
  provenance:
  - F-CONCEPT-WELC-9023366b4f0d
  - F-CONCEPT-WELC-22a12be20a07
- id: E-CHANGELEGACY-026-tool-trust-constrains-unprotected-edit
  from: refactoring-transformation-tool-trust
  relation: constrains
  to: legacy-unprotected-enabling-edit
  claim: Compiler and transformation-tool guarantees can bound a last-resort enabling edit but cannot eliminate its unobserved semantic risk.
  conditions:
  - the exact tool and construct are supported
  - reference, compile, and diff checks are available
  - the agent does not mix manual semantic edits
  derivation: corroborated
  confidence: contextual
  provenance:
  - F-CONCEPT-WELC-e618e7af8e9c
  - F-CONCEPT-WELC-36a096131afd
- id: E-CHANGELEGACY-027-hotspot-specializes-metrics
  from: refactoring-hotspot-prioritization
  relation: specializes
  to: architecture-metrics-as-signals
  claim: Hotspot analysis is a specialized attention signal that combines change activity with a rough complexity proxy and still requires contextual inspection before action.
  conditions:
  - history and complexity samples are comparable and representative
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-b25be62a75a5
  - F-CONCEPT-FSA-a8b1df24c4a8
- id: E-CHANGELEGACY-028-trend-evidence-hotspot
  from: repository-assessment-complexity-trend
  relation: evidence-for
  to: refactoring-hotspot-prioritization
  claim: A rising repository-relative complexity trajectory strengthens concern about an active hotspot, while a stable or falling trajectory can weaken that hypothesis.
  conditions:
  - the metric is sampled consistently across relevant revisions
  - formatting, generation, and language bias are controlled
  derivation: corroborated
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-c5c9444a3e00
  - F-CONCEPT-SDX-b25be62a75a5
- id: E-CHANGELEGACY-029-data-fitness-prerequisite-metrics
  from: repository-assessment-behavioral-data-fitness
  relation: prerequisite-of
  to: architecture-metrics-as-signals
  claim: A history-derived metric is inadmissible as an investigation signal when identity, time-window, entity, generated-artifact, migration, or task-grouping assumptions fail.
  conditions:
  - the metric consumes version-control or contribution history
  derivation: synthesized
  confidence: strong
  provenance:
  - F-CONCEPT-SDX-b864bebc70eb
  - F-CONCEPT-FSA-a8b1df24c4a8
- id: E-CHANGELEGACY-030-data-fitness-prerequisite-cochange
  from: repository-assessment-behavioral-data-fitness
  relation: prerequisite-of
  to: refactoring-cochange-evidence
  claim: Co-change evidence requires defensible logical changes and stable entity identity before repeated coordination can be interpreted.
  conditions:
  - commits may be squashed, split, copied, generated, renamed, or grouped mechanically
  derivation: direct
  confidence: strong
  provenance:
  - F-CONCEPT-SDX-b864bebc70eb
  - F-CONCEPT-SDX-15e6d8564bf0
- id: E-CHANGELEGACY-031-data-fitness-prerequisite-topology
  from: repository-assessment-behavioral-data-fitness
  relation: prerequisite-of
  to: architecture-team-topology-force
  claim: Contributor and ownership evidence must account for aliases, pair or mob work, organizational dates, squashes, and service accounts before it informs team-topology reasoning.
  conditions:
  - version-control authorship or ownership history is used as a proxy for coordination or knowledge
  derivation: corroborated
  confidence: strong
  provenance:
  - F-CONCEPT-SDX-714cb5634d4a
  - F-CONCEPT-FSA-e5e17aa74fb6
- id: E-CHANGELEGACY-032-cochange-evidence-boundary-candidate
  from: refactoring-cochange-evidence
  relation: evidence-for
  to: repository-assessment-behavioral-boundary-candidate
  claim: Repeated co-change across technical layers can nominate a component or domain-boundary candidate, but direction, cause, and semantic validity remain unresolved.
  conditions:
  - logical changes are fit
  - the relationship is recurrent and surprising
  - actual diffs and current source are inspected
  derivation: direct
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-15e6d8564bf0
  - F-CONCEPT-SDX-81087ba97153
- id: E-CHANGELEGACY-033-candidate-evidence-bounded-context
  from: repository-assessment-behavioral-boundary-candidate
  relation: evidence-for
  to: domain-bounded-context
  claim: A behavioral change cluster supplies candidate evidence for a Bounded Context only when domain language, invariants, identity, data authority, and expert examples establish semantic coherence.
  conditions:
  - the candidate crosses or groups meaningful domain concepts
  - domain evidence can confirm or reject the historical cluster
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-c94488f64ebb
  - F-CONCEPT-DDD-66cc671ede0b
- id: E-CHANGELEGACY-034-topology-evidence-boundary-candidate
  from: architecture-team-topology-force
  relation: evidence-for
  to: repository-assessment-behavioral-boundary-candidate
  claim: Actual coordination and ownership pressure can strengthen a behavioral boundary candidate when it aligns with semantic cohesion and accepted operational drivers.
  conditions:
  - team evidence is fit and used for system reasoning rather than blame
  - organization structure alone does not select the boundary
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-FSA-e5e17aa74fb6
  - F-CONCEPT-SDX-81087ba97153
- id: E-CHANGELEGACY-035-no-performance-constrains-topology
  from: repository-assessment-metrics-not-performance
  relation: constrains
  to: architecture-team-topology-force
  claim: Team-topology and ownership signals may inform system coordination risk but must never be repurposed as individual productivity or performance evidence.
  conditions:
  - behavioral repository data identifies contributors or ownership
  - the analysis could affect people evaluation
  derivation: corroborated
  confidence: universal
  provenance:
  - F-CONCEPT-SDX-d65947c87148
  - F-CONCEPT-FSA-e5e17aa74fb6
- id: E-CHANGELEGACY-036-hotspot-evidence-splinter
  from: refactoring-hotspot-prioritization
  relation: evidence-for
  to: refactoring-splinter-campaign
  claim: A validated active and congested hotspot can earn a splinter campaign when one recognizable high-activity responsibility can be extracted behind the old API.
  conditions:
  - history is fit
  - parallel changes create current integration cost
  - regression protection and a semantic seam exist
  derivation: direct
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-b25be62a75a5
  - F-CONCEPT-SDX-5b145b0aacfb
- id: E-CHANGELEGACY-037-splinter-specializes-direction
  from: refactoring-splinter-campaign
  relation: specializes
  to: refactoring-directional-campaign
  claim: The splinter pattern specializes a broad directional campaign by extracting one responsibility at a time behind a compatibility facade and revising the next step from new evidence.
  conditions:
  - the target is a congested active hotspot
  - each intermediate extraction is useful and protected
  derivation: corroborated
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-5b145b0aacfb
  - F-CONCEPT-REF-72d068fb3352
- id: E-CHANGELEGACY-038-splinter-implements-migration
  from: refactoring-splinter-campaign
  relation: implements
  to: refactoring-compatibility-migration
  claim: Keeping the old API as a temporary facade lets a splinter campaign preserve callers while responsibilities move incrementally.
  conditions:
  - the facade forwards without unauthorized semantic change
  - migration or facade-removal triggers are explicit
  derivation: synthesized
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-89178e7889da
  - F-CONCEPT-REF-eefb58a34d08
- id: E-CHANGELEGACY-039-logical-set-prerequisite-cochange
  from: repository-assessment-logical-change-set
  relation: prerequisite-of
  to: refactoring-cochange-evidence
  claim: Cross-repository or split-commit co-change analysis requires defensible grouping into logical changes before coupling support and degree are interpreted.
  conditions:
  - one task may span multiple commits or repositories
  - ticket identifiers or lower-confidence grouping rules are recorded
  derivation: direct
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-12a148197eac
  - F-CONCEPT-SDX-15e6d8564bf0
- id: E-CHANGELEGACY-040-early-warning-derived-cochange
  from: repository-assessment-behavioral-early-warning
  relation: derived-from
  to: refactoring-cochange-evidence
  claim: A missing historically expected companion change can create a review prompt, while intentional divergence remains allowed unless an independent contract makes it mandatory.
  conditions:
  - the co-change relationship is recurrent, fit, and relevant to the current change
  - the warning is bypassable with rationale
  derivation: direct
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-df8340541154
  - F-CONCEPT-SDX-15e6d8564bf0
- id: E-CHANGELEGACY-041-early-warning-derived-trend
  from: repository-assessment-behavioral-early-warning
  relation: derived-from
  to: repository-assessment-complexity-trend
  claim: A steep repository-relative complexity increase can focus early review without imposing a universal threshold or proving a design defect.
  conditions:
  - before and after samples use comparable semantics
  - the current diff and change purpose are inspected
  derivation: direct
  confidence: contextual
  provenance:
  - F-CONCEPT-SDX-83f0f415584a
  - F-CONCEPT-SDX-c5c9444a3e00
- id: E-CHANGELEGACY-042-review-severity-constrains-warning
  from: review-severity-confidence-separation
  relation: constrains
  to: repository-assessment-behavioral-early-warning
  claim: A behavioral warning remains a confidence-labeled investigation prompt or suggestion rather than a blocker unless an accepted contract and direct defect evidence justify blocking severity.
  conditions:
  - the warning comes from history, trend, hotspot, or co-change rather than a directly observed contract violation
  derivation: synthesized
  confidence: strong
  provenance:
  - F-CONCEPT-CC-15b7c4b5b811
  - F-CONCEPT-SDX-df8340541154
- id: E-CHANGELEGACY-043-no-performance-constrains-data-fitness
  from: repository-assessment-metrics-not-performance
  relation: constrains
  to: repository-assessment-behavioral-data-fitness
  claim: Even perfectly fit behavioral repository data lacks authority to score individual productivity or performance.
  conditions:
  - the proposed use concerns a person's evaluation, ranking, reward, or sanction
  derivation: synthesized
  confidence: universal
  provenance:
  - F-CONCEPT-SDX-6cbe3260028c
  - F-CONCEPT-SDX-b864bebc70eb
