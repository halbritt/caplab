schema_version: agent-doctrine-graph-edges/1
edges:
  - id: E-IMPLLANG-001-readiness-operationalizes-evidence
    from: implementation-readiness
    relation: operationalizes
    to: universal-evidence-before-intervention
    claim: Implementation readiness turns the general evidence obligation into a risk-scaled check of outcome, contract, placement, failure policy, verification, and integration before coding.
    conditions:
      - the task authorizes consequential implementation rather than read-only investigation
      - missing facts cannot be isolated safely in an explicitly disposable experiment
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-CC-2291cd188fa0, F-CONCEPT-CC-8730c675fe4f]

  - id: E-IMPLLANG-002-repository-constrains-readiness
    from: universal-repository-contract-precedence
    relation: constrains
    to: implementation-readiness
    claim: Repository requirements, architecture, toolchain, and accepted conventions determine which prerequisites an implementation must satisfy and how formal its readiness evidence must be.
    conditions:
      - applicable repository contracts have been discovered for the target path
      - no authorized decision supersedes those contracts
    derivation: corroborated
    confidence: universal
    provenance: [F-CONCEPT-CC-59bf0838015e, F-CONCEPT-CC-2291cd188fa0]

  - id: E-IMPLLANG-003-placement-implements-information-hiding
    from: implementation-placement-by-ownership
    relation: implements
    to: universal-information-hiding
    claim: Placing behavior with the owner of its state, policy, and invariants implements information hiding by preventing callers and peer modules from reconstructing or duplicating that knowledge.
    conditions:
      - ownership is established from data, policy, invariants, and callers
      - the selected owner can expose a coherent contract without unrelated concerns
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-APOSD-0a3eb9743076, F-CONCEPT-APOSD-e67566b00059]

  - id: E-IMPLLANG-004-placement-enables-local-reasoning
    from: implementation-placement-by-ownership
    relation: enables
    to: universal-local-reasoning
    claim: Ownership-based placement enables a change to be understood within one coherent module instead of tracing duplicated rules and exposed representation across the repository.
    conditions:
      - behavior and the knowledge it needs remain co-located
      - the interface does not leak nonlocal sequencing or representation
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-APOSD-0a3eb9743076, F-CONCEPT-APOSD-2bc29e652438]

  - id: E-IMPLLANG-005-aggregate-constrains-placement
    from: domain-aggregate-invariant-boundary
    relation: constrains
    to: implementation-placement-by-ownership
    claim: When behavior can violate an Aggregate invariant, mutation authority and consistency scope constrain placement to the Aggregate owner or an explicitly authorized coordinating boundary.
    conditions:
      - domain evidence establishes an Aggregate and invariant that must remain consistent
      - the new behavior reads or mutates state governed by that invariant
    derivation: synthesized
    confidence: strong
    provenance: [F-CONCEPT-DDD-e1f709bfd6bd, F-CONCEPT-APOSD-0a3eb9743076]

  - id: E-IMPLLANG-006-earned-abstraction-constrains-api
    from: universal-earned-abstraction
    relation: constrains
    to: implementation-minimal-coherent-api
    claim: A new API boundary is warranted only when its minimal contract hides coherent complexity, knowledge, or demonstrated variation better than direct code.
    conditions:
      - real consumers and their required operations are known
      - the interface reduces total caller and maintenance cost rather than forwarding mechanism
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-APOSD-2ea5ca3d7275, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-007-api-prerequisite-risk-tests
    from: implementation-minimal-coherent-api
    relation: prerequisite-of
    to: implementation-risk-driven-tests
    claim: Contract-derived tests require an explicit account of inputs, outputs, invariants, ownership, side effects, and failures before cases and oracles can be selected.
    conditions:
      - the tests claim to protect a reusable or externally observable contract
      - characterization is distinguished from desired-behavior testing
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-PP-d90f9a137c18, F-CONCEPT-PP-3303b20a4da0]

  - id: E-IMPLLANG-008-invariants-refine-api
    from: universal-explicit-invariants
    relation: refines
    to: implementation-minimal-coherent-api
    claim: Preconditions, postconditions, and state invariants refine an API by making caller and implementation obligations explicit without prescribing hidden mechanism.
    conditions:
      - the invariant is accepted behavior rather than an implementation preference
      - external input failures remain distinct from impossible internal states
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-PP-18ee8f1485d3, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-009-domain-interface-specializes-api
    from: domain-intention-revealing-interface
    relation: specializes
    to: implementation-minimal-coherent-api
    claim: An intention-revealing domain interface specializes the general API contract by expressing purpose, effects, and invariants in validated domain language instead of storage or orchestration mechanics.
    conditions:
      - the boundary exposes domain behavior rather than infrastructure mechanism
      - domain experts validate the operation names and consequences
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-DDD-dd56be5c6621, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-010-inversion-constrains-api
    from: architecture-dependency-inversion-gate
    relation: constrains
    to: implementation-minimal-coherent-api
    claim: A dependency-inversion interface must remain consumer-shaped and minimal, and is justified only by demonstrated substitution, asymmetric volatility, policy separation, or boundary pressure.
    conditions:
      - dependency inversion is proposed for an existing or new implementation dependency
      - direct coupling and a facade are compared as lower-cost alternatives
    derivation: corroborated
    confidence: contextual
    provenance: [F-CONCEPT-CA-00ecbddbb165, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-011-error-surface-operationalizes-policy
    from: implementation-error-surface-reduction
    relation: operationalizes
    to: implementation-explicit-failure-policy
    claim: Natural total semantics, reliable masking, and aggregation can operationalize a failure policy by reducing handling sites without erasing information callers need.
    conditions:
      - the failure taxonomy and recovery owner are already explicit
      - containment or aggregation preserves durability and observability
    derivation: direct
    confidence: contextual
    provenance: [F-CONCEPT-APOSD-71fddb56f8d8, F-CONCEPT-CC-233e88b9c99c]

  - id: E-IMPLLANG-012-containment-constrains-error-reduction
    from: implementation-fail-fast-or-recover
    relation: constrains
    to: implementation-error-surface-reduction
    claim: An error case may be masked or defined away only when the selected containment, recovery, or termination policy makes continued behavior trustworthy.
    conditions:
      - correctness, availability, durability, and restart consequences are known
      - a contained fallback or termination boundary is operationally valid
    derivation: corroborated
    confidence: contextual
    provenance: [F-CONCEPT-PP-5850f3961698, F-CONCEPT-APOSD-71fddb56f8d8]

  - id: E-IMPLLANG-013-result-representation-refines-failure
    from: implementation-normal-result-or-exception
    relation: refines
    to: implementation-explicit-failure-policy
    claim: Distinguishing expected results from exceptional failure refines how the broader failure policy is represented in ordinary control flow, status, return values, or exception mechanisms.
    conditions:
      - normality is defined by the operation contract and caller behavior
      - the selected language mechanism preserves cleanup and caller-relevant context
    derivation: direct
    confidence: contextual
    provenance: [F-CONCEPT-PP-e6b506d51dc9, F-CONCEPT-PP-811f1df832f2]

  - id: E-IMPLLANG-014-lifecycle-requires-failure-policy
    from: performance-resource-lifecycle
    relation: requires
    to: implementation-explicit-failure-policy
    claim: Resource and task ownership requires explicit error, cancellation, partial-completion, cleanup, and shutdown semantics on every exit path.
    conditions:
      - code creates concurrent work or acquires a closeable, scarce, or external resource
      - failures can occur during use, completion, or cleanup
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-EGO-80467c3675ec, F-CONCEPT-CC-233e88b9c99c]

  - id: E-IMPLLANG-015-obvious-flow-operationalizes-local-reasoning
    from: implementation-obvious-control-flow
    relation: operationalizes
    to: universal-local-reasoning
    claim: Visible nominal flow, state transitions, variable roles, termination, and exhaustive cases operationalize local reasoning inside a routine or module.
    conditions:
      - ordering and side effects remain explicit
      - simplification does not alter required concurrency or failure semantics
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-APOSD-f41be09fb465, F-CONCEPT-APOSD-2bc29e652438]

  - id: E-IMPLLANG-016-naming-enables-obviousness
    from: implementation-semantic-naming
    relation: enables
    to: implementation-obvious-control-flow
    claim: Precise names make state, role, units, and effects visible so readers do not need to reconstruct them from mechanism and call history.
    conditions:
      - names follow repository and language conventions
      - the underlying abstraction and state model are coherent
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-APOSD-f8e2728d0282, F-CONCEPT-APOSD-f41be09fb465]

  - id: E-IMPLLANG-017-domain-language-constrains-naming
    from: domain-language-model-loop
    relation: constrains
    to: implementation-semantic-naming
    claim: In domain-facing code, expert-validated Ubiquitous Language constrains symbol names so code, examples, tests, and discussion preserve the same concepts and distinctions.
    conditions:
      - a domain model and language are active in the target context
      - externally fixed protocol or schema names are adapted rather than silently rewritten
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-DDD-43e35e2d42ec, F-CONCEPT-APOSD-f8e2728d0282]

  - id: E-IMPLLANG-018-comments-enable-obviousness
    from: implementation-non-obvious-commentary
    relation: enables
    to: implementation-obvious-control-flow
    claim: Commentary enables obviousness when it records rationale, invariants, units, ownership, or nonlocal constraints that correct local structure cannot express.
    conditions:
      - the comment contains stable information readers need
      - code and names have first been made as clear as the repository permits
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-APOSD-3f17a9e18d90, F-CONCEPT-APOSD-f41be09fb465]

  - id: E-IMPLLANG-019-comments-preserve-api-contract
    from: implementation-non-obvious-commentary
    relation: preserves
    to: implementation-minimal-coherent-api
    claim: Maintained abstraction-level comments preserve API obligations that signatures cannot encode, including units, ownership, side effects, sequencing, failure, and rationale.
    conditions:
      - the information is part of the caller contract
      - the documentation is maintained with the implementation and compatibility process
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-APOSD-3f17a9e18d90, F-CONCEPT-APOSD-a90ebdb601c1]

  - id: E-IMPLLANG-020-comments-first-operationalizes-uncertainty
    from: implementation-comments-first-design-probe
    relation: operationalizes
    to: universal-minimize-simultaneous-uncertainty
    claim: Drafting a caller contract and intent-level implementation before code isolates interface incoherence while redesign remains cheap.
    conditions:
      - the proposed routine or boundary is difficult to explain concisely
      - comments-first is an optional design experiment rather than a repository mandate
    derivation: synthesized
    confidence: contextual
    provenance: [F-CONCEPT-APOSD-854a62a628e0, F-CONCEPT-CC-8dae51f003ad]

  - id: E-IMPLLANG-021-comments-structure-tension
    from: implementation-non-obvious-commentary
    relation: in-tension-with
    to: implementation-obvious-control-flow
    claim: Commentary preserves information code cannot express, while excessive explanatory prose can conceal structure that should instead be made locally obvious.
    conditions:
      - a review must choose between structural clarification and retained explanatory text
      - the repository's documentation contract and reader needs are known
    derivation: contested
    confidence: contextual
    provenance: [F-CONCEPT-APOSD-3f17a9e18d90, F-CONCEPT-CC-be15f4673a75, F-CONCEPT-APOSD-f41be09fb465]
    conflict_ref: conflict-comments-vs-self-documenting-structure

  - id: E-IMPLLANG-022-duplication-indicates-amplification
    from: implementation-duplication-as-evidence
    relation: indicates
    to: universal-change-amplification
    claim: Multiple representations of one authoritative rule indicate change amplification when a conceptual change requires coordinated edits to keep them consistent.
    conditions:
      - the occurrences encode the same knowledge and ownership
      - logical or historical evidence shows the same reason to change
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-PP-2197b08e3bb2, F-CONCEPT-APOSD-1dd25725fdb8]

  - id: E-IMPLLANG-023-duplication-evidence-for-abstraction
    from: implementation-duplication-as-evidence
    relation: evidence-for
    to: universal-earned-abstraction
    claim: Demonstrated duplicated knowledge supplies evidence for a shared abstraction only when a coherent contract lowers total coupling and preserves legitimate independent evolution.
    conditions:
      - semantic ownership and coordinated change are demonstrated
      - the candidate abstraction is cheaper and clearer than deliberate duplication or generation
    derivation: corroborated
    confidence: contextual
    provenance: [F-CONCEPT-APOSD-08a9b621a0da, F-CONCEPT-APOSD-2ea5ca3d7275]

  - id: E-IMPLLANG-024-representation-requires-invariants
    from: implementation-representation-fit
    relation: requires
    to: universal-explicit-invariants
    claim: Selecting a data or control representation requires explicit ordering, uniqueness, mutation, ownership, precision, and materialization invariants before container or layout choices can be judged.
    conditions:
      - the representation affects behavior or a public boundary
      - performance claims are evaluated separately with representative measurement
    derivation: synthesized
    confidence: strong
    provenance: [F-CONCEPT-FP-c50eaf7296ff, F-CONCEPT-PP-18ee8f1485d3]

  - id: E-IMPLLANG-025-language-conformance-specializes-precedence
    from: implementation-repository-language-conformance
    relation: specializes
    to: universal-repository-contract-precedence
    claim: Language choices specialize repository precedence by checking the compiler or interpreter floor, dependencies, build tools, static tooling, adjacent idiom, and compatibility before adopting a construct.
    conditions:
      - implementation introduces or changes a language-specific mechanism
      - the target is maintained source rather than out-of-scope generated or vendored code
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-CC-24e6e3121f6c, F-CONCEPT-CC-59bf0838015e]

  - id: E-IMPLLANG-026-tests-preserve-behavior
    from: implementation-risk-driven-tests
    relation: preserves
    to: universal-preserve-behavior-by-default
    claim: Contract-, boundary-, state-, failure-, and regression-derived tests create an executable preservation surface for authorized implementation, repair, refactoring, and optimization.
    conditions:
      - tests observe the affected contract rather than irrelevant implementation choreography
      - characterization and desired behavior are labeled separately
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-CC-ba525ba51386, F-CONCEPT-REF-470f9e409dc8]

  - id: E-IMPLLANG-027-coverage-threatens-adequate-protection
    from: testing-coverage-is-not-adequacy
    relation: threatens
    to: implementation-risk-driven-tests
    claim: Treating line or branch coverage as adequacy threatens risk-driven protection by substituting execution counts for contract, boundary, failure, state, and oracle evidence.
    conditions:
      - coverage percentage is used as the sole or dominant acceptance claim
      - test assertions and risk coverage have not been inspected
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-CC-8cab97dc172f, F-CONCEPT-CC-ba525ba51386]

  - id: E-IMPLLANG-028-test-first-operationalizes-protection
    from: testing-test-first-feedback
    relation: operationalizes
    to: implementation-risk-driven-tests
    claim: An observed failing test operationalizes risk-driven protection when it expresses an accepted contract or reproduced defect before the implementation changes.
    conditions:
      - expected behavior and an observable oracle are already established
      - the test is observed failing for the intended reason
    derivation: direct
    confidence: contextual
    provenance: [F-CONCEPT-CC-122f0ecf84a1, F-CONCEPT-CC-ba525ba51386]

  - id: E-IMPLLANG-029-design-before-tests-enables-api
    from: testing-design-before-feature-tests
    relation: enables
    to: implementation-minimal-coherent-api
    claim: Comparing responsibilities and caller-facing alternatives before feature-by-feature tests enables a coherent shared API when the abstraction itself remains unsettled.
    conditions:
      - the work creates a shared or durable boundary with multiple consumers
      - executable feedback follows once the interface decision is explicit
    derivation: corroborated
    confidence: contextual
    provenance: [F-CONCEPT-APOSD-f6cc19b3dc4b, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-030-debugging-operationalizes-uncertainty
    from: debugging-hypothesis-led-investigation
    relation: operationalizes
    to: universal-minimize-simultaneous-uncertainty
    claim: A stabilized reproduction, competing hypotheses, and one discriminating observation at a time operationalize uncertainty isolation during defect diagnosis.
    conditions:
      - expected and actual behavior can be stated
      - diagnostic experiments avoid unauthorized production mutation
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-CC-d614293db2a2, F-CONCEPT-CC-8dae51f003ad]

  - id: E-IMPLLANG-031-investigation-prerequisite-repair
    from: debugging-hypothesis-led-investigation
    relation: prerequisite-of
    to: debugging-causal-repair
    claim: A causal repair requires a stabilized reproduction, localized first divergence, and supported causal hypothesis before production logic is changed.
    conditions:
      - the change claims to repair a root cause rather than provide containment
      - urgent containment, if any, is recorded separately
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-CC-d614293db2a2, F-CONCEPT-CC-e1fdb3f9e1e0]

  - id: E-IMPLLANG-032-repair-preserves-change-separation
    from: debugging-causal-repair
    relation: preserves
    to: universal-separate-semantic-structural-change
    claim: A minimal one-cause repair preserves causal attribution and semantic-structural separation by deferring unrelated cleanup and redesign to a later campaign.
    conditions:
      - the defect and authorized behavior change are bounded
      - structural work is not required to expose the causal repair safely
    derivation: synthesized
    confidence: strong
    provenance: [F-CONCEPT-CC-e1fdb3f9e1e0, F-CONCEPT-REF-93dea0b4cc46]

  - id: E-IMPLLANG-033-tests-enable-causal-repair
    from: implementation-risk-driven-tests
    relation: enables
    to: debugging-causal-repair
    claim: A failing reproduction and focused regression oracle enable a repair to demonstrate that it changed the causal path while preserving relevant surrounding behavior.
    conditions:
      - the test observes the reported failure or first divergence
      - broader affected contracts receive proportionate regression checks
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-CC-ba525ba51386, F-CONCEPT-CC-e1fdb3f9e1e0]

  - id: E-IMPLLANG-034-authority-constrains-repair
    from: agent-conduct-authority-bounded-action
    relation: constrains
    to: debugging-causal-repair
    claim: A supported diagnosis does not authorize a repair when the next step chooses product semantics, changes architecture, mutates production, or exceeds the granted execution and acceptance boundary.
    conditions:
      - diagnosis and execution authority are held by different roles or remain ambiguous
      - the repair has semantic, architectural, external, or irreversible effects
    derivation: synthesized
    confidence: strong
    provenance: [F-CONCEPT-PP-3cd1576a1ee8, F-CONCEPT-CC-e1fdb3f9e1e0]

  - id: E-IMPLLANG-035-review-operationalizes-evidence
    from: review-severity-confidence-separation
    relation: operationalizes
    to: universal-evidence-before-intervention
    claim: Review classification operationalizes evidence discipline by separating confirmed contract violations from risks, suggestions, and preferences while reporting consequence and confidence independently.
    conditions:
      - a review finding recommends or requires a change
      - the affected contract and consequence can be inspected
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-CC-15b7c4b5b811, F-CONCEPT-CC-8730c675fe4f]

  - id: E-IMPLLANG-036-repository-constrains-review
    from: universal-repository-contract-precedence
    relation: constrains
    to: review-severity-confidence-separation
    claim: Repository acceptance gates and conventions determine whether a review observation is a blocker, defect, or optional preference; source-school taste cannot set severity independently.
    conditions:
      - the repository declares an applicable behavior, architecture, style, or tooling contract
      - the reviewer remains within the authorized change scope
    derivation: corroborated
    confidence: universal
    provenance: [F-CONCEPT-CC-59bf0838015e, F-CONCEPT-CC-15b7c4b5b811]

  - id: E-IMPLLANG-037-python-idiom-specializes-conformance
    from: python-repository-shaped-idiom
    relation: specializes
    to: implementation-repository-language-conformance
    claim: Repository-shaped Python idiom specializes language conformance with interpreter, dependency, import, typing, formatter, and neighboring-code evidence.
    conditions:
      - maintained Python code is being implemented or reviewed
      - public behavior and the supported version floor remain protected
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-FP-6191dfc584db, F-CONCEPT-FP-b8b872819c0e]

  - id: E-IMPLLANG-038-python-protocol-specializes-api
    from: python-protocol-conformance
    relation: specializes
    to: implementation-minimal-coherent-api
    claim: Python protocol conformance specializes a coherent API by implementing only the standard operations real clients require with complete conventional semantics.
    conditions:
      - callers already consume a Python protocol or built-in operation
      - return, mutation, exhaustion, fallback, and failure laws can be honored
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-FP-eef30a8a9f91, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-039-python-interface-specializes-abstraction
    from: python-interface-mechanism-selection
    relation: specializes
    to: universal-earned-abstraction
    claim: Choosing direct coupling, duck typing, Protocol, ABC, or a concrete type specializes earned abstraction according to consumer operations and static or runtime enforcement needs.
    conditions:
      - a Python interface or substitution boundary is under consideration
      - implementation count, ownership, and variation are demonstrated rather than hypothetical
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-FP-4c60a2f40cc7, F-CONCEPT-APOSD-2ea5ca3d7275]

  - id: E-IMPLLANG-040-python-dynamic-specializes-abstraction
    from: python-dynamic-mechanism-escalation
    relation: specializes
    to: universal-earned-abstraction
    claim: Python properties, decorators, descriptors, subclass hooks, and metaclasses specialize the abstraction gate by escalating only as repeated interception or framework construction rules demand.
    conditions:
      - an ordinary function or attribute has been evaluated first
      - discoverability, import behavior, tooling, and public compatibility remain supportable
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-FP-aff4f8afdf70, F-CONCEPT-APOSD-2ea5ca3d7275]

  - id: E-IMPLLANG-041-python-representation-specializes-fit
    from: python-representation-fit
    relation: specializes
    to: implementation-representation-fit
    claim: Python container selection specializes representation fit across lists, tuples, deques, sets, mappings, flat arrays, views, and generators using semantic and workload requirements.
    conditions:
      - ordering, uniqueness, mutation, access, ownership, size, and materialization are explicit
      - lower-level storage is measured before adoption for performance
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-FP-b929241844bf, F-CONCEPT-FP-c50eaf7296ff]

  - id: E-IMPLLANG-042-python-mutable-ownership-refines-api
    from: python-mutable-ownership
    relation: refines
    to: implementation-minimal-coherent-api
    claim: Python's shared-reference semantics refine an API contract by requiring explicit borrowed, consumed, copied, shared, or owned behavior for mutable inputs and retained state.
    conditions:
      - an input may be stored or mutated beyond the call
      - identity, nested aliasing, lifetime, and caller-visible mutation are material
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-FP-c65f79886e4b, F-CONCEPT-PP-d90f9a137c18]

  - id: E-IMPLLANG-043-python-text-specializes-failure-policy
    from: python-text-bytes-boundary
    relation: specializes
    to: implementation-explicit-failure-policy
    claim: Python text and bytes handling specializes failure policy by making codec, invalid-input, normalization, replacement, and loss decisions explicit at external boundaries.
    conditions:
      - bytes cross a file, process, network, database, or serialization boundary
      - opaque binary data is not decoded merely for convenience
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-FP-8345f212d53e, F-CONCEPT-CC-233e88b9c99c]

  - id: E-IMPLLANG-044-python-static-boundary-requires-tests
    from: python-runtime-static-boundary
    relation: requires
    to: implementation-risk-driven-tests
    claim: Because Python type hints and structural checks cannot validate runtime data or behavior, executable tests and trust-boundary validation remain required for material contracts and invariants.
    conditions:
      - the code relies on hints, TypedDict, cast, or runtime protocol checks
      - external data or behavioral invariants affect correctness
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-FP-ca0253d8906f, F-CONCEPT-FP-925f7861cb72]

  - id: E-IMPLLANG-045-python-laws-refine-protocol
    from: python-special-method-laws
    relation: refines
    to: python-protocol-conformance
    claim: Equality, hashing, operator, slicing, representation, and formatting laws refine protocol conformance with algebra, dispatch, fallback, mutation, and result constraints.
    conditions:
      - the custom type implements the relevant special-method protocol
      - cross-type, unsupported, boundary, and mutability cases are tested
    derivation: direct
    confidence: strong
    provenance: [F-CONCEPT-FP-ed6febfafbeb, F-CONCEPT-FP-eef30a8a9f91]

  - id: E-IMPLLANG-046-python-streaming-specializes-representation
    from: python-streaming-iteration
    relation: specializes
    to: implementation-representation-fit
    claim: Python streaming specializes representation selection by accounting for one-pass iteration, replay, deferred failure, partial consumption, stable snapshots, and resource lifetime.
    conditions:
      - a generator or iterator is compared with materialized data
      - consumer access and lifetime requirements are explicit
    derivation: corroborated
    confidence: strong
    provenance: [F-CONCEPT-FP-afbee32d40fd, F-CONCEPT-FP-c50eaf7296ff]

  - id: E-IMPLLANG-047-python-cleanup-specializes-lifecycle
    from: python-structured-cleanup
