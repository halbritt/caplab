schema_version: agent-doctrine-procedures/1
procedures:
  - id: proc-plan-implementation
    title: Plan an implementation
    purpose: Convert an accepted behavior request into the smallest execution-ready plan that fits the repository and authority boundary.
    inputs:
      - accepted outcome, non-goals, and acceptance criteria
      - authority and write scope
      - repository instructions and accepted decisions
      - current source, tests, integration lifecycle, and relevant runtime constraints
    evidence_required:
      - traced current entry point and affected control/data path
      - identified invariant, information, policy, and lifecycle owners
      - existing tests/gates shown to cover or miss the affected path
      - classified change type and compatibility surface
    decision_steps:
      - "1. Rewrite the request as observable scenarios; mark every unresolved semantic choice as an owner decision."
      - "2. Discover applicable repository contracts from root to target and record required generation, build, test, ownership, and deployment gates."
      - "3. Trace the current behavior from entry point to state changes, side effects, errors, and integration boundaries; stop tracing once every proposed edit has a causal role."
      - "4. Classify feature, repair, refactoring, architecture, migration, optimization, cleanup, dependency, deletion, hardening, and documentation portions; split incompatible types into checkpoints."
      - "5. Select placement by information/invariant/lifecycle ownership. Compare extending the existing boundary with a local helper, direct implementation, composition, or new abstraction."
      - "6. Specify valid, boundary, invalid, partial, timeout/cancel, retry, and cleanup behavior that is material to the contract."
      - "7. Map each scenario and preserved property to an existing test/probe or a planned protection step; identify tests that must fail before a repair."
      - "8. Sequence the smallest coherent checkpoints: protection, implementation, integration, cleanup that is strictly required, and verification. Give each checkpoint an expected diff, gate, and rollback."
      - "9. Recheck authority for public API, behavior, data, dependency, architecture, security/durability, operations, and publication effects."
    outputs:
      - scenario and non-goal list
      - affected-path and placement rationale
      - checkpointed plan with exact verification
      - owner decisions, stop conditions, and residual risk
    stop_conditions:
      - expected behavior cannot be made unambiguous from accepted evidence
      - the affected path or invariant owner cannot be identified enough to bound edits
      - required feedback does not exercise the proposed surface
    escalation_conditions:
      - an unresolved choice changes product semantics, public compatibility, architecture, data, dependency, security/durability, or operations
      - required action exceeds write or environment authority
    common_false_positives:
      - assuming a new file or layer is needed because the feature is conceptually new
      - treating a nearby test as proof of path coverage
      - adding future variants that are not in accepted requirements
    roles: [coding-agent, implementation-agent, debugging-and-repair-agent]
    related_concepts:
      - universal-repository-contract-precedence
      - implementation-placement-by-ownership
      - implementation-explicit-failure-policy

  - id: proc-place-new-behavior
    title: Decide where new behavior belongs
    purpose: Locate behavior where it can enforce its rules with minimal leaked knowledge and change amplification.
    inputs:
      - behavior scenarios and callers
      - data, invariants, policies, side effects, lifecycle, and ownership
      - current dependency and module structure
      - history or expected change axes
    evidence_required:
      - actual reads/writes and decisions the behavior requires
      - existing owner of each invariant and authoritative data item
      - caller and operational lifecycle constraints
    decision_steps:
      - "1. List the facts and state transitions required by the behavior; mark which are authoritative versus derived."
      - "2. Identify the component already responsible for keeping each invariant true. If multiple components claim authority, stop and surface the ownership conflict."
      - "3. Prefer the location that owns most required authoritative information and can enforce the invariant without callers coordinating steps."
      - "4. Reject a location that requires exposing volatile representation, duplicating policy, or sending callers through a message chain merely for data access."
      - "5. Check lifecycle: construction, transaction, request, background task, shutdown, persistence, and retry responsibilities must be available at the chosen boundary."
      - "6. Check expected change axes using history and accepted roadmap. Keep independently changing policy/mechanism or domain contexts separate only when evidence shows independence."
      - "7. If no existing location fits, compare a local cohesive component with changing an existing boundary. Create a new boundary only if it has a clear authority and contract."
      - "8. Validate by describing the call from each real consumer; consumers should not supply hidden implementation knowledge or re-enforce the invariant."
    outputs:
      - chosen location and owned responsibility
      - rejected locations with leakage/amplification reasons
      - required boundary changes and tests
    stop_conditions:
      - authoritative data or policy ownership is unresolved
      - placement would cross an unapproved architectural or deployment boundary
    escalation_conditions:
      - no location can enforce the invariant without changing architecture or domain ownership
      - callers require contradictory semantics suggesting separate contexts
    common_false_positives:
      - placing behavior in a generic service because it uses multiple objects
      - moving behavior to data merely because data is present
      - deriving domain ownership from folder names
    roles: [coding-agent, architecture-agent, domain-design-agent]
    related_concepts:
      - implementation-placement-by-ownership
      - universal-local-reasoning
      - domain-language-model-loop

  - id: proc-determine-abstraction-earned
    title: Determine whether an abstraction is earned
    purpose: Distinguish useful information hiding or variation from speculative indirection.
    inputs:
      - concrete examples/callers
      - proposed invariant and variation axis
      - change history or accepted future requirements
      - direct, duplicated, composed, and abstract alternatives
    evidence_required:
      - demonstrated repeated knowledge or a real boundary pressure
      - evidence that examples share meaning, lifecycle, and invariant
      - estimate of caller knowledge and new concepts before/after
    decision_steps:
      - "1. Name the exact pressure: multiple implementations, repeated policy, independent evolution, testing substitution, ownership/deployment boundary, or policy/mechanism separation. Reject 'decoupling' without one."
      - "2. Collect at least two real examples unless one external boundary independently requires a contract. Compare semantics, not syntax."
      - "3. State what remains stable and what varies. If the variation axes differ among examples, keep them local until a coherent model emerges."
      - "4. Sketch the smallest contract including invariants, lifecycle, cost, errors, concurrency, and ownership. Count escape hatches, flags, downcasts, and implementation terms."
      - "5. Compare net reasoning/change cost for direct coupling, local duplication, helper/composition, configuration, and the abstraction. Include navigation and testing costs."
      - "6. Choose the abstraction only if it hides volatile knowledge or contains change better for current evidence; otherwise retain directness or duplication."
      - "7. Set a removal/revisit condition when justification relies partly on expected future variation."
    outputs:
      - earned/not-earned/contested disposition at the caller's granted authority level
      - stable contract and variation axis
      - alternatives and evidence
      - revisit/removal trigger
    stop_conditions:
      - shared meaning cannot be stated without implementation vocabulary
      - consumers need contradictory contracts
    escalation_conditions:
      - the abstraction would become a public API, ownership boundary, plugin model, or deployment contract without authority
    common_false_positives:
      - one implementation plus a mock
      - syntactically similar code with different reasons to change
      - hypothetical reuse or framework fashion
    roles: [coding-agent, architecture-agent, refactoring-agent, review-agent]
    related_concepts:
      - universal-earned-abstraction
      - implementation-duplication-as-evidence
      - architecture-earned-boundary

  - id: proc-review-api
    title: Review an API
    purpose: Determine whether an API gives real consumers a coherent, minimal, safe contract without leaking avoidable complexity.
    inputs:
      - API definition and implementations
      - real consumers and scenarios
      - compatibility/versioning policy
      - error, lifecycle, cost, concurrency, and security constraints
    evidence_required:
      - traced calls from representative consumers
      - invariant and ownership model
      - accepted compatibility obligations
      - contract tests or examples
    decision_steps:
      - "1. Enumerate current consumers and the job each performs; flag operations justified only by imagined consumers."
      - "2. Rewrite each operation in domain/policy terms and identify implementation, storage, or framework details exposed to callers."
      - "3. Check representational integrity: invalid states, partial construction, ambiguous identity, unchecked units, and ownership/lifetime must be prevented or explicit."
      - "4. Check behavioral contract: side effects, ordering, idempotency, blocking, cost, cancellation, partial results, retryability, cleanup, and concurrency are visible where material."
      - "5. Check cohesion and minimality: operations should serve one concept and not force unrelated consumers to depend on unused capabilities."
      - "6. Check evolution: additions, deprecations, serialization/protocol changes, and mixed versions must fit the compatibility policy."
      - "7. Check testability without exposing internals; prefer testing through stable behavior or consumer-defined narrow contracts."
      - "8. Classify findings as correctness/compatibility defects, risks, or preferences and propose the smallest contract correction."
    outputs:
      - consumer/use-case matrix
      - invariant, failure, cost, and compatibility findings
      - required versus optional changes
    stop_conditions:
      - consumer population or compatibility contract is unknown for a breaking decision
      - domain semantics are disputed
    escalation_conditions:
      - correcting the API requires breaking compatibility, data migration, or ownership changes
    common_false_positives:
      - equating fewer methods with a better API
      - demanding interfaces for test doubles
      - hiding material latency or allocation as an implementation detail
    roles: [coding-agent, architecture-agent, review-agent]
    related_concepts:
      - implementation-minimal-coherent-api
      - universal-information-hiding
      - implementation-explicit-failure-policy

  - id: proc-assess-architectural-pressure
    title: Assess architectural pressure
    purpose: Decide whether observed problems require system-level structural change rather than local implementation, documentation, testing, or ownership repair.
    inputs:
      - decision question and quality priorities
      - current static/runtime/deployment/data/ownership model
      - history, co-change, incidents, operational constraints, and domain evidence
      - accepted architectural decisions
    evidence_required:
      - recurring or high-impact pressure crossing a consequential boundary
      - evidence that lower-level remedies are insufficient
      - quantified or scenario-based driver
    decision_steps:
      - "1. State the symptom and affected outcome without naming architecture."
      - "2. Classify candidate causes: implementation defect, missing invariant/contract, test gap, documentation, team/process, local module, or architecture."
      - "3. For architecture, identify the consequential choice involved: data/authority, dependency direction, deployment, failure containment, scaling, security, technology volatility, or context boundary."
      - "4. Seek independent evidence: static paths plus at least one of runtime, operations, incidents, history/co-change, domain language, or ownership."
      - "5. Test the no-change and local-remedy hypotheses against the driver. If either meets the scenario at materially lower cost, do not recommend architecture work."
      - "6. Estimate frequency, impact, forecast duration, migration/reversal cost, and cost of postponement."
      - "7. Return 'no architectural pressure', 'monitor', 'local remedy', or 'architecture decision required' with falsifying conditions."
    outputs:
      - classified pressure and causal evidence
      - lower-level alternatives
      - assessment or recommendation status, plus an owner decision only when selection authority is explicit
    stop_conditions:
      - the driver cannot be expressed as an observable scenario
      - current system evidence is too incomplete to distinguish architecture from implementation
    escalation_conditions:
      - priorities among conflicting quality attributes lack an owner
      - assessment needs protected production, security, or organizational data beyond scope
    common_false_positives:
      - large files or dependency counts
      - implementation bugs in a module boundary
      - architectural fashion or diagram symmetry
      - high churn caused by a rapidly changing product
    roles: [architecture-agent, repository-assessment-agent, review-agent]
    related_concepts:
      - architecture-scoped-characteristics
      - universal-no-change-option
      - universal-change-amplification

  - id: proc-select-architectural-boundary
    title: Select an architectural boundary
    purpose: Choose whether and where to separate a responsibility based on demonstrated independent forces and total boundary cost.
    inputs:
      - accepted architectural driver and authority
      - candidate responsibilities, data, invariants, policies, teams, deployments, and failure modes
      - quality priorities and migration constraints
    evidence_required:
      - at least one independent force that a boundary can contain
      - current coupling and coordination costs
      - operational and reversal consequences for each boundary form
    decision_steps:
      - "1. List candidate cohesion anchors: one invariant/data authority, domain language/context, policy, lifecycle, deployment/scaling unit, failure/security boundary, or team/operations ownership."
      - "2. List interactions crossing each candidate boundary, including transaction, latency, consistency, versioning, security, observability, and support."
      - "3. Reject candidates whose contract merely forwards internal operations or requires callers to coordinate hidden invariants."
      - "4. Compare in-process module, package/library, process/service, data boundary, and no new boundary. Choose the least costly form that satisfies the driver."
      - "5. Check data and authority: exactly one source of truth and conflict policy must exist for every invariant; copies and caches need freshness/failure semantics."
      - "6. Check expected change and co-change. Keep responsibilities together when they repeatedly change for the same reason; separate only when histories/domain evidence show independent reasons."
      - "7. Define contract, owner, fitness criteria, migration states, compatibility, observability, rollback/safe-forward, and retirement."
      - "8. Prefer a slice that tests the boundary under real forces before full adoption."
    outputs:
      - chosen boundary form and cohesion anchor
      - interaction/cost matrix and rejected candidates
      - contract, ownership, migration, and fitness plan
    stop_conditions:
      - invariant/data authority remains ambiguous
      - the boundary driver disappears under a lower-cost local remedy
    escalation_conditions:
      - process/service/data separation changes operational or product commitments
      - multiple owners claim authority over the same policy or data
    common_false_positives:
      - splitting at nouns or directories
      - one service per team or capability by default
      - treating deployment independence as free
    roles: [architecture-agent, domain-design-agent]
    related_concepts:
      - architecture-earned-boundary
      - architecture-distribution-readiness

  - id: proc-determine-refactoring-earned
    title: Determine whether refactoring is earned
    purpose: Decide whether structural change has enough demonstrated benefit and protection to justify risk now.
    inputs:
      - candidate structure and triggering task/problem
      - source, tests, history/co-change, incidents, and review evidence
      - expected future changes and ownership
    evidence_required:
      - named structural pressure with concrete examples
      - causal link between structure and cost/risk
      - viable preservation surface
    decision_steps:
      - "1. Record the signal—smell, size, duplication, hotspot, co-change, defects, review difficulty, or near-term change—and label it a hypothesis."
      - "2. Gather concrete episodes where the structure amplified edits, obscured an invariant, caused defects, slowed review, or blocked a required change."
      - "3. Filter false signals: generated/vendor code, formatting/bulk commits, stable unattractive code, volatile requirements, one-off migration, or process bottlenecks."
      - "4. Describe the structural cause and predict how a bounded change would reduce the original episodes. Compare no change and local workaround."
      - "5. Define preservation boundaries and demonstrate tests/characterization can detect relevant regressions at useful cadence."
      - "6. Estimate campaign size, review/migration cost, new abstraction cost, reversal, and expected period of benefit."
      - "7. Refactoring is earned only if expected pressure reduction exceeds risk/cost and a bounded campaign exists; otherwise leave, monitor, or characterize."
    outputs:
      - earned/not-earned/monitor disposition at the caller's granted authority level
      - pressure episodes and filtered false positives
      - preservation feasibility and candidate scope
    stop_conditions:
      - no causal structural pressure remains after filtering
      - preservation cannot be made credible for the proposed scope
    escalation_conditions:
      - remedy changes semantics, public API, architecture, data, or operations
    common_false_positives:
      - large/old code
      - high churn without cause analysis
      - code smell catalogs treated as mandatory
      - upcoming work too speculative to value
    roles: [refactoring-agent, legacy-code-agent, review-agent]
    related_concepts:
      - refactoring-smells-as-hypotheses
      - refactoring-demonstrated-pressure
      - refactoring-leave-unattractive-code

  - id: proc-select-first-refactoring-campaign
    title: Select the first refactoring campaign
    purpose: Choose the safest high-leverage structural slice after refactoring has been earned.
    inputs:
      - earned pressure statement
      - candidate seams/campaigns
      - preservation map, test cadence, write scope, and near-term work
    evidence_required:
      - each candidate's predicted pressure reduction
      - dependency and blast-radius map
      - feedback and rollback feasibility
    decision_steps:
      - "1. Generate at least three candidates when feasible: characterize/observe only, local seam/extraction, and broader structural option."
      - "2. For each candidate score pressure reduction, relevance to near-term work, unknown behavior, files/owners affected, feedback speed, reversible checkpoints, migration, and new concepts."
      - "3. Eliminate candidates that mix semantic change, require ungranted architecture, or cannot be verified incrementally."
      - "4. Prefer the candidate that creates a useful seam or localizes one invariant while touching the smallest behavior surface; do not maximize code movement."
      - "5. Define target state, non-goals, temporary structures, and removal criteria."
      - "6. Sequence protection first, then one mechanical or semantic-structure move per checkpoint, compiling/testing after each."
      - "7. Define completion by replaying the motivating change/review task or a proxy tied to it, not by aesthetics or line count."
    outputs:
      - ranked candidate table
      - selected campaign with rationale
      - checkpoint, verification, rollback, and benefit plan
    stop_conditions:
      - no candidate can remain behavior-preserving and bounded
      - test/characterization feedback is too weak or slow for the blast radius
    escalation_conditions:
      - best candidate requires new architectural/domain ownership or public compatibility decisions
    common_false_positives:
      - choosing the worst-looking code instead of highest pressure
      - choosing the broadest campaign for a cleaner endpoint
      - using metric reduction as benefit proof
    roles: [refactoring-agent, legacy-code-agent]
    related_concepts:
      - refactoring-directional-campaign
      - refactoring-small-verified-steps
      - legacy-seams-and-enabling-points

  - id: proc-work-poorly-characterized-code
    title: Work safely in poorly characterized code
    purpose: Create enough feedback and separation to make a required change without first redesigning the system.
    inputs:
      - required change and observable outcome
      - current code/build/runtime and external dependencies
      - available tests, incidents, data, and production observations
      - diagnostic and edit authority
    evidence_required:
      - identified change point
      - smallest observable behavior surface
      - dependency obstacles and enabling points
    decision_steps:
      - "1. Locate the change point where behavior must differ; map only callers, state, side effects, and dependencies that can affect the requested outcome."
      - "2. Capture current behavior at the narrowest stable boundary using existing tests, characterization, snapshots, golden masters, runtime probes, or incident fixtures as appropriate."
      - "3. Include representative normal, boundary, error, and stateful cases; label unknown and nondeterministic dimensions."
      - "4. Identify seams where behavior can vary without editing the core. Prefer an existing object/function/configuration seam; use link/build/preprocessing seams only when pervasive dependencies leave no safer option."
      - "5. If no seam exists, make the smallest mechanical dependency-breaking change at a controlled enabling point and immediately establish a test."
      - "6. Separate sensing from isolation: observe the relevant effect and replace only dependencies required to execute it."
      - "7. Implement the required behavior in a controlled area, integrate through the seam, and verify characterized plus new scenarios."
      - "8. Decide explicitly whether temporary seams remain, deepen into supported boundaries, or are removed after the change."
    outputs:
      - change-point/dependency map
      - characterization suite and detection limits
      - seam/enabling-point recommendation or authorized selection
      - bounded implementation and residual unknowns
    stop_conditions:
      - no observation surface can distinguish regression from success
      - dependency-breaking would alter uncontrolled behavior
    escalation_conditions:
      - characterization requires sensitive production data or destructive access
      - undocumented behavior conflicts with requested semantics
    common_false_positives:
      - mocking all collaborators
      - treating current behavior as intended behavior
      - rewriting for testability before identifying the required change
    roles: [legacy-code-agent, debugging-and-repair-agent, refactoring-agent]
    related_concepts:
      - legacy-characterization-surfaces
      - legacy-seams-and-enabling-points
      - universal-minimize-simultaneous-uncertainty

  - id: proc-distinguish-repair-structural
    title: Distinguish defect repair from structural work
    purpose: Prevent causal repairs and behavior-preserving changes from being obscured in one campaign.
    inputs:
      - symptom/reproducer and expected behavior
      - proposed code changes
      - current structure and tests
    evidence_required:
      - causal chain for the defect
      - preservation boundary for structural edits
      - change-by-change effect classification
    decision_steps:
      - "1. For every proposed edit ask whether an authorized observer could see a changed output, side effect, error, ordering, timing/resource contract, data, or operation. If yes, classify it as semantic."
      - "2. Link each semantic edit to the accepted defect behavior and causal chain. Remove speculative semantic edits."
      - "3. Identify structural edits needed only to expose or reach the causal repair. Prefer mechanical preparation with preservation checks."
      - "4. Create checkpoints: failing reproducer; optional behavior-preserving preparation; minimal repair; optional separately justified cleanup/refactoring."
      - "5. Demonstrate the reproducer still fails after structural preparation and passes only after the repair."
      - "6. Review the repair diff without cleanup noise; then decide whether follow-up structure is earned independently."
    outputs:
      - per-edit semantic/structural classification
      - separated checkpoint sequence
      - defect regression proof and optional follow-up proposal
    stop_conditions:
      - expected behavior is not accepted
      - structural preparation changes the reproducer or other protected behavior
    escalation_conditions:
      - repair requires compatibility, architecture, data, or operational change
    common_false_positives:
      - calling a rewrite a refactor because tests pass
      - treating error-message or timing changes as internal automatically
      - folding a discovered bug into a structural campaign
    roles: [debugging-and-repair-agent, refactoring-agent, review-agent]
    related_concepts:
      - universal-separate-semantic-structural-change
      - refactoring-behavior-preservation
      - debugging-causal-repair

  - id: proc-evaluate-duplication
    title: Evaluate duplication
    purpose: Decide whether repeated code represents harmful repeated knowledge, independent coincidence, or useful evidence that has not yet earned abstraction.
    inputs:
      - duplicated fragments and all known callers
      - domain/invariant meaning and ownership
      - change/co-change history and expected variants
      - candidate shared and local designs
    evidence_required:
      - semantic comparison rather than text similarity alone
      - examples of coordinated or independent change
      - contract and variation axis for any proposed abstraction
    decision_steps:
      - "1. Classify the repetition: identical syntax, repeated domain rule/invariant, repeated test setup/oracle, generated output, compatibility shim, or coincidental shape."
      - "2. Ask whether each occurrence must change for the same reason. Use history/co-change and domain policy to corroborate; filter bulk/generated changes."
      - "3. List differences and likely variants. If examples vary on different axes or ownership/lifecycles differ, retain local duplication."
      - "4. Estimate failure cost of divergence: inconsistent policy, missed fix, shotgun surgery, or merely extra lines."
      - "5. Sketch the smallest shared knowledge owner. Reject an abstraction requiring flags, downcasts, implementation leakage, or callers to recover local context."
      - "6. Compare no change, local helper, generated source, data/configuration, composition, and full abstraction."
      - "7. Unify when shared meaning and coordinated change are demonstrated and net change/reasoning cost falls; otherwise document or monitor the evidence."
    outputs:
      - duplication classification
      - shared meaning/variation analysis
      - unify, retain, generate, or monitor recommendation or authorized selection
    stop_conditions:
      - the shared rule cannot be stated independently of current implementation
      - one occurrence is generated or vendored and has a different authority
    escalation_conditions:
      - unification changes public API, domain ownership, deployment, or compatibility
    common_false_positives:
      - two visually similar algorithms with different policy
      - duplicated test data deliberately keeping cases independent
      - boilerplate better handled by a generator than runtime abstraction
    roles: [coding-agent, refactoring-agent, review-agent]
    related_concepts:
      - implementation-duplication-as-evidence
      - universal-earned-abstraction
      - refactoring-cochange-evidence

  - id: proc-evaluate-module-depth
    title: Evaluate module depth
    purpose: Determine whether a module hides substantial complexity behind a simple coherent interface or merely redistributes it across shallow layers.
    inputs:
      - module public contract and real consumers
      - internal decisions, invariants, failure/cost semantics, and dependencies
      - change history and navigation/review evidence
    evidence_required:
      - caller knowledge before and after the boundary
      - number and volatility of hidden decisions
      - evidence of pass-through or leaked configuration
    decision_steps:
      - "1. Enumerate what each consumer must know to use the module correctly: concepts, call order, configuration, errors, cost, lifecycle, and side effects."
      - "2. Enumerate internal decisions the module owns and can change without consumer edits."
      - "3. Mark leakage: consumers selecting internal strategies, mirroring internal data, coordinating calls, catching mechanism-specific errors, or traversing pass-through layers."
      - "4. Assess interface coherence and width against hidden complexity. A small unit can be deep; a large API can still be shallow. File/class/function size is not the measure."
      - "5. Trace representative changes. A deep module localizes them; a shallow module sends matching edits or knowledge through callers/layers."
      - "6. Compare deepening by pulling policy/complexity inward, merging pass-through layers, or splitting unrelated responsibilities. Choose only the move supported by change and invariant evidence."
      - "7. Preserve material cost and failure semantics that callers need; hiding complexity must not mislead."
    outputs:
      - consumer-knowledge versus hidden-decision map
      - deep/shallow/mixed assessment
      - bounded deepen, merge, split, or no-change recommendation
    stop_conditions:
      - consumer contracts or operational costs are unknown
      - hidden decisions actually belong to different authorities
    escalation_conditions:
      - deepening or merging changes public compatibility or architectural ownership
    common_false_positives:
      - equating many lines with depth
      - equating a narrow interface with depth when it leaks configuration/order
      - splitting for small classes without independent change
    roles: [architecture-agent, coding-agent, refactoring-agent, review-agent]
    related_concepts:
      - architecture-change-locality-cohesion
      - universal-information-hiding
      - universal-local-reasoning

  - id: proc-identify-domain-boundaries
    title: Identify domain boundaries
    purpose: Discover contexts in which language, policies, identities, invariants, and models are internally coherent and vary independently.
    inputs:
      - domain scenarios and expert language
      - workflows, decisions, identities, invariants, and data ownership
      - code/data/change history and organizational/operational ownership
      - integration and translation costs
    evidence_required:
      - concrete scenarios showing term/policy meaning
      - recurring disagreement or translation between models
      - independent change/ownership evidence where available
    decision_steps:
      - "1. Collect domain narratives around decisions and failures, not noun lists. Record terms, definitions, actors, identities, time, policy, and invariant."
      - "2. Find terms whose meaning, lifecycle, authority, or policy differs across workflows or expert groups. Do not force one universal model."
      - "3. Group concepts that must remain consistent together to enforce an invariant or complete a domain decision."
      - "4. Compare groups with code, data, co-change, team, deployment, and regulatory ownership. Treat alignment as corroboration, not proof from directories."
      - "5. Identify translations and shared concepts. Decide whether explicit mapping/anti-corruption, shared kernel, published contract, or one context is least costly."
      - "6. Test candidate boundaries with new/changed policies: edits should localize and terminology should remain unambiguous inside each context."
      - "7. Reject domain restructuring when the code is infrastructure-dominant, rules are trivial/stable, or ceremony exceeds model pressure."
    outputs:
      - context and language map
      - invariant/data authority per context
      - relationship/translation strategy
      - uncertainty and validation scenarios
    stop_conditions:
      - no domain expert or accepted behavior evidence can resolve meaning
      - data authority conflicts remain unowned
    escalation_conditions:
      - boundary changes product ownership, organization, data, deployment, or public integration
    common_false_positives:
      - one bounded context per directory/team/noun
      - treating database tables as the domain model
      - applying rich modeling to generic infrastructure plumbing
    roles: [domain-design-agent, architecture-agent, coding-agent]
    related_concepts:
      - domain-language-model-loop
      - domain-bounded-context

  - id: proc-decide-performance-justified
    title: Decide whether performance work is justified
    purpose: Turn a performance complaint into a measured, authorized optimization decision or an explicit no-action result.
    inputs:
      - complaint, SLO/cost/capacity goal, or incident
      - operation, workload, environment, and resource boundary
      - current telemetry, tests, benchmark capability, and authority
    evidence_required:
      - quantified workload-relative objective
      - representative baseline with defined metric semantics
      - evidence the gap is material and within the target system's control
    decision_steps:
      - "1. Separate correctness, speed, and resource efficiency. Classify an infinite loop, leak, or failure-to-terminate as repair when it violates behavior."
      - "2. Specify operation, input distribution/scale, concurrency, environment, success/failure population, latency percentile/throughput, CPU/memory/I/O/network budget, and time horizon."
      - "3. Identify objective owner and semantic trade space. Stop if 'faster' cannot be tied to an accepted outcome."
      - "4. Validate metric boundary, unit, aggregation, sampling, variance, instrumentation cost, and workload representativeness. Capture a reproducible baseline."
      - "5. Compare baseline with target and materiality. If within target, stop; further optimization needs a new objective."
      - "6. Profile representative work and locate a causal resource path. If the bottleneck is external/out of scope, recommend the appropriate owner/action rather than local tuning."
      - "7. Estimate benefit ceiling, campaign cost, added complexity, and regression risk. Recommend an experiment only when expected value exceeds cost and protection exists; execute it only under separate authority."
    outputs:
      - repair, no-action, monitor, experiment, or optimization-campaign recommendation or authorized selection
      - quantified objective/baseline and bottleneck evidence
      - authority, preservation, and stop conditions
    stop_conditions:
      - objective, workload, metric, or baseline is not meaningful
      - target is already met
      - no causal bottleneck in scope is found
    escalation_conditions:
      - performance requires trading precision, freshness, fairness, ordering, consistency, durability, cost, or compatibility
      - representative measurement requires unsafe production access
    common_false_positives:
      - microbenchmark or average presented as user impact
      - visually inefficient cold code
      - high CPU percentage without capacity/time boundary
    roles: [performance-agent, architecture-agent, review-agent, debugging-and-repair-agent]
    related_concepts:
      - performance-measurable-objective
      - performance-representative-baseline
      - performance-profile-causal-bottleneck

  - id: proc-rank-engineering-risks
    title: Rank engineering risks
    purpose: Produce a defensible action order without conflating severity, confidence, urgency, and effort.
    inputs:
      - risk candidates and affected assets/users
      - evidence, uncertainty, controls, detectability, and recovery
      - dependencies, deadlines, and authority
    evidence_required:
      - scenario for each risk from trigger to consequence
      - impact, likelihood/frequency evidence, exposure, detectability, and reversibility
      - current controls and residual risk
    decision_steps:
      - "1. Express each risk as trigger → vulnerable state → failure → consequence; remove entries that are only disliked structure without a consequence."
      - "2. Score or rank separately: impact, evidence-based likelihood/exposure, detectability before harm, recovery/reversibility, time sensitivity, and confidence. Do not multiply arbitrary numbers into false precision."
      - "3. Identify current prevention, detection, containment, recovery, and acceptance controls; rank residual rather than inherent risk."
      - "4. Mark confidence independently. A high-impact low-confidence risk may justify investigation, not immediate redesign."
      - "5. Estimate risk-reduction leverage, implementation risk, dependency ordering, and cost for each candidate action, including no change/monitoring."
      - "6. Prioritize mandatory contract violations and intolerable safety/security/data/durability risks, then actions with greatest verified residual-risk reduction per reversible effort."
      - "7. Assign owner, deadline/revisit trigger, evidence needed, and acceptance authority."
    outputs:
      - ranked risk ledger with separate dimensions
      - action/investigation/monitor/accept disposition
      - owners, evidence gaps, and revisit conditions
    stop_conditions:
      - consequences or affected scope cannot be stated
      - comparisons use incompatible time/environment boundaries
    escalation_conditions:
      - risk tolerance or priority among product, safety, security, durability, and schedule lacks an authorized owner
    common_false_positives:
      - ranking by code smell count or raw scanner severity
      - high confidence mistaken for high impact
      - high churn mistaken for high defect risk without context
    roles: [review-agent, architecture-agent, repository-assessment-agent, debugging-and-repair-agent]
    related_concepts:
      - review-severity-confidence-separation
      - universal-evidence-before-intervention
      - universal-reversible-reviewable-change

  - id: proc-establish-preservation-boundaries
    title: Establish preservation boundaries
    purpose: Define exactly what a change may and may not alter and how each protected property will be observed.
    inputs:
      - change type and authorized semantics
      - APIs, data, workflows, runtime/operational behavior, and constraints
      - consumers, incidents, tests, and compatibility policy
    evidence_required:
      - accepted behavior and known actual behavior
      - affected consumers/state/operations
      - available or planned proof mechanism
    decision_steps:
      - "1. List explicitly authorized observable changes; everything else remains protected provisionally."
      - "2. Inventory inputs, outputs, side effects, state transitions, public/internal APIs, serialization/protocol/schema, and compatibility windows."
      - "3. Inventory failure semantics: error category/message metadata if contractual, retryability, idempotency, partial success, cancellation, timeout, cleanup, and recovery."
      - "4. Inventory persistent data identity/integrity/retention/ownership; concurrency, ordering, atomicity/consistency; security/privacy/audit; safety/durability."
      - "5. Inventory material performance/resource properties and deployment/configuration/observability/runbook behavior."
      - "6. For each property classify: must preserve exactly, may vary within bound, intentionally changes, unknown/characterize, or outside scope with owner."
      - "7. Map every protected or changed property to test, probe, benchmark, static check, review, monitor, or explicit unverified-risk statement."
      - "8. Obtain owner decision for contradictions or properties whose protection makes the requested change infeasible."
    outputs:
      - preservation matrix
      - authorized-change matrix
      - proof map and residual uncertainty
    stop_conditions:
      - accepted and relied-upon behavior conflict without owner resolution
      - high-risk protected property has no credible observation method
    escalation_conditions:
      - public compatibility, data, security/safety, durability, or operational policy must change
    common_false_positives:
      - “tests pass” as a complete boundary
      - treating timing, errors, ordering, or side effects as internal automatically
      - assuming undocumented behavior is disposable
    roles: [coding-agent, refactoring-agent, legacy-code-agent, performance-agent, debugging-and-repair-agent]
    related_concepts:
      - universal-preserve-behavior-by-default
      - refactoring-behavior-preservation
      - performance-semantic-preservation

  - id: proc-determine-tests-characterization
    title: Determine required tests or characterization
    purpose: Select the smallest credible feedback surface for new behavior, repair, refactoring, legacy change, migration, or optimization.
    inputs:
      - change type and preservation matrix
      - architecture/integration boundaries and current tests
      - known behavior, incidents, data, nondeterminism, and risk
    evidence_required:
      - demonstration of which current tests execute the affected path and assert relevant properties
      - gaps and feedback cadence
    decision_steps:
      - "1. For each scenario/property, inspect test code and if necessary instrument/mutate to prove the path and oracle are exercised. Coverage percentage alone is insufficient."
      - "2. Use ordinary contract tests for accepted intended behavior; use characterization to record actual behavior when intent is unknown or preservation dominates."
      - "3. Select the narrowest stable boundary that observes the consequence without binding harmless internals. Add broader integration/contract tests for external protocols and ownership boundaries."
      - "4. For defects, require a reproducer that fails before repair and passes after; for migrations include mixed-state/retry/reconciliation; for performance include semantic tests plus representative baseline."
      - "5. Include normal, boundary, invalid/error, stateful, concurrency/order, and failure/recovery cases in proportion to risk."
      - "6. Control clocks, randomness, scheduling, global state, external services, and data, or state how nondeterminism limits confidence."
      - "7. Test doubles substitute only the dependency behavior needed for sensing/separation and must not expose implementation detail publicly."
      - "8. Ensure feedback speed fits step size; split campaign or add local tests if failures cannot be localized."
    outputs:
      - scenario-to-test/probe matrix
      - characterization versus intended-contract classification
      - feedback cadence and detection limits
    stop_conditions:
      - no stable oracle exists for a protected high-risk property
      - the harness changes the behavior being characterized materially
    escalation_conditions:
      - representative tests require sensitive production data, destructive operations, or unavailable external authority
    common_false_positives:
      - nearby tests assumed relevant
      - mocks verifying call sequence rather than outcome
      - characterization rewritten to preferred behavior
    roles: [coding-agent, legacy-code-agent, refactoring-agent, debugging-and-repair-agent, performance-agent]
    related_concepts:
      - implementation-risk-driven-tests
      - legacy-characterization-surfaces
      - legacy-sensing-and-separation

  - id: proc-decide-leave-code-alone
    title: Decide when to leave code alone
    purpose: Make no change an evidence-based outcome when intervention would not repay its risk and cost.
    inputs:
      - candidate issue and triggering signal
      - current/expected change frequency, impact, consumers, and ownership
      - intervention options, preservation, and reversal cost
    evidence_required:
      - evidence for actual cost/risk or its absence within a stated interval
      - expected future work from accepted plans/domain constraints
      - latent high-impact risk check
    decision_steps:
      - "1. State the harm claimed. If it is only aesthetics, symmetry, fashion, or metric threshold, choose leave/monitor unless another consequence appears."
      - "2. Check present activity, incidents, defects, review burden, comprehension cost, operational risk, and expected changes. Filter missing history and untouchable/dead code."
      - "3. Check latent risk independent of churn: security/safety/data/durability, unsupported dependencies, recovery path, and external compatibility."
      - "4. Estimate intervention blast radius, unknown behavior, testability, migration/coordination, new concepts, and opportunity cost."
      - "5. Compare leave, document/observe, add tests/monitoring, local change, and broader change."
      - "6. Leave alone when no material harm is demonstrated or lower-risk observation/protection dominates; record triggers that would reopen the decision."
      - "7. Do not call no change permanent: assign revisit condition, not a vague future cleanup."
    outputs:
      - leave/monitor/protect/change recommendation or authorized selection
      - evidence, latent-risk check, and revisit trigger
    stop_conditions:
      - missing evidence prevents distinguishing stable from merely unobserved dangerous code
    escalation_conditions:
      - owner must accept a material latent risk or deprecation/retirement decision
    common_false_positives:
      - old/stable code assumed safe or used
      - high churn assumed structurally bad
      - “cleaner” assumed lower total cost
    roles: [refactoring-agent, architecture-agent, review-agent, repository-assessment-agent]
    related_concepts:
      - refactoring-leave-unattractive-code
      - repository-assessment-code-age
      - universal-no-change-option

  - id: proc-stop-and-escalate
    title: Determine when to stop and escalate
    purpose: Stop at a safe state when evidence, authority, or preservation no longer supports continued action and present the smallest owner decision needed.
    inputs:
      - current task, authority, plan, checkpoint, and target state
      - new evidence/failure and repository status
      - rollback/safe-forward options
    evidence_required:
      - exact condition that invalidates continuation
      - current reversible state and effects already applied
      - decision owner and viable alternatives
    decision_steps:
      - "1. Compare current state with hard stops: ambiguous semantics, falsified cause, failed/irrelevant feedback, uncontrolled behavior, authority/scope transition, high-impact irreversible action, conflicting contracts, or unsafe verification."
      - "2. Stop immediately on a hard condition; do not spend the remaining authority on cleanup that could obscure the state."
      - "3. Restore the last verified checkpoint when rollback is safer and authorized; otherwise stabilize the current state and prevent further effects."
      - "4. Record observations separately from interpretation, commands/actions taken, artifacts/results, and residual side effects."
      - "5. State the exact decision or authority needed, options including no action, consequences, recommended smallest unblocker, and evidence that would resolve uncertainty."
      - "6. Preserve reproducer, baseline, logs, tests, and worktree state needed for continuation without exposing sensitive data."
    outputs:
      - stopped state and reason
      - rollback/stabilization evidence
      - concise escalation packet with decision, options, risk, and retrieval handles
    stop_conditions:
      - this procedure itself cannot safely inspect or stabilize the target within authority
    escalation_conditions:
      - always when invoked for authority, semantic, high-risk, or contract conflict
    common_false_positives:
      - stopping merely because work is difficult
      - continuing because tests unrelated to the failure still pass
      - asking an owner to choose mechanics already delegated to the agent
    roles: [coding-agent, architecture-agent, refactoring-agent, legacy-code-agent, performance-agent, review-agent, debugging-and-repair-agent]
    related_concepts:
      - agent-conduct-authority-bounded-action
      - universal-reversible-reviewable-change

  - id: proc-assess-authority-to-act
    title: Assess whether an agent has authority to act
    purpose: Determine the highest permitted action level for the exact target and effect before any material side effect.
    inputs:
      - user instruction and role
      - repository ownership/governance contracts
      - intended actions and effects
      - target files, systems, data, environments, remotes, people, and publication surfaces
    evidence_required:
      - explicit authority source or accepted automated policy
      - exact semantic/change classification and target scope
      - reserved owner decisions and stop conditions
    decision_steps:
      - "1. Parse the requested verb and outcome. Map it to observe, diagnose, recommend, propose, select, authorize, execute, verify, or accept."
      - "2. Bound target scope across repository/path, data, environment, remote state, external communication/publication, people, and time."
      - "3. Classify every intended effect by change type and semantic impact. Separate normal execution mechanics from product, architecture, domain, dependency, data, security, operational, and acceptance decisions."
      - "4. Find the authority source for each effect. Access, prior unrelated approval, silence, technical confidence, passing tests, and source doctrine are invalid authority evidence."
      - "5. Set the ceiling to the lowest level supported for all required effects. Below the ceiling, use least authority; above it, recommend/propose and escalate."
      - "6. Record what the agent may do, must not do, who owns reserved decisions, and what evidence/approval permits transition."
      - "7. Re-run this procedure when scope, semantics, risk class, environment, or side effects change."
    outputs:
      - authority matrix by action/effect/target
      - permitted ceiling and prohibited transitions
      - required owner decisions and re-evaluation triggers
    stop_conditions:
      - authority source is absent or contradictory for a material write
      - target principal/owner cannot be established
    escalation_conditions:
      - any required effect exceeds the ceiling
      - authorization or acceptance would be self-granted
    common_false_positives:
      - diagnosis interpreted as repair authority
      - implementation interpreted as architecture authority
      - verification interpreted as acceptance
    roles: [coding-agent, architecture-agent, refactoring-agent, legacy-code-agent, performance-agent, review-agent, debugging-and-repair-agent, repository-assessment-agent]
    related_concepts:
      - agent-conduct-authority-bounded-action
      - universal-repository-contract-precedence
