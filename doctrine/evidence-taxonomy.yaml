schema_version: agent-doctrine-evidence/1

governing_rules:
  - id: evidence-is-claim-relative
    rule: No evidence class is globally strongest; its value depends on the claim being tested, its provenance, recency, representativeness, and independence.
  - id: contracts-precede-preferences
    rule: Accepted repository and task contracts constrain permissible action even when generic design evidence favors another choice.
  - id: absence-is-bounded
    rule: Failure to observe a signal establishes only that the inspected method and interval did not reveal it.
  - id: correlation-needs-causal-work
    rule: Churn, co-change, defects, latency, and incidents can locate investigation targets but do not by themselves identify a structural cause or remedy.
  - id: transformations-need-baselines
    rule: Claims of preservation or improvement require a pre-change baseline on the dimensions named by the claim.
  - id: triangulate-high-risk-decisions
    rule: Irreversible, semantic, architectural, security-, safety-, durability-, or production-sensitive decisions should use independent evidence classes when feasible.

classes:
  - id: evidence-explicit-user-requirements
    name: Explicit user and stakeholder requirements
    examples:
      - acceptance criteria
      - named behavior and non-goals
      - risk, privacy, compatibility, and schedule constraints
    can_establish:
      - intended outcomes and priority among stated outcomes
      - authorized scope when issued by an authorized principal
      - explicit semantic-change permission
    cannot_establish:
      - that the implementation satisfies the requirement
      - unstated domain facts or technical feasibility
      - authority outside the speaker's ownership
    reliability_conditions:
      - source and decision ownership are identifiable
      - wording is current and conflicts are reconciled
      - examples are distinguished from normative criteria
    common_misuse:
      - inferring broad architecture authority from a feature request
      - treating an old request as current despite superseding decisions

  - id: evidence-repository-contracts
    name: Repository contracts
    examples:
      - contribution instructions
      - build and test commands
      - versioning and compatibility policies
      - ownership rules
      - generated-file markers
      - security and deployment runbooks
    can_establish:
      - local process and conformance requirements
      - expected verification gates
      - protected surfaces and precedence rules
    cannot_establish:
      - that documentation is current or internally consistent
      - runtime correctness merely because the contract was followed
      - permission beyond the contract's named scope
    reliability_conditions:
      - discover instructions from root to target path
      - check recency, ownership, and conflicts
      - verify executable commands where safe
    common_misuse:
      - replacing repository conventions with source-preferred style
      - obeying a stale local note over an accepted higher-level contract

  - id: evidence-accepted-design-decisions
    name: Accepted architectural and design decisions
    examples:
      - ADRs
      - approved RFCs
      - API and data contracts
      - compatibility commitments
    can_establish:
      - selected tradeoffs, boundaries, and decision rationale
      - constraints that implementation and review must preserve
      - known conditions for revisiting a decision
    cannot_establish:
      - that the recorded assumptions remain true
      - that implementation conforms to the decision
      - that an unaccepted draft is authoritative
    reliability_conditions:
      - acceptance state and supersession chain are clear
      - current repository/runtime evidence is compared with assumptions
    common_misuse:
      - treating every design document as accepted
      - using an ADR as proof that its fitness criteria pass today

  - id: evidence-static-source-structure
    name: Static source structure
    examples:
      - modules and packages
      - dependency edges
      - public APIs
      - control and data flow
      - duplication and complexity indicators
    can_establish:
      - code that exists and statically visible relationships
      - candidate seams, ownership sites, and invariant representations
      - direct violations of mechanically checkable constraints
    cannot_establish:
      - production frequency, latency, or failure impact
      - why the structure evolved
      - whether a large or complex unit is costly to change
      - actual runtime dispatch hidden by reflection, generation, or configuration
    reliability_conditions:
      - generated, vendored, test, and production code are distinguished
      - dynamic mechanisms and build variants are considered
      - analysis covers the relevant call and data paths
    common_misuse:
      - treating file size or a smell as a verdict
      - inferring domain boundaries from directories alone

  - id: evidence-static-analysis
    name: Static analysis and compiler diagnostics
    examples:
      - type checking
      - linters
      - dependency rules
      - taint and data-flow analysis
      - dead-code detection
    can_establish:
      - violations inside the tool's modeled rule set
      - unresolved references and some incompatible transformations
      - reproducible candidate defects with exact locators
    cannot_establish:
      - correctness outside the model
      - operational significance of every warning
      - absence of defects from a clean run
    reliability_conditions:
      - tool version, configuration, exclusions, and build target are recorded
      - findings are checked for generated code and known false positives
    common_misuse:
      - promoting all warnings to blockers
      - assuming compiler success preserves reflection or external callers

  - id: evidence-tests
    name: Automated tests
    examples:
      - unit and component tests
      - integration and contract tests
      - property and fuzz tests
      - end-to-end and migration tests
    can_establish:
      - behavior for the exercised inputs, environment, and assertions
      - an executable preservation surface
      - reproducibility of a defect when the test fails before repair
    cannot_establish:
      - correctness for unexercised behaviors or environments
      - that assertions reflect current intended behavior
      - production fitness solely from a passing suite
    reliability_conditions:
      - the test demonstrably executes the relevant path
      - failure is observed before a repair when used as regression evidence
      - determinism, isolation, or known flakiness is reported
      - oracles assert outcomes rather than implementation trivia unless structure is the contract
    common_misuse:
      - equating coverage percentage with behavioral protection
      - writing a test that already passes and calling it defect reproduction

  - id: evidence-runtime-observation
    name: Runtime observation
    examples:
      - logs and traces
      - metrics
      - process and resource state
      - request/response capture
      - debugger observations
    can_establish:
      - behavior during the observed interval and environment
      - actual execution paths and state transitions visible to instrumentation
      - temporal ordering when clocks and correlation are sound
    cannot_establish:
      - universal behavior beyond the sample
      - root cause without competing-hypothesis analysis
      - absence of uninstrumented failures
    reliability_conditions:
      - environment, interval, sampling, clock, and correlation IDs are known
      - instrumentation side effects and dropped data are considered
      - sensitive data is minimized
    common_misuse:
      - treating a log message as proof that the intended effect completed
      - extrapolating a quiet interval to production safety

  - id: evidence-version-history
    name: Version history
    examples:
      - commits and diffs
      - blame and introduction dates
      - reverted changes
      - release history
    can_establish:
      - recorded change frequency and sequence
      - when visible structure was introduced or removed
      - candidate ownership and change-pressure patterns
    cannot_establish:
      - author intent without corroboration
      - causal coupling from simultaneous edits alone
      - design quality or current importance from age or churn alone
    reliability_conditions:
      - renames, squashes, generated changes, formatting, vendoring, and imports are filtered
      - the observation window matches repository history and product phase
      - missing history and branch selection are disclosed
    common_misuse:
      - using blame to assign fault
      - treating old code as stable or good solely because it is old

  - id: evidence-co-change
    name: Co-change and temporal coupling
    examples:
      - files or functions repeatedly changed in the same commits
      - cross-service changes for one feature
      - recurring coordinated release edits
    can_establish:
      - repeated coordination and change-locality pressure
      - candidate hidden concepts or misplaced boundaries
      - review and deployment coupling worth investigation
    cannot_establish:
      - semantic coupling or the correct future boundary by itself
      - that two units should always be merged
      - whether coupling is harmful, incidental, generated, or process-driven
    reliability_conditions:
      - mechanical commits and bulk changes are excluded
      - commit size, time window, and entity granularity are controlled
      - static and domain evidence are used to interpret the pattern
    common_misuse:
      - converting a heat map directly into a refactoring plan

  - id: evidence-profiling
    name: Profiling
    examples:
      - CPU and wall-time profiles
      - allocation and heap profiles
      - lock contention and scheduler traces
      - I/O and database profiles
    can_establish:
      - where measured resources were consumed under the sampled workload
      - candidate hot paths and contention sites
      - relative movement after a controlled change
    cannot_establish:
      - user impact without workload and objective context
      - future production behavior from an unrepresentative run
      - that the hottest line is the correct optimization level
    reliability_conditions:
      - workload, warmup, sampling method, build flags, and environment are recorded
      - profiler overhead and aggregation artifacts are considered
      - results are repeatable enough for the decision
    common_misuse:
      - optimizing the top frame without following the causal path
      - profiling debug builds and generalizing to release behavior

  - id: evidence-benchmarks
    name: Benchmarks and experiments
    examples:
      - microbenchmarks
      - load and stress tests
      - end-to-end latency and throughput experiments
      - A/B or canary measurements
    can_establish:
      - comparative performance under controlled stated conditions
      - variance, scaling behavior, and resource tradeoffs in the measured range
      - a regression threshold when the harness is stable
    cannot_establish:
      - production benefit when workload or environment is not representative
      - semantic preservation without separate correctness checks
      - causality when multiple variables changed together
    reliability_conditions:
      - baseline and candidate differ only in named variables
      - warmup, repetitions, variance, input distribution, and resource limits are recorded
      - compiler elimination, caching, and coordinated omission are addressed
    common_misuse:
      - reporting a single fastest run
      - using a microbenchmark to justify system architecture

  - id: evidence-incidents
    name: Incidents and defect records
    examples:
      - postmortems
      - customer-impact reports
      - support cases
      - recurring failure tickets
    can_establish:
      - realized failure modes, impact, and observed contributing conditions
      - priority signals and missing defenses
      - recurrence when records are comparable
    cannot_establish:
      - complete causality if the investigation was partial
      - future risk probability from anecdotes alone
      - that a broad redesign is the only adequate response
    reliability_conditions:
      - timeline and evidence are separated from retrospective inference
      - corrective actions and recurrence are tracked
      - reporting bias and missing near misses are acknowledged
    common_misuse:
      - generalizing one incident into a universal architecture rule

  - id: evidence-operational-constraints
    name: Operational and environmental constraints
    examples:
      - deployment topology
      - availability and recovery objectives
      - memory, CPU, power, storage, and network limits
      - release, observability, and on-call capability
      - regulatory and data-residency constraints
    can_establish:
      - non-functional boundaries a design must satisfy
      - cost and failure consequences of distribution, persistence, and concurrency
      - viable deployment and rollback mechanisms
    cannot_establish:
      - current conformance without runtime or test evidence
      - that a familiar architecture best satisfies the constraint
    reliability_conditions:
      - constraints are quantified as scenarios where feasible
      - peak, degraded, recovery, and maintenance modes are included
      - ownership and changeability of constraints are known
    common_misuse:
      - listing quality attributes without measurable stimulus and response

  - id: evidence-domain-language
    name: Domain language and expert behavior
    examples:
      - terms used by domain experts
      - policies, workflows, identities, and invariants
      - event and decision narratives
      - regulatory definitions
    can_establish:
      - candidate concepts, distinctions, policies, and context boundaries
      - meanings that implementation names and rules should preserve
      - disagreement that signals multiple models or contexts
    cannot_establish:
      - a single universal model when experts or workflows differ
      - implementation architecture without technical and operational evidence
      - correctness from vocabulary matching alone
    reliability_conditions:
      - terms are tied to concrete scenarios and counterexamples
      - multiple expert perspectives and context changes are represented
      - policy volatility and ownership are known
    common_misuse:
      - inferring boundaries from nouns or directory names alone
      - adding domain ceremony to infrastructure-dominant code without model pressure

  - id: evidence-generated-artifacts
    name: Generated artifacts
    examples:
      - generated code and schemas
      - inventories and reports
      - compiled route tables
      - vendored lockfiles and API clients
    can_establish:
      - the generator's recorded output for a known input and version
      - mechanical inconsistencies when independently validated
      - derived topology or coverage for scoping
    cannot_establish:
      - maintainers' priorities or causal design conclusions by itself
      - source-of-truth status unless the repository contract grants it
      - correctness when the generator or inputs are unverified
    reliability_conditions:
      - generator, inputs, version, and reproducibility are known
      - generated output is distinguished from editable authority
      - summaries link back to inspectable evidence
    common_misuse:
      - letting a large inventory dominate a maintainer-facing decision artifact
      - manually editing generated output instead of its source

  - id: evidence-dependency-metadata
    name: Dependency and supply-chain metadata
    examples:
      - manifests and lockfiles
      - advisories and licenses
      - update and compatibility notes
      - provenance and signatures
    can_establish:
      - declared/resolved versions and mechanically visible dependency paths
      - known advisory applicability when version and configuration match
      - compatibility commitments stated by the supplier
    cannot_establish:
      - runtime reachability or exploitability by version alone
      - safe upgrade behavior without repository tests and migration evidence
      - trust from popularity or source prestige
    reliability_conditions:
      - lock state, build target, transitive resolution, and source authenticity are verified
      - advisory recency and configuration applicability are checked
    common_misuse:
      - bundling upgrades with unrelated refactoring
      - treating a green scanner as complete supply-chain assurance

decision_evidence_patterns:
  implementation:
    minimum:
      - evidence-explicit-user-requirements
      - evidence-repository-contracts
      - evidence-static-source-structure
      - evidence-tests
  architectural-change:
    minimum:
      - evidence-accepted-design-decisions
      - evidence-static-source-structure
      - evidence-operational-constraints
    strengthen_with:
      - evidence-version-history
      - evidence-co-change
      - evidence-incidents
      - evidence-domain-language
      - evidence-runtime-observation
  refactoring:
    minimum:
      - evidence-static-source-structure
      - evidence-tests
    require_change_pressure_from_at_least_one:
      - evidence-version-history
      - evidence-co-change
      - evidence-incidents
      - evidence-explicit-user-requirements
      - evidence-static-source-structure
  legacy-change:
    minimum:
      - evidence-static-source-structure
      - evidence-tests
    if_tests_are_weak:
      - create_characterization_from_runtime_or_existing_behavior
      - narrow preservation claims to exercised surfaces
  performance-change:
    minimum:
      - evidence-profiling
      - evidence-benchmarks
      - evidence-tests
      - evidence-operational-constraints
  defect-repair:
    minimum:
      - evidence-runtime-observation
      - evidence-tests
    alternatives_when_runtime_reproduction_is_unavailable:
      - incident evidence plus a falsifiable static causal chain
      - explicit statement that the repair remains probabilistic
