  title: 'Chapter 5: Mocks and test fragility'
  disposition: Mocks vs stubs (CQS mapping); observable behavior vs implementation details via client-goal criterion; hexagonal
    architecture; intra- vs inter-system communications; mock only externally observable communications; fully controlled
    out-of-process dependencies are part of the application.
