  title: 'Chapter 12: Case Study: Waiting for Godot'
  disposition: Narrative case study of a manual, playbook-driven, ~40-person, ~$100k overnight release that fails UAT (QA
    data did not match production) and rolls back; motivates deployment automation and is used only as corroborating cost
