  title: 'Chapter 4: The four pillars of a good unit test'
  disposition: Four attributes of a good test (regression protection, refactoring resistance, fast feedback, maintainability);
    false positives caused by implementation-detail coupling and their trust-eroding dynamics; multiplicative value estimate
    and mutual exclusivity of the first three attributes; resistance to refactoring as non-negotiable; Test Pyramid ratios
    with contextual exceptions; black-box by default, white-box for coverage analysis.
