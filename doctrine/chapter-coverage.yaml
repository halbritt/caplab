  chapter_path: books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/016-chapter-9-mocking-best-practices.md
  title: 'Chapter 9: Mocking best practices'
  disposition: Verify unmanaged-dependency interactions at the outermost owned type (system edge); spies as independent assertion
    checkpoints; verify expected calls and absence of unexpected calls; mocks in integration tests only; mock only types you
    own (adapters).
