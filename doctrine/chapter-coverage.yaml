  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md
  title: 'Chapter 13: Design for Deployment'
  disposition: 'Zero-downtime deployment as a designed feature: build pipelines, convergence vs immutable infrastructure,
    micro/macro rollout timescales (prepare, drain, apply, warm-up), expand/contract schema phasing with shims, schemaless-version
    ordering, trickle-then-batch migration, cache-busting web assets, batched health-gated rollout with canary, cleanup/contraction.'
  sha256: e753548374ac4684c8fbb809d767c61f6c9a8e8396ca6f571cbb406269b4d20c
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/021-chapter-14-handling-versions.md
  title: 'Chapter 14: Handling Versions'
  disposition: 'Version compatibility: API as layered stack of agreements; Postel asymmetry as a required/optional set algebra
    (require less, accept more, return more); live implementation as de facto specification; version-discriminator routing
    options for unavoidable breaks; consumer-owned contract tests and per-side conformance testing; defensive handling of
    others'' versions.'
  sha256: 06ebf9b42e9d1ab8573b6342dfa88f7ef4a19f3a6ccfb8a429389165cea9df31
