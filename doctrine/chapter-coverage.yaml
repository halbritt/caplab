  title: 'Chapter 3: The anatomy of a unit test'
  disposition: AAA structure with one behavior per test and no branching; multi-line act phase as encapsulation/invariant
    signal; fixture reuse via private factory methods instead of coupled constructor setup; plain-language domain-fact naming
    without the method under test's name; parameterized tests and fluent assertions as readability trade-offs.
