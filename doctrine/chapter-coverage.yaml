  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md
  title: 'Chapter 17: Chaos Engineering'
  disposition: 'Chaos engineering as empirical whole-system experimentation: safety is not composable; drift into failure
    and the regulator paradox; Simian Army and opt-in vs opt-out adoption; prerequisites (tolerable cost, blast radius, tracing,
    health definition, recovery plan); hypothesis design around externally observable steady state; injection types (kill,
    latency, call failure); random-to-targeted fault search; learning from faults that do not become failures; disaster/zombie
    simulations.'
