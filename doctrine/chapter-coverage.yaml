  title: 'Chapter 10: Testing the database'
  disposition: Schema plus reference data in source control; migration-based delivery over state-based (data motion); transactions/unit
    of work in production and per test section; sequential execution, cleanup at test start, no in-memory database substitutes;
    test-code reuse (Object Mother, decorators, fluent assertions); higher threshold for reads, no direct repository tests.
