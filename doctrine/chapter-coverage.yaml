- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/012-chapter-6-case-study-phenomenal-cosmic-powers-itty-bitty-living-space.md
  title: 'Chapter 6: Case Study: Phenomenal Cosmic Powers, Itty-Bitty Living Space'
  disposition: 'Black Friday retail outage anatomy: timeout-less connection pools blocking 3,000 threads at low CPU, latency
    averages that hide timeouts, alert fatigue from false-positive pages, and recovery by scripted runtime component reconfiguration
    instead of six-hour full restarts.'
  sha256: ca717bd44af307a27dc007679c7df60cc9fd5c47685bd0bcccc6b3e88f5ef479
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/013-chapter-7-foundations.md
  title: 'Chapter 7: Foundations'
  disposition: 'Physical foundation layer: hostname-vs-DNS many-to-many mappings, multihomed hosts with production/backup/admin
    networks, explicit socket binding, VLANs, physical/VM/container/cloud deployment constraints, oversubscription, untrustworthy
    VM clocks, ephemeral identity, and the 12-factor checklist.'
  sha256: 4bc37faec14e3909879c9e77147fb2658fde462a23c40063c96098ecf02eea0f
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/014-chapter-8-processes-on-machines.md
  title: 'Chapter 8: Processes on Machines'
  disposition: 'Single-instance production hygiene: precise service/instance/executable vocabulary, build chain of custody,
    immutable and disposable infrastructure, externalized per-environment configuration and credentials, and designed-in transparency
    via operator-aimed logs, metrics, and health checks.'
  sha256: df2ceb44961cc6aed5fb2279dce9e72a0949c7be7bab532ac658c180b2303459
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/015-chapter-9-interconnect.md
  title: 'Chapter 9: Interconnect'
  disposition: 'Connecting instances into systems: DNS naming and round-robin limits, GSLB, software/hardware load balancing
    with health checks, demand control and load shedding (queues as the failure mechanism), multihomed network routing hazards,
    dynamic service discovery and its CAP behavior, migratory virtual IPs.'
  sha256: 70d4fd56155ca36aaf0f73af638701dce3c7503f4fe5158d63fc3e1bc4a2f011
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md
  title: 'Chapter 10: Control Plane'
  disposition: Control-plane cost/benefit sizing, automation-amplified failure (AWS S3 and Reddit outages) and safeguards,
    platform teams as service providers, system-wide transparency framed as user experience and economic value, log/metrics
    collection, configuration services under partition, deployment pipelines and canaries, and scriptable command-and-control
    interfaces.
  sha256: 51c247f275343da063514e0ad54682722807b03c90ce6be6bc82708555126842
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/017-chapter-11-security.md
  title: 'Chapter 11: Security'
  disposition: 'Security baked in, not sprinkled on: the OWASP Top 10 flaw classes with defenses, least privilege for processes
    and containers, credential custody (vaulting, file permissions, memory hygiene), dependency-tree vulnerability tracking,
    and security as a continuous patch-and-redeploy process.'
  sha256: 6e64320b1e10537f00c6795552f027f00db922c6f158d2b8e92ab9a0629c9996
