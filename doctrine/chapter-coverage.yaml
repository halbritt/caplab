  title: 'Chapter 8: Why integration testing?'
  disposition: Integration-test role and Test Pyramid; longest-happy-path scoping; Fail Fast as alternative; managed vs unmanaged
    dependencies; single-implementation interfaces and YAGNI; explicit domain boundary, fewer layers, no circular dependencies;
    support vs diagnostic logging.
  sha256: 6804dcc3a9676332a1df054d08edb10a3ceced3d75128504ac5bc60bb70fb0c1
