  title: 'Chapter 15: Case Study: Trampled by Your Own Customers'
  disposition: 'Launch-day crash case study: sessions (not users) as the real resource unit; polite load-test scripts vs hostile
    production traffic (bots, cookie-less spiders, scrapers, 404 storms); missing self-protective safety devices; aftermath
    of throttles, static pages, IP blocks; nothing is as permanent as a temporary fix; Conway''s law sidebar.'
