  disposition: Part divider, single heading; no body content.
  sha256: 44123e2e6a5df6603740e3b411f0ce424a7d6a7143354fe18de0d0a3d4753f1f
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/007-chapter-2-case-study.md
  title: 'Chapter 2: Case Study: The Exception That Grounded an Airline'
  disposition: 'Full anatomy of an airline-grounding outage: DB failover leaves stale pooled JDBC connections, spec-permitted
    exception in a cleanup path leaks connections, pool exhaustion blocks all threads, RMI without timeouts propagates the
    hang to callers; incident discipline (restore service first, pre-scripted data capture) and postmortem evidence discipline.'
  sha256: 86d19363c3239e3dfa943859ceb6895e074d2ecca9cafebbf117afa0f0cf7643
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md
  title: 'Chapter 3: Stabilize Your System'
  disposition: Stability vocabulary (transaction, system, impulse, stress, strain, longevity); leaks and data growth escape
    short-lived test environments; failure modes must be designed like crumple zones; fault/error/failure chain; tight coupling
    accelerates crack propagation; fault-tolerance vs let-it-crash camps.
  sha256: 17b7e117f846c755352c7723c769c370ffccb285674cd240e91a4aa736a3c057
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md
  title: 'Chapter 4: Stability Antipatterns'
  disposition: 'Catalog of production failure amplifiers: integration points (sockets, HTTP, vendor libraries), chain reactions
    in homogeneous farms, cascading failures via drained pools and missing timeouts, user/traffic/session pressure, blocked
    threads as proximate cause of most failures, self-denial attacks, scaling effects, unbalanced capacities, dogpile, control-plane
    force multiplication, slow responses, unbounded result sets.'
  sha256: d21ee13279f215ea29082b86f2eff14da3a195fb665c4c4875b10b976da99760
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md
  title: 'Chapter 5: Stability Patterns'
  disposition: 'Costed countermeasure catalog: Timeouts, Circuit Breaker, Bulkheads, Steady State, Fail Fast, Let It Crash,
    Handshaking, Test Harnesses, Decoupling Middleware, Shed Load, Back Pressure, Governor; explicit warning that pattern
    count is not a quality metric and that each pattern is a judgment call.'
  sha256: 544eb287ff665b989811bb6a2ab4411d4717e063e9ed415cbd071818b559d918
- source_id: SRC-RI
  chapter_path: books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/011-part-ii-design-for-production.md
