  title: 'Chapter 1: The goal of unit testing'
  disposition: Unit testing's goal as sustainable project growth against entropy; tests (and all code) as liability with itemized
    upkeep costs; testability and coverage metrics as negative-only indicators; coverage-number targets as perverse incentive;
    successful-suite properties (integrated, targets critical code, value over maintenance cost).
