  title: 'Chapter 2: What is a unit test?'
  disposition: Unit test definition (small piece, fast, isolated); classical vs London schools split on what isolation means;
    shared/private/out-of-process/volatile dependency taxonomy and collaborator-vs-value distinction; unit of behavior vs
    unit of code; large object graphs as design signal; classical definitions of integration and end-to-end tests.
  sha256: e5c8c5decf48b6f293abc068aa05b91309074928a92e6ec6827baf62cc20a438
