  - id: universal-no-change-option
    title: Keep no change as a valid decision
    category: universal
    claim: Leave code or architecture unchanged when demonstrated pressure and expected benefit do not exceed intervention, migration, indirection, learning, and operational cost.
    decision_rule: Compare no change, observe/protect, local change, and broader change; check present cost, expected future work, latent high-impact risk, preservation difficulty, and reversal cost; record a concrete revisit trigger.
    why_it_matters: Engineering capacity and change risk are finite, and unattractive stable code can be safer than an unearned redesign.
    applicable_when:
      - assessing refactoring, architecture, modernization, abstraction, or optimization
    required_evidence:
      - actual current cost/risk or absence within a stated interval
      - expected future change from accepted plans
      - latent security, safety, data, durability, and compatibility check
      - intervention cost and uncertainty
    insufficient_evidence:
      - code is old or quiet and therefore safe
      - code looks bad and therefore must change
      - target design is fashionable or aesthetically cleaner
    required_inputs:
      - problem claim and alternatives
      - risk and expected change horizon
    expected_outputs:
      - leave, monitor, protect, localize, or change disposition
      - revisit trigger and owner
    preservation_boundaries:
      - latent high-impact risks are not dismissed because churn is low
      - quiet external consumers and missing history remain uncertainty
    safe_actions:
      - add focused characterization or monitoring instead of restructuring
      - record a trigger such as next feature, incident, or threshold
      - choose deletion only after use/authority proof
    unsafe_actions:
      - defer an accepted critical risk indefinitely
      - use no change as an excuse to avoid required behavior
      - call code dead from static evidence alone
    common_failure_modes:
      - aesthetic refactoring
      - modernization theater
      - stable code assumed safe or used
    conflicts:
      - conflict-refactor-now-vs-leave-alone
      - conflict-upfront-vs-evolutionary-architecture
    source_support:
      - source_id: SRC-REF
        locator: "books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md :: When Shouldn't You Refactor?"
