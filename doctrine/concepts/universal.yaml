  - id: universal-earned-abstraction
    title: Earn abstractions through demonstrated pressure
    category: universal
    claim: Introduce or retain an abstraction only when it hides coherent knowledge or mechanism and reduces total caller reasoning, coordinated change, or substitution cost more than its interface and indirection add.
    decision_rule: Identify stable meaning and actual variation, compare direct code, duplication, composition, helper, configuration, and abstraction, and count concepts, navigation, errors, lifecycle, testing, and operational cost on both sides.
    why_it_matters: An abstraction can create local reasoning, but a shallow or speculative one freezes the wrong model and adds permanent interface burden.
    applicable_when:
      - proposing helper, module, interface, base class, pattern, plugin, or framework
      - evaluating duplication or multiple implementations
    required_evidence:
      - coherent shared meaning or real boundary pressure
      - current consumers or demonstrated variation
      - hidden decision and net cost comparison
    insufficient_evidence:
      - two similar snippets
      - one implementation plus a mock
      - hypothetical extensibility or reuse
      - desire for symmetry or decoupling without a force
    required_inputs:
      - concrete examples and callers
      - variation/change history and contract sketch
    expected_outputs:
      - earned, not-earned, or contested decision
      - stable contract, variation axis, and removal trigger
    preservation_boundaries:
      - behavior, errors, lifecycle, cost, and ownership
      - no semantic repair hidden in extraction
    safe_actions:
      - private intention-revealing helper
      - consumer-owned narrow interface for genuine substitution
      - module hiding volatile representation
    unsafe_actions:
      - generic framework before repeated use
      - pass-through wrapper with no policy or hiding
      - parameter/flag explosion to force examples together
    common_failure_modes:
      - speculative generality
      - wrong commonality
      - leaky abstraction
      - mock-shaped production API
    conflicts:
      - conflict-abstraction-vs-duplication
      - conflict-performance-specialization-vs-abstraction
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/009-4-modules-should-be-deep.md :: 4: Modules Should Be Deep"
