  - id: universal-measure-claimed-improvement
    title: Measure the improvement that is claimed
    category: universal
    claim: A claim that work improves performance, maintainability, reliability, architecture fitness, or process needs a preserved baseline and evidence on that same dimension.
    decision_rule: Define the observable outcome before intervention, choose a representative direct measure or defensible proxy, compare under compatible conditions, and bound the conclusion to the evidence.
    why_it_matters: A reduced file size, complexity score, or benchmark can move while the actual change, review, user, or operational cost stays the same or worsens.
    applicable_when:
      - accepting refactoring, optimization, architecture, hardening, or process improvement
    required_evidence:
      - pre-change baseline and target
      - representative comparison or replayed motivating scenario
      - semantic preservation and confound analysis
    insufficient_evidence:
      - aesthetic improvement
      - metric decrease detached from outcome
      - one favorable result or self-reported ease
    required_inputs:
      - named improvement and baseline
      - candidate result and context
    expected_outputs:
      - verified, not verified, regressed, or inconclusive disposition
      - retained regression/fitness check where stable
    preservation_boundaries:
      - measurement semantics and representative population
      - unmeasured tradeoffs reported explicitly
    safe_actions:
      - replay the change task that motivated refactoring
      - use fitness functions for accepted architecture characteristics
      - retain benchmark raw results
    unsafe_actions:
      - select a proxy after seeing results
      - claim global benefit from a local metric
      - suppress contradictory evidence
    common_failure_modes:
      - Goodhart's law
      - benchmark overfit
      - refactoring success defined by line count
    source_support:
      - source_id: SRC-SDX
        locator: "books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/007-chapter-2-identify-code-with-high-interest-rates.md :: Follow Up on Improvements to Rails"
