schema_version: agent-doctrine-concepts/1
concepts:
  - id: universal-repository-contract-precedence
    title: Repository contracts outrank generic doctrine
    category: universal
    claim: Explicit task authority, accepted repository decisions, executable contracts, and current runtime facts govern the work before any generic engineering school or source preference.
    decision_rule: Discover the applicable local contract and actual target state first; use doctrine to investigate or choose among locally valid options, never to override a higher-precedence constraint without owner authority and repository evidence.
    why_it_matters: Advice that is sound in one language, lifecycle, architecture, or risk class can be harmful when detached from a repository's accepted commitments.
    applicable_when:
      - every assessment, recommendation, review, or implementation
    required_evidence:
      - user instruction and authority
      - repository instructions from root through target path
      - accepted ADR, RFC, API, compatibility, generation, build, and test contracts
      - current source, configuration, and relevant runtime state
    insufficient_evidence:
      - a book or framework calls a practice universal
      - neighboring directory names resemble a known architecture
      - community popularity or agent preference
    required_inputs:
      - task and target scope
      - repository contract hierarchy
      - current target evidence
    expected_outputs:
      - cited applicable contracts and any conflict
      - in-contract action or explicit escalation
    preservation_boundaries:
      - accepted behavior, architecture, ownership, data, compatibility, and operational policy
      - generated and vendored authority
    safe_actions:
      - use generic doctrine as a hypothesis or decision aid
      - verify whether an older decision's assumptions still hold
      - propose a decision change separately
    unsafe_actions:
      - silently migrate repository style or architecture to a source-preferred form
      - treat an unaccepted design draft as authority
      - infer permission from technical access
    common_failure_modes:
      - cargo-cult architecture
      - style migration hidden in feature work
      - stale documentation followed over executable current truth
    counterexamples:
      - A demonstrably stale contract may be repaired or superseded, but only through the repository's decision authority and an explicit change classification.
    interactions:
      - Governs every lower-priority concept and contextual lens.
    source_support:
      - source_id: SRC-FSA
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/003-preface-invalidating-axioms.md :: Axiom"
        contribution: Rejects timeless architecture axioms and requires context-specific tradeoff reasoning.
        relationship: direct_support
      - source_id: SRC-CC
