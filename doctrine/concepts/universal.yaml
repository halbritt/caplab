  - id: universal-explicit-invariants
    title: Make invariants explicit and owned
    category: universal
    claim: Every material invariant needs a clear owner, representation, enforcement point, failure policy, and proof mechanism proportionate to risk.
    decision_rule: State valid and invalid states over observable data; place enforcement with the authority that can keep the rule true across all mutation paths; map it to tests, static constraints, schema rules, or monitors.
    why_it_matters: Implicit or duplicated invariants become inconsistent, allow invalid intermediate states, and make callers coordinate hidden rules.
    applicable_when:
      - state, API, persistence, concurrency, domain, migration, or security rules are changed
    required_evidence:
      - accepted policy or current relied-upon constraint
      - all mutation/creation paths and authority
      - failure and recovery requirements
    insufficient_evidence:
      - repeated defensive code without understanding the rule
      - an assertion that can be disabled where safety depends on it
      - a type name with no enforcement
    required_inputs:
      - state model and ownership
      - domain/operational scenarios
    expected_outputs:
      - invariant statement and owner
      - enforcement and proof map
      - intentional failure semantics
    preservation_boundaries:
      - public preconditions/postconditions and substitutability
      - durable data and concurrency semantics
    safe_actions:
      - validated construction
      - semantic type or schema constraint
      - side-effect-free internal assertion plus boundary validation
    unsafe_actions:
      - strengthen a public precondition silently
      - enforce one copy of a duplicated rule and leave others inconsistent
      - mutate inside an assertion
    common_failure_modes:
      - two-phase initialization
      - ambiguous sentinel state
      - validation scattered across callers
    source_support:
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/009-chapter-4-pragmatic-paranoia.md :: Design by Contract"
        contribution: Treats preconditions, postconditions, and invariants as explicit program agreements.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/014-chapter-8-defensive-programming.md :: 8.2 Assertions"
        contribution: Separates internal invariant assertions from normal input and error handling.
        relationship: corroboration
      - source_id: SRC-DDD
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/007-chapter-6-the-life-cycle-of-a-domain-object.md :: Aggregates"
        contribution: Locates transactional domain invariants within an explicit consistency boundary.
        relationship: corroboration
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/008-chapter-3-the-anatomy-of-a-unit-test.md :: 3.1 How to structure a unit test"
        contribution: Reads a test act phase that needs more than one method call as evidence the API lets clients skip an invariant-maintaining step - an encapsulation breach the owner should close by performing the whole business operation in one method; applies to business-logic APIs, explicitly less to utility or infrastructure code.
        relationship: refinement
      - source_id: SRC-DDIA2
        locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/012-chapter-8-transactions.md :: Consistency'
        contribution: Defines transaction consistency as preservation of application-specific invariants and makes clear that the application must correctly define and enforce those invariants; the database cannot infer arbitrary domain rules.
        relationship: refinement
