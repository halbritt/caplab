  - id: universal-change-amplification
    title: Reduce demonstrated change amplification
    category: universal
    claim: Structure is costly when one conceptual change repeatedly forces disproportionate, risky, or cross-owner edits; restructuring is justified only when it reduces that demonstrated amplification.
    decision_rule: Trace representative changes and co-change; distinguish shared knowledge from generated, process, test, or requirement-driven coordination; select a boundary or abstraction only when it localizes the same future change.
    why_it_matters: It turns vague maintainability into an inspectable relationship between structure and work.
    applicable_when:
      - evaluating cohesion, boundaries, duplication, technical debt, or architecture
    required_evidence:
      - concrete change episodes or accepted near-term change
      - static/domain interpretation of coordinated edits
      - predicted and later observed pressure reduction
    insufficient_evidence:
      - churn alone
      - one large commit or bulk rename
      - file size or dependency count
    required_inputs:
      - change history and current structure
      - concept/invariant ownership
    expected_outputs:
      - amplification map and cause
      - no-change, localize, merge, split, or abstract decision
    preservation_boundaries:
      - behavior and ownership while relocating structure
      - generated and test/application relationships interpreted correctly
    safe_actions:
      - filter mechanical history
      - inspect surprising co-change
      - replay the motivating change after restructuring
    unsafe_actions:
      - turn a heat map directly into a refactoring plan
      - merge all co-changing code
      - blame authors or teams using history metrics
    common_failure_modes:
      - false temporal coupling
      - shared common module becoming a dependency magnet
      - stable abstraction that does not match actual change axes
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/007-2-the-nature-of-complexity.md :: 2: The Nature of Complexity"
        contribution: Names change amplification as a primary symptom of software complexity.
        relationship: direct_support
      - source_id: SRC-SDX
        locator: "books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/008-chapter-3-coupling-in-time-a-heuristic-for-the-concept-of-surprise.md :: What Is Change Coupling?"
        contribution: Supplies historical evidence for repeated coordinated change invisible in static code.
        relationship: corroboration
      - source_id: SRC-CA
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/023-chapter-13-component-cohesion.md :: THE COMMON CLOSURE PRINCIPLE"
        contribution: Connects component cohesion to grouping elements that change for the same reasons.
        relationship: corroboration
