  - id: universal-preserve-behavior-by-default
    title: Preserve behavior unless change is authorized
    category: universal
    claim: Existing observable behavior remains protected unless an accepted contract explicitly identifies what may change and who can accept it.
    decision_rule: List authorized semantic changes; provisionally preserve every other relevant output, side effect, data, error, ordering, timing/resource contract, security, durability, and operational property until it is classified.
    why_it_matters: Internal-looking changes often affect undocumented callers, state, failures, order, performance, or operations.
    applicable_when:
      - repair, refactoring, migration, optimization, cleanup, deletion, or dependency change
    required_evidence:
      - accepted desired behavior and semantic authority
      - preservation matrix and consumers
      - tests, characterization, probes, or explicit residual risk
    insufficient_evidence:
      - all edited symbols are private
      - the existing suite passes without path proof
      - the change is labeled refactoring or cleanup
    required_inputs:
      - change classification
      - current and intended behavior
      - authority and proof mechanisms
    expected_outputs:
      - authorized-change and preservation matrices
      - verification and acceptance owner
    preservation_boundaries:
      - behavior not explicitly released
      - public and operational contracts
      - relied-upon undocumented behavior until owner decision
    safe_actions:
      - characterize surprising behavior
      - separate semantic and structural checkpoints
      - narrow the preservation claim to exercised properties
    unsafe_actions:
      - repair a discovered bug inside a refactoring campaign
      - assume error, ordering, or timing changes are internal
      - silently redefine behavior to match a preferred design
    common_failure_modes:
      - behavior-changing refactor
      - passing unrelated tests used as proof
      - undocumented compatibility break
    source_support:
      - source_id: SRC-REF
        locator: "books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md :: Defining Refactoring"
        contribution: Defines refactoring by preservation of externally visible behavior.
        relationship: direct_support
      - source_id: SRC-WELC
        locator: "books/programming-working-effectively-with-legacy-code/chapters/008-chapter-1-changing-software.md :: Four Reasons to Change Software"
        contribution: Distinguishes change intents while centering preservation of existing behavior.
        relationship: corroboration
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/007-chapter-3-conquering-efficiency.md :: Functionality Phase"
        contribution: Requires a functional baseline before efficiency changes.
        relationship: corroboration
