  - id: universal-evidence-before-intervention
    title: Evidence before intervention
    category: universal
    claim: An engineering intervention is earned only by evidence capable of establishing the claimed problem and distinguishing the proposed response from no change or a lower-cost response.
    decision_rule: State the observable condition, evidence class, causal hypothesis, and remedy prediction; gather the cheapest discriminating evidence before recommending or executing material change.
    why_it_matters: Static unattractiveness, source prestige, and plausible stories can otherwise become unbounded refactoring, architecture, or optimization mandates.
    applicable_when:
      - assessing structure, architecture, correctness, technical debt, or performance
      - selecting any material intervention
    required_evidence:
      - claim-relative observation such as accepted requirement, reproduction, incident, recurring change, operational constraint, or representative measurement
      - evidence connecting the proposed action to the condition
      - alternatives including no change where viable
    insufficient_evidence:
      - file size, age, smell, churn, or complexity metric alone
      - a hypothetical future variant or scale
      - a single unrepresentative benchmark or anecdote
    required_inputs:
      - decision question and consequence
      - available evidence and known gaps
    expected_outputs:
      - observation, inference, and recommendation separated
      - act, experiment, monitor, leave, or escalate disposition
    preservation_boundaries:
      - authority and repository contracts
      - properties outside the proven intervention scope
    safe_actions:
      - gather history, tests, runtime, domain, or profile evidence
      - narrow a claim to what the evidence establishes
      - recommend an experiment rather than a solution
    unsafe_actions:
      - convert correlation into causation
      - treat an inventory or metric as a verdict
      - hide missing evidence behind confidence
    common_failure_modes:
      - aesthetic debt declaration
      - architecture astronomy
      - speculative optimization
    source_support:
      - source_id: SRC-SDX
        locator: "books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/006-chapter-1-why-technical-debt-isn-t-technical.md :: Interest Rate Is a Function of Time"
        contribution: Shows that poor-looking code creates maintenance debt only in relation to change and context.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/008-chapter-3-measure-twice-cut-once-upstream-prerequisites.md :: cc2e.com/0386 Checklist: Upstream Prerequisites"
        contribution: Requires problem, requirements, and architecture evidence before construction.
        relationship: corroboration
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/007-chapter-3-conquering-efficiency.md :: Resource-Aware Efficiency Requirements"
        contribution: Makes optimization action depend on explicit workload and resource evidence.
        relationship: corroboration
