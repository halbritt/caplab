  - id: universal-reversible-reviewable-change
    title: Prefer reversible, reviewable changes
    category: universal
    claim: Choose the smallest coherent step that can be independently understood, verified, and reversed or safely advanced.
    decision_rule: For each step, specify expected effect, preserved properties, feedback, checkpoint, and rollback/safe-forward; split when a reviewer cannot attribute outcomes or a failure cannot be localized.
    why_it_matters: Reversibility preserves options and reviewability limits simultaneous uncertainty and blast radius.
    applicable_when:
      - implementation, refactoring, migration, optimization, architecture evolution, or operational hardening
    required_evidence:
      - coherent checkpoint and exact verification
      - rollback or safe-forward route
      - compatibility/intermediate-state analysis
    insufficient_evidence:
      - a large final patch can be reverted wholesale
      - all steps are described in prose but not independently valid
    required_inputs:
      - sequence, feedback cadence, and target state
    expected_outputs:
      - checkpointed plan or diff
      - stop and recovery conditions
    preservation_boundaries:
      - no long-lived invalid intermediate state
      - required atomicity and compatibility window
    safe_actions:
      - thin vertical slice
      - one mechanical transformation at a time
      - staged prepare, transition, verify, retire migration
    unsafe_actions:
      - big-bang rewrite without necessity
      - irreversible data or public change without rehearsal
      - unrelated churn that obscures review
    common_failure_modes:
      - incomplete intermediate state
      - rollback that cannot restore data semantics
      - too-slow feedback for step size
    source_support:
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/007-chapter-2-a-pragmatic-approach.md :: Reversibility @@ occurrence=1"
        contribution: Treats non-final decisions and replaceable choices as protection against uncertainty.
