  - id: universal-separate-semantic-structural-change
    title: Separate semantic and structural work
    category: universal
    claim: Feature behavior, defect repair, refactoring, architecture, migration, optimization, cleanup, deletion, and dependency changes remain distinct checkpoints even when one task needs several.
    decision_rule: Classify each edit by intended observable effect; preserve the failing reproducer or baseline through preparation; make semantic effect appear in an isolated checkpoint and justify follow-up structure independently.
    why_it_matters: Mixed changes make causality, review, rollback, benchmark interpretation, and authority impossible to audit.
    applicable_when:
      - a task combines behavior and structure or spans change types
    required_evidence:
      - per-edit change classification
      - preservation boundary and semantic authority
      - checkpoint verification
    insufficient_evidence:
      - one final green test suite
      - all changes touch the same files
      - structure also improved while fixing the bug
    required_inputs:
      - intended effect and proposed diff sequence
      - baseline or reproducer
    expected_outputs:
      - separate checkpoints and proof for each change type
      - explicit composite authority when indivisible
    preservation_boundaries:
      - causal evidence for repair/optimization
      - reviewable behavior delta
      - rollback and migration states
    safe_actions:
      - mechanical preparation followed by an isolated semantic edit
      - follow-up refactoring after repair verification
      - separate dependency update
    unsafe_actions:
      - fix a defect during nominal refactoring
      - combine broad cleanup with optimization comparison
      - delete old migration path before transition acceptance
    common_failure_modes:
      - behavior-changing refactor
      - repair hidden in move/rename
      - untraceable benchmark or regression
    source_support:
      - source_id: SRC-REF
        locator: "books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md :: The Two Hats"
