  - id: universal-local-reasoning
    title: Prefer local reasoning
    category: universal
    claim: Place knowledge, state, invariants, and behavior so a maintainer can understand and change one responsibility without reconstructing distant hidden state or call order.
    decision_rule: Minimize the concepts and remote facts required for a representative change; localize an invariant with its authoritative data and hide coherent complexity behind a stable contract.
    why_it_matters: Cognitive load and unknown dependencies dominate change risk even when code is individually readable.
    applicable_when:
      - selecting placement, module shape, API, state ownership, or control flow
    required_evidence:
      - representative change or use scenario
      - knowledge and navigation required by callers/maintainers
      - state, invariant, and dependency ownership
    insufficient_evidence:
      - physical proximity alone
      - fewer files without less required knowledge
      - short methods connected by opaque delegation
    required_inputs:
      - current dependency and knowledge map
      - expected change axes
    expected_outputs:
      - localized responsibility and stable contract
      - remaining cross-boundary obligations
    preservation_boundaries:
      - authoritative ownership and required cross-system contracts
      - observability of material cost/failure semantics
    safe_actions:
      - co-locate state and invariant enforcement
      - hide representation and mechanism
      - make the main control path obvious
    unsafe_actions:
      - duplicate authoritative policy to avoid a dependency
      - hide unavoidable distributed consistency
      - add pass-through layers that increase navigation
    common_failure_modes:
      - message chains
      - global mutable context
      - temporal coupling
      - shallow wrapper proliferation
    conflicts:
      - conflict-deep-modules-vs-small-units
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/007-2-the-nature-of-complexity.md :: 2: The Nature of Complexity"
        contribution: Defines complexity through change amplification, cognitive load, and unknown unknowns.
        relationship: direct_support
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/007-chapter-2-a-pragmatic-approach.md :: Orthogonality"
        contribution: Connects independent change to localized effects and reduced coordination.
        relationship: corroboration
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/011-chapter-5-design-in-construction.md :: Software's Primary Technical Imperative: Managing Complexity"
        contribution: Centers human ability to understand a bounded amount of detail during construction.
        relationship: corroboration
