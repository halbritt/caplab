  - id: universal-information-hiding
    title: Hide volatile decisions behind coherent contracts
    category: universal
    claim: Information hiding succeeds when one module owns a design decision or representation and callers depend on stable meaning rather than mechanics; access modifiers alone are insufficient.
    decision_rule: List facts callers must know and decisions they should not; move representation, order, defaults, and mechanism behind the owner unless correctness, cost, failure, security, or operation requires exposure.
    why_it_matters: Leaked knowledge creates coordinated edits and expands the mental model required for local work.
    applicable_when:
      - designing modules, APIs, data representations, adapters, or configuration
    required_evidence:
      - decision owner and volatility
      - actual caller needs
      - leaked knowledge or coordinated change
