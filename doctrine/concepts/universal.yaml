  - id: universal-minimize-simultaneous-uncertainty
    title: Minimize simultaneous uncertainty
    category: universal
    claim: Organize investigation and change so one uncertain behavior, dependency, design choice, or performance hypothesis is tested at a time with close feedback.
    decision_rule: Rank unresolved assumptions by consequence; use the cheapest discriminating search, experiment, characterization, prototype, trace, or benchmark; update the plan before broadening work.
    why_it_matters: Interacting unknowns make failures hard to localize, comparisons uninterpretable, and reversal unsafe.
    applicable_when:
      - unfamiliar code, uncertain requirements, novel dependencies, integration, debugging, refactoring, or optimization
    not_applicable_when:
      - a fully mechanical change has established behavior and verification
    required_evidence:
      - explicit unknowns and consequence
      - discriminating check and baseline
      - checkpoint and stop condition
    insufficient_evidence:
      - a broad implementation happens to compile
      - confidence based on another repository
      - several simultaneous changes followed by one result
    required_inputs:
      - uncertainty ledger
      - available feedback and authority
    expected_outputs:
      - resolved, narrowed, or falsified assumption
      - retained or discarded experiment
      - updated sequence
    preservation_boundaries:
      - experiments do not alter authoritative data or behavior without permission
      - disposable prototypes do not enter production silently
    safe_actions:
      - one-change diagnostic experiment
      - thin tracer slice built to production standards
      - throwaway prototype kept outside authority surfaces
    unsafe_actions:
      - prototype laundering
      - repair and refactor in one comparison
      - several performance levers in one benchmark
    common_failure_modes:
      - causal ambiguity
      - large speculative diff
      - feedback too slow for step size
    source_support:
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/011-chapter-5-design-in-construction.md :: Experimental Prototyping"
        contribution: Uses bounded prototypes to answer specific design uncertainties.
        relationship: direct_support
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/007-chapter-2-a-pragmatic-approach.md :: Tracer Bullets Don't Always Hit Their Target"
        contribution: Treats thin integrated slices as feedback that redirects implementation.
        relationship: corroboration
      - source_id: SRC-REF
        locator: "books/refactoring-improving-the-design-of-existing-code/chapters/009-chapter-5-toward-a-catalog-of-refactorings.md :: Format of the Refactorings"
        contribution: Advocates the smallest verified structural steps and decomposition after failure.
        relationship: corroboration
    confidence: universal
    roles: [coding-agent, architecture-agent, refactoring-agent, legacy-code-agent, performance-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
