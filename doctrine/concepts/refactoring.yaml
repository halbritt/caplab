- id: refactoring-demonstrated-pressure
  title: Evidence that earns refactoring
  category: refactoring
  claim: Structural intervention requires demonstrated present or imminent maintenance pressure, not unattractiveness alone.
  decision_rule: Require a concrete goal and verified pressure such as repeated coupled edits, dispersed responsibility, blocked testing, recurring defects, active complexity growth, or material review/cognitive cost; select the smallest response.
  why_it_matters: Refactoring spends risk and review capacity and should target recurring cost.
  applicable_when:
  - refactoring proposal
  - cleanup request
  - architecture improvement assessment
  not_applicable_when:
  - an independently authorized platform migration
  - though it needs its own evidence
  required_evidence:
  - current task
  - call sites
  - history
  - defects
  - test friction
  - review or domain evidence
  insufficient_evidence:
  - file length
  - smell name
  - generic style
  - churn alone
  required_inputs:
  - pressure ledger
  - candidate responses
  expected_outputs:
  - earned
  - not-earned
  - or uncertain decision and verification target
  preservation_boundaries:
  - Any selected structural action remains behavior-preserving unless separately authorized.
  safe_actions:
  - refactor adjacent to required work
  - rank a measured hotspot for inspection
  unsafe_actions:
  - broad aesthetic cleanup
  - automatic split from a threshold
  common_failure_modes:
  - metric-driven churn
  - wrong bottleneck
  - under-refactoring where history is unavailable
  counterexamples:
  - A security-driven structural migration can be earned by external risk rather than prior churn.
  interactions:
  - architecture-metrics-as-signals
  - refactoring-hotspot-prioritization
  - refactoring-leave-unattractive-code
  conflicts: []
