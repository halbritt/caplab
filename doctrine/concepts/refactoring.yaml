- id: refactoring-smells-as-hypotheses
  title: Treat smells as falsifiable hypotheses
  category: refactoring
  claim: A smell names an investigation question and neither proves a defect nor selects a transformation.
  decision_rule: Translate the smell into an operational maintenance consequence, test it against callers, change history, responsibilities, runtime constraints, and repository idiom, then act only when the hypothesis survives.
  why_it_matters: Surface forms are context-sensitive and automatic remedies often create indirection or destroy rationale.
  applicable_when:
  - long method
  - large class
  - switch
  - comments
  - duplication
  - middle man
  - inheritance findings
  not_applicable_when:
  - a direct contractual violation already establishes a defect
  required_evidence:
  - specific consequence
  - causal link
  - repository context
  insufficient_evidence:
  - detector output
  - threshold count
  - catalog match
  - reviewer taste
  required_inputs:
  - smell candidate
  - current source and use evidence
  expected_outputs:
  - confirmed
  - refuted
  - or uncertain hypothesis and next observation
  preservation_boundaries:
  - Investigation does not authorize structural or semantic change.
  safe_actions:
  - inspect why a long unit changes
  - retain rationale comments
  - compare alternative remedies
  unsafe_actions:
  - split by size
  - replace every switch with polymorphism
  - delete comments automatically
  common_failure_modes:
  - cargo-cult patterns
  - shallow modules
  - false blocker review
  counterexamples:
  - Repeated dispersed edits with omission defects can strongly confirm shotgun surgery.
  interactions:
  - refactoring-demonstrated-pressure
  - architecture-metrics-as-signals
  - universal-earned-abstraction
  conflicts:
  - conflict-deep-modules-vs-small-units
  - conflict-comments-vs-self-documenting-structure
