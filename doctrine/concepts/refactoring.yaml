- id: refactoring-small-verified-steps
  title: Short verified transformation loop
  category: refactoring
  claim: Structural safety comes from small reversible moves with feedback, not from the intended final design alone.
  decision_rule: Make the smallest move that advances one goal, run the cheapest relevant check, checkpoint coherent green states, and broaden checks at integration boundaries.
  why_it_matters: Short feedback minimizes simultaneous uncertainty and localizes error to the last move.
  applicable_when:
  - manual refactoring
  - legacy extraction
  - hotspot campaign
  - codemod staging
  not_applicable_when:
  - requiring an expensive full suite after every keystroke when a reliable check ladder exists
  required_evidence:
  - known baseline
  - move-specific expectation
  - fast check
  - rollback point
  insufficient_evidence:
  - only a final suite after an opaque rewrite
  - compile-only for semantic risk
  required_inputs:
  - target
  - check ladder
  - campaign goal
  expected_outputs:
  - verified step sequence
  - green checkpoints
  preservation_boundaries:
  - Each structural step preserves the established boundary.
  safe_actions:
  - extract then targeted test
  - commit coherent green slice
  - redo an early extraction
  unsafe_actions:
  - defer all verification
  - accumulate unrelated moves
  - long isolated refactor without integration
  common_failure_modes:
  - steps too large
  - flaky feedback
  - ritual microsteps with no causal value
  counterexamples:
  - A trusted tool may perform an internally atomic repository-wide rename
  - followed by repository checks.
  interactions:
  - universal-minimize-simultaneous-uncertainty
  - refactoring-transformation-tool-trust
  - refactoring-stop-backtrack-escalate
  conflicts: []
