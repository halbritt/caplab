- id: refactoring-behavior-preservation
  title: Explicit behavior-preservation boundary
  category: universal
  claim: Unless change is authorized, externally observable behavior remains invariant across structural work.
  decision_rule: Enumerate authorized deltas; treat every other output, error, side effect, stored format, protocol, ordering, timing, durability, and supported caller interaction as preserved until evidence narrows it.
  why_it_matters: Tests expose only selected observations; an explicit boundary prevents silent semantic assumptions.
  applicable_when:
  - refactoring
  - repair
  - migration
  - optimization
  - legacy change
  not_applicable_when:
  - an implementation detail with no observable or contractual consequence
  required_evidence:
  - requirements or ADRs
  - callers
  - tests
  - runtime observations
  - schemas
  - incidents
  insufficient_evidence:
  - green unit tests alone
  - compilation alone
  - internal method shape
  required_inputs:
  - authorized delta
  - observable-surface inventory
  expected_outputs:
  - preservation matrix
  - check per material invariant
  - unknowns
  preservation_boundaries:
  - The concept defines the preservation boundary; each surface must name its owner and evidence.
  safe_actions:
  - characterize uncertain behavior
  - explicitly record gaps
  - use layered checks
  unsafe_actions:
  - claim preservation from compilation
  - ignore errors or side effects
  - freeze irrelevant internals
  common_failure_modes:
  - incomplete surface inventory
  - accidental behavior frozen indiscriminately
  - false test confidence
  counterexamples:
  - An authorized defect repair changes the failing case while preserving the surrounding boundary.
  interactions:
  - legacy-characterization-surfaces
  - legacy-effect-surface
  - refactoring-compatibility-migration
  conflicts: []
  source_support:
