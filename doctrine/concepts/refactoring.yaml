- id: refactoring-stop-backtrack-escalate
  title: Stop, backtrack, or escalate on lost certainty
  category: agent-conduct
  claim: The agent must stop when it can no longer state what changed, what remains invariant, why a check failed, or whether it has authority.
  decision_rule: Return to the last known-good state; retain only an independently useful protected subset; otherwise reverse the agent-owned slice or escalate the behavior/authority choice.
  why_it_matters: Continuing converts explicit uncertainty into hidden risk and unauthorized decisions.
  applicable_when:
  - ambiguous failure
  - surprising behavior
  - authority gap
  - irreversible next step
  not_applicable_when:
  - safe read-only investigation can still reduce uncertainty
  required_evidence:
  - baseline
  - current diff
  - failure output
  - ownership and authority
  insufficient_evidence:
  - sunk cost
  - deadline
  - confidence without reproducer
  required_inputs:
  - campaign goal
  - last green point
  - uncertainty ledger
  expected_outputs:
  - continue
  - retain-smaller
  - backtrack
  - or escalate decision with reason
  preservation_boundaries:
  - Do not cross an unresolved semantic, public, data, production, or authority boundary.
  safe_actions:
  - discard scratch work
  - keep green seam
  - present alternatives
  unsafe_actions:
  - debug forward through many edits
  - silently choose expected behavior
  - reverse user changes
  common_failure_modes:
  - premature abandonment
  - destructive rollback
  - escalation without prior safe investigation
  counterexamples:
  - A newly authorized semantic delta can resume as a separately classified slice.
  interactions:
  - agent-conduct-authority-bounded-action
  - legacy-characterization-surfaces
  - refactoring-small-verified-steps
  conflicts:
  - conflict-refactor-now-vs-leave-alone
  source_support:
