- id: refactoring-leave-unattractive-code
  title: Evidence-governed no-change decision
  category: refactoring
  claim: Leave unattractive code unchanged when it has no demonstrated cost or authorized imminent change and intervention risk exceeds near-term benefit.
  decision_rule: Compare activity, incidents, runtime use, roadmap and support obligations against characterization, dependency, integration, and knowledge cost; choose no change when benefit remains speculative.
  why_it_matters: Mature odd code can embody hard-won behavior, and touching it resets defect risk.
  applicable_when:
  - old stable module
  - rewrite proposal
  - cleanup audit
  not_applicable_when:
  - confirmed defect
  - vulnerability
  - unsupported platform
  - imminent required change
  required_evidence:
  - recent history
  - runtime use
  - incidents
  - roadmap
  - support constraints
  - ownership
  insufficient_evidence:
  - age alone
  - folklore
  - complaints
  - no commits in paused product
  required_inputs:
  - value-risk comparison
  expected_outputs:
  - leave
  - isolate
  - characterize
  - delete-investigate
  - or act decision with revisit trigger
  preservation_boundaries:
  - Existing behavior remains untouched; observations do not become authorization.
  safe_actions:
  - avoid stable code
  - isolate through existing boundary
  - record trigger
  unsafe_actions:
  - rewrite from dislike
  - declare dead from age
  - permanent freeze despite new risk
  common_failure_modes:
  - fear-driven avoidance
  - false stability
  - latent external risk
  counterexamples:
