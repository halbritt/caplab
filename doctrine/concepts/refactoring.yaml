- id: refactoring-compatibility-migration
  title: Published structural change is a compatibility migration
  category: architecture
  claim: Independent consumers or persisted data turn a desirable internal restructuring into a phased migration.
  decision_rule: Inventory consumers and control; change atomically only when all are proven controlled, otherwise preserve an adapter or old representation, migrate observably, then remove under deprecation authority.
  why_it_matters: Internal green tests do not protect deployed clients, old data, or independently released components.
  applicable_when:
  - public API
  - wire protocol
  - event
  - schema
  - file format
  - multi-repo consumer
  not_applicable_when:
  - private proven-unreferenced symbol with atomic callers
  required_evidence:
  - consumer inventory
  - compatibility contract
  - ownership
  - rollout
  - rollback
  - telemetry where available
  insufficient_evidence:
  - local repository search
  - one-component compile
  - internal tests
  required_inputs:
  - boundary and consumer map
  expected_outputs:
  - atomic-edit proof or phased migration plan
  preservation_boundaries:
  - Old clients/data remain usable through the authorized compatibility interval.
  safe_actions:
  - adapter
  - dual read/write when authorized
  - staged deprecation
  unsafe_actions:
  - rename public API as refactoring
  - mutate schema without migration
  common_failure_modes:
  - orphan clients
  - unreadable data
  - permanent adapter
  counterexamples:
  - A private method and all callers in one compilation unit can change atomically.
  interactions:
  - refactoring-behavior-preservation
  - refactoring-change-type-classification
  - refactoring-splinter-campaign
  conflicts:
  - conflict-dependency-inversion-vs-direct-coupling
  source_support:
  - source_id: SRC-REF
    locator: 'books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md :: Changing Interfaces'
    contribution: Published callers and database data make an otherwise local refactoring a compatibility and migration problem.
    relationship: direct_support
  - source_id: SRC-REF
    locator: 'books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md :: Databases'
    contribution: Published callers and database data make an otherwise local refactoring a compatibility and migration problem.
    relationship: direct_support
  - source_id: SRC-RI
    locator: 'books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Relational Database Schemata'
    contribution: Defines the additive expansion phase of a schema migration - new tables, views, nullable columns, aliases, copies, trigger shims - whose criterion is that nothing added is observable by the currently running application, and requires testing migrations against production-shaped data rather than clean QA data.
    relationship: refinement
  - source_id: SRC-RI
    locator: 'books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Cleanup'
    contribution: Defines the contraction phase - drop superseded structures and remove shims only after every instance runs the new version, and defer NOT NULL and foreign-key constraints until then because old instances would start erroring on actions that were previously valid; feature-toggle review and removal are scheduled here, and shim removal must itself be a versioned migration.
    relationship: refinement
  - source_id: SRC-RI
    locator: 'books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Schemaless Databases'
    contribution: Shows schemaless stores still carry an implicit application schema across every document version ever written - of the four concurrent code/data version combinations only old-code-reads-new-data fails, so code able to read both versions must be fully rolled out before data migration runs, and trickle-then-batch migration amortizes migrations too large for a deployment window.
    relationship: refinement
  confidence: strong
