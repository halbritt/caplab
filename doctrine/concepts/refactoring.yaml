schema_version: agent-doctrine-concepts/1
concepts:
- id: refactoring-change-type-classification
  title: Classify change by purpose and semantic permission
  category: agent-conduct
  claim: A change label is valid only when its purpose and allowable observable delta match the actual work.
  decision_rule: Inventory intended observable deltas, classify the primary purpose, and split mixed purposes into separately authorized and verified slices.
  why_it_matters: Classification determines authority, preservation, tests, review, rollout, and rollback; misleading labels hide risk.
  applicable_when:
  - planning any repository write
  - reviewing a mixed diff
  - describing a campaign
  not_applicable_when:
  - pure observation with no proposed mutation
  required_evidence:
  - request and acceptance criteria
  - current behavior
  - accepted contracts
  - proposed semantic delta
  insufficient_evidence:
  - issue label
  - commit title
  - cleanup wording
  - code movement
  required_inputs:
  - authority statement
  - current and desired behavior
  - affected boundaries
  expected_outputs:
  - change type
  - authorized delta
  - invariant list
  - ordered slices
  preservation_boundaries:
  - All observable behavior outside the authorized delta.
  safe_actions:
  - repair then refactor on green
  - name migration explicitly
  - separate optimization from semantics
  unsafe_actions:
  - call behavior change refactoring
  - hide API migration in cleanup
  - bundle unrelated repair
  common_failure_modes:
  - review ambiguity
  - missing rollback
  - untested semantic drift
  counterexamples:
  - A private local rename with unchanged behavior is ordinary refactoring.
  interactions:
  - refactoring-behavior-preservation
  - universal-separate-semantic-structural-change
  - refactoring-compatibility-migration
  conflicts: []
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/008-chapter-1-changing-software.md :: Four Reasons to Change Software'
    contribution: Feature addition, defect repair, design improvement/refactoring, and optimization differ by purpose and by which existing behavior may change.
    relationship: direct_support
  - source_id: SRC-REF
    locator: 'books/refactoring-improving-the-design-of-existing-code/chapters/006-chapter-2-principles-in-refactoring.md :: Defining Refactoring'
    contribution: Refactoring is explicitly behavior-preserving structural change and should be distinguished from cleanup or performance work.
    relationship: refinement
