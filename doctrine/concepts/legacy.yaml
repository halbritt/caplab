- id: legacy-sprout-wrap
  title: Sprout or wrap behavior under deadline pressure
  category: legacy
  claim: When required behavior cannot safely enter an untestable body in time, tested logic may be placed beside or around it through a narrow integration point.
  decision_rule: Sprout separable new computation; wrap required before/after behavior; test new logic, characterize integration where feasible, and record the design and integration gap.
  why_it_matters: It confines new uncertainty but may create a staging scar and leave old/new integration weakly protected.
  applicable_when:
  - urgent authorized feature or repair in untestable code
  not_applicable_when:
  - small seam can cheaply bring original path under test
  required_evidence:
  - deadline and change need
  - protection obstacle
  - narrow integration
  - new-logic tests
  insufficient_evidence:
  - desire to avoid understanding old code
  required_inputs:
  - required behavior
  - old call boundary
  expected_outputs:
  - sprout or wrap slice
  - integration-risk statement
  - follow-up disposition
  preservation_boundaries:
  - Existing old behavior remains unchanged except the authorized added wrapper/sprout effect.
  safe_actions:
  - tested helper called once
  - explicit decorator/wrapper with contract
  unsafe_actions:
  - parallel subsystem
  - duplicated long-term policy
  - untested integration claimed safe
  common_failure_modes:
  - architectural scar
  - stale duplication
  - context split
  counterexamples:
  - Ordinary TDD inside already testable code is preferable.
  interactions:
  - legacy-cover-and-modify
  - legacy-provisional-dependency-break
  conflicts:
