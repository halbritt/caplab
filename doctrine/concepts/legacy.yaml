- id: legacy-pinch-point
  title: Protect a change cluster at a stable convergence point
  category: legacy
  claim: One stable observation can intercept effects from several changed paths, trading localization for reduced preparation.
  decision_rule: Choose the closest stable convergence point covering the relevant effect set; supplement critical leaves and narrow or retire the broad test as seams improve.
  why_it_matters: It can make a bounded change feasible without breaking every dependency in a tangled area.
  applicable_when:
  - many connected classes or effects
  - no economical local harness
  not_applicable_when:
  - point is nondeterministic
  - destructive
  - too slow
  - or misses the changed path
  required_evidence:
  - effect convergence
  - stable harness
  - scope
  - cost
  - critical gaps
  insufficient_evidence:
  - architectural height
  - aggregate coverage
  required_inputs:
  - effect graph
  - candidate interception points
  expected_outputs:
  - selected point
  - covered paths
  - supplemental tests
  - retention rule
  preservation_boundaries:
  - Broad coverage protects only observed effects; unrelated behavior is not declared correct.
  safe_actions:
  - temporary service-boundary characterization
  - targeted leaf tests
  unsafe_actions:
  - one happy-path E2E test claimed comprehensive
  common_failure_modes:
  - flaky slow suite
  - incidental convergence
  - weak failure localization
  counterexamples:
  - A stable public protocol may be the enduring correct contract surface.
  interactions:
  - legacy-effect-surface
  - legacy-provisional-safety-net
  conflicts:
  - conflict-broad-vs-narrow-characterization
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/020-chapter-12-i-need-to-make-many-changes-in-one-area-do-i-have-to-break-dependencies-for-all-the-classes-involved.md :: Pinch Point'
