- id: legacy-characterization-surfaces
  title: Characterize actual relevant behavior
  category: legacy
  claim: A characterization test records what the system does at a relevant observation surface; it does not declare that behavior correct.
  decision_rule: Invoke a relevant path, assert and observe, rule out harness error, encode repeatable actual behavior and change-sensitive boundaries, and stop when the intended change can be sensed.
  why_it_matters: Undocumented deployed behavior may be relied upon, while desired-behavior assumptions can silently widen a change.
  applicable_when:
  - unknown or undocumented behavior
  - legacy refactoring
  - suspected regressions
  not_applicable_when:
  - irrelevant dead paths
  - formally specified behavior with a stronger oracle except as comparison
  required_evidence:
  - representative setup
  - actual output or effect
  - repeatability
  - path relevance
  insufficient_evidence:
  - what code should do
  - snapshot approval without inspection
  - coverage alone
  required_inputs:
  - change and effect surface
  - observation harness
  expected_outputs:
  - targeted baseline tests
  - suspicious-behavior and uncertainty ledger
  preservation_boundaries:
  - Observed relevant behavior is provisionally preserved unless repair authority changes it.
  safe_actions:
  - name an odd observation explicitly
  - normalize nondeterministic noise
  - escalate discrepancy
  unsafe_actions:
  - silently correct behavior
  - treat observation as moral correctness
  - capture unstable environment wholesale
  common_failure_modes:
  - golden-master noise
  - nondeterminism
  - ossified irrelevant behavior
  - harness bug
  counterexamples:
  - A protocol specification can supply the desired oracle while characterization shows the current deviation.
  interactions:
  - refactoring-behavior-preservation
  - legacy-effect-surface
  - refactoring-stop-backtrack-escalate
  conflicts:
  - conflict-broad-vs-narrow-characterization
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/009-chapter-2-working-with-feedback.md :: The Legacy Code Change Algorithm'
