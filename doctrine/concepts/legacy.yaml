- id: legacy-provisional-dependency-break
  title: Minimum provisional dependency break
  category: legacy
  claim: Break only the dependency that prevents required feedback, and make any resulting design scar explicit and revisitable.
  decision_rule: Rank seam options by production impact, scope, reversibility, and test leverage; choose the smallest, verify production behavior, and record retain/remove criteria.
  why_it_matters: Demanding final architecture before tests recreates the legacy dilemma, while untracked hooks fossilize.
  applicable_when:
  - one dependency blocks harness or observation
  not_applicable_when:
  - durable boundary is independently earned or no protection benefit exists
  required_evidence:
  - blocking dependency
  - alternatives
  - production invariant
  - lifecycle criteria
  insufficient_evidence:
  - testability as an abstract virtue
  required_inputs:
  - obstacle
  - seam options
  - protection goal
  expected_outputs:
  - bounded enabling change
  - tests
  - debt disposition
  preservation_boundaries:
  - Production behavior and selection remain stable.
  safe_actions:
  - parameterize with current production value
  - extract-and-override in harness
  unsafe_actions:
  - redesign all dependencies
  - leave hidden global hook
  common_failure_modes:
  - temporary scar becomes permanent
  - API pollution
  - global leakage
  counterexamples:
  - Multiple production implementations can independently earn a durable interface.
  interactions:
  - legacy-seams-and-enabling-points
  - legacy-unprotected-enabling-edit
  - legacy-sprout-wrap
  conflicts:
  - conflict-temporary-seam-vs-long-term-design
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/009-chapter-2-working-with-feedback.md :: Break Dependencies'
    contribution: The legacy dilemma may require a small production edit to create tests; dependency-breaking scars can be tolerated locally and reconsidered after feedback exists.
