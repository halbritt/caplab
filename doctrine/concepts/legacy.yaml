- id: legacy-sensing-and-separation
  title: Sensing, separation, and test-double evidence scope
  category: review
  claim: Sensing exposes the effects a harness must observe, separation removes dependencies that prevent execution, and substitutes establish only the local behavior they model rather than real integration.
  decision_rule: Name the effect that must be sensed and the dependency that blocks execution; introduce only the required observation or separation mechanism, use the simplest faithful substitute, and add contract or integration evidence whenever correctness depends on the real boundary.
  why_it_matters: Conflating observation, isolation, and integration proof creates indiscriminate mocking and passing tests that encode a false production model.
  applicable_when:
  - mock
  - fake
  - stub
  - external dependency
  - nondeterministic collaborator
  not_applicable_when:
  - cheap deterministic value object
  required_evidence:
  - observation need
  - collaborator contract
  - substitute fidelity
  - integration layer
  insufficient_evidence:
  - passing mocked test
  - verified call count
  - type compatibility
  required_inputs:
  - boundary contract
  - desired observation
  expected_outputs:
  - real or double choice
  - scope statement
  - missing integration evidence
  preservation_boundaries:
  - The substitute must not redefine the production contract.
  safe_actions:
  - small owned in-memory fake
  - boundary contract test
  unsafe_actions:
  - reimplement vendor behavior and infer integration correctness
  - mock internals broadly
  common_failure_modes:
  - brittle interaction tests
  - divergent fake
  - false integration confidence
  counterexamples:
  - Exactly-once enqueue interaction may itself be the required behavior.
  interactions:
  - legacy-seams-and-enabling-points
  - legacy-effect-surface
  conflicts: []
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/010-chapter-3-sensing-and-separation.md :: Chapter 3: Sensing and Separation'
    contribution: Separates the need to observe effects from the need to isolate dependencies that prevent harness execution.
    relationship: direct_support
