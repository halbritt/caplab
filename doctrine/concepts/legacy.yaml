- id: legacy-current-work-responsibility-discovery
  title: Discover responsibility through current work
  category: legacy
  claim: The behavior being changed supplies the most reliable initial evidence for one responsibility inside an unclear large unit.
  decision_rule: Mark methods, data, and effects involved in current work; name their shared purpose; extract only with a cohesive seam and protection; defer unrelated groups.
  why_it_matters: Live change supplies semantic and temporal evidence without requiring an ideal full decomposition.
  applicable_when:
  - large unclear class/module
  - feature or repair in legacy code
  not_applicable_when:
  - forcing every task into a new type
  - accepted domain boundary already resolves placement
  required_evidence:
  - current path
  - data relationships
  - change reason
  - nameable policy
  - test seam
  insufficient_evidence:
  - size
  - position grouping
  - imagined class diagram
  required_inputs:
  - current task slice
  - effect and data map
  expected_outputs:
  - local responsibility hypothesis
  - retain or extract choice
  preservation_boundaries:
  - Initial extraction remains behind existing interfaces where possible.
  safe_actions:
  - extract in current owner first
  - revisit after more changes
  unsafe_actions:
  - design complete hierarchy from static read
  - move ownership before understanding
  common_failure_modes:
  - task-shaped fragmentation
  - duplicated invariants
  - provisional boundary mistaken final
  counterexamples:
  - Strong accepted domain architecture may already identify the owner.
  interactions:
  - architecture-change-locality-cohesion
  - legacy-scratch-refactoring
  - refactoring-small-verified-steps
  conflicts:
  - conflict-deep-modules-vs-small-units
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/028-chapter-20-this-class-is-too-big-and-i-don-t-want-it-to-get-any-bigger.md :: Heuristic #7: Focus on the Current Work'
    contribution: Method/data relationships and the present change reveal one responsibility more reliably than attempting a complete decomposition from static size.
    relationship: direct_support
