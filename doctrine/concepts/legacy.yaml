- id: legacy-provisional-safety-net
  title: Provisional broad characterization safety net
  category: legacy
  claim: A broad black-box or E2E suite may temporarily protect initial restructuring when local tests are impossible, with explicit brittleness and retirement rules.
  decision_rule: Cover critical user scenarios and complex paths in an isolated stable environment, use them to enable the first seam, add narrower tests, then retain only enduring contract value.
  why_it_matters: Broad tests may be the only initial route but are slow, brittle, and weak at localization.
  applicable_when:
  - central untestable hotspot
  - stable black-box boundary
  not_applicable_when:
  - destructive live environment
  - reliable narrow seam already available
  required_evidence:
  - critical scenarios
  - repeatability
  - environment controls
  - coverage gaps
  - retirement criteria
  insufficient_evidence:
  - one recorded happy path
  - screenshots
  - aggregate coverage
  required_inputs:
  - user-visible scenarios
  - change surface
  expected_outputs:
  - temporary safety net
  - scope statement
  - narrowing plan
  preservation_boundaries:
  - Only recorded stable external behavior is protected.
  safe_actions:
  - isolated API characterization
  - DOM/component identity over pixels
  unsafe_actions:
  - production live test
  - flaky GUI playback claimed comprehensive
  common_failure_modes:
  - brittleness blocks unrelated change
  - leaked state
  - false confidence
  counterexamples:
  - Stable protocol E2E tests may retain enduring value after local tests exist.
  interactions:
  - legacy-pinch-point
