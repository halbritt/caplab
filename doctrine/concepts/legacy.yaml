schema_version: agent-doctrine-concepts/1
concepts:
- id: legacy-cover-and-modify
  title: Cover-and-modify change algorithm
  category: legacy
  claim: Poorly characterized code should be changed through a minimum route from change point to effect/test point, dependency seam, characterization, semantic edit, and optional refactoring.
  decision_rule: Identify change and test points, break only dependencies blocking sensing or separation, characterize relevant behavior, implement the authorized delta, then refactor only on green.
  why_it_matters: It resolves the need-tests-before-change versus need-change-before-tests dilemma without redesigning the system first.
  applicable_when:
  - valuable weakly-tested existing code
  - difficult construction or execution
  not_applicable_when:
  - fast existing tests already protect the full change surface
  required_evidence:
  - change point
  - effect path
  - observation point
  - dependency obstacle
  - baseline
  insufficient_evidence:
  - global coverage percentage
  - whole-system understanding
  - mockability alone
  required_inputs:
  - authorized delta
  - dependency and effect sketch
  expected_outputs:
  - minimum safe-change route
  - tests
  - uncertainty ledger
  preservation_boundaries:
  - All behavior outside the accepted semantic delta.
  safe_actions:
  - one seam
  - targeted characterization
  - semantic slice
  - optional later refactor
  unsafe_actions:
  - break every dependency
  - redesign surrounding architecture
  - edit and pray
  common_failure_modes:
  - test point too high
  - seam changes production binding
  - missed side effects
  counterexamples:
  - A pure fully tested function can be modified directly.
  interactions:
  - legacy-effect-surface
  - legacy-seams-and-enabling-points
  - legacy-characterization-surfaces
  conflicts: []
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/009-chapter-2-working-with-feedback.md :: The Legacy Code Change Algorithm'
    contribution: Identify change points and test points, break blocking dependencies, write tests, then make the change and refactor.
    relationship: direct_support
