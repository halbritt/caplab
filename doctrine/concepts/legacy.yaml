- id: legacy-effect-surface
  title: Select protection from effect propagation
  category: legacy
  claim: Required tests follow all observable effects reachable from a change point, not class boundaries or coverage targets alone.
  decision_rule: Trace returns, mutations, globals/statics, I/O, callbacks/events, exceptions, and deferred effects to stable observations; choose the nearest reliable points plus critical broad contracts.
  why_it_matters: It bounds test preparation and reveals hidden coupling without demanding global coverage.
  applicable_when:
  - planning tests for change
  - legacy characterization
  - repair blast radius
  not_applicable_when:
  - as a replacement for cross-cutting security or concurrency analysis
  required_evidence:
  - call and effect sketch
  - side effects
  - exception paths
  - observation points
  insufficient_evidence:
  - testing every public method
  - line coverage
  - class adjacency
  required_inputs:
  - change point
  - execution and state graph
  expected_outputs:
  - test-point list
  - uncovered high-risk effects
  - confidence
  preservation_boundaries:
  - Every preserved material effect needs a check or explicit uncertainty.
  safe_actions:
  - test return and mutation
  - include async completion
  - use pinch point where justified
  unsafe_actions:
  - assume void means no effect
  - expose internals without trade-off review
  common_failure_modes:
  - missed deferred effect
  - enormous high-level test
  - internal overspecification
  counterexamples:
  - A pure function's effect surface may be only its return value.
  interactions:
  - legacy-characterization-surfaces
  - legacy-pinch-point
  - legacy-cover-and-modify
  conflicts:
  - conflict-broad-vs-narrow-characterization
  source_support:
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/019-chapter-11-i-need-to-make-a-change-what-methods-should-i-test.md :: Effect Propagation'
    contribution: Effects propagate through returns, mutation, globals/statics, and downstream calls; tests should be selected from that forward effect graph.
    relationship: direct_support
  - source_id: SRC-WELC
    locator: 'books/programming-working-effectively-with-legacy-code/chapters/019-chapter-11-i-need-to-make-a-change-what-methods-should-i-test.md :: Effects and Encapsulation'
    contribution: Effects propagate through returns, mutation, globals/statics, and downstream calls; tests should be selected from that forward effect graph.
