- id: legacy-scratch-refactoring
  title: Disposable refactoring for understanding
  category: legacy
  claim: Aggressive reversible structural edits can reveal behavior and responsibilities, but insight—not the scratch diff—is the default deliverable.
  decision_rule: Work in an isolated reversible copy, rename/extract/delete to learn, capture findings, discard, and recreate only the smallest justified production campaign from a clean baseline.
  why_it_matters: It permits exploration without laundering unverified edits into production.
  applicable_when:
  - poorly understood code
  - monster method
  - suspected dead code
  not_applicable_when:
  - static reading and existing tests already answer the question
  required_evidence:
  - explicit scratch status
  - clean baseline
  - no external side effects
  - recorded findings
  insufficient_evidence:
  - scratch code compiles
  - scratch structure looks better
  required_inputs:
  - understanding question
  - isolated workspace
  expected_outputs:
  - effect/responsibility/dead-code hypotheses
  - no production diff by default
  preservation_boundaries:
  - Scratch mutations never alter shared or external state and are not merged without a fresh protected campaign.
  safe_actions:
  - throwaway extraction
  - exploratory rename
  - discard
  unsafe_actions:
  - merge exploration
  - delete from production based on scratch only
  - destroy user work
  common_failure_modes:
  - scratch becomes production
  - findings not recorded
  - false dead-code conclusion
  counterexamples:
  - A protected extraction discovered in scratch can be recreated as the first production slice.
