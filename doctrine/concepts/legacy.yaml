- id: legacy-seams-and-enabling-points
  title: Dependency seam with explicit enabling point
  category: legacy
  claim: A test seam is operational only when alternate behavior can be selected explicitly at a known enabling point without changing production semantics.
  decision_rule: Name the behavior to substitute, locate enabling points, choose the least invasive mechanism, prove production selection is unchanged, and govern lifecycle and concurrency.
  why_it_matters: An interface or hook without controllable selection does not enable sensing or separation and may only add indirection.
  applicable_when:
  - dependency blocks execution or observation
  - nondeterministic or external collaborator
  not_applicable_when:
  - cheap deterministic value dependency
  - existing sufficient injection
  required_evidence:
  - blocking dependency
  - substitute behavior
  - enabling point
  - production/test selection
  insufficient_evidence:
  - interface existence
  - mocking framework
  - generic decoupling goal
  required_inputs:
  - dependency path
  - language/build/runtime seam options
  expected_outputs:
  - seam mechanism
  - enabling point
  - production default
  - tests
  - disposition
  preservation_boundaries:
  - Production binding, lifetime, concurrency, and public API remain unchanged unless authorized.
  safe_actions:
  - constructor/function parameter
  - controlled object seam
  - explicit existing default
  unsafe_actions:
  - ambient global switch
  - hidden test mode
  - public exposure solely for tests
  common_failure_modes:
  - parallel-test leakage
  - permanent indirection
  - test-only production branch
  counterexamples:
  - An already injected owned protocol needs no new seam.
  interactions:
  - legacy-cover-and-modify
  - legacy-provisional-dependency-break
  - legacy-sensing-and-separation
  conflicts:
  - conflict-temporary-seam-vs-long-term-design
  source_support:
