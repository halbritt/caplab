schema_version: agent-doctrine-concepts/1
concepts:
  - id: go-package-api-simplicity
    title: Keep Go packages cohesive and APIs minimally exported
    category: implementation
    claim: Go package boundaries should place behavior with a cohesive responsibility, export only demonstrated cross-package needs, enforce implementation scope where appropriate, and keep dependencies visible.
    decision_rule: Inspect consumers, ownership, change reasons, import topology, initialization, and repository conventions; retain or extend the smallest coherent package, use internal for enforced implementation scope, and add a package, dependency, export, or interface only when it reduces real complexity or supplies required capability.
    why_it_matters: Unnecessary packages and exports create cycles, compatibility burden, pass-through APIs, and framework-style indirection that Go tooling cannot hide.
    applicable_when: [Go package change, public API, new dependency, symbol export, interface proposal]
    not_applicable_when: [generated or vendored Go whose producing workflow is out of scope]
    required_evidence: [package call and import graph, actual consumers, data and invariant ownership, module and dependency policy, compatibility tests]
    insufficient_evidence: [package or file size, clean-architecture preference, aesthetic symmetry, testing convenience alone]
    required_inputs: [feature contract, repository topology, consumer and ownership inventory]
    expected_outputs: [placement export dependency and interface decision with compatibility impact]
    preservation_boundaries: [import paths, initialization order, build tags, public API, module and dependency contract]
    safe_actions: [unexported implementation, internal package, consumer-shaped interface when earned, transparent dependency]
    unsafe_actions: [broad utility package, export for testing convenience, package fragmentation, repackaging beyond task scope]
    common_failure_modes: [package cycle, overfragmentation, accidental public API, dependency opacity, interface mirroring implementation]
    counterexamples: [A public library with an accepted compatibility mission may deliberately expose a broader stable capability.]
    interactions: [Universal placement and abstraction rules govern; this lens adds Go package, export, internal, and module mechanics.]
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Packaging and Modules"
        contribution: Establishes package and module boundaries as primary organization and dependency surfaces.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Internal Packages"
        contribution: Refines implementation scope with Go's enforced internal visibility.
        relationship: refinement
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Dependencies Transparency by Default"
        contribution: Corroborates explicit, inspectable dependency relationships.
        relationship: corroboration
