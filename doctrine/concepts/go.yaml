  - id: "go-consumer-owned-interfaces"
    title: "Place Go interfaces with demonstrated consumers"
    category: "implementation"
    claim: "Define a Go interface at the consumer that needs the behavioral contract; create a producer-side interface only for a known cross-consumer abstraction and keep it minimal."
    decision_rule: "Identify the current consumer and the behavior it needs; define the smallest interface in that consumer's package, and expose a producer-side interface only when multiple current consumers demonstrably share one stable abstraction."
    why_it_matters: "Producer-owned interfaces often encode speculative capability and force consumers to depend on methods they do not need; consumer placement keeps the contract at the point of use."
    applicable_when: ["designing or reviewing a Go package boundary", "introducing a test or substitution seam"]
    not_applicable_when: ["a concrete dependency is local, stable, and no consumer needs substitution"]
    required_evidence: ["current consumer call sets and ownership", "observed substitution, volatility, or cross-boundary pressure", "Go method-set and import-direction compatibility"]
    insufficient_evidence: ["a mock is easier to generate", "a future implementation is merely imaginable"]
