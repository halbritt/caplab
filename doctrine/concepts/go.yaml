  - id: "go-slice-aliasing-control"
    title: "Control Go slice aliasing before append"
    category: "implementation"
    claim: "Treat a subslice as an alias of its backing array; before appending or exposing it, make the intended mutation reach explicit and copy or cap capacity when isolation is required."
    decision_rule: "Before appending to, mutating, returning, or retaining a slice, establish backing-array sharing and intended ownership; copy for isolation or cap capacity when append must not reach spare shared storage."
    why_it_matters: "A subslice can retain and mutate shared backing storage, so an append that looks local can corrupt another view or extend an unintended memory lifetime."
