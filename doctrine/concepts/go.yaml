  - id: go-semantics-before-performance-constructs
    title: Choose Go values, pointers, generics, and interfaces for semantics first
    category: implementation
    claim: Pointer use, generic or interface dispatch, and specialization have workload- and compiler-dependent cost and must be selected first from ownership, mutation, nil, copy, identity, API, and variation semantics.
    decision_rule: Choose value versus pointer from mutation, identity, size, copy, escape, nil, and method-set needs; choose generics, interfaces, or direct code from consumer variation and clarity; profile and benchmark only when the construct is material to an accepted performance target.
    why_it_matters: Folklore such as pointers avoid copies or generics are zero-cost can increase escapes, allocations, alias races, API surface, and maintenance cost.
    applicable_when: [Go receiver and parameter choice, generic or interface proposal, hot-path specialization]
    not_applicable_when: [ordinary type choices with established semantics and no material performance claim]
    required_evidence: [ownership and mutation semantics, API compatibility, escape or build analysis when relevant, causal profile and representative benchmark for speed claims]
    insufficient_evidence: [pointers are faster, generics are free, Go is fast, one compiler version extrapolated indefinitely]
    required_inputs: [semantic contract, consumer variation, current toolchain, performance objective when applicable]
    expected_outputs: [simplest correct construct or measured bounded specialization]
    preservation_boundaries: [aliasing and mutation, nil behavior, interface and method sets, compiler compatibility, public API]
    safe_actions: [value for value semantics, pointer for identity or shared mutation, generic code for real type variation]
    unsafe_actions: [pointer proliferation for presumed speed, generic abstraction before variants, manual inlining without profile]
    common_failure_modes: [extra escape and allocation, alias race, false generic abstraction, benchmark-shaped API]
    counterexamples: [A pointer is required for shared mutation or identity independently of performance.]
    interactions: [Performance specialization activates only after the semantic choice and a proven critical path.]
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Generic Code Will Be Faster?"
        contribution: Rejects automatic performance claims for generics and requires workload measurement.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/009-chapter-5-how-go-uses-memory-resource.md :: Values, Pointers, and Memory Blocks"
        contribution: Refines value and pointer choice with copy, address, and memory behavior.
        relationship: refinement
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/008-chapter-4-how-go-uses-the-cpu-resource-or-two.md :: Manual Inlining Is Rarely Needed"
        contribution: Corroborates reliance on simple code and current compiler behavior before manual specialization.
        relationship: corroboration
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.9 #9: Being confused about when to use generics"
        contribution: "Treats generics as an abstraction to introduce for demonstrated type variation or imminent boilerplate rather than speculative future reuse."
        relationship: "direct_support"
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/010-chapter-6-functions-and-methods.md :: 6.1 #42: Not knowing which type of receiver to use"
        contribution: "Selects value versus pointer receivers from mutation, copyability, size, method-set and interface consistency, and intended value semantics, with performance secondary."
        relationship: "refinement"
