  - id: go-goroutine-resource-lifecycle
    title: Own Go goroutine and resource lifecycles
    category: implementation
    claim: Every goroutine and opened or exhaustible resource needs an owner, stop condition, completion observation, cleanup, and error behavior on success, failure, cancellation, and partial consumption.
    decision_rule: At creation or acquisition, state who cancels or closes, whether and how the caller waits, how errors propagate, what partial consumption requires, and how completion is tested; use defer immediately after successful acquisition when its timing matches the required lifetime.
    why_it_matters: Go makes concurrent work and resource acquisition concise, but orphan goroutines, unread bodies, lost errors, and wrong close ownership cause leaks and deadlocks.
    applicable_when: [goroutine, channel, file, response body, stream, timer, background worker]
    not_applicable_when: [immutable values with no external or concurrent lifecycle]
    required_evidence: [creation-to-completion control flow, owner and transfer, cancellation and error paths, leak race and shutdown tests]
    insufficient_evidence: [happy-path return, finalizer, one empty goroutine profile, assumption receiver closes sender-owned channel]
    required_inputs: [lifecycle graph, failure and cancellation policy, resource API]
    expected_outputs: [explicit lifecycle contract and implementation with cleanup tests]
    preservation_boundaries: [partial results, error and close order, acknowledged work, shutdown and cancellation]
    safe_actions: [stop and wait for owned goroutine, close or exhaust a body as required, defer release at the correct scope]
    unsafe_actions: [launch without cancellation or error observation, close from the wrong owner, leak on early return, defer inside an unbounded loop]
    common_failure_modes: [goroutine leak, file or socket leak, deadlock, lost error, premature close]
    counterexamples: [Process-owned telemetry may be intentionally detached but still requires bounded buffers and shutdown semantics.]
    interactions: ["Generic resource lifecycle applies across languages; this lens makes goroutine, channel, defer, and exhaust mechanics explicit.", "A Go API that starts concurrent work must expose caller responsibility, completion observation, cancellation, and error ownership as part of this lifecycle contract.", "Channel creation, sending, directional capability, and closure belong to one explicit owner within the same lifecycle contract."]
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/015-chapter-11-optimization-patterns.md :: Control the Lifecycle of Your Goroutines"
        contribution: Requires explicit goroutine start, stop, wait, and error ownership.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/015-chapter-11-optimization-patterns.md :: Reliably Close Things"
        contribution: Refines cleanup placement and error-path release for closeable resources.
        relationship: refinement
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/015-chapter-11-optimization-patterns.md :: Exhaust Things"
        contribution: Extends ownership to partially consumed streams and response bodies.
        relationship: refinement
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/013-chapter-9-concurrency-practice.md :: 9.2 #62: Starting a goroutine without knowing when to stop it"
        contribution: "Treats a goroutine as an owned resource whose termination, held resources, and completion wait must be designed at creation rather than inferred after launch."
        relationship: "direct_support"
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/005-chapter-1-an-introduction-to-concurrency.md :: Determining Concurrency Safety"
        contribution: "Uses alternative function signatures to show how callers otherwise cannot tell whether they must add concurrency, whether the callee already creates goroutines, or how completion is observed."
        relationship: "refinement"
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/007-chapter-3-go-s-concurrency-building-blocks.md :: Channels"
        contribution: "Assigns channel creation, writes, and closure to one owner, exposes receive-only access to consumers, and connects unclear or oversized ownership scope to deadlocks and panics."
        relationship: "refinement"
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/008-chapter-4-concurrency-patterns-in-go.md :: Preventing Goroutine Leaks"
        contribution: "Defines completion, unrecoverable error, and explicit cancellation as termination paths and assigns the goroutine creator responsibility for ensuring a child can stop."
        relationship: "direct_support"
