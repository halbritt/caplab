  - id: "go-interface-nil-semantics"
    title: "Keep typed nil out of absent interface results"
    category: "implementation"
    claim: "A Go interface containing a typed nil pointer is non-nil; an API returning an interface must return an explicit nil interface when absence is its contract."
    decision_rule: "When nil denotes absence for an interface result, return a nil interface rather than converting a typed nil pointer; test both interface equality and any subsequent method call at the boundary."
    why_it_matters: "An interface containing a typed nil pointer compares non-nil, so callers can enter error or behavior paths that later panic despite an apparent absence contract."
