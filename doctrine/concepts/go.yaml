  - id: go-explicit-contextual-errors
    title: Keep Go error paths explicit and contextual
    category: implementation
    claim: Go errors are ordinary explicit control flow; every material error must be handled, returned, or deliberately classified while preserving causal inspection, stable context, cleanup, and caller recovery semantics.
    decision_rule: At each error site, identify recovery ownership, add operation context at the boundary that knows it, preserve cause using the current repository and toolchain convention, avoid duplicate logging and propagation, and test important failure and cleanup paths.
    why_it_matters: Discarded or repeatedly transformed errors lose root cause, break errors.Is or errors.As behavior, duplicate reports, and leak resources.
    applicable_when: [all Go code that receives or creates errors]
    not_applicable_when: [an API explicitly documents an ignorable best-effort result and consequence analysis confirms it]
    required_evidence: [callee contract, caller recovery behavior, current Go version and repository convention, cleanup and failure tests]
    insufficient_evidence: [example code omits handling, operation seems unable to fail, dated third-party wrapping advice]
    required_inputs: [operation and failure contract, caller, repository error convention, resource ownership]
    expected_outputs: [handled propagated or classified error with preserved cause and context]
    preservation_boundaries: [errors.Is and errors.As inspection, stable caller decisions, cleanup, retry and logging semantics]
    safe_actions: [return with stable operation context once, combine cleanup errors when durability requires, deliberately document an ignored error]
    unsafe_actions: [drop an error, compare unstable message text, double-log and return without policy, replace current standard handling with dated library advice]
    common_failure_modes: [lost cause, noisy duplicate logs, broken sentinel or typed inspection, leaked resource, misleading success]
    counterexamples: [A best-effort close during shutdown may be secondary, but data-loss or durability consequences still require reporting or combination.]
    interactions: [The language-independent failure policy supplies product semantics; this concept supplies Go's explicit mechanism and current-toolchain check.]
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Never Ignore Errors!"
        contribution: Requires every meaningful error to be handled or deliberately justified.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Single Way of Handling Errors"
        contribution: Establishes errors as explicit ordinary control flow in Go.
        relationship: corroboration
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: How to Wrap Errors?"
        contribution: Supplies historical wrapping guidance retained only behind a current repository and toolchain check.
        relationship: historical_precursor
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/011-chapter-7-error-management.md :: 7.2 #49: Ignoring when to wrap an error"
        contribution: "Separates wrapping for added context or typed marking from transformation that intentionally hides the cause, and exposes wrapping as a caller-coupling decision rather than automatic formatting."
        relationship: "refinement"
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/008-chapter-4-concurrency-patterns-in-go.md :: Error Handling"
        contribution: "Requires a goroutine's error to travel with its result so the parent with recovery context can choose policy instead of the child logging or terminating locally."
        relationship: "refinement"
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/009-chapter-5-concurrency-at-scale.md :: Error Propagation"
        contribution: "Separates the low-level occurrence and location from a stable user-facing message and further diagnostic route, assigning each module one opportunity to add the context it owns."
        relationship: "refinement"
    confidence: strong
    roles: [coding-agent, debugging-and-repair-agent, review-agent]
    languages: [Go]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [Go error, errors Is, errors As, wrap error, ignored error, error context]
