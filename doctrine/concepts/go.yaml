  - id: "go-context-lifecycle-propagation"
    title: "Propagate context only across shared lifetimes"
    category: "implementation"
    claim: "Propagate a Go context only when child work shares the parent's request lifetime; derive cancellation and deadlines explicitly so independent work is not canceled accidentally."
    decision_rule: "Accept context as the first parameter at request-scoped boundaries, propagate it unchanged down the call graph, derive narrower deadlines or cancellation only with an owned cancel function, and never store context in long-lived state."
    why_it_matters: "Replacing, discarding, or indefinitely retaining a context severs deadlines, cancellation, and request-scoped ownership, allowing work to outlive its caller or lose required values."
    applicable_when: ["implementing Go request, RPC, database, or goroutine lifecycles", "reviewing cancellation and deadline propagation"]
    not_applicable_when: ["the operation has no caller-scoped lifetime or cancellation contract"]
    required_evidence: ["context origin and propagation path", "deadline and cancellation ownership", "all derived cancel functions are called"]
    insufficient_evidence: ["a context parameter exists somewhere", "context.Background is convenient"]
    required_inputs: ["call graph and lifecycle owner", "deadline and cancellation requirements"]
    expected_outputs: ["propagation and derivation contract", "verified cancellation path"]
    preservation_boundaries: ["caller deadline and cancellation", "request-scoped value semantics"]
    safe_actions: ["derive and defer cancel at the owning scope", "pass the received context to downstream calls"]
    unsafe_actions: ["replace a caller context with Background", "store context in a struct", "forget a derived cancel function"]
    common_failure_modes: ["orphan work", "lost deadline", "timer and goroutine leaks", "hidden request coupling"]
