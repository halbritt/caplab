  - id: "go-synchronization-mechanism-fit"
    title: "Choose channels or mutexes by coordination semantics"
    category: "implementation"
    claim: "Use a mutex to protect concurrently shared state and channels to coordinate work, signal events, or transfer ownership; choose from required semantics rather than treating either mechanism as a universal default."
    decision_rule: "Use a mutex for tightly scoped shared-state invariants; use channels for coordination, signaling, streaming, or ownership transfer; choose atomics only for a measured narrow state transition whose memory-order semantics are established."
    why_it_matters: "Treating channels or mutexes as a universal default obscures ownership and coordination semantics and can add blocking, goroutine, contention, or lifecycle cost without benefit."
