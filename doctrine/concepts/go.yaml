  - id: go-bounded-concurrency
    title: Earn and bound Go concurrency
    category: performance
    claim: Goroutines and channels add scheduling, coordination, synchronization, and memory cost; introduce a bounded topology only when a parallelizable workload or functional throughput requirement justifies it after sequential simplification.
    decision_rule: Remove unnecessary work and improve the sequential path first, model dependencies and ordering, choose bounded workers or sharding, define cancellation errors closure and wait ownership, then compare sequential and concurrent implementations under representative load and resource limits.
    why_it_matters: Unbounded per-item goroutines and coordination-heavy channels can make the system slower, nondeterministic, leaky, and memory-bound.
    applicable_when: [parallelizable Go work, high-latency I/O, throughput or latency pressure, worker or shard design]
    not_applicable_when: [tiny tasks, sequential dependencies, cold paths, no accepted concurrency driver]
    required_evidence: [objective and baseline, causal profile or functional throughput requirement, task-size distribution, work dependency graph, race leak and macro resource tests]
    insufficient_evidence: [idle cores, goroutine syntax, micro throughput ignoring errors or coordination, GOMAXPROCS folklore]
    required_inputs: [work graph, ordering and error contract, target, resource and deployment limits]
    expected_outputs: [sequential, worker, shard, or other bounded topology with comparison evidence]
    preservation_boundaries: [result ordering, errors and cancellation, delivery semantics, closure ownership, CPU memory and scheduler budgets]
    safe_actions: [bounded worker pool, explicit wait and stop, sharding when coordination dominates, retain sequential fallback]
    unsafe_actions: [goroutine per unbounded item, sender-ownership violation on channel close, shared mutation without synchronization]
    common_failure_modes: [slower path, goroutine leak, race, memory explosion, nondeterministic result, shutdown deadlock]
    counterexamples: [Independent long network waits may justify bounded concurrency from a functional throughput requirement before CPU profiling.]
    interactions: [This Go pattern refines the generic earned-concurrency obligation and depends on goroutine lifecycle ownership.]
    conflicts: [conflict-concurrency-vs-sequential-simplicity]
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/008-chapter-4-how-go-uses-the-cpu-resource-or-two.md :: Adding Concurrency Should Be One of Our Last Deliberate Optimizations to Try"
        contribution: Requires sequential simplification and measured evidence before concurrent optimization.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/014-chapter-10-optimization-examples.md :: A Worker Approach Without Coordination (Sharding)"
        contribution: Refines topology selection by showing when sharding removes costly coordination.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, performance-agent, architecture-agent, review-agent]
    languages: [Go]
    repository_archetypes: [service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [goroutine, Go concurrency, worker pool, sharding, channel, GOMAXPROCS]
    routing:
      activate_for_roles: [coding-agent, performance-agent, architecture-agent, review-agent]
      activate_for_tasks: [add-Go-concurrency, optimize-throughput, review-worker-pool]
      activate_for_repository_signals: [go statement, channel, worker pool, per-item goroutine, scheduler profile]
      activate_for_languages: [Go]
