  - id: "go-channel-capacity-contract"
    title: "Treat channel capacity as a synchronization contract"
    category: "implementation"
    claim: "Choose unbuffered channels when handoff synchronization is part of the contract; buffer only for a demonstrated nonblocking or bounded-capacity need, and justify size because buffering weakens synchronization and can hide deadlocks."
    decision_rule: "Choose unbuffered or buffered channels from the required handoff and backpressure semantics; when buffered, justify a finite capacity from burst, service-rate, memory, and latency evidence and define full-buffer behavior."
    why_it_matters: "Channel capacity changes blocking, scheduling, backpressure, ordering visibility, and memory use; an arbitrary buffer can hide a blocked consumer or create unbounded latency expectations."
    applicable_when: ["creating or changing a Go channel buffer", "reviewing worker pools or pipelines"]
    not_applicable_when: ["the channel capacity is fixed by an external protocol and already evidenced"]
    required_evidence: ["producer and consumer rates or burst bounds", "blocking and latency contract", "memory cost and full-buffer behavior"]
    insufficient_evidence: ["a buffer avoids a current deadlock", "capacity equals an arbitrary round number"]
    required_inputs: ["pipeline topology and rate evidence", "ownership and shutdown behavior"]
    expected_outputs: ["capacity rationale or unbuffered-handshake decision", "saturation behavior and test"]
    preservation_boundaries: ["message order and delivery semantics", "bounded memory and cancellation behavior"]
    safe_actions: ["use unbuffered channels for required rendezvous", "bound buffers and observe saturation"]
    unsafe_actions: ["increase capacity until tests pass", "use buffering to mask missing consumer progress"]
    common_failure_modes: ["hidden deadlock", "latency accumulation", "memory growth", "producer or consumer starvation"]
    conflicts: ["conflict-concurrency-vs-sequential-simplicity"]
    source_support:
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/013-chapter-9-concurrency-practice.md :: 9.7 #67: Being puzzled about channel size"
        contribution: "Separates the synchronization guarantee of unbuffered channels from buffered delivery and limits buffer sizing to known bounded sends or evidence from measurement."
        relationship: "direct_support"
    confidence: "strong"
    roles: ["coding-agent", "architecture-agent", "performance-agent", "review-agent"]
    languages: ["Go"]
    repository_archetypes: ["library", "service", "CLI", "monolith"]
    retrieval_terms: ["Go channel capacity", "buffered channel", "backpressure", "rendezvous"]
    routing:
      activate_for_roles: ["coding-agent", "architecture-agent", "performance-agent", "review-agent"]
      activate_for_tasks: ["add-Go-concurrency", "bound-concurrency", "review-async"]
      activate_for_repository_signals: ["make chan with capacity", "worker queue", "blocked send"]
