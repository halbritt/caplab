- id: data-event-time-semantics
  title: Make event time, lateness, and window closure explicit
  category: architecture
  claim: Define stream computations against explicit event-time or processing-time semantics, including ordering, lateness, window closure, correction, and retained state; do not let processing delay silently change results.
  decision_rule: Choose event time or processing time per result semantics, define timestamp authority, ordering scope, watermark or closure rule, allowed lateness, correction or retraction behavior, retained state, and replay determinism before implementing windows or joins.
  why_it_matters: Network delay, backlog, restart, and reprocessing make arrival time differ from occurrence time; implicit clock choice creates false spikes, missing events, and nondeterministic joins.
  applicable_when:
  - building stream windows, joins, alerts, or temporal aggregates
  - replaying historical events
  - reviewing event timestamps and late-data handling
  not_applicable_when:
  - event order and time do not affect any result or side effect
  required_evidence:
  - business meaning and authority of each timestamp
  - observed delay and out-of-order distribution
  - window, lateness, correction, and state requirements
  insufficient_evidence:
  - broker arrival time assumed to equal occurrence time
  - wall clock without synchronization limits
  - window size without closure semantics
  required_inputs:
  - event schema and timestamp sources
  - delay and ordering model
  - consumer result and correction contract
  expected_outputs:
  - temporal semantics and window policy
  - late-event and correction behavior
  - state bound and replay test
  preservation_boundaries:
  - causal and business-time meaning
  - aggregate correctness
  - bounded state and operational capacity
  safe_actions:
  - record both occurrence and receipt time when needed
  - publish corrections for accepted late events
  - track dropped-late-event metrics
  unsafe_actions:
  - use processing time for historical replay
  - silently discard stragglers
  - claim total order across independent partitions
  common_failure_modes:
  - restart creates false rate spike
  - late event omitted permanently
  - time-dependent join changes on replay
  - unbounded window state
  counterexamples:
  - A stateless transformation that does not inspect time can process events without window or lateness policy.
  interactions:
  - Specializes architecture-event-temporal-semantics for time-aware processing.
  - Performance-metric-semantics governs interpretation of windowed metrics.
