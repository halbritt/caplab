- id: data-schema-evolution-compatibility
  title: Manage schema evolution across mixed versions
  category: architecture
  claim: Use explicit schemas as executable documentation and predeployment compatibility checks; choose evolution rules that support forward and backward checks while minimizing the number of concurrently supported data formats.
  decision_rule: Keep the schema current with the encoded data, define the required forward and backward compatibility checks, validate proposed changes before deployment, and prefer an evolution path that minimizes the number of formats that must coexist.
  why_it_matters: An explicit schema can expose incompatible evolution before deployment and serve as executable documentation, while proliferating data formats increases reader and migration complexity.
  applicable_when:
  - selecting or evolving a schema-based persisted, event, wire, or file format
  - configuring predeployment compatibility checks
  not_applicable_when:
  - the representation has no explicit schema and no schema adoption or evolution decision is in scope
  required_evidence:
  - current explicit schema and encoded-data contract
  - required forward and backward compatibility directions
  - predeployment compatibility-check result
  - number of formats that must coexist
  insufficient_evidence:
  - new code can read its own output
  - prose documentation that is not checked against encoded data
  - compatibility asserted only after deployment
  required_inputs:
  - current and proposed schemas
  - compatibility direction required by the dataflow
  - format-lifetime and migration constraints
  expected_outputs:
  - current executable schema
  - forward and backward compatibility result
  - evolution plan minimizing concurrent formats
  preservation_boundaries:
  - documented field meaning and encoded-data validity
  - accepted forward and backward compatibility direction
  - deployed data remains within the checked evolution contract
  safe_actions:
  - validate a proposed schema before deployment
  - keep schema documentation generated from the actual contract
  - choose an encoding with explicit evolution checks
  unsafe_actions:
  - treat prose as an executable schema
  - deploy an unchecked incompatible change
  - proliferate formats without a supported-reader plan
  common_failure_modes:
  - schema documentation drifts from data
  - incompatibility discovered after deployment
  - too many concurrent formats
  - schema evolution assumed rather than checked
  counterexamples:
  - A private ephemeral in-memory structure can change atomically with its code and needs no persisted-format compatibility check.
  interactions:
  - Refines refactoring-compatibility-migration for explicit encoded schemas without claiming the mixed-version or unknown-field behavior of uncited sections.
  - Operations-live-interface-compatibility remains the broader live behavior contract.
  conflicts: []
  source_support:
