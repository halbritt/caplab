- id: data-fencing-token-enforcement
  title: Enforce distributed leases with fencing tokens
  category: architecture
  claim: A distributed lease or lock is safe only when the protected resource rejects stale holders using monotonically increasing fencing tokens; client-side lease belief alone cannot prevent delayed or paused actors from writing.
  decision_rule: Issue a monotonically increasing token with each lock or lease grant and require the protected resource to reject any operation carrying a token older than the greatest accepted token; do not rely on the client's local lease clock or liveness belief.
  why_it_matters: A paused or delayed process can resume after its lease expires and still write, so mutual exclusion at the coordinator does not protect a resource that cannot recognize stale holders.
  applicable_when:
  - using distributed locks or leases to protect writes or exclusive work
  - reviewing failover of a lease-holding worker
  not_applicable_when:
  - the operation is purely local under one process lock
  - the protected operation is naturally commutative and stale execution is harmless
  required_evidence:
  - lease grant and renewal semantics
  - monotonic token source
  - resource-side comparison and rejection behavior
  - process pause and delayed-message failure tests
  insufficient_evidence:
  - lease timeout alone
  - coordinator reports one owner
  - client checks its own clock before writing
  required_inputs:
  - protected resource and mutation path
  - lease protocol
  - token persistence and comparison boundary
  expected_outputs:
  - fenced lease contract
  - resource-side stale-token rejection
  - pause and failover verification
  preservation_boundaries:
  - resource integrity under pause and failover
  - monotonic token ordering
  - existing availability requirements
  safe_actions:
  - pass the token with every protected write
  - persist the highest accepted token at the resource
  - inject pauses beyond lease expiry
  unsafe_actions:
  - accept a write because the client believes its lease is valid
  - fence only at the lock service
  - reuse or reset token sequences without an epoch
  common_failure_modes:
  - zombie writer
  - split-brain mutation
  - lease expires during process pause
  - resource ignores stale token
  counterexamples:
  - A best-effort duplicate cleanup task that is idempotent and cannot corrupt shared state may not need a distributed lease at all.
  interactions:
  - Specializes operations-designed-failure-modes for lease-protected resources.
  - Architecture-event-temporal-semantics governs duplicate and delayed work more broadly.
  conflicts: []
  source_support:
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/013-chapter-9-the-trouble-with-distributed-systems.md :: Distributed Locks and Leases'
    contribution: Demonstrates that a process can pause past lease expiry and later issue a stale write, and requires the storage service to reject that write by comparing monotonically increasing fencing tokens.
