    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/018-chapter-14-doing-the-right-thing.md :: Legislation and Self-Regulation'
    contribution: Calls for collecting personal data only for specified necessary purposes and purging it once no longer needed, emphasizing that data not held cannot be leaked, stolen, or compelled for disclosure.
