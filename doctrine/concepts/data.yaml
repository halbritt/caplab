- id: data-index-workload-tradeoff
  title: Earn indexes from demonstrated query workloads
  category: performance
  claim: Create and retain an index only for demonstrated access paths whose read benefit exceeds its storage, write-amplification, maintenance, and consistency costs.
  decision_rule: Map candidate indexes to observed query predicates and ordering, measure read improvement and write or storage cost under a representative workload, and retain only indexes whose end-to-end benefit exceeds maintenance and consistency cost.
  why_it_matters: Every index accelerates selected reads by maintaining additional derived state, which consumes storage, increases writes, and can lengthen compaction, recovery, or update paths.
  applicable_when:
  - adding, changing, or removing database, search, or secondary indexes
  - diagnosing read latency or write amplification
  not_applicable_when:
  - the structure is primary authoritative storage rather than an auxiliary access path
  required_evidence:
  - query frequency and latency distribution
  - write rate, storage, compaction, and maintenance overhead
  - query plan or profile showing the access path
  insufficient_evidence:
  - an index recommendation without the target query
  - read benchmark that excludes writes
  - unused-index age alone
  required_inputs:
  - representative read and write workload
  - current plans and index inventory
  - resource and freshness limits
  expected_outputs:
  - index keep, add, alter, or remove decision
  - measured benefit and cost
  - monitoring and reversal plan
  preservation_boundaries:
  - query correctness and ordering
  - write durability and latency commitments
  - storage and recovery headroom
  safe_actions:
  - measure plans before and after
  - build an index online when required
  - remove an unused index through a reversible observation period
  unsafe_actions:
  - index every field
  - judge an index from one query in isolation
  - ignore write amplification or storage growth
  common_failure_modes:
  - write path degraded by speculative indexes
  - index not used by real queries
  - rebuild exceeds recovery budget
  - stale derived index
  counterexamples:
  - A mandatory uniqueness constraint may justify an index for correctness even when read acceleration is not the primary benefit.
  interactions:
  - Treats indexes as a specialized form of data-system-of-record-derived-state.
  - Performance-benchmark-validity governs before-and-after evidence.
  conflicts:
  - conflict-caching-vs-recomputation-freshness
  source_support:
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/008-chapter-4-storage-and-retrieval.md :: Storage and Indexing for OLTP'
    contribution: Establishes indexes as auxiliary structures that accelerate particular queries while consuming space and adding write overhead, so index selection must follow application query patterns.
    relationship: direct_support
