- id: data-end-to-end-request-idempotence
  title: Suppress duplicate effects end to end
  category: architecture
  claim: Carry a client-generated operation identity through every hop and enforce its uniqueness at the durable effect boundary so retries after unknown outcomes cannot apply one intent more than once.
  decision_rule: Generate an operation identifier at the intent origin, preserve it through every retry and hop, atomically record or constrain it at the durable effect boundary, and return the prior outcome for duplicates without repeating external effects.
  why_it_matters: Transport, broker, or transaction duplicate suppression ends at its own boundary; a timeout can cause a human or upstream service to retry the same intent as a new request.
  applicable_when:
  - processing commands that may be retried after an unknown outcome
  - charging, transferring, provisioning, sending, or incrementing through several hops
  - reviewing exactly-once claims
  not_applicable_when:
  - the operation is naturally idempotent and duplicate execution has no distinct observable effect
  required_evidence:
  - identity generation and propagation path
  - atomic deduplication or uniqueness enforcement
  - retention period and collision semantics
  - external-effect and retry behavior
  insufficient_evidence:
  - TCP retries
  - broker exactly-once setting
  - random request ID regenerated on each attempt
  - check-then-insert outside a transaction
  required_inputs:
  - end-user or upstream intent boundary
  - durable effect and transaction boundary
  - retry and timeout paths
  expected_outputs:
  - end-to-end idempotency contract
  - deduplication record or constraint
  - duplicate-response and retention policy
  preservation_boundaries:
  - one accepted intent produces one durable effect
  - request identity remains stable
  - privacy and retention constraints on deduplication metadata
  safe_actions:
  - generate the key before the first network call
  - enforce uniqueness atomically
  - reuse the stored outcome for duplicates
  unsafe_actions:
  - generate a new key on retry
  - deduplicate only in memory
  - claim exactly once from one transport layer
  common_failure_modes:
  - double charge
  - duplicate message side effect
  - dedupe record expires before retry window
  - identity lost across a service hop
  counterexamples:
  - Setting an absolute desired state such as enabled=true may already be idempotent, though its authorization and ordering still matter.
  interactions:
  - Refines architecture-event-temporal-semantics and implementation-explicit-failure-policy.
  - Supports data-single-authority-change-propagation consumers.
