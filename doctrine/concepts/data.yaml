- id: data-consistency-model-selection
  title: Select consistency properties by the guarantee actually needed
  category: architecture
  claim: 'Name and select consistency properties independently: linearizability governs the real-time behavior of operations on a replicated object, while serializability governs transaction equivalence to a serial execution.'
  decision_rule: State the user-visible anomaly to prevent, distinguish real-time single-object recency from transaction serial ordering, and choose the weakest explicit property that preserves the accepted invariant and interaction within availability and latency authority.
  why_it_matters: Treating linearizability, serializability, and generic consistency as synonyms hides different guarantees and can pay coordination cost without preventing the anomaly that matters.
  applicable_when:
  - selecting read, write, or transaction consistency
  - reviewing replicated-state semantics
  - diagnosing stale or contradictory observations
  not_applicable_when:
  - the operation has no cross-observation or transaction ordering requirement
  required_evidence:
  - application scenario and forbidden observations
  - datastore consistency and isolation guarantees
  - latency and availability consequences under partition or failure
  insufficient_evidence:
  - strong consistency as an adjective
  - serializable transaction assumed linearizable
  - CAP slogan without a concrete operation
  required_inputs:
  - interaction and invariant scenarios
  - replication and transaction model
  - availability and latency objectives
  expected_outputs:
  - named consistency and isolation requirements
  - allowed anomaly and failure behavior
  - verification scenario
  preservation_boundaries:
  - application invariants and user-visible ordering
  - authorized availability and latency
  - durability
  safe_actions:
  - specify read-after-write when that is the actual need
  - test the forbidden history
  - use coordination only for the scoped operation that requires it
  unsafe_actions:
  - infer linearizability from serializability
  - infer serializability from linearizable reads
  - select consistency from a product label
  common_failure_modes:
  - wrong anomaly prevented
  - unnecessary global coordination
  - stale read breaks a user workflow
  - transaction order confused with wall-clock order
  counterexamples:
  - An eventually updated analytics dashboard may explicitly tolerate stale values while preserving aggregate integrity.
  interactions:
  - Complements data-transaction-guarantee-verification.
  - Uses architecture-scoped-characteristics to scope the property to a flow.
  conflicts:
  - conflict-synchronous-vs-asynchronous-interaction
