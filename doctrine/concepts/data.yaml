- id: data-transaction-guarantee-verification
  title: Verify transaction guarantees rather than trusting labels
  category: architecture
  claim: 'Treat transaction and ACID labels as claims to verify: identify the actual atomicity, isolation, durability, failure, and scope guarantees a datastore provides before relying on them for correctness.'
  decision_rule: Translate product labels into tested guarantees for atomicity, isolation anomalies, durability, retry, and scope; map each application invariant to the property and boundary it actually needs before selecting a transaction mode.
  why_it_matters: ACID and isolation names are used inconsistently, so code can appear safe under nominal behavior while losing updates, exposing partial effects, or losing acknowledged data under concurrency and faults.
  applicable_when:
  - relying on database transactions for correctness
  - selecting an isolation level
  - reviewing retry or distributed transaction behavior
  not_applicable_when:
  - the operation is read-only and no consistency or transaction property is relied upon
  required_evidence:
  - vendor or protocol guarantee for the exact configuration
  - application invariants and anomaly analysis
  - concurrency and fault tests at the relied-upon boundary
  insufficient_evidence:
  - ACID-compliant marketing
  - default isolation name alone
  - tests without concurrent or failure cases
  required_inputs:
  - transaction scope and operations
  - application invariants
  - datastore configuration and failure model
  expected_outputs:
  - guarantee matrix and selected transaction mode
  - mapped invariants and residual anomalies
  - retry and unknown-outcome policy
  preservation_boundaries:
  - application invariants
  - acknowledged durability
  - external side-effect semantics
  safe_actions:
  - verify the exact isolation and durability configuration
  - use a stronger guarantee for a demonstrated anomaly
  - bound retries and deduplicate effects
  unsafe_actions:
  - assume snapshot isolation is serializable
  - treat consistency as a database-defined invariant
  - retry an unknown non-idempotent outcome blindly
  common_failure_modes:
  - lost update
  - write skew
  - partial multi-object effect
  - acknowledged data loss
  - duplicate external effect
  counterexamples:
  - An append-only diagnostic log may tolerate duplicate records and need no multi-object transaction.
  interactions:
  - Operationalizes universal-explicit-invariants at a datastore boundary.
  - Data-consistency-model-selection separates transaction ordering from real-time recency.
  conflicts: []
