- id: data-single-authority-change-propagation
  title: Synchronize derived systems from one change authority
  category: architecture
  claim: Propagate changes to derived systems from one ordering authority rather than independent dual writes; make downstream lag, replay, schema, and recovery semantics explicit.
  decision_rule: Commit each fact first through one ordering authority, derive downstream changes from its durable change stream, and specify bootstrap snapshot, offset, schema, lag, replay, idempotence, and recovery behavior; reject independent dual writes for the same fact.
  why_it_matters: Independent writes to a database and an index or cache can succeed in different orders or only partly, creating permanent divergence even when neither system reports an error.
  applicable_when:
  - synchronizing a database with caches, indexes, warehouses, or other stores
  - introducing change data capture or an outbox
  - reviewing dual writes
  not_applicable_when:
  - the downstream system owns a separate fact rather than a derived representation
  required_evidence:
  - single commit and ordering authority
  - change-stream ordering and durability
  - snapshot and offset bootstrap procedure
  - consumer idempotence, lag, schema, and recovery semantics
  insufficient_evidence:
  - writes usually arrive in order
  - retry both writes
  - message broker exists without a source ordering contract
  required_inputs:
  - authority and mutation map
  - downstream consumers
  - schema, freshness, and rebuild requirements
  expected_outputs:
  - change-propagation topology
  - bootstrap and replay procedure
  - lag and recovery ownership
  preservation_boundaries:
  - source-system transaction semantics
  - derived-state integrity
  - schema compatibility and deletion propagation
  safe_actions:
  - capture committed changes
  - pair a consistent snapshot with a known log offset
  - make consumers idempotent and monitor lag
  unsafe_actions:
  - write the same fact independently to two systems
  - start CDC without a consistent bootstrap
  - expose internal schemas as stable events without a compatibility decision
  common_failure_modes:
  - dual-write race
  - partial cross-system update
  - snapshot-log gap
  - consumer schema break
  - unbounded lag
  counterexamples:
  - An audit service may author its own observation that references a transaction without being a derived copy of the transaction record.
  interactions:
  - Operationalizes data-system-of-record-derived-state for continuous propagation.
  - Requires data-schema-evolution-compatibility and architecture-event-temporal-semantics.
  conflicts:
  - conflict-synchronous-vs-asynchronous-interaction
  - conflict-caching-vs-recomputation-freshness
