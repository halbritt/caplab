- id: data-end-to-end-integrity-auditing
  title: Audit data integrity across the whole derivation path
  category: architecture
  claim: Design dataflows so durable inputs, derivation code, provenance, and outputs can be checked end to end and replayed or independently recomputed to detect corruption that component guarantees cannot exclude.
  decision_rule: Preserve input identity, transformation code and parameters, provenance, and output checks; periodically recompute, reconcile, or independently verify derived state across the full path and assign detection, repair, and escalation ownership.
  why_it_matters: Component checksums and transaction guarantees cannot detect every application, storage, network, or derivation bug, so silent corruption remains invisible unless the resulting dataflow is checked end to end.
  applicable_when:
  - operating durable derived-data pipelines
  - handling high-consequence financial, identity, or compliance data
  - reviewing backup, replay, or reconciliation claims
  not_applicable_when:
  - the data is disposable and corruption has no accepted consequence
  required_evidence:
  - source and transformation identity
  - end-to-end invariant or checksum
  - audit frequency and coverage
  - repair path and owner
  insufficient_evidence:
  - component health checks
  - backup exists without restore proof
  - transaction committed
  - logs exist without a reproducible derivation
  required_inputs:
  - dataflow and provenance map
  - integrity invariants
  - source, code, and output identities
  expected_outputs:
  - auditable provenance chain
  - scheduled integrity check and discrepancy signal
  - repair and root-cause workflow
  preservation_boundaries:
  - authoritative evidence remains immutable
  - audit access respects privacy and security
  - repair does not erase the discrepancy record
  safe_actions:
  - restore and compare backups
  - recompute a derived view independently
  - hash immutable inputs and bind code versions
  unsafe_actions:
  - trust a checksum that covers only one hop
  - repair corruption without preserving evidence
  - claim auditability from mutable logs alone
  common_failure_modes:
  - silent data corruption
  - broken backup discovered during disaster
  - untraceable derivation
  - audit log diverges from state
  counterexamples:
  - A disposable local build cache can be deleted on suspicion rather than continuously audited.
  interactions:
  - Extends operations-transparency-by-design from service state to durable data provenance.
  - Uses data-batch-reproducible-derivation and data-system-of-record-derived-state for repair.
