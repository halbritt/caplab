- id: data-partition-key-workload-fit
  title: Fit partition keys to load distribution and locality
  category: performance
  claim: Choose partition keys against observed key distribution, request rates, access locality, and change over time; detect and mitigate hot keys without concealing routing or query costs.
  decision_rule: Measure key cardinality, frequency distribution, temporal concentration, access locality, and query routing; select and test a key that spreads the relevant load while preserving required locality, then define hotspot detection and mitigation.
  why_it_matters: A nominally even partitioning algorithm still overloads one shard when the workload concentrates on a hot key, and salting that key can trade write relief for read fan-out and bookkeeping.
  applicable_when:
  - choosing or changing a shard or stream partition key
  - diagnosing hot partitions
  - designing tenant placement
  not_applicable_when:
  - the data and work are not partitioned
  required_evidence:
  - key-frequency and size distribution over representative intervals
  - query and update locality requirements
  - routing, fan-out, and rebalancing behavior
  insufficient_evidence:
  - uniform hash function without workload distribution
  - average shard size
  - one static sample that omits bursts
  required_inputs:
  - candidate keys
  - representative load and access distribution
  - locality and routing requirements
  expected_outputs:
  - partition-key decision and expected distribution
  - hotspot telemetry and threshold
  - mitigation and migration path
  preservation_boundaries:
  - co-located invariants and required ordering
  - query completeness
  - tenant isolation and compliance constraints
  safe_actions:
  - replay representative keys through a distribution model
  - special-case a measured hot key with explicit read cost
  - monitor per-partition load
  unsafe_actions:
  - assume hashing removes skew
  - salt keys without accounting for read fan-out
  - partition by a low-cardinality or unbounded-hot field
  common_failure_modes:
  - celebrity hot key
  - large tenant overwhelms one shard
  - read fan-out hidden by write distribution
  - partition migration without routing compatibility
  counterexamples:
  - A monotonically increasing key can be acceptable when the storage engine deliberately range-splits and the measured write path remains balanced.
  interactions:
  - Refines architecture-contextual-partitioning with workload evidence.
  - Supplies a required input to data-sharding-evidence-gate.
  conflicts:
  - conflict-domain-vs-technical-partition
  source_support:
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/011-chapter-7-sharding.md :: Skewed Workloads and Relieving Hot Spots'
    contribution: Shows how skewed keys and celebrity-like hot spots defeat otherwise even sharding and compares mitigations that spread load while adding bookkeeping and read fan-out.
