- id: data-replication-guarantee-selection
  title: Select replication guarantees from failure consequences
  category: architecture
  claim: Choose replication synchrony from explicit durability, latency, availability, and recovery requirements; acknowledge which writes may be lost or blocked under each failure mode.
  decision_rule: For each failure scenario, state when a write is acknowledged, which replicas may lag, what failover can lose or block, and the maximum acceptable recovery point; select synchrony and quorum behavior that meets those consequences within latency and availability authority.
  why_it_matters: 'Replication does not itself guarantee durability or availability: synchronous acknowledgment can block, while asynchronous acknowledgment can lose writes after failover.'
  applicable_when:
  - selecting or configuring database replication
  - reviewing failover, durability, or multi-region behavior
  - diagnosing acknowledged-write loss or stale reads
  not_applicable_when:
  - the datastore is nonreplicated and no replication change is proposed
  required_evidence:
  - acknowledgment and replication topology
  - failure and failover behavior
  - durability, latency, availability, and recovery objectives
  insufficient_evidence:
  - replication factor alone
  - marketing claim of high availability
  - healthy-cluster benchmarks
  required_inputs:
  - write criticality and recovery point objective
  - network and region topology
  - failure scenarios and latency budget
  expected_outputs:
  - replication mode and acknowledged loss/blocking semantics
  - failover and recovery plan
  - tests and telemetry for lag and durability
  preservation_boundaries:
  - acknowledged durability contract
  - required write availability
  - data ordering and integrity
  safe_actions:
  - document whether acknowledged writes may be lost
  - measure replication lag
  - test failover with representative writes
  unsafe_actions:
  - equate replicas with backups
  - claim zero data loss with asynchronous acknowledgment
  - switch leaders without fencing or divergence analysis
  common_failure_modes:
  - acknowledged write lost on failover
  - synchronous follower blocks all writes
  - stale replica treated as current
  - recovery objective unspecified
  counterexamples:
  - A disposable metrics stream may explicitly accept occasional loss and choose asynchronous replication for throughput.
  interactions:
  - Builds on architecture-scoped-characteristics and operations-designed-failure-modes.
  - Data-consistency-model-selection governs read semantics separately.
  conflicts:
  - conflict-efficiency-vs-resilience-margin
  source_support:
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/010-chapter-6-replication.md :: Synchronous Versus Asynchronous Replication'
    contribution: Contrasts synchronous and asynchronous follower acknowledgment by write latency, availability during follower failure, and the possibility of losing acknowledged writes during failover.
    relationship: direct_support
