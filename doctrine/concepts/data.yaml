schema_version: agent-doctrine-concepts/1
concepts:
- id: data-system-of-record-derived-state
  title: Separate authoritative records from managed derived state
  category: architecture
  claim: Designate authoritative systems of record explicitly; caches, indexes, denormalized representations, analytics, and other regenerable representations are derived state whose read benefit must exceed their write, consistency, rebuild, and deletion costs.
  decision_rule: For each replicated or denormalized representation of a fact, identify the sole accepted write authority, the read benefit that earns the copy, the derivation and freshness contract, and the rebuild or reconciliation path; permit another write authority only when it owns a genuinely different fact.
  why_it_matters: When authoritative and derived representations are not distinguished, direct writes create competing truths; when denormalized copies are not costed, read convenience silently becomes write amplification, inconsistency, and unrecoverable drift.
  applicable_when:
  - introducing a cache, search index, denormalized field, materialized view, warehouse feed, projection, or replicated read model
  - reviewing data ownership, read optimization, or recovery across several stores
  not_applicable_when:
  - independent stores own different facts and no representation is intended to derive from another
  required_evidence:
  - complete mutation-path and data-authority inventory
  - measured read benefit plus write, storage, freshness, and consistency costs
  - derivation, rebuild, reconciliation, and consumer behavior during lag
  insufficient_evidence:
  - calling one database the source of truth without tracing writes
  - duplicating a fact because joins are inconvenient without measuring the read path
  - assuming a cache, index, or denormalized copy can be rebuilt without exercising the path
  required_inputs:
  - dataflow and mutation map
  - recovery and freshness requirements
  - deletion and retention obligations
  expected_outputs:
  - system-of-record and managed-derived-state map
  - read-benefit and write-consistency tradeoff
  - rebuild, reconciliation, lag, and failure contract
  preservation_boundaries:
  - authoritative history and domain invariants
  - consumer-visible consistency commitments
  - privacy deletion and retention obligations
  safe_actions:
  - route writes through the identified authority
  - derive and rebuild a read-optimized copy from preserved input
  - measure the copy's read benefit and verify replay or reconciliation
  unsafe_actions:
  - write the same fact independently to multiple systems
  - let callers update authoritative and denormalized values independently
  - call an unrebuildable copy a cache
  common_failure_modes:
  - dual-write divergence
  - unrebuildable derived state
  - denormalized values drift
  - write amplification without measured read benefit
  - hidden second authority
  counterexamples:
  - Two bounded contexts may each author different meanings of a similarly named field; neither is automatically derived or denormalized from the other.
  interactions:
  - Provides the authority and cost distinction used by data-single-authority-change-propagation and data-index-workload-tradeoff.
  - Performance-cache-validity governs the narrower cache tradeoff.
  conflicts:
  - conflict-caching-vs-recomputation-freshness
  source_support:
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/005-chapter-1-trade-offs-in-data-systems-architecture.md :: Systems of Record and Derived Data'
    contribution: Defines a system of record as the authoritative version of data and distinguishes indexes, caches, and materialized views as derived datasets that can be discarded and rebuilt from that authority.
    relationship: direct_support
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/007-chapter-3-data-models-and-query-languages.md :: Normalization, Denormalization, and Joins'
    contribution: Frames normalization as storing a fact in one authoritative place and denormalization as deliberate duplication that can improve reads while increasing write work and consistency risk.
    relationship: refinement
  confidence: strong
