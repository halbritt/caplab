- id: data-batch-reproducible-derivation
  title: Make batch derivations reproducible and replaceable
  category: architecture
  claim: Build batch derivations from immutable inputs with deterministic, side-effect-bounded transformations and versioned outputs so failures, bugs, and changed logic can be recovered by rerunning rather than repairing hidden mutations.
  decision_rule: Keep source inputs immutable, make transformation code and configuration versioned and deterministic, isolate external side effects from retryable computation, publish outputs atomically or by version, and prove that a prior or corrected result can be regenerated.
  why_it_matters: Reproducible derivation converts code and task failures into reruns or output swaps instead of irreversible mutation and makes debugging, comparison, and recovery inspectable.
  applicable_when:
  - building ETL, analytics, model-training, reconciliation, or bulk transformation jobs
  - reviewing retry and rollback of batch work
  not_applicable_when:
  - the operation is an interactive transaction whose purpose is to mutate authoritative state directly
  required_evidence:
  - immutable or versioned input identity
  - code and configuration identity
  - side-effect and output-publication behavior
  - successful replay or rebuild check
  insufficient_evidence:
  - job can be rerun without checking duplicate side effects
  - input path without content identity
  - overwrite-in-place output called reproducible
  required_inputs:
  - input dataset and identity
  - transformation code and parameters
  - output and consumer activation contract
  expected_outputs:
  - versioned derived dataset
  - replay and rollback procedure
  - validation comparison
  preservation_boundaries:
  - authoritative inputs
  - code block and numeric semantics
  - consumer visibility remains atomic or explicitly partial
  safe_actions:
  - write a new output version
  - compare corrected output before activation
  - buffer external publication after computation succeeds
  unsafe_actions:
  - write one record at a time into a production system from retryable tasks
  - mutate input data
  - overwrite the only known-good output
  common_failure_modes:
  - partial output becomes visible
  - rerun duplicates side effects
  - input drift prevents reproduction
  - rollback code leaves corrupted data
  counterexamples:
  - A one-off destructive legal deletion is intentionally not replayable and needs a different verified procedure.
  interactions:
  - Applies data-system-of-record-derived-state to offline computation.
  - Supports universal-reversible-reviewable-change through versioned outputs.
  conflicts: []
  source_support:
