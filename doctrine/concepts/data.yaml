- id: data-minimization-lifecycle
  title: Minimize sensitive data across its lifecycle
  category: architecture
  claim: Collect personal or sensitive data only for specified necessary purposes, retain it only while needed, and purge it when the purpose ends so unavailable data cannot be leaked, stolen, or compelled.
  decision_rule: For each personal or sensitive field, record the specified purpose and necessity, choose the least collection that serves it, set a retention limit and purge trigger, and decline collection or continued retention when the evidenced benefit does not exceed exposure.
  why_it_matters: Every retained sensitive datum creates breach, misuse, and compelled-disclosure exposure; data that was never collected or has been purged cannot create those risks.
  applicable_when:
  - collecting or retaining personal, behavioral, identity, location, health, or other sensitive data
  - setting retention for analytics, logs, events, or product features
  not_applicable_when:
  - the data is demonstrably non-personal, non-sensitive, and carries no retention or disclosure consequence
  required_evidence:
  - specified explicit purpose for each field
  - necessity and proportionality of collection
  - retention limit and purge trigger
  - authority for any required retention
  insufficient_evidence:
  - data may be useful later
  - storage is cheap
  - a broad privacy policy permits collection
  - retention by default
  required_inputs:
  - data classification and specified purpose
  - product, legal, security, and human-impact authority
  - retention requirement
  expected_outputs:
  - minimized field set
  - retention limit and purge procedure
  - documented exception for required records
  preservation_boundaries:
  - human dignity, agency, consent, and applicable rights
  - records whose retention is explicitly required
  - evidence of the collection and purge decision
  safe_actions:
  - collect the least precise data that serves the specified purpose
  - expire data automatically when no longer needed
  - decline speculative collection
  unsafe_actions:
  - collect for unspecified future insight
  - retain forever by default
  - treat possible future value as necessity
  common_failure_modes:
  - purpose creep
  - indefinite retention
  - unnecessary breach exposure
  - sensitive collection without a specified use
  counterexamples:
  - A legally required financial record may need a fixed retention period; the authority and scope must be explicit rather than silently overridden.
  interactions:
  - Specializes operations-bounded-accumulation for personal and sensitive data.
  - Data-end-to-end-integrity-auditing must preserve integrity without expanding sensitive collection beyond its purpose.
  conflicts: []
  source_support:
