- id: data-sharding-evidence-gate
  title: Earn sharding from demonstrated capacity pressure
  category: architecture
  claim: Adopt sharding only when demonstrated data volume or write throughput exceeds a simpler topology and the system can absorb cross-shard queries, transactions, indexes, rebalancing, and routing complexity.
  decision_rule: Demonstrate that one node cannot satisfy current or authorized near-term data or write capacity, compare vertical and simpler partitioning alternatives, and shard only with explicit plans for keys, cross-shard operations, indexes, rebalancing, routing, recovery, and reversal.
  why_it_matters: Sharding can extend storage and write capacity but turns local queries, transactions, indexes, and operations into distributed coordination problems.
  applicable_when:
  - proposing database or workload sharding
  - reviewing a partitioned datastore or capacity limit
  - planning a shard migration
  not_applicable_when:
  - a single node or simpler read replication meets the evidenced workload
  required_evidence:
  - single-node capacity baseline and limiting resource
  - current and authorized projected load
  - cross-shard query, transaction, and index inventory
  - operational capability for rebalancing and recovery
  insufficient_evidence:
  - large table by itself
  - future scale
  - microservices imply separate shards
  - vendor supports partitioning
  required_inputs:
  - load model
  - data and transaction topology
  - partition-key candidates
  - migration and rollback plan
  expected_outputs:
  - no-shard decision, bounded trial, or sharding design
  - cross-shard semantics and owners
  - rebalancing and hotspot plan
  preservation_boundaries:
  - domain invariants and transaction semantics
  - availability and recovery objectives
  - query behavior and compatibility
  safe_actions:
  - measure the actual single-node ceiling
  - shard one demonstrated hotspot behind a stable contract
  - retain a merge-back or migration path
  unsafe_actions:
  - shard before naming the capacity limit
  - hide cross-shard transactions
  - assume even distribution from hash partitioning alone
  common_failure_modes:
  - premature sharding
  - cross-shard query explosion
  - unowned rebalance
  - hot partition
  - distributed transaction discovered late
  counterexamples:
  - A dataset larger than memory does not require sharding when it fits durable storage and the workload meets its objectives on one node.
  interactions:
  - Specializes architecture-distribution-readiness for data placement.
  - Requires performance-measurable-objective and data-partition-key-workload-fit.
  conflicts:
  - conflict-monolith-vs-distributed-services
  source_support:
  - source_id: SRC-DDIA2
    locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/011-chapter-7-sharding.md :: Pros and Cons of Sharding'
    contribution: States that sharding is primarily needed when one node cannot hold the data or sustain the write rate and enumerates the query, transaction, index, and operational complexity it introduces.
    relationship: direct_support
