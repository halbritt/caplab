  - id: testing-assert-observable-outcomes
    title: Assert the end result, not implementation steps
    category: implementation
    claim: Tests must verify the end result the system under test delivers to its client - its externally observable behavior - because assertions coupled to implementation steps, structure, or algorithms produce false positives that erode trust in the suite and deter refactoring.
    decision_rule: Verify the end result from the client's point of view, treating the system under test as a black box; treat any assertion that would fail under a behavior-preserving restructuring as a false-positive source, and weigh suite accuracy as signal over noise whose noise term grows as the codebase ages and refactoring becomes necessary.
    why_it_matters: False positives start as a minor nuisance but become as damaging as missed bugs once refactoring is needed, because developers stop trusting and then stop running the suite.
    applicable_when: [writing assertions, reviewing tests for brittleness, diagnosing tests that fail on refactoring, assessing suite accuracy]
    not_applicable_when: [explicit characterization tests that pin current behavior as a preservation gate without claiming correctness]
    required_evidence: [the client-visible outcome the test should verify, which asserted facts are implementation details, false-positive history of the suite]
    insufficient_evidence: [assertions passing against the current implementation, mock verification of internal calls, structural snapshots without a semantic oracle]
    required_inputs: [client-facing contract of the system under test, tests and their assertion targets]
    expected_outputs: [assertions rewritten against observable outcomes, named false-positive sources, suite accuracy assessment as signal over noise]
    preservation_boundaries: [tests do not redefine the contract while being decoupled from internals, regression protection is retained when brittle assertions are replaced]
    safe_actions: [assert on returned values state visible to clients or communications that cross the system boundary, remove assertions on sub-structure and internal call order, track false alarms as suite noise]
    unsafe_actions: [assert internal structure or algorithm steps for business logic, compare against implementation-derived expected text such as generated SQL, tolerate recurring false alarms as normal]
    common_failure_modes: [tests that fail on every refactor and get deleted in bulk, disabled tests accumulating because nobody trusts failures, snapshot assertions pinning incidental structure]
    counterexamples: [Characterization tests deliberately pin current sometimes implementation-adjacent observations as a preservation gate without asserting correctness; they differ in purpose from a long-lived specification suite.]
