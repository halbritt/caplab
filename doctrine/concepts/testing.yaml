  - id: testing-database-delivery-prerequisites
    title: Put the schema and migrations in source control before testing the database
    category: implementation
    claim: Database integration testing presupposes delivery discipline - the schema including reference data lives in source control as the single source of truth, every change ships as an explicit committed migration (never edited retroactively except to prevent data loss), and each developer runs a separate database instance.
    decision_rule: Before writing database integration tests, verify the schema and reference data are source-controlled, changes flow through committed migrations rather than state comparison (data motion outweighs merge-conflict convenience), and test runs get isolated instances; where these are absent, establish them or report the gap rather than testing against a shared drifting database.
    why_it_matters: Without a source-controlled schema and migration history there is no authoritative database state to test against, and shared instances make tests interfere and results unreproducible.
    applicable_when: [introducing database integration tests, assessing a repository's database delivery discipline, reviewing migration practices]
    not_applicable_when: [systems with no owned relational schema, such as pure consumers of external data services]
    required_evidence: [schema and reference data location and authority, migration history and its discipline, instance isolation for developers and test runs]
    insufficient_evidence: [a production database that merely exists, schema dumps taken ad hoc, a shared development database that mostly works]
    required_inputs: [database delivery pipeline, schema ownership, test environment provisioning]
    expected_outputs: [verified prerequisites or a named gap, migration-based change flow, per-run database isolation]
    preservation_boundaries: [committed migrations are not edited retroactively except to prevent data loss, reference data is treated as part of the schema]
    safe_actions: [classify data the application can modify as regular data and the rest as reference data belonging to the schema, add missing schema files to source control before testing, provision per-developer instances]
    unsafe_actions: [test against a shared drifting database, apply schema changes by state comparison where data motion matters, edit an applied migration]
    common_failure_modes: [tests green against a database no longer matching production schema, migration edits breaking replayability, shared instances producing flaky interference]
    counterexamples: [Absence of these prerequisites is itself a data-fitness finding for any database-touching change, loosely related to repository-assessment-behavioral-data-fitness without extending it.]
    interactions: [Prerequisite for testing-database-production-fidelity; the delivery-discipline framing makes missing migrations a repository-assessment signal rather than merely a testing inconvenience.]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/017-chapter-10-testing-the-database.md :: 10.1 Prerequisites for testing the database"
        contribution: States the prerequisites (schema and reference data in source control, per-developer instances, migration-based over state-based delivery because data motion outweighs merge-conflict convenience) that make a real database testable at all.
        relationship: direct_support
    confidence: strong
