  - id: testing-mock-unmanaged-dependencies-only
    title: Mock unmanaged dependencies, use managed ones real
    category: implementation
    claim: Replace only unmanaged out-of-process dependencies (those whose communications form externally observable, backward-compatible contracts, such as message buses and SMTP) with mocks; use real instances of managed dependencies such as the application database and verify their final state, never interactions with them.
    decision_rule: Classify each out-of-process dependency as managed (accessible only through the application, communication pattern an implementation detail) or unmanaged (communications observable by external systems, backward compatibility required); mock only the unmanaged ones, verify managed ones by final state, and treat externally visible tables in a partially shared database as an unmanaged message channel.
    why_it_matters: Communications with a managed dependency are implementation details free to change, while communications with an unmanaged dependency are contracts whose regressions break external consumers - mocking the former pins refactorable detail, mocking the latter protects a real contract.
    applicable_when: [choosing what to mock in integration tests, reviewing test-double usage at process boundaries, testing systems with databases message buses or external services, deciding how to test logging]
    not_applicable_when: [untested legacy code where substituting a managed dependency may be the only route to first feedback, governed by the legacy records]
    required_evidence: [per-dependency classification as managed or unmanaged with ownership evidence, which database tables or channels other systems observe, availability of a real managed dependency for tests]
    insufficient_evidence: [a dependency being out-of-process alone, mocking-framework convenience, an interface existing for the dependency]
    required_inputs: [out-of-process dependency inventory, external consumer map, test environment capabilities]
    expected_outputs: [per-dependency mock-or-real decision with classification rationale, state-based verification for managed dependencies, interaction verification only at unmanaged boundaries]
    preservation_boundaries: [backward compatibility of unmanaged communications, managed-dependency state verification does not become interaction pinning]
    safe_actions: [run integration tests against a real application database, mock the message bus and verify outgoing messages, treat shared tables as an unmanaged message channel, test support logging as an unmanaged-dependency interaction and leave diagnostic logging untested]
    unsafe_actions: [mock the application database and verify repository calls, verify interactions with a managed dependency, treat a partially shared database as fully private]
    common_failure_modes: [database mocks pinning SQL or repository choreography, unmanaged contracts unprotected because everything real was too hard, shared tables changed as if private]
    counterexamples: [Khorikov's own corollary - if the real managed database cannot be used in tests, write no database integration tests at all rather than mock it - conflicts with legacy doctrine's acceptance of temporary imperfect protection and is preserved rather than adopted silently.]
