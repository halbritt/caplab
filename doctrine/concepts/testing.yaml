        contribution: Sets the unit/integration ratio rule (edge cases in unit tests; one longest-happy-path integration test per business scenario, adding tests only until every external system's communication is exercised) and admits the Fail Fast principle as a documented alternative to integration-testing immediately-manifest edge cases.
