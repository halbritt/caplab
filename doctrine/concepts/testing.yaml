  - id: testing-four-pillar-test-value
    title: Value tests as the product of four attributes
    category: review
    claim: Evaluate every automated test on four attributes - protection against regressions, resistance to refactoring, fast feedback, and maintainability - whose multiplied scores give the test's value; a zero on any attribute makes the test worthless regardless of the others.
    decision_rule: Score tests multiplicatively across the four attributes with a high retention threshold; treat resistance to refactoring as non-negotiable because it is near-binary, and negotiate the remaining trade-off between regression protection and feedback speed by the code's criticality.
    why_it_matters: The first three attributes are mutually exclusive at their extremes, so maximizing one to the exclusion of the others produces end-to-end suites too slow to run, trivial tests that protect nothing, or brittle tests that punish refactoring.
    applicable_when: [evaluating tests or suites, choosing between test designs, deciding which tests to keep or rewrite, reviewing test additions]
    not_applicable_when: [temporary characterization or safety-net tests governed by explicit legacy retirement rules]
    required_evidence: [the amount and significance of code each test exercises, the test's coupling to implementation details, execution speed and maintenance history]
    insufficient_evidence: [test count or coverage contribution, passing status, style conformance]
    required_inputs: [tests under evaluation, criticality of the covered code, suite performance data]
    expected_outputs: [per-test attribute scores with the binding constraint named, retention and rewrite decisions, explicit protection-versus-speed trade-off for the code's criticality]
    preservation_boundaries: [eradicating brittleness takes priority before tuning other attributes, protection for accepted behavior is not dropped silently]
    safe_actions: [score a questionable test on all four attributes before deciding, discard or rewrite tests scoring near zero on refactoring resistance, trade regression protection against feedback speed deliberately]
    unsafe_actions: [keep a brittle test because it protects a lot, maximize one attribute to the exclusion of the others, average the attributes instead of multiplying them]
    common_failure_modes: [brittle suites retained for their coverage, trivial fast tests mistaken for value, end-to-end-only strategies too slow to run per change]
    counterexamples: [A temporary broad end-to-end net during legacy rescue scores near zero under the multiplication rule yet is deliberately retained under that record's explicit temporariness and retirement rules.]
    interactions: [The book's frame of reference for all downstream testing records; supplies the selection pressure on Khorikov's side of conflict-broad-vs-narrow-characterization; legacy-provisional-safety-net reconciles only through its retirement rules.]
    conflicts: [conflict-broad-vs-narrow-characterization]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/010-chapter-4-the-four-pillars-of-a-good-unit-test.md :: 4.1 Diving into the four pillars of a good unit test"
        contribution: Defines the four attributes and grounds regression-protection scoring in the amount, complexity, and domain significance of the code a test exercises - including library and framework code - noting trivial code is rarely worth testing.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/010-chapter-4-the-four-pillars-of-a-good-unit-test.md :: 4.4 In search of an ideal test"
        contribution: Proves the first three attributes mutually exclusive by extremes (end-to-end tests sacrifice speed, trivial tests sacrifice regression protection, brittle tests sacrifice refactoring resistance), makes the value estimate multiplicative with a high retention threshold, declares resistance to refactoring non-negotiable because it is near-binary, and reduces the remaining trade-off to regression protection versus feedback speed.
        relationship: direct_support
    confidence: strong
    roles: [review-agent, coding-agent, refactoring-agent, repository-assessment-agent]
