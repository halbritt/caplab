  - id: testing-humble-object-testability-split
    title: Split complex collaborator-heavy code before testing it
    category: refactoring
    claim: Unit-test effort belongs on code that is complex or domain-significant and has few collaborators; code that is both complex and collaborator-heavy must be split (Humble Object) into decision logic and a thin orchestrator rather than tested as-is, while trivial code goes untested and controllers receive a small number of integration tests.
    decision_rule: Classify code on two axes - complexity or domain significance versus collaborator count; unit test the complex/few-collaborators quadrant, give the trivial quadrant no tests, integration-test controllers sparsely, and split the overcomplicated quadrant into a testable decision core plus a humble orchestrator, accepting the trilemma that domain-model testability, controller simplicity, and performance cannot all be maximized.
    why_it_matters: Testing overcomplicated code as-is yields expensive brittle tests, while leaving it unsplit leaves the system's hardest logic unprotected.
    applicable_when: [deciding where unit-test effort goes, code that is both complex and collaborator-heavy, reviewing test plans for controllers and domain logic]
    not_applicable_when: [no demonstrated pressure or authority exists to restructure production code, in which case the classification still guides test placement but not intervention]
    required_evidence: [two-axis classification of the code under consideration, the trilemma position chosen and its rationale, demonstrated pressure justifying a structural split]
    insufficient_evidence: [a quadrant label alone as restructuring license, testability desire without maintenance pressure, framework fashion for layered splits]
    required_inputs: [complexity and collaborator inventory, restructuring authority and pressure evidence, performance obligations]
    expected_outputs: [test-effort allocation per quadrant, split proposal separating decision logic from orchestration where earned, explicit trilemma trade-off record]
    preservation_boundaries: [behavior preservation through any split, performance obligations under decision-step granulation, the split is a structural change requiring its own authority]
    safe_actions: [unit test domain logic and utility algorithms, give controllers a small number of integration tests, propose a humble-object split for overcomplicated code with pressure evidence, leave trivial code untested]
    unsafe_actions: [unit test overcomplicated code as-is through heavy mocking, inject out-of-process dependencies into the domain model for convenience, split code solely because a quadrant diagram says so]
    common_failure_modes: [brittle mock-heavy tests of orchestrating logic, domain logic never split out and never protected, splits performed without pressure that add layers and cost]
    counterexamples: [The depth-versus-width rule - deep or wide, never both - is a compatible reformulation on the Ousterhout side of the deep-modules conflict, not a license for universal thin layering.]
    interactions: [Treating untestability of important logic as restructuring pressure is in tension with refactoring-demonstrated-pressure, and the boundary it introduces must be earned per architecture-earned-boundary with testability recorded explicitly as the quality force; the depth-versus-width rule supplies compatible evidence for the deep-modules conflict's decision rule.]
    conflicts: [conflict-deep-modules-vs-small-units]
