  - id: testing-no-test-privileged-access
    title: Give tests no privileges production clients lack
    category: implementation
    claim: Tests must interact with the system under test exactly as production clients do, with no special privileges - do not publicize private methods or private state for testing, re-derive expected values with the algorithm under test, add test-only switches to production code, or partially mock concrete classes; each pressure signals a missing abstraction or an unseparated responsibility to extract instead.
    decision_rule: When a test seems to need privileged access, treat the need as a design signal - test private methods through observable behavior or extract the missing abstraction into its own class; verify state only through what production code reads; hardcode expected results precalculated independently of the SUT; keep test-only branches out of production code; split classes that would need partial mocking; and inject time explicitly rather than reading ambient context.
    why_it_matters: Privileged access couples the suite to internals and pollutes production code, so tests pass in configurations production never runs and refactoring breaks tests that verified nothing a client could see.
    applicable_when: [a test wants access to private members or state, expected values are computed rather than known, production code is growing test-only parameters, a concrete class is being partially mocked, code reads ambient time]
    not_applicable_when: [members that are private yet part of an observable contract, such as an ORM-invoked private constructor]
    required_evidence: [the observable route to the behavior a privileged test would verify, independently derived expected values, the responsibility mix behind a partial-mock urge]
    insufficient_evidence: [coverage of a private method as a goal in itself, convenience of reflection or visibility widening, a mocking framework's ability to partially mock]
    required_inputs: [public contract of the system under test, domain-expert or legacy oracle for expected values, dependency and responsibility inventory]
    expected_outputs: [tests exercising only client-visible surfaces, extracted abstractions where private complexity was unreachable, production code free of test-only branches, explicit time injection]
    preservation_boundaries: [public API surface is not widened for testability, production behavior carries no test-mode variation, encapsulation of state remains intact]
    safe_actions: [test a private method via the observable behavior that uses it, extract an unreachable complex private method into its own class, hardcode independently precalculated expected values, replace ambient time with an injected value]
    unsafe_actions: [publicize private methods or state for a test, reimplement the algorithm in the test to compute expectations, add Boolean test switches to production code, partially mock a concrete class with CallBase]
    common_failure_modes: [reflection-based tests freezing internals, tautological tests that mirror the algorithm, test-mode code paths shipping to production, partial mocks hiding mixed responsibilities]
    counterexamples: [A private member that is genuinely part of an observable contract - an ORM-invoked private constructor - may be exercised as that contract; an interface with a fake implementation is the lesser and safer pollution when some seam is unavoidable.]
    interactions: [Aligned with legacy-characterization-surfaces on independently derived expected values (legacy output may serve as the oracle when refactoring); WELC tolerates explicit revisitable encapsulation-breaking scars in untested code, a disagreement routed through conflict-temporary-seam-vs-long-term-design; a private method too complex to reach observably is a missing abstraction, connecting to universal-information-hiding.]
    conflicts: [conflict-temporary-seam-vs-long-term-design]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/019-chapter-11-unit-testing-anti-patterns.md :: 11.1 Unit testing private methods"
        contribution: Establishes the no-test-privilege rule for private methods - test them via observable behavior; a private method too complex to reach that way is dead code or a missing abstraction to extract into its own class, with the rare exception of members that are private yet part of an observable contract (e.g., an ORM-invoked private constructor).
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/019-chapter-11-unit-testing-anti-patterns.md :: 11.2 Exposing private state"
        contribution: Verify state only through what production code actually reads (a status change is verified via the discount it produces), never by publicizing fields for tests.
        relationship: refinement
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/019-chapter-11-unit-testing-anti-patterns.md :: 11.3 Leaking domain knowledge to tests"
        contribution: Never reimplement the algorithm in the test; hardcode expected results precalculated independently of the SUT (domain expert or legacy output).
        relationship: refinement
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/019-chapter-11-unit-testing-anti-patterns.md :: 11.4 Code pollution"
        contribution: No production code whose only purpose is testing (Boolean environment switches); an interface with a fake implementation is the lesser, safer pollution.
        relationship: refinement
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/019-chapter-11-unit-testing-anti-patterns.md :: 11.5 Mocking concrete classes"
        contribution: Needing CallBase partial mocks means one class mixes unmanaged-dependency communication with logic; split into a gateway plus a pure calculator.
        relationship: refinement
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/019-chapter-11-unit-testing-anti-patterns.md :: 11.6 Working with time"
        contribution: Static ambient-context time is an anti-pattern; inject time explicitly, preferring a plain value over a service (service at operation start, value thereafter).
        relationship: refinement
