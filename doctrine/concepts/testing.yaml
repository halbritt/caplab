  - id: testing-integration-scope-selection
    title: Budget integration tests around the longest happy path
    category: implementation
    claim: Keep integration tests few and targeted - cover as many edge cases as possible with unit tests, then use integration tests for the longest happy path that touches all out-of-process dependencies plus only those edge cases unit tests cannot exercise, letting fail-fast crashes stand in for tests of wiring bugs that manifest immediately without corrupting state.
    decision_rule: Push edge cases down to unit tests; write one integration test per business scenario following the longest happy path, adding tests only until every external system's communication is exercised; where a wiring bug would manifest immediately and corrupt no state, prefer the Fail Fast principle over an integration test.
    why_it_matters: Integration tests are slow and expensive to maintain, so undirected growth duplicates cheaper coverage while the actual cross-dependency paths stay unexercised.
    applicable_when: [scoping integration tests for a feature, reviewing integration-suite growth, deciding whether an edge case needs an out-of-process test]
    not_applicable_when: [systems whose logic cannot be exercised in process at all, where integration tests are the only executable protection]
    required_evidence: [which edge cases unit tests already cover, the longest happy path touching all out-of-process dependencies per scenario, whether a candidate failure manifests immediately without corrupting state]
    insufficient_evidence: [integration-test counts or coverage contribution, a desire to test everything end to end, one wiring incident without failure-mode analysis]
    required_inputs: [business scenario inventory, out-of-process dependency map, unit-test coverage of edge cases]
    expected_outputs: [integration tests scoped to longest happy paths, edge cases assigned to unit tests, documented fail-fast substitutions for immediately-manifest wiring bugs]
    preservation_boundaries: [every external system's communication is exercised by some test, a test that adds no significant value is recognized as worse than no test]
    safe_actions: [route new edge cases to unit tests first, extend an existing integration test to touch an unexercised dependency rather than adding another, document where fail-fast substitutes for a test]
    unsafe_actions: [duplicate unit-tested edge cases at integration level, add per-edge-case integration tests when the happy path already exercises the dependency, integration-test configuration mistakes that crash on startup anyway]
    common_failure_modes: [integration suite growing per edge case until it dominates run time, dependencies never exercised because every test mocks them, wiring bugs tested expensively instead of failing fast]
    counterexamples: [Where broad end-to-end protection is a provisional legacy safety net, its budget is governed by that record's retirement rules rather than this steady-state rule.]
    interactions: [Corroborates testing-coverage-is-not-adequacy - a test that adds no significant value is worse than no test; the fail-fast substitution connects to implementation-fail-fast-or-recover; steady-state budgeting contrasts with legacy-provisional-safety-net's temporary broad nets.]
