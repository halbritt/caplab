        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/016-chapter-9-mocking-best-practices.md :: 9.1 Maximizing mocks' value"
        contribution: Directs mocks at the last owned type before the external system and at the actual message content, showing this maximizes code exercised (protection against regressions) and detaches the test from intermediate implementation types (resistance to refactoring); recommends spies as independent, reusable assertion checkpoints that do not trust production code.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/016-chapter-9-mocking-best-practices.md :: 9.2 Mocking best practices"
