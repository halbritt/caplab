  - id: testing-output-based-style-preference
    title: Prefer output-based tests where purity is affordable
    category: implementation
    claim: Prefer output-based tests over state-based and communication-based ones wherever decision logic can be made purely functional, because they couple least to implementation details and cost least to maintain; restructure toward a functional core only when the code's complexity and importance justify the performance and code-size cost.
    decision_rule: Rank candidate test styles output > state > communication on resistance to refactoring and maintainability (protection and speed being style-independent); where decision logic can be separated from side effects, push side effects to the edges behind a functional core, but gate the restructuring on the code's complexity and importance against the read-decide-act performance and code-volume cost.
    why_it_matters: Output-based tests verify pure input-to-output mappings and survive restructuring, while communication-based tests pin interaction choreography and state-based tests pin intermediate representations.
    applicable_when: [choosing a test style for decision logic, considering a functional-core restructuring for testability, reviewing mock-heavy tests of computational code]
    not_applicable_when: [code whose essence is collaboration or side effects rather than computable outputs, simple or unimportant code where restructuring cannot repay its cost]
    required_evidence: [whether the decision logic can be made purely functional, complexity and importance of the code justifying restructuring, performance headroom for read-decide-act round trips]
    insufficient_evidence: [style preference alone, purity pursued as an aesthetic, a mocking framework's limitations]
    required_inputs: [decision logic and its side-effect entanglement, workload characteristics, test style inventory]
    expected_outputs: [per-code style selection with ranking rationale, functional-core proposal gated by complexity and cost, or explicit retention of state or communication style where appropriate]
    preservation_boundaries: [behavior and failure semantics through the restructuring, performance obligations under read-decide-act, accepted architecture remains a contract]
    safe_actions: [convert computational logic with incidental side effects to output-based testing, keep state-based tests where state is the contract, decline functional restructuring for simple or unimportant code]
    unsafe_actions: [force purity where collaborators are essential, absorb unbounded read-decide-act round trips for testability, rewrite a stable codebase to change its test style without demonstrated value]
    common_failure_modes: [purity pursued at disproportionate performance cost, code-base size inflated by functional scaffolding, communication tests retained for logic that could be pure]
    counterexamples: [Khorikov's own gate forbids converting simple or unimportant code bases - there is no one-size-fits-all choice.]
    interactions: [The side-effects-to-edges trade participates in conflict-domain-purity-vs-implementation-simplicity; the adoption gate aligns with and constrains the preference per universal-no-change-option; the functional core realizes architecture-policy-mechanism-separation at test scale.]
