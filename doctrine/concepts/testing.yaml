  - id: testing-test-level-mix
    title: Choose the test-level mix from the system's shape
    category: implementation
    claim: Choose the unit/integration/end-to-end mix by trading feedback speed against regression protection for the system at hand - a unit-test majority over a complex domain, an integration-heavy mix for simple CRUD systems, and end-to-end tests reserved for the most critical flows that cheaper tests cannot protect.
    decision_rule: Derive the pyramid ratio from the fast-feedback versus regression-protection trade-off rather than adopting it as dogma; no layer may concede resistance to refactoring, CRUD-dominated systems legitimately shift toward a unit/integration rectangle, and a single-dependency API can justify more end-to-end tests.
    why_it_matters: Cargo-culting a fixed ratio produces suites mismatched to the system - domain-heavy systems underprotected by integration tests, CRUD systems burdened with unit tests of trivial code.
    applicable_when: [planning a test strategy, reviewing the suite's level distribution, deciding at which level to protect a behavior]
    not_applicable_when: [a legacy rescue phase where a temporarily inverted pyramid is governed by provisional safety-net rules]
    required_evidence: [domain complexity versus CRUD character of the system, feedback-speed requirements of the development cycle, criticality of flows proposed for end-to-end coverage]
    insufficient_evidence: [a pyramid diagram as policy, ratio conventions imported from another system, level counts without behavior mapping]
    required_inputs: [system shape and domain complexity, current level distribution, critical flow inventory]
    expected_outputs: [level mix rationale tied to the system's shape, per-behavior level assignments, named exceptions such as CRUD rectangles with their justification]
    preservation_boundaries: [no layer concedes resistance to refactoring, critical flows retain protection when the mix shifts]
    safe_actions: [assign edge cases to unit tests and happy paths spanning dependencies to integration tests, shift a CRUD system's mix toward integration tests, reserve end-to-end tests for the most critical flows]
    unsafe_actions: [enforce a fixed pyramid ratio across unlike systems, add end-to-end tests for flows cheaper tests already protect, unit test trivial CRUD glue to satisfy a ratio]
    common_failure_modes: [ratio enforced as dogma, complex domain protected mainly by slow integration tests, end-to-end suites duplicating cheaper coverage]
    counterexamples: [A temporarily inverted pyramid - broad end-to-end protection first - is the deliberate legacy-rescue posture under provisional safety-net retirement rules, applying to a different lifecycle phase.]
