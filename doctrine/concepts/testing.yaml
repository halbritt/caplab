schema_version: agent-doctrine-concepts/1
concepts:
  - id: testing-suite-net-value
    title: Keep a test only while its value exceeds its upkeep
    category: implementation
    claim: A test belongs in the suite only while its regression-protection and design value clearly exceeds its recurring costs of refactoring alongside the code, execution on every change, false-alarm triage, and reading, because test code is itself a liability.
    decision_rule: Judge suite quality test-by-test against the goal of sustainable project growth; weigh each test's protection value against its four recurring upkeep costs, keep the suite integrated into the development cycle and focused on the most important code, and remove or rewrite tests whose net value is negative rather than accumulating them.
    why_it_matters: Tests are code with maintenance costs of their own; a suite retained by accumulation rather than judgment slows every change while protecting little.
    applicable_when: [assessing an existing test suite, deciding whether a test earns its maintenance cost, reviewing test additions in a change, planning suite investment]
    not_applicable_when: [no automated suite exists yet and the question is whether to protect a change at all]
    required_evidence: [what each questioned test protects and at what level, the test's recurring costs in maintenance and triage, how central the covered code is to the system's purpose]
    insufficient_evidence: [test count or growth trend alone, aggregate coverage percentage, the age or authorship of a test]
    required_inputs: [suite inventory, change and failure history of the tests, criticality ranking of covered code]
    expected_outputs: [per-test keep, rewrite, or remove judgments with rationale, suite focus statement naming the most important code]
    preservation_boundaries: [regression protection for accepted behavior is not dropped without an explicit decision, test removal is a recorded change rather than silent deletion]
    safe_actions: [inventory what a costly test actually protects before removing it, rewrite a brittle high-value test rather than deleting it, decline to add a test whose upkeep exceeds its protection]
    unsafe_actions: [treat more tests as automatically better, keep a failing or flaky test by disabling it silently, judge the suite by an aggregate automated metric alone]
    common_failure_modes: [suite grown by accumulation until every change breaks dozens of low-value tests, brittle tests deleted in bulk without recording lost protection, badge metrics substituting for judgment]
    counterexamples: [A temporary broad safety net retained during a legacy rescue is deliberately low-net-value and is governed by its own explicit retirement rules rather than this record.]
    interactions: [Applies universal-no-change-option cost-benefit reasoning to tests themselves; legacy-provisional-safety-net deliberately retains temporarily brittle broad suites during rescue and reconciles with this record only through its explicit temporariness and retirement rules.]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/006-chapter-1-the-goal-of-unit-testing.md :: 1.2 The goal of unit testing"
        contribution: Defines the goal of unit testing as sustainable project growth against software entropy (design improvement is a side effect) and itemizes the four recurring upkeep costs a test must outweigh to have positive net value.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/006-chapter-1-the-goal-of-unit-testing.md :: 1.4 What makes a successful test suite?"
        contribution: States that suite quality can only be judged test-by-test with personal judgment, not by an aggregate automated metric, and names the three success properties - integration into the development cycle, focus on the most important code, and maximum value for minimum maintenance cost.
        relationship: direct_support
    confidence: strong
    roles: [coding-agent, review-agent, refactoring-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [test value, suite maintenance cost, test liability, sustainable growth, test upkeep, suite quality]
    routing:
      activate_for_roles: [coding-agent, review-agent, refactoring-agent, repository-assessment-agent]
      activate_for_tasks: [assess-tests, review-coverage-gate, plan-implementation, refactor]
      activate_for_repository_signals: [slow or brittle suite, tests failing on every refactor, disabled tests, coverage badge]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [maintainability, regression, evidence-quality]
      exclude_when: [no automated tests exist and none are being assessed]
      prerequisites: [suite inventory and criticality evidence]
      retrieval_priority: high
      retrieval_budget_hint: 340
      related_concepts: [testing-four-pillar-test-value, testing-coverage-is-not-adequacy, implementation-risk-driven-tests, universal-no-change-option]

  - id: testing-unit-of-behavior
    title: Test one unit of behavior, not one unit of code
    category: implementation
    claim: A unit test should verify one unit of observable behavior meaningful in the problem domain - which may span a method, a class, or several classes - rather than one unit of code per class.
    decision_rule: Scope each test to a cohesive behavior a domain-literate non-programmer could recognize, with the number of classes implementing it explicitly irrelevant; name the test as a plain-language domain fact and keep the method under test's name out of the test name.
    why_it_matters: Class-per-test granularity couples the suite to the current decomposition, so structural refactoring breaks tests even when behavior is preserved.
    applicable_when: [writing or reviewing unit tests, choosing test granularity, naming tests, refactoring a suite that mirrors the class structure]
    not_applicable_when: [utility or infrastructure code whose contract is genuinely the method itself]
    required_evidence: [the observable behavior the test verifies stated in domain terms, the behavior's boundary independent of the current class decomposition]
    insufficient_evidence: [a one-test-class-per-production-class convention, method names appearing in test names, mock verification of internal collaboration]
    required_inputs: [behavior contract in domain language, current test granularity conventions]
    expected_outputs: [tests scoped and named by behavior, granularity rationale independent of class count]
    preservation_boundaries: [existing behavior coverage is not reduced while regrouping tests, accepted repository naming conventions remain contracts until changed]
    safe_actions: [scope a test across several collaborating classes when they implement one behavior, describe the scenario in plain language to a domain-familiar reader, rename tests to domain facts when touching them]
    unsafe_actions: [create a test class per production class by default, encode the method under test's name into the test name for business logic, split one behavior across many structure-mirroring tests]
    common_failure_modes: [suite mirrors class diagram and shatters on refactor, test names that repeat signatures and rot on rename, behavior verified only piecewise through collaboration checks]
    counterexamples: [Tests for generic utility code may legitimately reference the utility's name because the utility itself is the contract.]
    interactions: [Corroborates implementation-risk-driven-tests' smallest-observing-level rule; the London school's one-class-at-a-time granularity is preserved as a live position in conflict-classical-vs-london-test-isolation.]
    conflicts: [conflict-classical-vs-london-test-isolation]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/007-chapter-2-what-is-a-unit-test.md :: 2.3.1 Unit testing one class at a time"
        contribution: Rejects the class as the default test target and requires each test to tell a cohesive story a domain-literate non-programmer could recognize, with the number of classes implementing the behavior explicitly irrelevant.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/008-chapter-3-the-anatomy-of-a-unit-test.md :: 3.4 Naming a unit test"
        contribution: Applies the behavior-not-code rule to naming - describe the scenario in plain language to a domain-familiar non-programmer, avoid rigid naming policies, and keep the method under test's name out of the test name (utility code excepted).
        relationship: refinement
    confidence: strong
    roles: [coding-agent, review-agent, refactoring-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [unit of behavior, test granularity, test naming, one class per test, domain fact, observable behavior]
    routing:
      activate_for_roles: [coding-agent, review-agent, refactoring-agent]
      activate_for_tasks: [implement-feature, assess-tests, refactor, review-tests]
      activate_for_repository_signals: [test class per production class, method names in test names, tests broken by pure refactor]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [regression, maintainability]
      exclude_when: [the artifact under test is a utility whose method is its contract]
      prerequisites: [behavior contract in domain terms]
      retrieval_priority: high
      retrieval_budget_hint: 320
      related_concepts: [implementation-risk-driven-tests, testing-assert-observable-outcomes, testing-self-contained-test-anatomy]

  - id: testing-shared-dependency-substitution
    title: Substitute shared and slow dependencies, keep collaborators real
    category: implementation
    claim: Replace with test doubles only the dependencies that are shared between tests or slow out-of-process ones, so tests stay fast and mutually independent, and keep private mutable collaborators and value objects real.
    decision_rule: Classify each dependency as shared, private, out-of-process, or volatile and distinguish collaborators from value objects; substitute shared and slow out-of-process dependencies to isolate tests from each other, and keep in-process private collaborators and immutable values real rather than isolating the unit from them.
    why_it_matters: Isolating units from their collaborators couples tests to internal communication patterns, while isolating tests from each other targets the actual sources of interference and slowness.
    applicable_when: [deciding what to mock or stub in a unit test, reviewing test-double usage, a suite whose tests interfere through shared state or run slowly]
    not_applicable_when: [legacy code where no test protection exists yet and any seam may be needed to gain first feedback]
    required_evidence: [dependency classification per the shared/private/out-of-process taxonomy, whether the dependency is mutable shared state or a value, execution-speed and interference evidence for the suite]
    insufficient_evidence: [a mocking-framework convention of substituting everything, the mere existence of an interface, discomfort with multi-class tests]
    required_inputs: [dependency inventory of the system under test, suite execution characteristics]
    expected_outputs: [per-dependency substitution decision with taxonomy rationale, tests independent of each other with collaborators left real]
    preservation_boundaries: [test independence in execution and outcome, real collaborator behavior remains exercised, value-object semantics are never doubled]
    safe_actions: [substitute the database and message bus shared across tests, keep domain collaborators and value objects real, isolate tests from each other rather than the unit from its graph]
    unsafe_actions: [mock every collaborator by default, substitute immutable value objects, leave a shared mutable dependency live so tests interfere]
    common_failure_modes: [mock-everything suites that break on refactor, tests coupled through a shared database, doubles hiding real collaborator defects]
    counterexamples: [In untested legacy code, substituting a private in-process collaborator at a seam can be the only way to gain feedback; that move is governed by the legacy records and their provisional status rules.]
    interactions: [Grounded in the shared/private/out-of-process dependency taxonomy and the collaborator-versus-value distinction, which corroborates domain-value-object; the contested boundary with London-school and WELC substitution practice is preserved in conflict-classical-vs-london-test-isolation and conflict-temporary-seam-vs-long-term-design.]
    conflicts: [conflict-classical-vs-london-test-isolation, conflict-temporary-seam-vs-long-term-design]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/007-chapter-2-what-is-a-unit-test.md :: 2.1 The definition of \"unit test\""
        contribution: Identifies isolation as the contested attribute of the unit-test definition and states the classical resolution - isolate tests from each other, not units from collaborators - grounded in the shared/private/out-of-process/volatile dependency taxonomy that determines what must be substituted.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/007-chapter-2-what-is-a-unit-test.md :: 2.2.1 How the classical and London schools handle dependencies"
        contribution: Shows that even the London school leaves immutable dependencies unmocked, and distinguishes collaborators (shared or mutable dependencies) from value objects, which never need substitution.
        relationship: direct_support
    confidence: contextual
    roles: [coding-agent, review-agent, legacy-code-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, monolith, distributed-system]
    retrieval_terms: [test double, shared dependency, private dependency, collaborator, value object, test isolation, mock scope]
    routing:
      activate_for_roles: [coding-agent, review-agent, legacy-code-agent]
      activate_for_tasks: [implement-feature, assess-tests, review-tests, dependency-review]
      activate_for_repository_signals: [mock-heavy suite, shared test database, tests interfering through state, mocking framework configuration]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [regression, maintainability, evidence-quality]
      exclude_when: [untested legacy code where the legacy seam records govern first feedback]
      prerequisites: [dependency classification of the system under test]
      retrieval_priority: high
      retrieval_budget_hint: 380
      related_concepts: [testing-mock-unmanaged-dependencies-only, testing-unit-of-behavior, domain-value-object, legacy-seams-and-enabling-points]

  - id: testing-testability-as-design-signal
    title: Read test pain as design evidence, not a mocking problem
    category: review
    claim: Difficulty unit testing code - oversized arrange phases, sprawling interconnected object graphs - is reliable evidence of a design problem such as tight coupling, while ease of testing does not establish quality, and doubles that make painful setup disappear hide the problem rather than fix it.
    decision_rule: Treat hard-to-test code as a one-way indicator - investigate the coupling it signals rather than suppressing the signal with mocks; never cite easy testability alone as proof of good design, and route any structural response through the demonstrated-pressure and authority gates.
    why_it_matters: Mocking a tangled graph apart makes the pain disappear without touching its cause, leaving the coupling in production while the suite over-specifies internal structure.
    applicable_when: [a test needs extensive setup or many doubles, reviewing code whose tests are painful to write, assessing design quality with testability evidence]
    not_applicable_when: [test pain caused by missing infrastructure or tooling rather than the design of the code under test]
    required_evidence: [the concrete setup or graph complexity causing test pain, the coupling or responsibility problem it points to, whether doubles are masking rather than resolving the pain]
    insufficient_evidence: [ease of testing offered as proof of quality, test pain in code outside the change surface, discomfort with a testing framework]
    required_inputs: [painful tests and their arrange phases, dependency graph of the code under test]
    expected_outputs: [named design hypothesis behind the test pain, decision to investigate or record rather than mask, structural proposal routed through its own gates when pressure warrants]
    preservation_boundaries: [the signal is evidence for investigation, not authority to restructure, behavior preservation governs any structural response]
    safe_actions: [record oversized arrange phases as coupling evidence, name over-specification when doubles mirror internal structure, propose investigation of the signaled design problem]
    unsafe_actions: [mock the graph apart to make the pain disappear, claim good design from easy tests, restructure immediately on test pain without demonstrated pressure or authority]
    common_failure_modes: [doubles accumulating until tests specify implementation choreography, test pain normalized as the cost of testing, easy-to-test shallow code mistaken for good design]
    counterexamples: [In legacy code the same pain may be worked around rather than fixed now; the disagreement is about timing and authority, not about the signal's validity.]
    interactions: [Corroborates universal-change-amplification; legacy-sprout-wrap accepts working around an untestable body rather than fixing the design now, and mock-enabled seams that relieve the same pain are adjudicated by conflict-temporary-seam-vs-long-term-design; structural responses remain gated by refactoring-demonstrated-pressure.]
    conflicts: [conflict-temporary-seam-vs-long-term-design]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/007-chapter-2-what-is-a-unit-test.md :: 2.3 Contrasting the classical and London schools of unit testing"
        contribution: Argues a large interconnected class graph is itself the design problem that test pain correctly exposes, that mocking the graph apart hides the root cause instead of tackling it, and names over-specification as the London style's biggest cost.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/006-chapter-1-the-goal-of-unit-testing.md :: 1.2 The goal of unit testing"
        contribution: States the one-way indicator - hard-to-test code reliably signals poor quality (usually tight coupling), but easy-to-test code does not establish good design.
        relationship: corroboration
    confidence: strong
    roles: [review-agent, coding-agent, refactoring-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, monolith, distributed-system]
    retrieval_terms: [testability, test pain, arrange phase size, tight coupling, over-specification, design signal]
    routing:
      activate_for_roles: [review-agent, coding-agent, refactoring-agent, repository-assessment-agent]
      activate_for_tasks: [assess-tests, review-tests, assess-structure, refactor]
      activate_for_repository_signals: [oversized test setup, many doubles per test, interconnected object graph, mock choreography]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [maintainability, architecture, evidence-quality]
      exclude_when: [test pain stems from tooling or infrastructure rather than the code's design]
      prerequisites: [painful test evidence tied to the code under test]
      retrieval_priority: high
      retrieval_budget_hint: 340
      related_concepts: [universal-change-amplification, testing-humble-object-testability-split, refactoring-demonstrated-pressure, legacy-sprout-wrap]

  - id: testing-self-contained-test-anatomy
    title: One self-contained arrange-act-assert sequence per test
    category: implementation
    claim: A unit test should be one self-contained arrange-act-assert sequence with no branching; multiple act sections or if statements mean multiple behaviors that belong in separate tests, with grouped acts tolerable only in already-slow integration tests.
    decision_rule: Structure every test as a single arrange-act-assert sequence, ban if statements in any test, allow multiple assertions only when they verify one unit of behavior, and reuse fixtures through expressive private factory methods rather than constructor or setup-method initialization that couples tests together.
    why_it_matters: Branching and multiple act phases hide several behaviors in one test, and shared setup state makes a change to one arrangement break sibling tests while hiding the context a reader needs.
    applicable_when: [writing or reviewing unit tests, refactoring test structure, introducing fixture reuse]
    not_applicable_when: [slow integration tests where grouped act sections are an explicit speed compromise]
    required_evidence: [the single behavior each test verifies, how fixtures are initialized and shared, whether a modification to one test can affect siblings]
    insufficient_evidence: [a one-assertion-per-test rule applied mechanically, framework defaults that push setup methods, test length alone]
    required_inputs: [test suite structure and fixture conventions, behavior inventory of tests under review]
    expected_outputs: [tests with single AAA sequences and no branching, fixture reuse through factory methods, split tests where multiple behaviors were hidden]
    preservation_boundaries: [behavior coverage is preserved when splitting tests, independent modification - a change to one test must not affect others]
    safe_actions: [split a branching test into one test per behavior, replace constructor setup with expressive private factory methods, keep multiple assertions that verify one behavior together]
    unsafe_actions: [put if statements in a test, chain several act phases in a unit test for convenience, couple tests through shared mutable setup state]
    common_failure_modes: [branching tests that pass for the wrong reason, sibling tests broken by a setup change, one-assertion dogma shattering a single behavior across tests]
    counterexamples: [Base-class constructors remain acceptable for near-universal integration infrastructure such as database connections.]
    interactions: [The assert-count rule - one unit of behavior, not one assertion - reinforces testing-unit-of-behavior; a multi-line act phase is separately read as an encapsulation signal by universal-explicit-invariants.]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/008-chapter-3-the-anatomy-of-a-unit-test.md :: 3.1 How to structure a unit test"
        contribution: Establishes the single arrange-act-assert structure, bans if statements in any test, allows multiple assertions when they verify one unit of behavior, and permits multiple act sections only as a speed compromise in slow integration tests.
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/008-chapter-3-the-anatomy-of-a-unit-test.md :: 3.3 Reusing test fixtures between tests"
        contribution: Prefers expressive private factory methods over constructor or setup-method initialization for fixture reuse, because shared setup state couples tests together (a change to one arrangement breaks siblings) and hides the context a reader needs; base-class constructors remain acceptable for near-universal integration infrastructure like database connections.
        relationship: direct_support
    confidence: strong
    roles: [coding-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [arrange act assert, AAA, test structure, fixture reuse, factory method, setup method, branching test]
    routing:
      activate_for_roles: [coding-agent, review-agent]
      activate_for_tasks: [implement-feature, assess-tests, review-tests]
      activate_for_repository_signals: [if statements in tests, shared setup methods, multiple act sections, fixture coupling]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [maintainability, regression]
      exclude_when: [grouped acts are an explicit speed compromise in slow integration tests]
      prerequisites: [behavior inventory of the tests under review]
      retrieval_priority: normal
      retrieval_budget_hint: 300
