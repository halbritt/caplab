  - id: testing-mock-at-system-edges
    title: Mock the outermost owned adapter and assert the literal message
    category: implementation
    claim: When mocking an unmanaged dependency, substitute the outermost owned adapter in the chain to the external system and assert the literal outgoing message, checking both that expected calls occur and that no unexpected calls occur, with assertion checkpoints kept independent of production code.
    decision_rule: Mock the last type your code owns before the external system rather than an intermediate abstraction; assert the actual message content, verify call counts including the absence of other calls, keep expected values duplicated in the test rather than referenced from production constants, and mock only types you own by wrapping third-party libraries in adapters.
    why_it_matters: Mocking at the edge maximizes the code each test exercises and detaches assertions from intermediate implementation types, while independent checkpoints keep the test from trusting the very code it verifies.
    applicable_when: [writing integration tests that mock unmanaged dependencies, reviewing mock placement and assertions, integrating third-party client libraries]
    not_applicable_when: [managed dependencies verified by final state, in-process collaborators that should stay real]
    required_evidence: [the chain of owned types leading to the external system, the backward-compatibility strictness of the outgoing contract, whether asserted values are independent of production constants]
    insufficient_evidence: [a mock existing at whatever interface was convenient, call verification without message content, expected values referencing production code]
    required_inputs: [adapter chain inventory, outgoing message contracts, mocking and spy infrastructure]
    expected_outputs: [mocks placed at the outermost owned type, literal-message assertions with call-count completeness, owned adapters wrapping third-party libraries]
    preservation_boundaries: [outgoing contract compatibility, assertion independence from production code, mocks confined to integration tests]
    safe_actions: [mock the owned message-bus adapter rather than an intermediate event dispatcher, assert the rendered outgoing message text, use spies as reusable independent checkpoints, wrap and mock your own adapter over a third-party interface]
    unsafe_actions: [mock an intermediate type deep inside the application, verify only that some call happened without content or count, reference production constants as expected values, mock a third-party interface directly]
    common_failure_modes: [mocks pinning intermediate types that refactoring changes, unexpected extra calls passing unnoticed, tests trusting production formatting code for expectations]
    counterexamples: [Edge precision is proportionate to contract strictness - for logging, mocking the owned DomainLogger wrapper rather than the raw ILogger suffices.]
    interactions: [Mock-only-types-you-own motivates owned adapters, corroborating domain-anticorruption-layer; the independent-checkpoint principle is kindred to legacy-characterization-surfaces' rule about trustworthy observation surfaces; the number of mocks per test follows the unmanaged-dependency count, not a one-mock rule.]
    source_support:
