  - id: testing-database-production-fidelity
    title: Test the database with production semantics
    category: implementation
    claim: Integration tests against a managed database earn trust only by matching production semantics - the same DBMS vendor (no in-memory substitutes), a separate transaction or unit of work per arrange/act/assert section instead of a shared or umbrella transaction, sequential execution, and leftover-data cleanup at the start of each test.
    decision_rule: Run database integration tests against the production DBMS vendor (version or edition may differ); give each test section its own transaction or unit of work because production gives each business operation its own; execute sequentially and clean leftover data at the beginning of each test rather than relying on teardown or rollback-only umbrella transactions.
    why_it_matters: In-memory analogs and umbrella transactions diverge from production behavior in locking, constraints, and visibility, producing both false positives and false negatives exactly where database tests are supposed to provide confidence.
    applicable_when: [writing or reviewing database integration tests, diagnosing database tests that pass while production fails, designing test data lifecycle]
    not_applicable_when: [repository conventions explicitly accept an in-memory or parallel arrangement as a contract, which takes precedence while its risks are reported]
    required_evidence: [production DBMS vendor and the test substitute in use, transaction structure of tests versus production operations, test execution order and cleanup mechanism]
    insufficient_evidence: [tests passing against an in-memory analog, teardown scripts that are usually run, parallel execution that has not yet flaked]
    required_inputs: [production database semantics, test infrastructure capabilities, data lifecycle conventions]
    expected_outputs: [same-vendor test database arrangement, per-section unit-of-work structure, sequential execution with cleanup-at-start]
    preservation_boundaries: [production transaction semantics are mirrored not approximated, business operations keep atomic updates through a unit of work whose lifetime matches the operation]
    safe_actions: [replace an in-memory analog with the production vendor, restructure a shared unit of work into per-section ones, clean leftover data at test start, keep execution sequential until parallel isolation is proven]
    unsafe_actions: [substitute a different database engine for speed, reuse one unit of work across test sections, rely on rollback-only umbrella transactions, parallelize container-per-test infrastructure prematurely]
    common_failure_modes: [functional mismatch between in-memory analog and production DBMS, umbrella transactions hiding visibility bugs, teardown skipped leaving state for the next run]
    counterexamples: [Widely practiced sqlite-in-memory and parallel testcontainers patterns contradict this record; where a repository has adopted them as convention, universal-repository-contract-precedence governs before enforcement.]
    interactions: [Deliberately trades speed for fidelity against fast-feedback pressure and rejects premature parallelization as maintenance burden, touching performance-earned-bounded-concurrency; presupposes testing-database-delivery-prerequisites.]
    source_support:
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/017-chapter-10-testing-the-database.md :: 10.3.3 Avoid in-memory databases"
        contribution: Rejects in-memory database analogs because functional mismatch with the production DBMS produces false positives and false negatives, requiring the same vendor (version/edition may differ).
        relationship: direct_support
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/017-chapter-10-testing-the-database.md :: 10.2 Database transaction management"
        contribution: Establishes that business operations need atomic updates via a transaction or unit of work whose lifetime matches the business operation, and that tests must not reuse one unit of work across test sections because production gives each operation its own.
        relationship: refinement
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/017-chapter-10-testing-the-database.md :: 10.3 Test data life cycle"
        contribution: Prescribes running database integration tests sequentially and clearing leftover data at the beginning of each test (the fastest option not prone to skipped teardown), noting rollback-only umbrella transactions diverge from production behavior.
        relationship: refinement
