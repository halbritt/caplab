  - id: implementation-validation-placement
    title: Place validation with the owner of each meaning layer
    category: implementation
    claim: Validate message syntax at ingress or message construction, validate semantic preconditions in the application service or dispatcher, and enforce contextual business feasibility in the domain model, without duplicating one rule across all layers.
    decision_rule: Classify each rule as structural syntax, referential or message semantics, or context-dependent domain policy; enforce it at the earliest boundary that owns that meaning, keep the invariant at its authoritative owner, and define caller-visible failure without repeating the same rule in every layer.
    why_it_matters: Undifferentiated validation either lets malformed data travel too deeply, clutters the domain with transport concerns, or scatters business rules so representations disagree.
    applicable_when:
      - designing API or message validation
      - placing service preconditions
      - reviewing domain invariants and input checks
    not_applicable_when:
      - opaque binary data that the application is not authorized or required to interpret
    required_evidence:
      - input trust boundary and syntax contract
      - authoritative source for referenced entities and semantic preconditions
      - domain owner and invariant
      - failure and reporting requirements per caller
    insufficient_evidence:
      - a field has a type hint
      - a schema validates shape
      - the same check appears in several layers
      - a framework convention without ownership analysis
    required_inputs:
      - external input contract
      - application workflow
      - domain model and invariants
      - failure policy
    expected_outputs:
      - rule classification and authoritative enforcement point
      - edge rejection behavior
      - service precondition behavior
      - domain invariant and proof route
    preservation_boundaries:
      - untrusted-input containment
      - domain authority and invariants
      - public error compatibility
      - idempotence and transaction semantics
    safe_actions:
      - reject malformed structure at ingress
      - use a service precondition for referenced-resource existence
      - keep business feasibility in the domain owner
      - share a predicate without duplicating authority
    unsafe_actions:
      - treat static types as runtime validation
      - repeat one business rule independently in controller service and model
      - let malformed input reach durable state
      - put transport syntax into a domain entity
    common_failure_modes:
      - schema-valid but impossible command
      - domain model polluted by transport checks
      - contradictory validations across layers
      - time-of-check/time-of-use race from a separate transaction
    counterexamples:
      - A single small boundary function may own all three layers when it is genuinely the only semantic owner and still keeps the distinctions explicit.
    interactions:
      - Specializes implementation-placement-by-ownership and universal-explicit-invariants; untrusted public input remains governed by operations-untrusted-request-handling.
    conflicts:
      - conflict-domain-purity-vs-implementation-simplicity
    source_support:
