  - id: testing-coverage-is-not-adequacy
    title: Treat coverage as execution evidence, not adequacy
    category: implementation
    claim: Coverage can show that code was executed, but cannot by itself establish correct assertions, boundary protection, failure behavior, state coverage, or test independence.
    decision_rule: Use coverage to find unexecuted areas, then assess adequacy against contracts, risks, boundaries, data flow, failures, and oracle quality; never set a coverage number as the sole acceptance proof.
    why_it_matters: A high percentage with weak or missing assertions can conceal the exact behaviors most likely to fail.
    applicable_when: [test assessment, coverage gate review, implementation or repair verification]
    required_evidence: [coverage semantics, relevant contract and risk inventory, assertion and oracle inspection, missing path analysis]
    insufficient_evidence: [line or branch percentage alone, badge status, number of tests]
    required_inputs: [coverage report, tests, target contract, risk profile]
    expected_outputs: [unprotected behavior findings, useful uncovered paths, bounded adequacy statement]
    preservation_boundaries: [existing useful tests, honest uncertainty, no test deletion solely to improve a metric]
    safe_actions: [use uncovered code as a search lead, inspect assertions, add risk-derived cases]
    unsafe_actions: [equate 100 percent coverage with correctness, write assertion-free execution tests, exclude difficult paths without rationale]
    common_failure_modes: [coverage theater, assertion-free tests, ignored error paths, overfit metric]
    counterexamples: [A repository may use a coverage floor as one regression signal, provided other evidence determines adequacy.]
    interactions: [Coverage is one static execution inventory within risk-driven test selection.]
    source_support:
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/031-chapter-22-developer-testing.md :: Coverage Monitors"
        contribution: Coverage monitors report only which code was exercised, revealing unexecuted code that signals the need for more tests.
        relationship: direct_support
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/013-chapter-8-pragmatic-projects.md :: Testing Thoroughly"
        contribution: Corroborates contract, state, error, data, and test-validity coverage beyond lines.
        relationship: corroboration
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/006-chapter-1-the-goal-of-unit-testing.md :: 1.3 Using coverage metrics to measure test suite quality"
        contribution: Shows line and branch coverage prove only execution, not verification - assertion-free tests and unverified implicit outcomes still reach 100%, external-library code paths stay invisible, and mandated coverage targets create a perverse incentive.
        relationship: corroboration
      - source_id: SRC-UT
        locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/010-chapter-4-the-four-pillars-of-a-good-unit-test.md :: 4.5 Exploring well-known test automation concepts"
        contribution: Prescribes writing all tests black-box against behavior meaningful to the problem domain, while using white-box coverage analysis only to locate untested branches that are then tested black-box; a test untraceable to a business requirement should be restructured or deleted.
        relationship: refinement
      - source_id: SRC-SEAG
        locator: 'books/dokumen-pub-software-engineering-at-google-lessons-learned-from-programming-over-time-1nbsped-1492082791-9781492082798/chapters/019-chapter-11-testing-overview.md :: A Note on Code Coverage'
        contribution: Explains that coverage records execution rather than useful assertions or behavior protection, warns that numeric bars become ceilings, and redirects adequacy assessment to customer-visible behaviors, dependency breakage, stability, and context.
        relationship: direct_support
    confidence: strong
