  - id: implementation-comments-first-design-probe
    title: Use comments-first as an optional design probe
    category: implementation
    claim: Drafting the interface contract and high-level implementation intent before code can expose an incoherent abstraction while redesign is cheap, but it is an optional probe rather than a universal workflow.
    decision_rule: Use the probe when a new routine or boundary is hard to explain concisely; draft caller-facing obligations and intent-level steps, redesign if the prose exposes leakage or parameter complexity, then retain only durable non-obvious information.
    why_it_matters: A difficult contract is easier to reconsider before implementation details and tests anchor the first design.
    applicable_when: [new shared routine, API design, unfamiliar algorithm, consequential abstraction]
    not_applicable_when: [mechanical edits, repository workflows that use an equivalent executable design artifact]
    required_evidence: [unsettled interface or algorithm, meaningful redesign latitude, repository acceptance of the workflow]
    insufficient_evidence: [belief that every line needs a comment, desire for documentation volume]
    required_inputs: [intended abstraction, caller obligations, implementation outline]
    expected_outputs: [clearer contract and structure, retained stable commentary, or evidence to reject the candidate abstraction]
    preservation_boundaries: [repository workflow, no stale speculative comments, no documentation promise before authorization]
    safe_actions: [draft contract comments, intent pseudocode, compare alternative interfaces]
    unsafe_actions: [retain speculative prose as accepted behavior, force comments-first on a team, narrate final mechanics]
    common_failure_modes: [comment-first cargo cult, prose frozen before requirements, stale pseudocode, implementation detail in public contract]
    counterexamples: [A test example or type signature may be the repository's clearer design probe for a small routine.]
    interactions: [The probe complements alternative-design comparison and test-first feedback; task evidence selects the ordering.]
    conflicts: [conflict-comments-vs-self-documenting-structure]
    source_support:
      - source_id: SRC-APOSD
