  - id: testing-design-before-feature-tests
    title: Design shared abstractions before feature tests freeze them
    category: implementation
    claim: When a new shared module's responsibility and interface are unsettled, compare the broader abstraction and caller alternatives before individual feature tests dictate a tactical structure.
    decision_rule: Assess whether the work creates a reusable boundary with multiple consumers or durable compatibility; if so, model responsibilities and alternative interfaces first, then express accepted behavior as tests. Otherwise use the shortest feedback sequence that preserves behavior.
    why_it_matters: Tests written around the first decomposition can make an accidental interface costly to reconsider without supplying architectural evidence.
    applicable_when: [new shared module, public API, durable library boundary, domain abstraction]
    not_applicable_when: [localized defect repair, established interface, mechanical implementation]
    required_evidence: [abstraction uncertainty, consumer and compatibility scope, alternative interfaces, repository architecture]
    insufficient_evidence: [dislike of TDD, desire for a large design document, hypothetical future consumers]
    required_inputs: [responsibility model, consumers, interface alternatives, risk and reversibility]
    expected_outputs: [selected coherent interface followed by contract-derived tests]
    preservation_boundaries: [no unaccepted semantic invention, design effort proportional to risk, executable feedback remains close]
    safe_actions: [compare two interfaces, sketch caller usage, define invariant ownership, then test the selected contract]
    unsafe_actions: [complete architecture up front for a local helper, postpone executable feedback indefinitely, use design authority not granted]
    common_failure_modes: [architecture astronomy, test-frozen tactical API, document without executable contract]
    counterexamples: [A defect regression should normally fail before the repair even when the containing module has design debt.]
    interactions: [This sequence competes with test-first only where abstraction uncertainty is material.]
