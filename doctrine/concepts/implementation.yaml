  - id: implementation-documentation-lifecycle
    title: Give durable documentation a code-like lifecycle
    category: implementation
    claim: Durable technical documentation needs canonical ownership, source control, change review with the code it describes, issue tracking, and periodic freshness checks so duplicate or stale sources are consolidated or deprecated.
    decision_rule: For documentation used to build, operate, integrate with, or change the system, identify its consumers, owner, canonical location, coupled code or contract, review path, freshness signal, and retirement rule; keep it with the authoritative source when practical and classify temporary notes explicitly.
    why_it_matters: Ownerless or duplicated documentation drifts from executable reality, makes readers choose among conflicting claims, and leaves the people who detect errors unable to route repairs.
    applicable_when:
      - creating or reviewing public API documentation
      - maintaining operator or developer guides
      - recording durable architecture and repository guidance
    not_applicable_when:
      - temporary investigation notes with an explicit expiry
      - generated documentation whose generator is the maintained authority
    required_evidence:
      - identified document consumers and purpose
      - canonical source and accountable owner
      - coupling between the document and code or contract
      - freshness, issue, review, and deprecation route
    insufficient_evidence:
      - the document exists in a popular wiki
      - a recent modification timestamp alone
      - a request to document everything
      - multiple copies that happen to agree today
    required_inputs:
      - accepted code and contract state
      - repository documentation conventions
      - ownership and review boundaries
      - existing duplicates and inbound links
    expected_outputs:
      - canonical documentation location and owner
      - change and review policy tied to affected code
      - freshness and issue signal
      - consolidation or deprecation disposition for duplicates
    preservation_boundaries:
      - accepted contract meaning
      - repository history and attribution
      - valid inbound links or an explicit redirect plan
      - human authority over policy and acceptance
    safe_actions:
      - update documentation in the same change as its coupled code
      - assign an owner and issue route
      - consolidate duplicates into a canonical source with redirects
      - mark temporary or generated material explicitly
    unsafe_actions:
      - silently create a second canonical source
      - infer policy from stale prose over executable contracts
      - delete documentation only because it is old
      - treat a passing freshness check as human acceptance
    common_failure_modes:
      - ownerless wiki rot
      - duplicate sources that disagree
      - documentation review detached from code review
      - freshness metrics optimized without reader value
    counterexamples:
      - A disposable scratch note can remain outside this lifecycle when it is clearly noncanonical and expires.
    interactions:
      - Complements implementation-non-obvious-commentary for durable context beyond code and universal-repository-contract-precedence when prose conflicts with executable state.
    conflicts:
      - conflict-comments-vs-self-documenting-structure
    source_support:
