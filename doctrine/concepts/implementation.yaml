  - id: implementation-duplication-as-evidence
    title: Treat duplication as evidence about knowledge
    category: implementation
    claim: Duplication is harmful when multiple representations encode one authoritative rule or must change together; similar code with independent ownership may be safer than a premature common abstraction.
    decision_rule: Determine whether occurrences represent the same knowledge, have the same reasons to change, and logically or historically require coordinated edits; extract only when the shared concept has a coherent contract and lowers total coupling and caller cost.
    why_it_matters: Blind deduplication creates wrong commonality, while duplicated knowledge causes inconsistent repairs and change amplification.
    applicable_when: [duplicate-code finding, helper or base-class proposal, generated representation, cache, repeated policy]
    not_applicable_when: [generated derivatives with one authoritative generator, independent algorithms that only look alike]
    required_evidence: [semantic equivalence, knowledge authority, ownership and change reasons, co-change where available, candidate contract and cost]
    insufficient_evidence: [token similarity, two occurrences, clone metric, shared syntax]
    required_inputs: [occurrences and owners, requirements, history, generator or cache semantics]
    expected_outputs: [extract, generate, retain, or centralize-authority decision with consistency mechanism]
    preservation_boundaries: [independent evolution, performance and behavior, generated-file workflow, external contracts]
    safe_actions: [centralize one rule, use active generation, extract a bounded helper, record deliberate duplication when non-obvious]
    unsafe_actions: [inheritance solely for reuse, generic abstraction before variation stabilizes, edit generated copies independently]
    common_failure_modes: [wrong abstraction, coupled independent domains, synchronization drift, parameterized commonality with flags]
    counterexamples: [A performance cache deliberately duplicates state when one explicit update and invalidation authority controls it.]
    interactions: [Duplication supplies pressure for abstraction but cannot by itself prove that an abstraction is earned.]
    conflicts: [conflict-abstraction-vs-duplication]
    source_support:
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/007-chapter-2-a-pragmatic-approach.md :: **7** The Evils of Duplication"
        contribution: Defines harmful duplication as multiple representations of one piece of knowledge.
