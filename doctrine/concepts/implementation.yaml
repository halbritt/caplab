    not_applicable_when: ["the component is sequential and has no asynchronous resource waits"]
    required_evidence: ["resource and wait-for graph", "global lock or acquisition order", "termination, retry, and fairness observations"]
    insufficient_evidence: ["race detector passes", "no deadlock occurred in one test"]
    required_inputs: ["concurrency topology and resources", "progress and fairness requirements"]
    expected_outputs: ["progress contract and lock order", "deadlock, livelock, and starvation test plan"]
    preservation_boundaries: ["safety invariants while improving progress", "resource ownership and cancellation"]
    safe_actions: ["define a global acquisition order", "bound retries and critical sections", "observe blocked and starved work"]
    unsafe_actions: ["fix deadlock by adding sleeps", "assume memory locks are the only contended resources"]
    common_failure_modes: ["deadlock", "livelock", "starvation", "priority inversion"]
    conflicts: ["conflict-concurrency-vs-sequential-simplicity", "conflict-efficiency-vs-resilience-margin"]
