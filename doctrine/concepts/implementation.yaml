  - id: implementation-repository-language-conformance
    title: Conform language choices to the repository toolchain
    category: implementation
    claim: A language idiom or mechanism is appropriate only when current repository versions, tooling, neighboring code, public compatibility, and runtime semantics support it and it improves the authorized task.
    decision_rule: Verify compiler or interpreter floor, dependency matrix, build and static tools, local conventions, and affected public behavior before introducing a construct; preserve an established alternative when migration cost exceeds task benefit.
    why_it_matters: Technically valid language features can break supported environments, confuse maintainers, or silently change API and runtime behavior.
    applicable_when: [any language-specific implementation or modernization, new syntax, concurrency mechanism, type-system feature]
    not_applicable_when: [generated or vendored code unless its producing workflow is the target]
    required_evidence: [repository version and dependency contract, CI and build matrix, formatter and static-tool configuration, adjacent code, behavior tests]
    insufficient_evidence: [feature newness, source-book preference, isolated REPL or benchmark success, generic best practice]
    required_inputs: [task behavior, repository toolchain, compatibility and API commitments]
    expected_outputs: [compatible idiomatic implementation or explicit migration proposal]
    preservation_boundaries: [build and import compatibility, public signatures, serialization, repository conventions]
    safe_actions: [reuse supported standard protocols, follow local error and formatting conventions, note a deliberate version-dependent choice]
    unsafe_actions: [raise a version floor silently, perform drive-by modernization, replace local conventions with source preference]
    common_failure_modes: [toolchain incompatibility, style migration hidden in feature work, version-sensitive runtime assumption]
    counterexamples: [Greenfield code with an explicit current-version floor may adopt current idioms immediately.]
    interactions: [This is the implementation specialization of repository-contract precedence; language files supply mechanism-specific rules.]
    conflicts: [conflict-uniformity-vs-context-sensitive-design]
    source_support:
