  - id: "implementation-concurrency-progress-contract"
    title: "Protect progress as well as shared state"
    category: "implementation"
    claim: "Concurrent correctness requires progress as well as race freedom: designs must account for deadlock, livelock, starvation, lock ordering, and fairness across every contended resource."
    decision_rule: "Alongside safety invariants, specify progress and fairness expectations; inspect wait-for cycles, lock order, retry behavior, critical-section duration, and contention across memory and non-memory resources."
    why_it_matters: "Code can be data-race-free yet never complete or provide equitable access because of deadlock, livelock, starvation, or resource cycles."
