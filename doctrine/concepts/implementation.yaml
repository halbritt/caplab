  - id: implementation-risk-driven-tests
    title: Derive protection from contract and risk
    category: implementation
    claim: Tests and characterization should protect observable contracts, invariants, boundary values, state transitions, failure and resource paths, and repaired regressions at the smallest level that can observe them without binding to irrelevant internals.
    decision_rule: Inventory nominal and invalid equivalence classes, boundaries, states, data flow, side effects, cleanup, integrations, and observed defects; select test levels and oracles for consequence and observability, and record residual gaps.
    why_it_matters: Different defect classes escape different methods, and line execution does not establish that meaningful behavior is protected.
    applicable_when: [new behavior, repair, refactoring, legacy change, optimization, integration]
    not_applicable_when: [generated or vendored code protected at its generator or adapter boundary unless directly maintained]
    required_evidence: [accepted behavior, risk and boundary inventory, current suite, defect reproduction when applicable, observable oracle]
    insufficient_evidence: [coverage percentage, happy path, snapshot with no semantic oracle, mocks of implementation choreography]
    required_inputs: [contract, preservation boundary, risks, seams, test infrastructure]
    expected_outputs: [test and characterization matrix, required level and oracle, explicit gaps and uncertainty]
    preservation_boundaries: [tests do not silently redefine desired behavior, public testability does not leak internals, nondeterminism is controlled]
    safe_actions: [regression test before repair, boundary table, contract fake, deterministic property generator, failure cleanup test]
    unsafe_actions: [change tests merely to accept code, expose internals publicly for convenience, claim unrelated passing tests as path proof]
    common_failure_modes: [implementation-coupled test, flaky concurrency test, asserted mock choreography, untested cleanup, characterization mislabeled as requirement]
    counterexamples: [A characterization test may record undocumented behavior without claiming that behavior is correct.]
    interactions: [Static typing, profiling, and review complement executable protection but cannot substitute for the relevant behavioral oracle.]
    source_support:
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/031-chapter-22-developer-testing.md :: 22.3 Bag of Testing Tricks"
