  - id: testing-test-first-feedback
    title: Use test-first when it improves contract feedback
    category: implementation
    claim: Writing a failing behavioral test before implementation is valuable when it clarifies an accepted contract, reproduces a defect, or creates a close preservation gate; it is not proof that the resulting design is coherent.
    decision_rule: Prefer test-first for defect repair and well-understood behavior with an observable oracle; for unsettled shared abstractions, first establish enough interface and responsibility design that tests do not freeze the first tactical decomposition.
    why_it_matters: Test-first can shorten feedback and expose testability, but feature-by-feature tests can anchor accidental interfaces when the abstraction itself is unresolved.
    applicable_when: [defect repair, contract implementation, behavior-preserving change, well-specified feature]
    not_applicable_when: [unknown desired behavior, exploratory spike without a stable oracle]
    required_evidence: [accepted expected behavior, observable failing condition, suitable test level, design uncertainty assessment]
    insufficient_evidence: [workflow fashion, test count, a test written first but never observed failing]
    required_inputs: [behavior contract, current behavior, test seam, abstraction maturity]
    expected_outputs: [observed failing test, focused implementation feedback, retained regression protection]
    preservation_boundaries: [test does not invent product semantics, public surface is not widened for convenience]
    safe_actions: [write a minimal failing regression, verify failure reason, implement to the contract]
    unsafe_actions: [change test and code until both agree, mock internals into a frozen design, claim test-first as design proof]
    common_failure_modes: [false red, implementation-coupled test, tactical API, test-only public seam]
    counterexamples: [An algorithmic prototype may need an experiment before a stable expected result can be specified.]
    interactions: [The competing design-first sequence is selected by abstraction uncertainty, not by compromise or preference.]
