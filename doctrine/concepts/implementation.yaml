  - id: implementation-representation-fit
    title: Select representation from semantics and operations
    category: implementation
    claim: Control and data representations should be chosen from required invariants, ownership, mutation, ordering, access, scale, and materialization needs before habit or speculative performance.
    decision_rule: State the operations and semantic laws first, choose the simplest repository-idiomatic representation that satisfies them, and require measurement before accepting a more complex representation solely for speed or memory.
    why_it_matters: A mismatched representation hides invariants, creates accidental quadratic work, leaks storage choices into APIs, and increases aliasing or lifetime risk.
    applicable_when: [data-structure selection, state model, collection-heavy code, serialization boundary, algorithm implementation]
    required_evidence: [required operations and invariants, ownership and mutation, ordering and uniqueness, expected scale, workload evidence for optimization]
    insufficient_evidence: [favorite container, theoretical compactness, microbenchmark that omits conversion, existing type name]
    required_inputs: [behavioral semantics, access and mutation profile, repository and language options]
    expected_outputs: [representation decision, boundary conversions, tests for semantic laws]
    preservation_boundaries: [ordering, duplicates, precision, equality, ownership and aliasing, public representation compatibility]
    safe_actions: [use a standard fitting representation, localize conversion, stream only when lifetime semantics fit]
    unsafe_actions: [convert to a set when order matters, leak internal storage publicly, introduce low-level buffers in cold code]
    common_failure_modes: [habitual list or map, representation leakage, accidental quadratic operation, retained backing storage]
    counterexamples: [A small fixed configuration collection should favor clarity over theoretical compactness.]
    interactions: [Python and performance lenses refine concrete container, streaming, cache, and allocation decisions.]
    source_support:
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/017-chapter-10-general-issues-in-using-variables.md :: 10.8 Using Each Variable for Exactly One Purpose"
        contribution: Connects data representation and variable roles to understandable state and control.
