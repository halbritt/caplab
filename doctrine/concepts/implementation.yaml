  - id: implementation-dependency-adoption-gate
    title: Price a dependency across its maintenance horizon before adoption
    category: implementation
    claim: Adopt an external dependency only after its behavior, testability, provider stewardship, compatibility promise, expected lifespan and breaking cadence, internal alternative cost, and upgrade ownership and cost have been evaluated for the product maintenance horizon.
    decision_rule: State the capability needed and expected lifespan; compare an internal implementation, direct platform use, and candidate dependencies across current fit, test evidence, compatibility, security, transitive surface, provider incentives, upgrade cadence, migration cost, and named ownership; adopt the lowest total-lifecycle-cost option or defer when material evidence is absent.
    why_it_matters: Importing code is cheap today but creates future compatibility, security, build, upgrade, and ownership obligations that can exceed the implementation cost avoided.
    applicable_when:
      - adding a package, framework, plugin, SDK, or service dependency
      - replacing an internal implementation with a third-party dependency
      - reviewing a dependency introduced transitively
    not_applicable_when:
      - the dependency is already mandated by an accepted repository contract and the task does not reconsider it
    required_evidence:
      - demonstrated capability need and expected usage horizon
      - runnable tests and observed behavior of the candidate
      - provider ownership, compatibility promise, and release history
      - security and transitive-dependency posture
      - named internal upgrade and incident owner
      - credible internal or platform alternative and migration cost
    insufficient_evidence:
      - popularity alone
      - one successful local example
      - latest version status
      - reputation without compatibility evidence
      - a test double proving only the consumer assumption
    required_inputs:
      - repository dependency and toolchain policy
      - supported runtimes and deployment targets
      - candidate release and compatibility records
      - consumer and upgrade ownership
    expected_outputs:
      - adopt, build, use-platform, prototype, or defer decision
      - version and compatibility boundary
      - upgrade and vulnerability response owner
      - reversal or migration plan proportional to lock-in
    preservation_boundaries:
      - supported runtime and public compatibility
      - build reproducibility and provenance
      - security policy
      - existing dependency owners and licenses
    safe_actions:
      - prototype behind a disposable seam
      - pin and verify an approved dependency
      - record upgrade ownership and removal conditions
      - prefer a smaller surface that satisfies the demonstrated need
    unsafe_actions:
      - adopt because reimplementation feels wasteful without lifecycle comparison
      - use an unmaintained dependency without an explicit containment plan
      - leave upgrade ownership implicit
      - confuse a lockfile with a security or compatibility assessment
    common_failure_modes:
      - orphaned dependency
      - forced upgrade with no migration budget
      - transitive dependency explosion
      - provider promise misunderstood
      - internal wrapper that hides rather than reduces lock-in
    counterexamples:
      - A short-lived isolated experiment may use a disposable dependency if it cannot enter production or a public contract.
    interactions:
      - Specializes architecture-framework-commitment for imported code and precedes operations-dependency-vulnerability-currency and operations-build-provenance after adoption.
    conflicts:
      - conflict-generalized-reuse-vs-local-clarity
    source_support:
      - source_id: SRC-SEAG
        locator: 'books/dokumen-pub-software-engineering-at-google-lessons-learned-from-programming-over-time-1nbsped-1492082791-9781492082798/chapters/030-chapter-21-dependency-management.md :: Considerations When Importing'
        contribution: Provides a pre-import question set covering runnable tests, provider and supported-use evidence, compatibility and breaking cadence, expected duration, internal implementation cost, upgrade incentives, owner, and expected upgrade difficulty.
