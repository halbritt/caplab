schema_version: agent-doctrine-concepts/1
concepts:
  - id: implementation-readiness
    title: Scale implementation readiness to risk
    category: implementation
    claim: Consequential coding should begin only after the intended outcome, affected contracts, placement constraints, failure and resource policy, verification route, and integration path are understood at a depth proportional to consequence and uncertainty.
    decision_rule: If the agent cannot state those elements, gather the missing evidence or choose an explicitly disposable, reversible experiment; require more formal readiness for public, durable, distributed, security-sensitive, or hard-to-reverse work.
    why_it_matters: Missing prerequisites force implementation to invent product semantics and architecture while making verification ambiguous.
    applicable_when: [feature implementation, behavior change, public API work, new dependency, durable system change]
    not_applicable_when: [bounded read-only investigation, explicitly disposable prototype]
    required_evidence: [accepted problem and outcome, current relevant behavior, repository placement constraints, risk class, verification and integration route]
    insufficient_evidence: [ticket title alone, analogous code from another repository, presumed user intent, pressure to start]
    required_inputs: [task contract, authority boundary, repository state, affected consumers, operational constraints]
    expected_outputs: [readiness decision, explicit gaps and assumptions, bounded implementation plan, verification gates]
    preservation_boundaries: [behavior outside authorized change, public and data compatibility, accepted architecture, operational safety]
    safe_actions: [inspect analogous paths, clarify missing behavior, identify a thin end-to-end slice, document unresolved assumptions]
    unsafe_actions: [invent business rules, select architecture by habit, start a broad change without a verification route]
    common_failure_modes: [solution-first coding, analysis paralysis, unbounded prerequisite documents, hidden semantic assumptions]
    counterexamples: [A short-lived internal script with obvious inputs and outputs can use a lightweight readiness check.]
    interactions: [Readiness specializes evidence-before-intervention for implementation planning; it does not demand complete up-front design.]
    source_support:
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/008-chapter-3-measure-twice-cut-once-upstream-prerequisites.md :: cc2e.com/0386 Checklist: Upstream Prerequisites"
        contribution: Enumerates the problem, requirements, architecture, testing, error, resource, and project-practice prerequisites for construction.
        relationship: direct_support
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/012-chapter-7-before-the-project.md :: **36** The Requirements Pit"
        contribution: Requires discovery of the underlying need and separation of policy from implementation before commitment.
        relationship: corroboration
    confidence: strong
    roles: [coding-agent, implementation-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [implementation readiness, prerequisites, risk, requirements, verification plan]
    routing:
      activate_for_roles: [coding-agent, implementation-agent, review-agent]
      activate_for_tasks: [plan-implementation, implement-feature, change-public-API, introduce-dependency]
      activate_for_repository_signals: [unclear requirement, cross-module change, public contract, durable state, weak verification]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [all]
      exclude_when: [the work is read-only observation]
      prerequisites: [task scope and repository orientation]
      retrieval_priority: core
      retrieval_budget_hint: 330
      related_concepts: [universal-evidence-before-intervention, universal-repository-contract-precedence, implementation-placement-by-ownership, implementation-risk-driven-tests]

  - id: implementation-placement-by-ownership
    title: Place behavior with its knowledge and invariants
    category: implementation
    claim: New behavior belongs in the smallest existing owner of the relevant state, policy, invariant, or hidden design decision that can expose a coherent contract without importing unrelated concerns.
    decision_rule: Trace inputs, owned data, invariants, side effects, failure policy, and callers; prefer the owner that implements the behavior without duplicating knowledge or exposing representation, and create a new owner only when no existing module has semantic ownership and a coherent boundary is earned.
    why_it_matters: Placement determines change locality, duplication, caller complexity, and the amount of system context needed for a safe change.
    applicable_when: [new behavior, defect repair placement, helper extraction, module or class selection]
    not_applicable_when: [generated or vendored code unless its generator or adapter is the authorized target]
    required_evidence: [data and policy ownership, relevant invariants, existing interfaces and callers, accepted dependency direction, recurring change evidence when available]
    insufficient_evidence: [directory names alone, file size, diagram symmetry, generic layered-architecture preference]
    required_inputs: [behavior contract, dependency and ownership map, caller needs, repository conventions]
    expected_outputs: [placement decision with rationale, interface impact, preservation boundary]
    preservation_boundaries: [state and transaction ownership, public behavior, resource lifetime, accepted dependency direction]
    safe_actions: [extend a coherent owner, add a private helper, introduce a bounded external adapter]
    unsafe_actions: [put policy in a utility grab-bag, copy authoritative knowledge across modules, move behavior only to shrink a file]
    common_failure_modes: [temporal decomposition, feature-envy diagnosis without ownership analysis, context-object grab-bag, domain policy placed by technical layer]
    counterexamples: [A dispatcher may own routing rather than domain state, and an adapter may legitimately translate an external contract.]
    interactions: [Domain ownership can refine placement, but directory or type names cannot establish it by themselves.]
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/010-5-information-hiding-and-leakage.md :: 5: Information Hiding (and Leakage)"
        contribution: Places decisions with the module that can hide their knowledge and representation.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/011-chapter-5-design-in-construction.md :: Assign Responsibilities"
        contribution: Endorses asking what each object should be responsible for, framed as a broader form of information hiding.
        relationship: corroboration
    confidence: strong
    roles: [coding-agent, architecture-agent, refactoring-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [behavior placement, ownership, responsibility, invariants, data owner, change locality]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, refactoring-agent, review-agent]
      activate_for_tasks: [place-new-behavior, move-code, repair-defect, design-module]
      activate_for_repository_signals: [duplicated rule, cross-module state access, utility module, pass-through layer]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [correctness, maintainability, architecture]
      exclude_when: [the target is generated or vendored and its authority surface is out of scope]
      prerequisites: [behavior contract and ownership evidence]
      retrieval_priority: core
      retrieval_budget_hint: 360
      related_concepts: [universal-information-hiding, universal-local-reasoning, universal-change-amplification, implementation-minimal-coherent-api]

  - id: implementation-minimal-coherent-api
    title: Expose a minimal coherent API contract
    category: implementation
    claim: An API must state the non-obvious meaning callers depend on while exposing no more mechanism, configuration, or surface than demonstrated consumers require.
    decision_rule: Inventory real consumers and specify inputs, outputs, units, ranges, ownership, mutation, ordering, side effects, failure, concurrency, lifecycle, and compatibility; remove a surface only if callers retain the required capability, and add indirection only when it hides coherent complexity or enables demonstrated variation.
    why_it_matters: A signature alone omits material obligations, while oversized or pass-through APIs increase compatibility burden and leak decisions.
    applicable_when: [new or changed API, library surface, service contract, module boundary, callback or protocol]
    not_applicable_when: [purely local expression with no reusable contract]
    required_evidence: [actual consumers and operations, repository compatibility policy, invariants and failure semantics, ownership and lifecycle requirements]
    insufficient_evidence: [method count, symmetry, hypothetical reuse, interface added only for a test double]
    required_inputs: [consumer inventory, behavior contract, alternatives, compatibility and operational constraints]
    expected_outputs: [documented contract, minimal surface decision, compatibility and test plan]
    preservation_boundaries: [caller-visible behavior, errors, ordering, mutation and ownership, latency or resource properties when contractual]
    safe_actions: [use a direct concrete dependency when it hides nothing, expose a small consumer-earned protocol, document non-obvious obligations]
    unsafe_actions: [expose internals for test convenience, add pass-through wrappers, hide remote or expensive work as an ordinary cheap call]
    common_failure_modes: [signature-only contract, configuration leakage, parameter soup, accidental public surface, shallow interface]
    counterexamples: [A stable public library may need deliberate extension points established by an accepted compatibility mission.]
    interactions: [Language protocols refine how the contract is expressed; they do not replace consumer and semantic evidence.]
    source_support:
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/009-chapter-4-pragmatic-paranoia.md :: **21** Design by Contract"
        contribution: Defines preconditions, postconditions, and invariants as caller and implementation obligations.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/013-chapter-7-high-quality-routines.md :: 7.5 How to Use Routine Parameters"
        contribution: Requires explicit parameter direction, valid ranges, units, effects, and abstraction assumptions.
        relationship: corroboration
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/018-13-comments-should-describe-things-that-arent-obvious-from-the-code.md :: 13: Comments Should Describe Things that Aren’t Obvious from the Code"
        contribution: Extends the interface to all non-obvious facts a caller must know.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [API contract, consumer, precondition, postcondition, side effect, minimal interface]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, review-agent]
      activate_for_tasks: [design-API, review-API, add-interface, change-public-contract]
      activate_for_repository_signals: [public symbol, interface, protocol, service endpoint, configuration parameter]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [compatibility, correctness, maintainability, operational]
      exclude_when: [there is no boundary or reusable contract]
      prerequisites: [consumer and contract inventory]
      retrieval_priority: core
      retrieval_budget_hint: 390
      related_concepts: [universal-earned-abstraction, universal-information-hiding, universal-explicit-invariants, implementation-explicit-failure-policy]

  - id: implementation-explicit-failure-policy
    title: Make failure policy explicit
    category: implementation
    claim: Errors and exceptional conditions are part of an interface and need explicit caller-relevant meaning, recovery ownership, propagation, retry, logging, cleanup, partial-effect, and termination semantics.
    decision_rule: Classify each outcome as normal result, recoverable failure, retryable condition, invariant violation, or unrecoverable state; choose the repository- and language-appropriate mechanism that preserves cause and context, and select fail-fast or continued service from correctness, availability, durability, and containment requirements.
    why_it_matters: Improvised handling loses causes, duplicates reporting, retries unsafe work, leaks resources, or continues after state can no longer be trusted.
    applicable_when: [API design, I/O, validation, persistence, distributed calls, repair, operational hardening]
    required_evidence: [caller recovery needs, product correctness and availability policy, side effects and idempotency, language and repository convention, cleanup obligations]
    insufficient_evidence: [personal exception preference, a catch-all handler, belief that an operation cannot fail, success-path tests]
    required_inputs: [operation contract, failure modes, caller and containment boundary, resource lifecycle, authority]
    expected_outputs: [failure taxonomy, mechanism and ownership decision, tests for material paths, observability policy]
    preservation_boundaries: [caller-relevant cause and context, partial-effect and retry semantics, data integrity, cleanup and shutdown behavior]
    safe_actions: [return or raise at the responsible boundary, attach stable context once, make idempotent absence a natural result when authorized]
    unsafe_actions: [catch and ignore, double-log and return without policy, retry non-idempotent work blindly, continue after possible corruption]
    common_failure_modes: [ambiguous null or zero, handler proliferation, retry storm, partial commit, lost root cause, leaked resource]
    counterexamples: [Deleting an already absent item may naturally succeed, but failing to persist acknowledged data cannot be defined away.]
    interactions: [Error-surface reduction and mechanism choice are subordinate to this semantic contract.]
    source_support:
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/014-chapter-8-defensive-programming.md :: 8.3 Error-Handling Techniques"
        contribution: Compares return values, retries, propagation, logging, shutdown, and exceptions against system policy.
        relationship: direct_support
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/009-chapter-4-pragmatic-paranoia.md :: What Is Exceptional?"
        contribution: Separates ordinary outcomes from failures outside normal operation semantics.
        relationship: refinement
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/015-10-define-errors-out-of-existence.md :: 10: Define Errors Out Of Existence"
        contribution: Reduce exception complexity by hiding implementation-local failures, not caller-relevant failures.
        relationship: refinement
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/006-chapter-2-efficient-introduction-to-go.md :: Single Way of Handling Errors"
        contribution: Refines the policy for Go's explicit error control flow and causal context.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/007-chapter-2-case-study.md :: The Smoking Gun"
        contribution: Documents a whole-enterprise outage caused by a cleanup path that could itself throw - a spec-permitted exception from a close() call skipped the connection close, leaking pooled connections until exhaustion - showing cleanup and error paths are part of the failure contract.
        relationship: corroboration
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/015-chapter-9-interconnect.md :: Migratory Virtual IP Addresses"
        contribution: Callers through a migratory failover virtual IP must expect mid-connection IO errors when the address moves, distinguish them from destination-unreachable, know that uncommitted in-flight work is lost, and retry against the new node only within circuit-breaker-style limits.
        relationship: corroboration
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [failure policy, error semantics, exception, retry, fail fast, recovery, partial commit]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
      activate_for_tasks: [design-API, implement-I-O, repair-failure, resilience-review, operational-hardening]
      activate_for_repository_signals: [error return, exception, retry, catch, partial write, shutdown]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [correctness, availability, durability, data-integrity]
      exclude_when: [the code path cannot produce or observe a failure]
      prerequisites: [operation and caller contract]
      retrieval_priority: core
      retrieval_budget_hint: 420
      related_concepts: [universal-explicit-invariants, universal-preserve-behavior-by-default, performance-resource-lifecycle, implementation-error-surface-reduction]

  - id: implementation-error-surface-reduction
    title: Reduce error surfaces without erasing failure meaning
    category: implementation
    claim: Error handling may be simplified by natural total semantics, reliable masking, or aggregation at a useful boundary only when the change preserves caller-relevant failure information and operational safety.
    decision_rule: For each proposed eliminated handler, prove that the operation's new semantics are natural for callers, the lower-level failure is fully contained, or a higher boundary owns an equivalent decision; otherwise retain explicit propagation.
    why_it_matters: Repeated low-level handling increases complexity, but defining away a material failure converts visible risk into silent corruption or misleading success.
    applicable_when: [repeated error handling, idempotent API design, low-level mechanism errors, batch or transaction boundaries]
    not_applicable_when: [failures whose distinction controls durability, compensation, authorization, or user-visible recovery]
    required_evidence: [caller decisions that depend on the failure, containment guarantee, natural total semantics, aggregation and observability design]
    insufficient_evidence: [fewer branches, dislike of exceptions, catch-all success, rare occurrence]
    required_inputs: [failure taxonomy, caller behavior, containment and retry semantics]
    expected_outputs: [retained, masked, aggregated, or defined-away decision with preservation proof]
    preservation_boundaries: [cause information needed by callers, data integrity, retry and compensation semantics, operational visibility]
    safe_actions: [make deletion idempotent when authorized, translate stable low-level failures, aggregate related failures at an owning boundary]
    unsafe_actions: [turn persistence failure into success, mask partial commit, remove error detail needed for recovery]
    common_failure_modes: [false success, lost cause, duplicated translation, inaccessible operational failure]
    counterexamples: [A module may reliably hide transient storage retries if it owns idempotency, limits, and final failure reporting.]
    interactions: [This pattern reduces handling sites; it does not choose the product's fail-fast or recovery policy.]
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/015-10-define-errors-out-of-existence.md :: 10: Define Errors Out Of Existence"
        contribution: Defines natural semantics, masking, and aggregation as ways to reduce avoidable exception complexity.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/014-chapter-8-defensive-programming.md :: 8.3 Error-Handling Techniques"
        contribution: Requires a consistent system-level error policy rather than call-site improvisation.
        relationship: corroboration
    confidence: contextual
    roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, distributed-system]
    retrieval_terms: [define errors away, mask failure, aggregate errors, idempotent semantics, error surface]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
      activate_for_tasks: [simplify-error-handling, design-idempotent-API, translate-failure]
      activate_for_repository_signals: [repeated handlers, low-level error leakage, idempotent operation, batch failure]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [correctness, durability, availability]
      exclude_when: [callers require the exact failure distinction]
      prerequisites: [implementation-explicit-failure-policy]
      retrieval_priority: high
      retrieval_budget_hint: 320
      related_concepts: [implementation-explicit-failure-policy, universal-information-hiding, performance-resource-lifecycle]

  - id: implementation-fail-fast-or-recover
    title: Select fail-fast or recovery from system consequences
    category: implementation
    claim: Continuing, containing, retrying, degrading, or terminating after failure is a product and operational tradeoff, not a universal coding preference.
    decision_rule: Fail fast when state or results cannot be trusted and containment cannot protect consumers; recover or degrade when the repository has an explicit safe boundary, valid fallback, and availability requirement, while preserving evidence of the failure.
    why_it_matters: Crashing an availability-critical service can be needless, while continuing after corruption can compound data loss and make diagnosis harder.
    applicable_when: [invariant violation, corrupted state, dependency outage, embedded or service failure, durability-sensitive operation]
    required_evidence: [trustworthiness of current state, containment boundary, correctness and availability requirements, restart and recovery behavior, data-loss consequence]
    insufficient_evidence: [crash-dont-trash slogan, uptime preference alone, rare failure, broad catch handler]
    required_inputs: [failure classification, deployment model, recovery and restart contract, consequence analysis]
    expected_outputs: [terminate, isolate, retry, degrade, or continue decision with explicit boundary and verification]
    preservation_boundaries: [data integrity, acknowledged work, availability target, diagnostic evidence]
    safe_actions: [stop an untrustworthy worker while isolating peers, degrade a noncritical feature with observable status, restart through a proven supervisor]
    unsafe_actions: [continue after possible corruption, crash an entire service for a contained user error, hide fallback activation]
    common_failure_modes: [crash loop, silent degradation, cascading corruption, unavailable diagnostics]
    counterexamples: [A batch CLI may terminate on the first integrity failure even when a long-lived service would isolate one request.]
    interactions: [The decision assumes a prior failure taxonomy and may differ by repository archetype.]
    conflicts: [conflict-fault-tolerance-vs-let-it-crash]
    source_support:
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/009-chapter-4-pragmatic-paranoia.md :: Crash, Don't Trash"
        contribution: Supports termination before an impossible state compounds corruption.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/014-chapter-8-defensive-programming.md :: Robustness vs. Correctness"
        contribution: Exposes the contextual tradeoff between continued service and refusal of uncertain results.
        relationship: refinement
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/015-10-define-errors-out-of-existence.md :: 10: Define Errors Out Of Existence"
        contribution: Limits crash-based simplification to deployment contexts that can tolerate it.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Circuit Breaker"
        contribution: Corroborates that degraded-mode behavior is a business decision - what a caller does when a breaker is open, such as accepting an order without inventory confirmation, serving cached or generic answers, or calling a secondary, must be decided with system stakeholders rather than defaulted by engineers.
        relationship: corroboration
    confidence: contextual
    roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [service, CLI, embedded-system, distributed-system]
    retrieval_terms: [fail fast, recover, degrade, containment, crash, corruption]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
      activate_for_tasks: [design-failure-mode, repair-corruption, resilience-review]
      activate_for_repository_signals: [invariant violation, supervisor, fallback, degraded mode, crash]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [correctness, availability, durability, safety]
      exclude_when: [the outcome is an ordinary expected result]
      prerequisites: [implementation-explicit-failure-policy]
      retrieval_priority: high
      retrieval_budget_hint: 340
      related_concepts: [implementation-explicit-failure-policy, universal-explicit-invariants, performance-resource-lifecycle]

  - id: implementation-normal-result-or-exception
    title: Distinguish normal results from exceptional failures
    category: implementation
    claim: Expected domain outcomes belong in ordinary result or control semantics; exception-like mechanisms are appropriate only when the operation cannot fulfill its normal contract and the language and caller model support nonlocal failure flow.
    decision_rule: Define normality from the operation's contract and caller behavior, then compare result, status, exception, and total-semantics options for visibility, composition, cleanup, and repository consistency; never choose by slogan alone.
    why_it_matters: Treating expected outcomes as exceptions obscures normal flow, while encoding true failures as ambiguous values invites ignored errors.
    applicable_when: [API design, parsing, lookup, validation, I/O, language-level exception review]
    required_evidence: [operation contract, frequency and caller handling, language mechanism semantics, repository convention, cleanup behavior]
    insufficient_evidence: [rarity alone, personal preference, exception support in the language, fewer lines]
    required_inputs: [normal outcome set, failure taxonomy, callers, language and repository context]
    expected_outputs: [ordinary-result, exception, status, or total-semantics decision with caller examples]
    preservation_boundaries: [caller control flow, failure information, cleanup, compatibility]
    safe_actions: [return explicit absence when it is normal, raise or propagate when the normal contract cannot be met, document boundary translation]
    unsafe_actions: [use sentinel values indistinguishable from valid results, throw for routine branching, remove failure information to simplify a signature]
    common_failure_modes: [exception-driven normal flow, ignored status, ambiguous sentinel, incompatible translation]
    counterexamples: [A missing optional cache entry can be ordinary even when a missing required persisted record is a failure.]
    interactions: [This choice represents failure; it does not decide whether the surrounding system terminates or recovers.]
    source_support:
      - source_id: SRC-PP
        locator: "books/the-pragmatic-programmer/chapters/009-chapter-4-pragmatic-paranoia.md :: What Is Exceptional?"
        contribution: Defines exceptional conditions relative to an operation's normal semantics.
        relationship: direct_support
      - source_id: SRC-CC
        locator: "books/code-complete-2nd-edition-v413hav/chapters/014-chapter-8-defensive-programming.md :: 8.4 Exceptions"
        contribution: Compares exceptions with explicit error techniques using language and caller context.
        relationship: refinement
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/015-10-define-errors-out-of-existence.md :: 10: Define Errors Out Of Existence"
        contribution: Requires natural semantics when removing an error case.
        relationship: refinement
    confidence: contextual
    roles: [coding-agent, review-agent, architecture-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [normal result, exception, sentinel, status, absence, error representation]
    routing:
      activate_for_roles: [coding-agent, review-agent, architecture-agent]
      activate_for_tasks: [design-API, review-errors, translate-failure]
      activate_for_repository_signals: [exception, sentinel, optional result, status code]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [correctness, compatibility, maintainability]
      exclude_when: [no outcome or failure representation is being selected]
