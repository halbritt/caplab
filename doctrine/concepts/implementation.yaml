  - id: implementation-non-obvious-commentary
    title: Comment non-obvious contract and rationale
    category: implementation
    claim: Comments should preserve contract, rationale, invariant, unit, ownership, side effect, nonlocal relation, or tradeoff that correct code cannot make sufficiently obvious; they should not narrate mechanics.
    decision_rule: First improve misleading structure and names, then document what a maintainer must know but cannot reliably infer, at the highest stable abstraction level; update or remove the comment when its contract changes.
    why_it_matters: Missing rationale forces repeated rediscovery, while redundant or stale narration competes with executable truth and hides poor structure.
    applicable_when: [public or internal API, subtle invariant, workaround, nonlocal constraint, performance specialization, operational boundary]
    not_applicable_when: [generated comments, mechanical narration, obvious syntax]
    required_evidence: [reader-relevant fact not evident locally, stability of that fact, ownership for maintenance]
    insufficient_evidence: [low comment density, a desire to explain every line, confusing code left unimproved]
    required_inputs: [contract and rationale, intended audience, repository documentation convention]
    expected_outputs: [maintained abstraction-level comment or a code simplification that makes it unnecessary]
    preservation_boundaries: [public documentation promises, generated documentation, security-sensitive or operational detail]
    safe_actions: [document units and ownership, explain why a workaround remains, state an invariant near its authority]
    unsafe_actions: [repeat code in prose, excuse confusing structure, preserve obsolete implementation detail, expose secrets]
    common_failure_modes: [stale comment, narrated syntax, missing rationale, comment-code contradiction, commented-out code]
    counterexamples: [A short conventional loop rarely needs a prose description of each iteration.]
    interactions: [Comments complement obvious structure; they are neither a substitute for it nor categorically unnecessary.]
    conflicts: [conflict-comments-vs-self-documenting-structure]
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/018-13-comments-should-describe-things-that-arent-obvious-from-the-code.md :: 13: Comments Should Describe Things that Aren’t Obvious from the Code"
