  - id: implementation-unit-of-work-safe-default
    title: Make transactional mutation require explicit success
    category: implementation
    claim: A transactional unit of work should make no durable change unless its caller explicitly commits; normal exit, early exit, and exception otherwise roll back so one explicit success path owns mutation.
    decision_rule: Define the smallest transactional resource and consistency scope; enter it under one owner, perform reads and writes, verify invariants, and commit explicitly only after complete success; make every other exit roll back and treat irreversible external effects as separate obligations requiring an outbox, idempotence, or compensation.
    why_it_matters: Implicit commit and ambiguous transaction ownership turn early returns, exceptions, and partial work into durable state that callers cannot reason about or safely retry.
    applicable_when:
      - application use cases that mutate transactional state
      - repository and service-layer design
      - reviewing commit and rollback behavior
    not_applicable_when:
      - pure computation with no durable mutation
      - an indivisible external operation whose API itself is the transaction boundary
    required_evidence:
      - transactional resource and owner
      - aggregate or invariant boundary
      - all commit, rollback, early-exit, and exception paths
      - external side effects inside the scope
      - production-fidelity commit and rollback tests
    insufficient_evidence:
      - a class named UnitOfWork
      - use of a context manager alone
      - an ORM session with undocumented autocommit
      - mock-only verification of commit calls
    required_inputs:
      - use-case success contract
      - persistence and isolation semantics
      - failure and retry policy
      - external-effect inventory
    expected_outputs:
      - explicit transaction boundary and owner
      - single success commit path
      - default rollback behavior
      - test evidence for success, early exit, and failure
    preservation_boundaries:
      - domain invariants
      - durable data integrity
      - accepted transaction and isolation semantics
      - external effects that cannot be rolled back
    safe_actions:
      - require explicit commit after invariant checks
      - rollback in structured cleanup
      - test against the production database semantics
      - separate irreversible publication from the local transaction
    unsafe_actions:
      - commit implicitly on ordinary scope exit
      - hide writes behind multiple transaction owners
      - assume rollback reverses an external message or email
      - verify transaction behavior only with mocks
    common_failure_modes:
      - partial commit on early return
      - nested units of work with conflicting owners
      - external effect emitted before rollback
      - fake unit of work diverging from real isolation behavior
    counterexamples:
      - An immutable append API with one atomic call can expose that call itself as the explicit commit boundary.
    interactions:
      - Refines domain-aggregate-invariant-boundary with application transaction ownership and relies on python-structured-cleanup or an equivalent resource owner for cleanup.
    conflicts: []
    source_support:
      - source_id: SRC-APWP
        locator: 'books/architecture-patterns-with-python/chapters/011-chapter-6-unit-of-work-pattern.md :: Explicit Versus Implicit Commits'
        contribution: Compares implicit and explicit commit designs and prefers explicit commit plus default rollback because every path except complete success and deliberate commit leaves durable state unchanged.
        relationship: direct_support
