  - id: "implementation-atomicity-scope"
    title: "Define atomicity at the required scope"
    category: "implementation"
    claim: "Atomicity is defined relative to an explicit scope, and composing individually atomic operations does not make the compound operation atomic; protect the smallest scope that must be indivisible."
    decision_rule: "State the smallest compound operation that must appear indivisible to named observers, then protect that entire scope with one suitable transaction, lock, compare-and-swap loop, or ownership boundary."
    why_it_matters: "Individually atomic reads and writes can compose into a non-atomic check-update sequence that loses data or violates invariants."
    applicable_when: ["reviewing concurrent read-modify-write behavior", "designing transactions or critical sections"]
    not_applicable_when: ["each operation is independent and no compound invariant exists"]
    required_evidence: ["observer and indivisible invariant", "complete read-modify-write scope", "mechanism guaranteeing atomicity at that scope"]
    insufficient_evidence: ["each primitive operation is atomic", "the critical section is small"]
    required_inputs: ["state transition and observers", "contention and failure semantics"]
    expected_outputs: ["declared atomicity scope", "mechanism and verification for the compound operation"]
    preservation_boundaries: ["compound invariant", "failure and rollback semantics"]
    safe_actions: ["lock or transact across the whole invariant", "use compare-and-swap with explicit retry semantics"]
    unsafe_actions: ["protect reads and writes separately while assuming the sequence is atomic", "widen a lock without progress analysis"]
    common_failure_modes: ["lost update", "check-then-act race", "partial state exposure"]
    source_support:
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/005-chapter-1-an-introduction-to-concurrency.md :: Atomicity"
        contribution: "Makes atomicity context-dependent and demonstrates that a read, increment, and write can each be atomic while their compound update is not."
