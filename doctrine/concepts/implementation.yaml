  - id: implementation-obvious-control-flow
    title: Make control and state transitions obvious to readers
    category: implementation
    claim: Control flow, ordering, state, termination, and variable roles should be visible through the simplest fitting structures so a reader can predict behavior without reconstructing hidden context.
    decision_rule: Prefer the nominal path, keep related data and operations close, give each mutable variable one purpose, make termination and exhaustive cases explicit, and replace generic containers or event indirection when they conceal domain state or causal order.
    why_it_matters: Writer familiarity hides surprises that later readers experience as cognitive load, missed edge cases, and unsafe edits.
    applicable_when: [routine implementation, control-flow review, stateful logic, callback or event code]
    required_evidence: [actual state transitions and ordering, reader-relevant invariants, repository idioms, tests for branches and termination]
    insufficient_evidence: [line count, personal formatting taste, preference for one control construct]
    required_inputs: [behavior and state model, nominal and exceptional paths, language conventions]
    expected_outputs: [locally understandable flow, explicit termination and edge cases, reduced hidden state]
    preservation_boundaries: [ordering, side effects, error behavior, timing or concurrency semantics when contractual]
