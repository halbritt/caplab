        locator: "books/code-complete-2nd-edition-v413hav/chapters/011-chapter-5-design-in-construction.md :: How Much Design Is Enough?"
        contribution: Supports enough design to understand responsibilities and implementation before detailed construction.
        relationship: corroboration
