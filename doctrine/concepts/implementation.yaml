  - id: "implementation-concurrency-ordering-contract"
    title: "Make concurrent ordering logically necessary"
    category: "implementation"
    claim: "Required ordering between concurrent operations must be established by synchronization that makes the order logically necessary; timing delays and high-probability schedules are not correctness evidence."
    decision_rule: "Express every required order through synchronization, data dependency, or an explicit state protocol that makes the invalid schedule impossible; remove sleeps used as correctness mechanisms."
    why_it_matters: "Timing only makes a desired schedule more probable; it cannot establish correctness when operations must occur in a particular causal order."
    applicable_when: ["implementing or reviewing concurrent code in any language", "repairing a timing-sensitive race condition"]
    not_applicable_when: ["operations are independent and all interleavings satisfy the contract"]
    required_evidence: ["named required order", "synchronization or protocol edge enforcing it", "adversarial scheduling or deterministic completion tests"]
    insufficient_evidence: ["sleep duration longer than observed execution", "many passing runs"]
    required_inputs: ["concurrent operations and invariant", "available synchronization mechanisms"]
    expected_outputs: ["explicit ordering contract", "test proving the invalid order cannot occur"]
    preservation_boundaries: ["functional and temporal invariants", "termination behavior"]
    safe_actions: ["coordinate on an observable event", "encode a state transition or synchronization edge"]
    unsafe_actions: ["sleep to force order", "treat launch order as execution order"]
    common_failure_modes: ["flaky correctness", "rare stale state", "environment-sensitive failures"]
    conflicts: ["conflict-concurrency-vs-sequential-simplicity"]
    source_support:
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/012-chapter-8-concurrency-foundations.md :: 8.4 #58: Not understanding race problems"
