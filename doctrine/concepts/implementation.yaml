  - id: implementation-semantic-naming
    title: Name semantic distinctions precisely
    category: implementation
    claim: Names should create accurate mental models of domain meaning, scope, units, effects, and role while following repository and language conventions.
    decision_rule: Derive names from the concept and contract rather than type or mechanism; include distinctions a reader must otherwise rediscover, calibrate length to scope, and treat persistent naming difficulty as evidence to inspect the design.
    why_it_matters: Imprecise names collapse distinct concepts, hide side effects, and spread vocabulary drift across code, tests, and discussion.
    applicable_when: [new symbol, API review, domain implementation, rename proposal]
    not_applicable_when: [generated or externally fixed names except at an adapter boundary]
    required_evidence: [domain and repository vocabulary, symbol scope and effects, units and representation, public compatibility]
    insufficient_evidence: [generic naming rule detached from language, maximum name length, reviewer taste]
    required_inputs: [concept definition, callers, repository glossary and conventions]
    expected_outputs: [precise conventional name or explicit reason to retain an external name]
    preservation_boundaries: [public API, serialization and wire names, reflection, generated contracts]
    safe_actions: [distinguish units and roles, align code and tests with accepted vocabulary, add an adapter alias when needed]
    unsafe_actions: [rename by aesthetic preference, hide effects behind noun-like names, use one term for multiple domain concepts]
    common_failure_modes: [generic manager or data names, false synonyms, scope-mismatched verbosity, compatibility break]
    counterexamples: [A short conventional loop index can be clearer than a long domain name within a tiny scope.]
    interactions: [A good name cannot repair an incoherent abstraction, but difficulty naming one is useful design evidence.]
    source_support:
      - source_id: SRC-APOSD
        locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/019-14-choosing-names.md :: 14: Choosing Names"
