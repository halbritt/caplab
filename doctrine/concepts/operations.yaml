  - id: operations-load-shedding
    title: Refuse work fast when obligations cannot be met
    category: performance
    claim: A slow response is more damaging than a fast failure because it ties up resources in caller and provider alike; when demand exceeds timely capacity a service must refuse work quickly and as close to the system edge as possible, because queues backing up across tiers are how systems fail.
    decision_rule: Monitor the service's own response time against its obligations and start refusing work when it exceeds them; shed at the edge via load balancers and health checks that reflect measured response time and dependency state, size listen queues from allowed residence time, and prefer quick rejection over slow timeout.
    why_it_matters: Every failing system starts with a queue backing up somewhere; sockets, TCP buffers, and listen queues make response degrade nonlinearly exactly at peak load while caller retries make it worse.
    applicable_when: [services facing demand they do not control, designing health checks and load-balancer integration, diagnosing latency collapse at peak load]
    not_applicable_when: [closed-loop batch workloads where the producer can simply be paused]
    required_evidence: [measured residence time - queue time plus processing time - not processing time alone, response-time obligation or SLA with an owner, queue and listen-backlog configuration at each tier]
    insufficient_evidence: [average latency over completed requests, CPU utilization alone, a health check that only proves the process is running]
    required_inputs: [demand profile and capacity boundary, service obligations, edge and tier topology]
    expected_outputs: [edge rejection policy wired to real health, queue sizing from residence-time budgets, degradation behavior visible to operations]
    preservation_boundaries: [work already accepted, correctness of rejection signaling to callers, fairness policy where one exists]
    safe_actions: [return quick 503-style rejections from the first tier when unhealthy, incorporate own response time and required-dependency state into health checks, bound every queue]
    unsafe_actions: [degrade slowly instead of refusing, hide saturation behind averages of completed requests, buffer unbounded work to avoid visible rejections]
    common_failure_modes: [latency creep until timeout storms, queues absorbing demand until every tier is saturated, health checks passing while all workers are blocked]
    counterexamples: [Inside a trusted system boundary, blocking producers via back pressure is preferred to dropping work; shedding belongs at the uncontrolled edge.]
    interactions: [Mechanisms are the operations shed-load and back-pressure technique records; residence-time measurement discipline comes from performance-metric-semantics.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/015-chapter-9-interconnect.md :: Preventing Disaster"
        contribution: Prescribes shedding load at the edge - load balancers returning 503 when first-tier health checks fail, health checks that incorporate the service's own measured response time and required-dependency state, listen queues sized from allowed residence time, quick rejection preferred over slow timeout.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/015-chapter-9-interconnect.md :: How Systems Fail"
        contribution: Explains the failure mechanism the rule counters - every failing system starts with a queue backing up somewhere, and socket, TCP-buffer, and listen-queue exhaustion makes response degrade nonlinearly exactly at peak load, provoking caller retries that worsen it.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Slow Responses"
        contribution: Establishes that slow responses - from excess demand, leak-driven garbage collection, or TCP stalls - propagate upward as a gradual cascading failure and recommends systems monitor their own SLA compliance and start refusing work when they exceed it.
        relationship: direct_support
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/009-chapter-5-concurrency-at-scale.md :: Rate Limiting"
        contribution: "Uses rate limits to bound malicious and legitimate demand, preserve fairness across users, and compose multiple resource-specific quotas before work enters the protected operation."
        relationship: "refinement"
    confidence: strong
    roles: [architecture-agent, performance-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system]
    retrieval_terms: [load shedding, slow response, residence time, queue backlog, health check, refuse work, saturation]
    routing:
