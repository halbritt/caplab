  - id: operations-capacity-ratio-realism
    title: Evaluate stability at production multiplicity and capacity ratios
    category: performance
    claim: Stability properties change with instance counts and inter-layer capacity ratios that development and QA environments never reproduce; many-to-one relationships, point-to-point topologies, and shared resources must be evaluated at production multiplicity and designed - not tested - out.
    decision_rule: Enumerate every many-to-one and point-to-point relationship at production instance counts; rank communication alternatives by cost at that scale, accept point-to-point only at small fixed scale, and build both sides of unbalanced front-end/back-end ratios to survive being overwhelmed rather than provisioning symmetric capacity.
    why_it_matters: O(n^2) connection growth and shared-resource saturation emerge only at production scale, where the front end can always overwhelm the back end because their capacities are unbalanced by design.
    applicable_when: [reviewing topology or communication choices for production scale, capacity planning across tiers, diagnosing failures that appear only in production]
    not_applicable_when: [systems whose production multiplicity genuinely matches the development environment]
    required_evidence: [production instance counts per layer, connection and shared-resource growth model at those counts, relative capacity of adjacent tiers, stress evidence beyond expected workload on the most expensive transactions]
    insufficient_evidence: [QA passing at small scale, load tests at development multiplicity, symmetric capacity assumptions]
    required_inputs: [deployment topology with counts, communication pattern inventory, per-transaction cost profile]
    expected_outputs: [scale-viability verdict per relationship, communication choice with cost rationale, resilience obligations for both sides of unbalanced ratios]
    preservation_boundaries: [correctness under production multiplicity, capital efficiency - symmetric overprovisioning is explicitly not the goal]
    safe_actions: [compute connection counts at production scale before choosing point-to-point, stress the most expensive transactions well past expected load, protect the back end with handshaking and breakers instead of matching front-end capacity]
    unsafe_actions: [extrapolate stability from QA multiplicity, keep point-to-point topology while instance counts grow unbounded, provision every tier to front-end peak as a substitute for resilience]
    common_failure_modes: [connection explosion at rollout, shared resource saturating under production fan-in, back end collapsing under front-end surge]
