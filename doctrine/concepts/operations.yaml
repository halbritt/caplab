  - id: operations-restore-service-first
    title: Restore service before investigating cause
    category: agent-conduct
    claim: During a production incident, restoring service takes precedence over root-cause investigation; diagnostic evidence should be captured by pre-scripted collection that does not prolong the outage, and recovery should target the most likely culprit via the dependency structure rather than rebooting the world.
    decision_rule: While an incident is active, run pre-created evidence-capture scripts, form a culprit hypothesis from the dependency structure, and restore service by the most targeted action likely to work; move causal investigation to the postmortem, where surviving traces outrank witness narratives and configuration is compared against pre-outage baselines.
    why_it_matters: Recovery destroys the failed state, improvised data gathering prolongs outages, and witnesses mix observation with speculation - so evidence discipline must be designed in before the incident.
    applicable_when: [an availability-affecting incident is in progress, preparing incident runbooks and capture scripts, writing postmortems]
    not_applicable_when: [no live user impact exists - ordinary defect diagnosis proceeds evidence-first]
    required_evidence: [pre-scripted diagnostic capture - thread dumps snapshots logs - with rehearsed cost, dependency structure supporting culprit targeting, pre-outage configuration baselines for after-the-fact comparison]
    insufficient_evidence: [witness recollection presented as fact, post-recovery state treated as the failed state, a hypothesis formed after rebooting everything]
    required_inputs: [incident severity and restoration options, capture tooling, dependency map]
    expected_outputs: [service restored with targeted action, captured evidence surviving recovery, postmortem separating observations from inferences]
    preservation_boundaries: [user-facing service level, diagnostic evidence that recovery would destroy, production data integrity during recovery actions]
    safe_actions: [trigger scripted capture before restarting, target the common dependency implicated by the failure pattern, record restoration actions and timestamps for the postmortem]
    unsafe_actions: [prolong an outage to complete a diagnosis, reboot everything without a culprit hypothesis, present witness speculation as observation, skip evidence capture because restoration is urgent when capture is scripted and cheap]
    common_failure_modes: [evidence destroyed by recovery, outage extended by improvised debugging, postmortem built on narratives instead of traces, configuration drift invisible without baselines]
    counterexamples: [When an incident is contained and users are unaffected, evidence-first diagnosis resumes precedence over speed of restoration.]
    interactions: [Temporal boundary with debugging-hypothesis-led-investigation - restore first during the incident, hypothesis-led diagnosis after; capture authority follows agent-conduct-authority-bounded-action.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/007-chapter-2-case-study.md :: The Outage"
        contribution: States restore-service-over-investigation as the first priority, presents pre-created automated thread-dump and snapshot scripts as the balance between improvisation and data loss, and demonstrates culprit-targeting via the common-dependency hypothesis.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/007-chapter-2-case-study.md :: Postmortem"
        contribution: Adds post-incident evidence discipline - the failed state is destroyed by recovery, witnesses mix observation with speculation and present hypotheses as facts, and configuration should be compared against pre-outage backups to detect after-the-fact changes.
        relationship: refinement
    confidence: strong
