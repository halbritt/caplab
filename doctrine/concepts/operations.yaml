  - id: operations-untrusted-request-handling
    title: Treat every request and externally influenced value as untrusted
    category: implementation
    claim: Every request and every externally influenced value is untrusted regardless of network position - validate and escape input at each interpreter boundary instead of concatenating strings into queries, markup, or paths; authenticate all callers including internal ones; and authorize each object access per request, since possession of a URL, a session, or an internal IP confers no authority.
    decision_rule: At every interpreter boundary use parameterized or escaped forms rather than string concatenation; issue fresh session identifiers after authentication; authorize the object on the way out and reauthorize the request coming back in; and make unauthorized resources indistinguishable from nonexistent ones.
    why_it_matters: The consensus most-critical web flaw classes - injection, broken authentication, XSS, broken access control, CSRF - each reduce to trusting request content, origin, or link possession.
    applicable_when: [handling any externally influenced input, building or reviewing HTTP APIs and web surfaces, constructing queries markup or file paths from request data, internal services assumed safe behind the perimeter]
    not_applicable_when: [values that provably never cross a trust boundary]
    required_evidence: [interpreter boundaries enumerated with their escaping or parameterization mechanism, authentication policy covering internal callers, per-request object authorization checks]
    insufficient_evidence: [the caller is inside our network, a web framework is used, input was validated once upstream]
    required_inputs: [request flow map with trust boundaries, session and identity mechanisms, resource authorization model]
    expected_outputs: [boundary validation and escaping policy, session lifecycle rules, object-level authorization coverage]
    preservation_boundaries: [existing authentication contracts, information hiding of resource existence, session integrity]
    safe_actions: [use parameterized queries everywhere, escape output per target context, regenerate session IDs at privilege changes, return not-found for unauthorized objects]
    unsafe_actions: [concatenate request data into queries or paths, trust internal IPs as authentication, authorize by URL possession, expose object existence through 403-versus-404 differences]
    common_failure_modes: [injection through a forgotten boundary, session fixation, direct object references authorized only on render, internal API trusting the perimeter]
    counterexamples: [Constants compiled into the binary are trusted by construction; the boundary discipline begins where external influence enters.]
    interactions: [Maps onto the ubiquitous-language rule that access or capability is not authorization; language-level boundary mechanics live in the language concept families.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/017-chapter-11-security.md :: The OWASP Top 10"
        contribution: Catalogs the consensus most-critical web-application flaw classes - injection, broken authentication and session management, XSS, broken access control, security misconfiguration, sensitive data exposure, CSRF, underprotected APIs - each traced to trusting request content, origin, or link possession, with defenses such as parameterized queries, output escaping, fresh post-authentication session IDs, and per-request object authorization.
        relationship: direct_support
    confidence: strong
    roles: [coding-agent, review-agent, architecture-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system, monolith]
    retrieval_terms: [untrusted input, injection, parameterized query, session management, access control, OWASP, authorization per request]
    routing:
