  - id: operations-contract-conformance-testing
    title: Test each side's conformance to the shared contract
    category: review
    claim: Cross-service integration confidence comes from each side testing its own conformance to the shared specification - consumer-owned contract tests plus separate request-construction and response-tolerance checks - because either party can deploy a new version at any time.
    decision_rule: Split integration testing into request-side conformance and response-side tolerance without invoking the real dependency; have consumers own contract tests against the provider's staging surface as an early-warning system; and require consumers to handle any allowed combination of new, missing, or partial fields since callers and suppliers deploy independently.
    why_it_matters: Overspecified end-to-end request/response loop tests verify only current behavior, not contract conformance - they pass until the day an independently deployed version change breaks production.
    applicable_when: [designing tests for service integrations, reviewing integration test suites that loop through live dependencies, consuming an independently deployed API]
    not_applicable_when: [both sides deploy atomically from one repository and cannot version-skew]
    required_evidence: [the shared specification as the test oracle, request-side and response-side suites separated from live dependencies, consumer-owned contract tests with a run cadence]
    insufficient_evidence: [end-to-end tests against the current deployment only, mocks asserting current provider behavior rather than the contract, provider tests alone]
    required_inputs: [interface specification, consumer and provider deployment cadences, staging surface availability]
    expected_outputs: [conformance and tolerance suites per side, contract-test ownership and alerting, field-tolerance coverage for allowed variations]
    preservation_boundaries: [the agreed contract as oracle - tests must not enshrine incidental behavior, independence of deployment cadences]
    safe_actions: [write consumer contract tests against the provider's staging system, test request construction against the spec without the dependency, generate allowed field combinations to find tolerance gaps]
    unsafe_actions: [assert incidental provider behavior as contract, require the live dependency for every test run, assume field sets are fixed because they were fixed yesterday]
    common_failure_modes: [integration suite green while contract drift breaks production, mock drift from the real contract, consumer breaking on a legally added field]
    counterexamples: [Characterization tests of an unspecified legacy dependency assert observed behavior deliberately - that is discovery, not contract conformance.]
    interactions: [Refines implementation-risk-driven-tests at service boundaries; message-contract semantics interact with architecture-event-temporal-semantics.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/021-chapter-14-handling-versions.md :: Handle Others' Versions"
        contribution: Shows that overspecified end-to-end request/response loop tests verify only current behavior, not contract conformance; splits testing into request-side conformance and response-side tolerance without invoking the real dependency, and requires the consumer to handle any allowed combination of new, missing, or partial fields since callers and suppliers deploy independently.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/021-chapter-14-handling-versions.md :: Nonbreaking API Changes"
        contribution: Adds the consumer-owned contract-test practice - a suite written by the consuming team run against the provider's staging system as an early-warning system - and recommends generative testing to find gaps between specification, belief, and implementation.
        relationship: refinement
