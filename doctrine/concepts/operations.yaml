  - id: operations-transparency-by-design
    title: Design transparency in from the start
    category: architecture
    claim: Every instance must be designed from the start to reveal its historical, present, and projected state through operator-aimed logs, metrics, and health checks, with alert thresholds and health-rollup policy held outside the instance, because opaque systems cannot be diagnosed, tuned, or kept funded in production.
    decision_rule: Build transparency as a designed-in quality - operator-aimed log messages with ERROR reserved for actionable system problems, health checks reporting version accepting-work state and pool or breaker status - while keeping monitoring an exoskeleton whose thresholds and rollups live outside the instance; at system level ask whether users receive a good experience and whether the system creates its intended value.
    why_it_matters: Transparency cannot be bolted on late, ambiguous log messages breed superstition-driven operations, and at scale partially broken is the normal state - so signals must be designed for the people who act on them.
    applicable_when: [building new services or instances, reviewing logging metrics and health-check design, deciding what to alert on]
    not_applicable_when: [ephemeral experiments nobody operates]
    required_evidence: [operator-aimed log and metric semantics, health-check content covering version accepting-work and dependency status, thresholds and rollup policy held outside the instance, continuity of baseline vitals]
    insufficient_evidence: [debug-level logging exists, a dashboard was made once, alerts defined inside application code]
    required_inputs: [operational questions the system must answer, monitoring infrastructure, business value signals]
    expected_outputs: [instance transparency contract, alerting policy owned outside the instance, baseline rhythm documentation]
    preservation_boundaries: [monitoring as exoskeleton - instances do not embed alerting policy, privacy of logged data, production overhead budgets]
    safe_actions: [reserve ERROR for events demanding operator action, expose pool breaker and version state in health checks, sample vitals continuously so normal rhythms are known before incidents]
    unsafe_actions: [add monitoring as an afterthought, log ambiguous messages that invite superstition, alert on every partial breakage at scale, bury operator signals in developer debug noise]
    common_failure_modes: [six months of superstitious failovers from one ambiguous debug message, alert fatigue drowning real incidents, health checks that reveal nothing about readiness, unfunded operations because value is invisible]
    counterexamples: [A build-time tool run interactively by its author needs error messages, not an operational transparency contract.]
    interactions: [Feeds operations-liveness-by-external-observation with signal design; metric meaning discipline comes from performance-metric-semantics; runtime telemetry ownership parallels architecture-fitness-functions.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/014-chapter-8-processes-on-machines.md :: Transparency"
        contribution: Defines transparency as a designed-in quality that cannot be added late, requires monitoring to remain an exoskeleton with alerting and threshold policy outside the instance, aims logging levels at operations with ERROR reserved for actionable system problems, and specifies health checks that report version, accepting-work state, and connection-pool and circuit-breaker status.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md :: System-Wide Transparency"
        contribution: Reframes system-level monitoring around two questions - are users receiving a good experience, and is the system creating the intended economic value - and treats partially broken as the normal operating state at scale rather than something to alert on.
        relationship: refinement
      - source_id: SRC-RI
