schema_version: agent-doctrine-concepts/1
concepts:
  - id: operations-production-readiness
    title: Evaluate design choices against production life, not feature completion
    category: architecture
    claim: Feature completion and QA passage do not establish production readiness; design and architecture choices must be evaluated against operational cost, downtime exposure, and multi-year life in production, not only implementation cost.
    decision_rule: When comparing design alternatives, include operational consequences - downtime per release, incident exposure, monitoring and recovery cost - as evidenced inputs alongside implementation cost; where the operational cost model is unevidenced, gather evidence or narrow the claim rather than gold-plate.
    why_it_matters: Software designed only to pass QA trades one-time development savings for recurring operational cost, and the least-informed early decisions are the hardest to reverse in production.
    applicable_when: [comparing design or architecture alternatives for deployed systems, planning work on revenue- or availability-critical software, reviewing a proposal justified by development convenience alone]
    not_applicable_when: [throwaway prototypes or analysis code that will never run unattended in production]
    required_evidence: [expected production lifetime and release cadence, downtime or incident cost model with an owner, operational constraints of the deployment environment]
    insufficient_evidence: [feature-complete status and passing tests, an ROI narrative without an evidenced cost model, generic best-practice appeals]
    required_inputs: [candidate designs and their operational consequences, deployment and operations context]
    expected_outputs: [design comparison that names operational costs and risks, readiness gaps with owners, or an explicit accepted tradeoff]
    preservation_boundaries: [accepted behavior and contracts, delivery commitments not traded away without authority]
    safe_actions: [request the downtime or operations cost evidence behind a claim, name the operational consequences of each alternative, defer gold-plating when no evidence supports it]
    unsafe_actions: [treat QA passage as production readiness, justify speculative infrastructure with an assumed cost model, trade recurring operational cost for one-time development savings silently]
    common_failure_modes: [feature-complete declared production-ready, operational cost discovered after release, resume-driven overbuilding defended as readiness]
    counterexamples: [A short-lived internal migration script does not warrant production-grade operational design merely because it touches production data once.]
    interactions: [Frames the operations family; universal-evidence-before-intervention still governs whether a claimed cost model is evidence or assumption.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/005-chapter-1-living-in-production.md :: Aiming for the Right Target"
        contribution: Argues that software designed to pass QA tells you little about years of production life and introduces design for production by analogy to design for manufacturability.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/005-chapter-1-living-in-production.md :: A Million Dollars Here, a Million Dollars There"
        contribution: Quantifies design decisions as financial decisions - trading a one-time development cost for a recurring operational cost such as per-release downtime is usually the wrong trade - with a concrete downtime-cost example.
        relationship: refinement
    confidence: strong
    roles: [architecture-agent, review-agent, coding-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system, monolith, deployed systems]
    retrieval_terms: [production readiness, design for production, operational cost, downtime cost, feature complete]
    routing:
      activate_for_roles: [architecture-agent, review-agent, coding-agent, repository-assessment-agent]
      activate_for_tasks: [architecture-assessment, plan-implementation, operational-hardening, plan-change]
      activate_for_repository_signals: [deployment pipeline, production incident history, availability SLO, release checklist]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [operational, availability, cost]
      exclude_when: [the artifact never runs unattended in production]
      prerequisites: [deployment context and operational cost evidence]
