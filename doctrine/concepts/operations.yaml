        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/013-chapter-7-foundations.md :: Containers in the Data Center"
        contribution: Adds that container instances have short-lived identities and must externalize storage, credentials, hostnames, and ports rather than baking them into images or per-instance configuration.
