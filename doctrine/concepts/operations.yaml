  - id: operations-bounded-accumulation
    title: Pair every accumulation with a recycling or bounding mechanism
    category: architecture
    claim: Every mechanism that accumulates a resource - database rows, log files, in-memory caches, sessions, queues - must be paired with a mechanism that recycles or bounds it, so the system runs at least a full release cycle without human fiddling; callers must likewise bound how much response they will accept.
    decision_rule: For each accumulation point specify the purge rotation or size limit that balances it; require LIMIT-style bounds on queries and API responses because producers eventually return millions where hundreds were assumed; verify longevity with long-duration tests that include idle periods, since leaks and growth escape short test runs.
    why_it_matters: Unbounded accumulation is a slow-motion outage - systems that need routine human fiddling to survive invite the unforced errors that logins to production produce.
    applicable_when: [designing storage logging caching or session mechanisms, writing queries or API calls that fetch collections, reviewing longevity behavior of long-running services]
    not_applicable_when: [short-lived processes whose accumulations die with the process]
    required_evidence: [growth rate per accumulation point, recycling mechanism and its trigger, caller-side bounds on result sizes, longevity evidence covering at least a release cycle]
    insufficient_evidence: [disk is currently large enough, tests passing on short runs, a purge script that requires manual execution]
    required_inputs: [accumulation inventory, release-cycle length, data retention obligations]
    expected_outputs: [bounded design per accumulation with owner, query and API result limits, longevity test plan including idle-period simulation]
    preservation_boundaries: [data retention and audit obligations, correctness of purge boundaries, cache coherence within declared limits]
    safe_actions: [pair data growth with purging log growth with rotation and caches with size limits, state in every protocol how much response the caller accepts, slack load scripts a few hours a day to catch idle-timeout failures]
    unsafe_actions: [ship an accumulation with no balancing mechanism, issue unbounded queries against production-sized data, rely on scheduled human cleanup]
    common_failure_modes: [connection or memory leak surfacing weeks after release, log partition filling, a query returning the whole table after years of growth, firewall idle timeout killing pooled connections]
    counterexamples: [Append-only audit stores are deliberately unbounded; their growth is a sized and owned retention decision, not an accident.]
    interactions: [The steady-state rule generalizes performance-resource-lifecycle beyond process resources; the memorable bound rule is that the only sensible numbers are zero, one, and lots.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Steady State"
        contribution: States the steady-state rule - for every accumulation, a recycling mechanism - applying it to data purging, log rotation and shipping, and cache key-space and size limits, and ties routine human login to production to elevated risk of unforced errors.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Unbounded Result Sets"
        contribution: Adds the caller-side bound - in any API or protocol the caller should state how much response it will accept, because data producers will eventually return millions of rows where hundreds were assumed - requiring LIMIT-style bounds and production-sized test data.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md :: Extending Your Life Span"
        contribution: Provides the longevity evidence - memory leaks and data growth rarely appear in short-lived dev or QA runs or time-boxed load tests, so dedicated long-duration tests with idle-period simulation are the only pre-production way to find them.
        relationship: corroboration
    confidence: strong
