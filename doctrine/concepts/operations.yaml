  - id: operations-dependency-vulnerability-currency
    title: Track the full dependency tree against known vulnerabilities
    category: implementation
    claim: A deployed system must continuously track its full dependency tree - including build-tool plugins and container base images - against known vulnerabilities, and treat a known-vulnerable component as a defect requiring prompt patching and redeployment.
    decision_rule: Extract a full-artifact dependency report including build plugins, check it against published CVEs on a regular cadence - preferably breaking the build automatically on a known-vulnerable dependency - and keep servers redeployable on a moment's notice because security is a continuous process, not a one-time review.
    why_it_matters: Using components with known vulnerabilities is itself a top flaw class; new attacks emerge constantly and unpatched dependencies silently accumulate exploitable surface.
    applicable_when: [adding or upgrading dependencies, configuring CI gates, auditing a repository's security posture, maintaining container base images]
    not_applicable_when: [code with no third-party components and no build tooling - rare in practice]
    required_evidence: [complete dependency report including transitive dependencies and build plugins, CVE-check cadence and gate behavior, redeployment capability evidence]
    insufficient_evidence: [top-level dependency list only, an audit performed at release time only, pinned versions treated as safety]
    required_inputs: [dependency manifest and lockfiles, CI configuration, deployment pipeline]
    expected_outputs: [vulnerability tracking coverage verdict, gate policy for known CVEs, patch-and-redeploy path with owners]
    preservation_boundaries: [build reproducibility while upgrading, behavioral compatibility verified per upgrade, gate signal integrity - no silent suppressions]
    safe_actions: [generate dependency reports covering plugins and base images, wire CVE checks into CI with break-the-build defaults, schedule timed rebuilds from patched upstream bases]
    unsafe_actions: [ignore transitive and build-time dependencies, suppress vulnerability findings without disposition, let unpatchable servers accumulate, treat version pinning as a security control]
    common_failure_modes: [vulnerable transitive dependency shipped for months, compromised or outdated build plugin, stale base image with known exploits, CVE alert fatigue with no gate]
    counterexamples: [A vulnerability in an unused code path may be deferred with an explicit recorded disposition - deferral is a decision, not a default.]
    interactions: [Currency and patching here; integrity and custody in operations-build-provenance - both gate deployment and both feed dependency-review tasks.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/017-chapter-11-security.md :: The OWASP Top 10"
        contribution: Includes using components with known vulnerabilities among the top flaw classes and prescribes extracting a full-artifact dependency report including build plugins, checking it against CVEs weekly, and preferably breaking the build automatically when a dependency has a known CVE.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/017-chapter-11-security.md :: Security as an Ongoing Process"
        contribution: Frames security as a continuous process rather than a one-time review - new attacks emerge constantly, unhardened new technology needs extra patching vigilance, and servers must be redeployable on a moment's notice.
        relationship: refinement
