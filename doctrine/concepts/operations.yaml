  - id: operations-resilience-margin
    title: Retain deliberate margin against drift into failure
    category: performance
    claim: Systems optimized toward maximal utilization and specialized efficiency drift toward their safety boundary and fail abruptly; resilience requires deliberately retained capacity margin, flexibility, and routine tolerable stress.
    decision_rule: When an efficiency or throughput objective approaches the utilization limit, name availability margin as an explicit untraded quality attribute with an owner; counteract drift with routine low-level induced or tolerated stress that keeps failure evidence flowing, because a well-protected system stops producing the information that proves its protection works.
    why_it_matters: Economic and workload pressure push systems toward the safety boundary invisibly - highly efficient systems handle disruption badly and break all at once rather than degrading.
    applicable_when: [setting utilization or efficiency targets, reviewing optimization campaigns that consume headroom, assessing why a hyper-efficient system fails abruptly, value-stream optimization that specializes a system to today's tasks]
    not_applicable_when: [systems with explicit accepted headroom policies already enforced, throwaway workloads where abrupt failure is acceptable]
    required_evidence: [utilization trend against capacity, named margin with an owner and a floor, evidence stream proving protective mechanisms still work - incidents drills or injected stress]
    insufficient_evidence: [absence of recent failures - the regulator paradox makes silence uninformative, cost savings from higher utilization alone, efficiency benchmarks without disruption scenarios]
    required_inputs: [capacity and utilization data, efficiency objectives with owners, disruption tolerance requirements]
    expected_outputs: [explicit margin policy with floor and owner, drift indicators with review triggers, routine stress cadence that keeps evidence flowing]
    preservation_boundaries: [availability margin as an untraded attribute unless its owner trades it, flexibility reserves that efficiency work must not silently consume]
    safe_actions: [name the margin before optimizing toward the limit, schedule routine tolerable stress, treat quiet periods as missing evidence rather than proof of safety, keep some general capacity unspecialized]
    unsafe_actions: [pursue utilization limits without naming margin, read silence as safety, specialize every resource to today's workload, trade headroom for cost invisibly]
    common_failure_modes: [drift into failure under economic pressure, abrupt collapse of a fully utilized system, protection atrophying unnoticed because it stopped being exercised]
    counterexamples: [A batch analytics cluster may legitimately run at full utilization when failure means rerunning a job, not violating a service obligation.]
    interactions: [First explicit counterweight to the performance family - performance-measurable-objective keeps objectives falsifiable while this record keeps margin from being silently traded; the evidence-manufacturing side is operations-chaos-experiment-discipline.]
    conflicts: [conflict-efficiency-vs-resilience-margin]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md :: Antecedents of Chaos Engineering"
        contribution: Imports Dekker's drift-into-failure model - economic pressure plus workload pressure push the system toward the safety boundary - Weinberg's regulator paradox - the better a regulator works the less information it produces about its own quality - and the observation that highly efficient systems handle disruption badly and break all at once, justifying continuous low-level induced breakage as a balancing force.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/024-chapter-16-adaptation.md :: Team-Scale Autonomy"
        contribution: Argues full utilization slows flow and that value-stream optimization specializes the system to today's tasks at the cost of future flexibility - the adaptability face of the same tradeoff.
        relationship: refinement
      - source_id: "SRC-CIG"
        locator: "books/concurrency-in-go/chapters/009-chapter-5-concurrency-at-scale.md :: Replicated Requests"
        contribution: "Frames replicated requests as an explicit exchange of additional handlers and downstream resources for lower tail latency and fault tolerance, requiring cancellation of losing work."
        relationship: "refinement"
