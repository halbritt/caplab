  - id: operations-automation-safeguards
    title: Bound automation with safeguards proportional to its mechanical advantage
    category: agent-conduct
    claim: Control-plane automation acting on a mistaken sensed state or a mistaken desired state amplifies failure at machine speed; automated actuators need sanity bounds on their own observations, rate limits and minimum-capacity floors on destructive change, hysteresis, and human confirmation when observed and expected state diverge widely.
    decision_rule: Give every automated actuator explicit safeguards - distrust observations implying massive simultaneous failure, remove capacity slowly while adding it fast, refuse changes below a minimum-capacity floor, pause for human confirmation beyond a large-change threshold, and account for actuation lag - and treat resulting outages as system failures rather than operator error.
    why_it_matters: Automation applies mechanical advantage without judgment, so a small sensing or intent error becomes a fleet-wide outage faster than any human can perceive and intervene.
    applicable_when: [building or reviewing autoscalers deployment automation or service-discovery reactions, designing any automated actuator that can remove capacity or delete data, an autonomous agent executing bulk operational actions]
    not_applicable_when: [automation that only reports and recommends without actuating]
    required_evidence: [enumerated failure modes for wrong sensed state wrong desired state and impossible computed state, defined safe ranges rate limits and floors, escalation path when observation and expectation diverge]
    insufficient_evidence: [the automation passed tests under correct inputs, a rollback script exists, human-on-call as the only safeguard]
    required_inputs: [actuator inventory with blast radius, sensing sources and their failure modes, authority boundaries for destructive actions]
    expected_outputs: [safeguard specification per actuator, confirmation thresholds and owners, postmortem framing that treats automation-amplified error as system failure]
    preservation_boundaries: [minimum viable capacity, human ability to perceive and intervene, evidence trails of automated decisions]
    safe_actions: [distrust sensor readings that report most of the fleet unavailable, start fast but stop slowly, signal for confirmation on large state gaps, detect runaway actuation such as exploding instance counts]
    unsafe_actions: [let automation remove capacity as fast as it computes, act on a single sensing source for destructive decisions, blame the operator for automation-amplified failure, pre-script confirmations that were meant to be human judgments]
    common_failure_modes: [autoscaler killing a healthy fleet on bad telemetry, desired-state engine converging to an erroneous small target, service-discovery partition triggering mass deregistration]
    counterexamples: [An automation that only widens capacity or restores redundancy may safely act fast; asymmetry of risk justifies asymmetry of safeguards.]
    interactions: [Applies agent-conduct-authority-bounded-action to operational actuators - automation should do repetitive fast tasks while humans hold whole-situation judgment; the governor technique record supplies the rate-limiting mechanism.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Force Multiplier"
        contribution: Analyzes autoscaler and service-discovery outages to show automation failure modes - wrong sensed state, wrong desired state, impossible computed state - and lists safeguards including distrusting observations reporting mass unavailability, stopping slowly, signaling humans on large gaps, and accounting for actuation lag.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md :: Mechanical Advantage"
        contribution: Uses the 2017 AWS S3 and 2016 Reddit outages to derive concrete safeguards - slow down capacity removal, refuse changes below minimum capacity, pause for human confirmation beyond a large-change threshold, treat operator error as system failure, and study successes and near misses.
        relationship: direct_support
