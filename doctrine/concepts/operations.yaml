  - id: operations-runtime-control-surface
    title: Provide runtime control surfaces where replacement is slow
    category: architecture
    claim: A service whose instances start slowly needs pre-built, scriptable, access-restricted control interfaces for targeted runtime intervention - resetting circuit breakers, resizing pools, disabling specific integrations, reloading configuration, draining load, toggling features - while fast-restarting instances are better replaced than controlled.
    decision_rule: Scope live control to slow-starting instances; expose the control signals worth having on separate non-public admin ports, prefer scriptable command lines over GUIs, send fleet commands in waves with jitter to avoid dogpiles, and never ship self-destruct controls such as schema wipe in production code.
    why_it_matters: When changing config files and restarting all servers takes hours under load, a five-minute targeted reconfiguration is the difference between a blip and an outage - but in fast-restart environments the same machinery is unearned complexity.
    applicable_when: [operating or designing slow-starting stateful services, planning incident-recovery tooling, reviewing admin interfaces]
    not_applicable_when: [fast-starting instances where kill-and-replace is cheaper and safer than live mutation]
    required_evidence: [measured instance startup and warm-up time, inventory of interventions that recur during incidents, access control separating admin from public surfaces]
    insufficient_evidence: [a desire for operational knobs, admin endpoints on the public port, controls never rehearsed]
    required_inputs: [startup-time measurements, incident intervention history, security boundary design]
    expected_outputs: [control-surface inventory with access policy, scriptable interfaces for rehearsed interventions, decision to prefer replacement where restarts are fast]
    preservation_boundaries: [production data - no self-destruct operations, security isolation of admin surfaces, fleet stability under command distribution]
    safe_actions: [expose breaker reset pool resize integration toggle config reload and drain as scripted commands, restrict admin APIs to non-public ports, roll commands through the fleet in waves]
    unsafe_actions: [ship schema-wipe or reset-everything controls in production binaries, expose admin controls on public interfaces, command the whole fleet simultaneously, build GUIs as the only operational interface]
    common_failure_modes: [command queue dogpiling the fleet, admin endpoint exposed publicly, controls untested until the incident, six-hour full restarts because no targeted control existed]
    counterexamples: [A stateless container that boots in one second should be killed and replaced, not remotely reconfigured.]
    interactions: [Cache-flush controls carry the cold-start dogpile cost recorded on performance-cache-validity; safeguards on any actuating control follow operations-automation-safeguards.]
    conflicts: [conflict-live-control-vs-immutable-replacement]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md :: Command and Control"
        contribution: Scopes live control to slow-starting instances - fast-start container environments should kill and replace instead - lists the control signals worth exposing, requires admin APIs on separate non-public ports, prefers scriptable command lines over GUIs, warns command queues can dogpile a fleet without jitter or waves, and bans self-destruct controls such as schema wipe in production code.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/012-chapter-6-case-study-phenomenal-cosmic-powers-itty-bitty-living-space.md :: Does the Condition Respond to Treatment?"
        contribution: Demonstrates recovery by dynamically reconfiguring and restarting a single component in under five minutes where changing config files and restarting all servers would have taken more than six hours under load.
        relationship: corroboration
    confidence: contextual
    roles: [architecture-agent, debugging-and-repair-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system]
    retrieval_terms: [command and control, admin interface, runtime reconfiguration, drain, feature toggle, scriptable operations]
    routing:
      activate_for_roles: [architecture-agent, debugging-and-repair-agent, review-agent]
      activate_for_tasks: [operational-hardening, shutdown-design, resilience-review]
      activate_for_repository_signals: [slow startup, admin endpoint, feature flag runtime toggle, pool resize control]
