  - id: operations-live-interface-compatibility
    title: The live interface's accepted behavior is the contract
    category: architecture
    claim: Once an interface is live, its actually accepted and returned behavior is the de facto contract; a new version may require less, accept more, and return more, but may not reject previously accepted traffic, withhold previously returned data, or require more authorization without a versioned migration.
    decision_rule: Treat the API as a layered stack of agreements - framing, encoding, syntax, routing, semantics, authorization - where a unilateral break in any layer is a breaking change; apply the safe-change algebra of requiring a subset of parameters, accepting a superset, returning a superset, and enforcing a subset of constraints; and classify validation tightening on a live endpoint as a breaking change needing migration authority.
    why_it_matters: Fixing an accidental edge-case behavior or adding validation on a live endpoint presents as cleanup but semantically rejects traffic that was accepted yesterday - consumers deployed against actual behavior, not documentation.
    applicable_when: [changing any live API message format or endpoint, adding validation to existing interfaces, reviewing changes labeled cleanup on public surfaces, planning version-discriminated breaks]
    not_applicable_when: [pre-release interfaces with no external consumers]
    required_evidence: [observed accepted and returned behavior - not documentation alone, consumer inventory with deployment independence, compatibility classification per layer of the agreement stack]
    insufficient_evidence: [the spec says the input was invalid, internal tests passing, an assumption that undocumented behavior is unclaimed]
    required_inputs: [interface behavior baseline, proposed change classified per layer, migration authority]
    expected_outputs: [nonbreaking verdict via the safe-change algebra or a versioned migration plan, version discriminator choice for unavoidable breaks, mixed-version test evidence]
    preservation_boundaries: [previously accepted traffic, previously returned data, existing authorization requirements, message format versioning]
    safe_actions: [require less accept more return more, put a format version in messages, run old and new versions side by side testing mixed calls against the same entities, absorb compatibility cost as the provider instead of exporting synchronized upgrades]
    unsafe_actions: [tighten validation on a live endpoint without a versioned migration, withhold previously returned fields, require new authorization silently, treat undocumented accepted behavior as rejectable]
    common_failure_modes: [cleanup change breaking a consumer relying on undocumented behavior, validation hardening rejecting production traffic, provider and caller forced to deploy in lockstep]
    counterexamples: [Rejecting traffic that corrupts data is a defect repair with breaking-change consequences - it still needs the migration treatment, just with higher urgency.]
    interactions: [Supplies the compatibility test that refactoring-compatibility-migration's phased migrations rely on; change classification pressure lands on refactoring-change-type-classification.]
    conflicts: [conflict-static-typing-vs-runtime-validation]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/021-chapter-14-handling-versions.md :: Nonbreaking API Changes"
        contribution: Defines an API as a layered stack of agreements - framing, encoding, syntax, routing, semantics, authorization - whose unilateral break in any layer is a breaking change; gives the safe-change algebra and the de facto specification rule that even undocumented accepted behavior cannot be rejected once live, so validation tightening is itself a breaking change.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/021-chapter-14-handling-versions.md :: Help Others Handle Your Versions"
        contribution: Adds the ownership rule that the provider absorbs compatibility cost rather than exporting synchronized upgrades to consumers.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/024-chapter-16-adaptation.md :: Team-Scale Autonomy"
        contribution: Independently states that needing provider and caller updated together is a coupling warning sign.
        relationship: corroboration
