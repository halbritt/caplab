  - id: operations-build-provenance
    title: Require an unbroken chain of custody for production executables
    category: implementation
    claim: Production executables must arrive through an unbroken tamper-resistant chain of custody - version-controlled source, dependencies and build plugins verified against upstream signatures in a private repository, and builds performed only on a clean CI server that writes to a write-protected artifact store.
    decision_rule: Never treat a locally built artifact as deployable; verify third-party dependencies and build plugins against upstream signatures, build releases only on the CI server, and deploy only artifacts from the repository of blessed binaries with known provenance.
    why_it_matters: Build-system plugins and developer machines are attack vectors; a real supply-chain attack has been delivered through a compromised CI-server plugin, and provenance is what makes such tampering detectable.
    applicable_when: [setting up or reviewing build and deployment pipelines, adding dependencies or build plugins, an agent producing artifacts intended for deployment]
    not_applicable_when: [local experiments and throwaway builds never promoted toward production]
    required_evidence: [dependency and plugin verification against upstream signatures, CI-only build path for release artifacts, write-protection and provenance records on the artifact store]
    insufficient_evidence: [the artifact works, checksums generated on the same machine that built the artifact, trust in a developer laptop's cleanliness]
    required_inputs: [build pipeline topology, dependency sources, artifact store permissions]
    expected_outputs: [custody gaps with owners, verified-dependency policy, deployable-artifact definition tied to CI provenance]
    preservation_boundaries: [reproducibility of released artifacts, integrity of the artifact store, audit trail from source to instance]
    safe_actions: [verify signatures in a private dependency mirror, tag artifacts with pipeline stage provenance, restrict artifact-store writes to the build system]
    unsafe_actions: [deploy artifacts built on developer machines, add unverified build plugins, allow humans to overwrite released artifacts]
    common_failure_modes: [compromised plugin injecting code at build time, dependency substitution unnoticed, hotfix binary of unknown origin in production]
    counterexamples: [A sandboxed prototype may bypass custody until the moment its artifact is proposed for promotion, at which point it is rebuilt through the chain.]
    interactions: [Distinct from operations-dependency-vulnerability-currency - custody and integrity here, patch currency there; both gate deployment.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/014-chapter-8-processes-on-machines.md :: Code"
        contribution: Prescribes the chain of custody from developer to production instance - signature-verified third-party dependencies in a private repository, build-system plugins treated as attack vectors, no production builds from polluted developer machines, and CI-only builds into a repository nobody else can write to.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md :: Provisioning and Deployment Services"
        contribution: Requires an artifact repository of blessed binaries with known provenance populated only by clean build servers, pipeline stage tagging, and documents a real supply-chain attack delivered through a compromised CI-server plugin.
        relationship: corroboration
