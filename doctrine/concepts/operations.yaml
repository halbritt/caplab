  - id: operations-credential-custody
    title: Give production credentials dedicated custody
    category: implementation
    claim: Production credentials are high-value secrets requiring dedicated custody - kept out of source control, images, and installation directories; readable only by the owning account or held in a vault whose decryption keys live elsewhere; expunged from process memory promptly; and excluded from core dumps and support bundles.
    decision_rule: Separate credentials from ordinary configuration and from installation directories that get zipped and shipped during support incidents; enforce owner-only permissions or vaulting with keys stored apart from data; expunge keys from memory after use; and disable core dumps for credential-bearing processes.
    why_it_matters: Committed passwords, credentials in shipped support bundles, and secrets lingering in memory or dumps are recurring, well-documented compromise paths.
    applicable_when: [writing or reviewing code and scripts that touch credentials, designing configuration layouts, preparing support and diagnostic tooling]
    not_applicable_when: [no production secret exists in the workflow]
    required_evidence: [credential storage location and permission audit, vault key-separation design where vaulting is used, memory and dump hygiene for credential-bearing processes]
    insufficient_evidence: [secrets encrypted with a key stored beside them, a private repository treated as safe for passwords, secrets masked only in logs]
    required_inputs: [credential inventory with owners, storage and access mechanisms, support-tooling data flows]
    expected_outputs: [custody policy per credential class, permission and vault configuration, dump and bundle exclusion rules]
    preservation_boundaries: [secret confidentiality across the artifact lifecycle, auditability of credential access, service availability during rotation]
    safe_actions: [store credentials in a separately locked-down location with explicit grant and revoke, keep vault decryption keys apart from vaulted data, zero credential buffers after use, exclude credential paths from support bundles]
    unsafe_actions: [commit passwords to any source repository, leave credentials in installation directories, enable core dumps on credential-bearing services without scrubbing, log secrets at any level]
    common_failure_modes: [password committed and rotated too late, support zip containing production credentials, dump file with keys attached to a ticket, key beside its ciphertext]
    counterexamples: [Development-only fixtures with fake secrets may live in the repository precisely because they authorize nothing.]
    interactions: [Owns secret protection; operations-externalized-configuration owns environment portability of ordinary configuration - cross-reference rather than merge.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/017-chapter-11-security.md :: Configured Passwords"
        contribution: Requires production passwords separated from other configuration and outside installation directories that get zipped and shipped during support incidents, owner-only file permissions or vaulting with keys stored apart from data, prompt expunging of keys from memory, and disabled core dumps because dumps contain passwords.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/014-chapter-8-processes-on-machines.md :: Configuration"
        contribution: Keeps per-environment credential files out of the application's source repository in a separately locked-down repository with explicit grant and revoke access controls, citing the recurring committed-password failure mode.
        relationship: corroboration
    confidence: strong
    roles: [coding-agent, review-agent, architecture-agent]
