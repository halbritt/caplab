  - id: operations-zero-downtime-rollout
    title: Design rollout as a concurrent-versions time interval
    category: architecture
    claim: A production rollout is a designed time interval in which old and new versions run concurrently; the application must support preparation, drain, staged activation, and warm-up readiness so that users never observe the transition.
    decision_rule: Decompose the rollout into a macroscopic window nesting per-instance prepare, drain, apply, and time-to-ready spans; budget update time from packaging grain size before planning the window; roll out in health-gated batches with a canary group; gate load-balancer traffic on a health route that starts unavailable until warm; and decouple session lifetime from process lifetime.
    why_it_matters: Users see the during state, not just the after state - and manual playbook releases measured in dozens of people and six-figure costs are what unplanned-downtime deployment designs degenerate into.
    applicable_when: [planning or reviewing deployments of running services, designing deployment automation, sizing rollout windows and batches]
    not_applicable_when: [systems with genuinely accepted downtime windows where concurrency of versions is not required]
    required_evidence: [measured per-instance prepare drain apply and warm-up times, canary and batch health gates, session-drain behavior, compatibility plan for concurrently running versions]
    insufficient_evidence: [it deployed fine in staging, a rollback script never rehearsed, deployment treated as an operations afterthought]
    required_inputs: [deployment topology and packaging grain, session model, health-check integration]
    expected_outputs: [phased rollout plan with time budgets, canary and batch gating policy, drain and warm-up behavior in the application]
    preservation_boundaries: [user-visible service continuity, in-flight sessions and transactions, data compatibility across concurrent versions]
    safe_actions: [start instances with available=false until warm, drain sessions before stopping instances, canary before batches, watch metrics while shifting traffic]
    unsafe_actions: [treat deployment as an instantaneous switch, ignore warm-up before accepting traffic, terminate sessions with processes, plan windows without measured update times]
    common_failure_modes: [rollout window overrunning because packaging grain was never measured, cold instances taking traffic and timing out, sessions dropped at every deploy, canary skipped under schedule pressure]
    interactions: [Schema and contract phasing during the window is refactoring-compatibility-migration; the undeployed-code liability cycle corroborates universal-reversible-reviewable-change.]
    counterexamples: [A single-tenant batch tool updated between runs has no concurrent-versions interval to design.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Phases of Deployment"
        contribution: Decomposes a rollout into a macroscopic window nesting four per-instance time spans - prepare, drain bounded by session and blocked-thread realities, apply, and time-to-ready after start - and derives that packaging grain size drives per-machine update time, which must be budgeted before planning the rollout window.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: The Fallacy of Planned Downtime"
        contribution: Argues users see the during state, so deployment must be treated as a designed feature rather than an after-state assumption.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Rollout"
        contribution: Prescribes batched health-gated group updates with a canary group, traffic shaping while watching metrics, a health-check route that gates load-balancer traffic starting with available=false until warm, and decoupling session lifetime from process lifetime.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/019-chapter-12-case-study-waiting-for-godot.md :: Chapter 12: Case Study: Waiting for Godot"
        contribution: Corroborating cost evidence - a manual playbook release consuming roughly forty people and one hundred thousand dollars overnight, failing on QA-versus-production data mismatch and rolling back.
        relationship: corroboration
