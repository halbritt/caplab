  - id: operations-liveness-by-external-observation
    title: Judge liveness by external observation, not process checks
    category: architecture
    claim: A running process is not a live system; the dominant failure mode is a process whose threads are all blocked, so health must be judged by externally executed synthetic transactions and business-level metrics, not by process, port, or status-page checks.
    decision_rule: Monitor what users experience - synthetic transactions exercising real request paths and leading-indicator business counters - and treat internal process checks as supplementary; when latency is high while CPU is low, suspect blocked threads and take thread dumps before restarting.
    why_it_matters: Monitoring that probes only a status page can report healthy while every request-handling thread is blocked, leaving the outage invisible until users report it.
    applicable_when: [designing monitoring and alerting, reviewing health-check semantics, diagnosing a system that is up but unresponsive]
    not_applicable_when: [short-lived batch jobs whose success is judged by their output]
    required_evidence: [synthetic-transaction coverage of critical request paths, business metrics with expected rhythms, thread or task-level observability for hang diagnosis]
    insufficient_evidence: [process liveness or port checks, a status page served by a thread pool separate from request handling, CPU and memory graphs alone]
    required_inputs: [critical user transactions, monitoring infrastructure capabilities, baseline rhythms of business metrics]
    expected_outputs: [externally observed liveness definition, alert conditions tied to user-visible behavior, hang-diagnosis runbook hooks]
    preservation_boundaries: [production behavior under monitoring load, privacy of synthetic and real transaction data]
    safe_actions: [add synthetic transactions for revenue-critical paths, alert on business-metric anomalies as leading indicators, keep a reserved admin capacity so diagnosis stays possible during a hang]
    unsafe_actions: [declare health from process existence, restart a hung system before capturing thread dumps when capture is cheap and scripted, monitor only infrastructure metrics]
    common_failure_modes: [status page green during a total hang, alert fatigue from infrastructure noise while user impact goes unalerted, blocked threads misread as low load]
    counterexamples: [A stateless worker consuming a queue may be adequately monitored through queue depth and processing rate rather than synthetic transactions.]
    interactions: [Diagnostic follow-through belongs to debugging-hypothesis-led-investigation; the design-time obligation is operations-transparency-by-design.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Blocked Threads"
        contribution: Reports that most observed system failures are hangs rather than crashes - every thread blocked on an impossible outcome - and argues for external synthetic-transaction monitoring and leading-indicator business counters over internal process monitoring.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/007-chapter-2-case-study.md :: The Outage"
        contribution: Shows monitoring that only probed a status page reporting healthy while every request-handling thread was blocked, so the outage was invisible to internal checks.
        relationship: corroboration
    confidence: strong
    roles: [architecture-agent, debugging-and-repair-agent, review-agent, performance-agent]
