  - id: operations-chaos-experiment-discipline
    title: Establish whole-system resilience by disciplined fault injection
    category: architecture
    claim: Whole-system resilience is established by hypothesis-driven fault-injection experiments against the real system under a defined healthy steady state, bounded blast radius, request tracing, and a rehearsed recovery plan - not by component tests or staging environments, because safety is not composable.
    decision_rule: Before injecting faults, verify the entry conditions - failed requests are affordable, blast radius is bounded by explicit victim selection, tracing can show where a fault was absorbed or became a failure, monitoring can detect the health delta, and a recovery plan exists; state the hypothesis as an externally observable steady-state invariant with pre-agreed rejection evidence, and progress from random to targeted injection as the fault space sparsifies.
    why_it_matters: Independently safe components compose into unsafe systems - two providers each meeting a 30ms p99.9 break a 50ms client budget in sequence - and well-protected systems stop emitting the failure evidence that would otherwise justify confidence.
    applicable_when: [assessing resilience of a distributed system in production or production-like conditions, designing game days or continuous fault injection, deciding whether chaos tooling is appropriate at all]
    not_applicable_when: [every request is irreplaceable - if failed requests are unaffordable chaos experiments are the wrong approach, single-process systems adequately covered by component tests]
    required_evidence: [defined externally observable steady state with detection capability, explicit blast-radius bounds and victim selection, request tracing across the injection path, rehearsed recovery plan, explicit authorization of the harm envelope]
    insufficient_evidence: [staging results extrapolated to production scale, component fault tests alone, enthusiasm for chaos tooling without entry conditions]
    required_inputs: [steady-state metrics, injection mechanisms - kill instance add latency fail specific calls, authorization for deliberate production harm]
    expected_outputs: [hypothesis with rejection evidence agreed in advance, experiment record including faults absorbed without failure, hardening actions or validated confidence]
    preservation_boundaries: [the authorized blast radius, user harm envelope explicitly owned and accepted, recovery capability throughout the experiment]
    safe_actions: [start with opt-in scope for fragile estates, select victims explicitly, record where faults were absorbed as evidence of working defenses, run disaster and zombie simulations as rehearsals]
    unsafe_actions: [inject faults without a recovery plan, infer production resilience from staging, run experiments whose failure cost was never authorized, stop recording faults that did not become failures]
    common_failure_modes: [experiment causing unbounded real harm, hypothesis defined after seeing results, monitoring unable to detect the injected delta, chaos tooling adopted as fashion without entry conditions]
    counterexamples: [A payment-settlement pipeline where every request is irreplaceable should build resilience evidence through redundancy proofs and shadow traffic, not production fault injection.]
    interactions: [Deliberate injection sits in explicit tension with universal-preserve-behavior-by-default - the harm envelope must be owned and authorized, never inferred from the technique's existence; the regulator paradox inverts universal-evidence-before-intervention - controlled injection is the intervention that manufactures decision evidence; steady-state metrics double as universal-measure-claimed-improvement baselines.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md :: Adopting Your Own Monkey"
        contribution: Sets the entry conditions and experiment protocol - failed requests must be affordable, exposure limited by explicit blast-radius victim selection, request tracing must show where a fault was absorbed or became a failure, monitoring must detect the health delta, a recovery plan must exist before injection, and the hypothesis must be an externally observable steady-state invariant with pre-agreed rejection evidence.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md :: Breaking Things to Make Them Better"
        contribution: Supplies the whole-system rationale - safety is not composable, two independently safe 30ms-p99.9 providers called in sequence break a 50ms client budget, and staging cannot reproduce scale effects.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md :: Injecting Chaos"
        contribution: Provides the injection taxonomy - kill an instance, add latency, fail a specific call - and the progression from random selection to targeted search as the fault space sparsifies, including learning from faults that do not become failures.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md :: The Simian Army"
        contribution: Contrasts opt-out adoption with sign-off waivers against opt-in for fragile estates, and adds the rule that failures must happen often enough to be routine.
        relationship: corroboration
