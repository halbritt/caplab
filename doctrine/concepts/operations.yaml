  - id: operations-cascading-failure-halting
    title: Halt cascading failures at the caller's boundary
    category: architecture
    claim: A failure in a called system becomes the caller's failure unless the caller stops it at the boundary; drained resource pools and calls without timeouts are the primary transmission mechanisms, and high fan-in services deserve proportionally more protection and scrutiny.
    decision_rule: Distinguish cross-layer cascades from within-layer chain reactions; defend every crossing with timeouts and circuit breakers, treat aggressive or speculative retries as accelerants, and fix the shared defect behind a chain reaction rather than only adding capacity.
    why_it_matters: Cracks jump layers through exhausted pools and unbounded waits, so one sick dependency can take down every caller that failed to defend itself.
    applicable_when: [reviewing services that call other services, diagnosing an outage that spread across layers, designing retry policies]
    not_applicable_when: [a single-process system with no downstream dependencies]
    required_evidence: [pool exhaustion and timeout behavior at each boundary, fan-in analysis of shared services, retry policy and its amplification behavior]
    insufficient_evidence: [downstream health dashboards alone, an assumption that load balancers contain failure, retries added without idempotency or backoff analysis]
    required_inputs: [call graph with fan-in weights, resource pool configuration, failure history of dependencies]
    expected_outputs: [boundary defense plan per crossing, retry policy with backoff and limits, chain-reaction root-cause disposition]
    preservation_boundaries: [caller availability under dependency failure, resource budgets, accepted degraded modes]
    safe_actions: [add timeouts and breakers at layer crossings, bound and jitter retries, prioritize protection around high fan-in services, fix the load-related defect exposed by a chain reaction]
    unsafe_actions: [retry immediately and indefinitely into a sick dependency, let one drained pool block all request threads, rely on autoscaling to outrun a chain reaction]
    common_failure_modes: [retry storm amplifying an outage, pool drained by one slow dependency, surviving nodes collapsing in sequence after one node dies]
    counterexamples: [Within one process a shared in-memory fault is a defect to fix, not a cascade to contain; containment applies at process and service crossings.]
    interactions: [Chain reaction - within a layer under load - and cascade - across layers - stay distinct; bulkheads and autoscaling only slow a chain reaction whose shared defect must be fixed.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Cascading Failures"
        contribution: Defines cascading failure as a crack jumping layers, identifies exhausted resource pools, integration points without timeouts, and aggressive or speculative retries as the jump mechanisms, and names timeouts and circuit breakers as the effective counters.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Chain Reactions"
        contribution: Describes the intra-layer variant - in a homogeneous load-balanced farm one node's death raises survivors' load and failure probability, accelerating collapse; the shared defect must be fixed, with bulkheads and autoscaling only slowing the reaction.
        relationship: refinement
    confidence: strong
    roles: [architecture-agent, review-agent, debugging-and-repair-agent, performance-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system]
    retrieval_terms: [cascading failure, chain reaction, retry storm, pool exhaustion, fan-in, boundary defense]
    routing:
      activate_for_roles: [architecture-agent, review-agent, debugging-and-repair-agent, performance-agent]
      activate_for_tasks: [resilience-review, distributed-review, analyze-incident, stability]
      activate_for_repository_signals: [service call chain, connection pool, retry logic, load balancer farm, outage spanning layers]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [availability, operational, reliability]
      exclude_when: [no downstream dependency exists]
      prerequisites: [call graph and pool configuration evidence]
      retrieval_priority: high
      retrieval_budget_hint: 400
