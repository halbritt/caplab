  - id: operations-ephemeral-instance-design
    title: Treat instance identity, storage, and clock as ephemeral
    category: architecture
    claim: Services must treat machine identity, IP address, local storage, and clock as ephemeral and unreliable, tolerating the loss or slowdown of any single instance, avoiding irreplaceable special machines, and letting new instances volunteer for work instead of being individually configured.
    decision_rule: Design so any instance can disappear or lag - no whole-cluster synchronous responses, no event-ordering or trusted-clock assumptions on virtualized hosts, no addresses baked into configuration files - and have instances join work through autoscaling groups, load balancers, or competing consumers.
    why_it_matters: Individual cloud VMs have worse availability and ephemeral identity compared with physical machines, and oversubscribed hosts make VM performance and clocks unpredictable; designs that assume stable identity break at exactly the wrong time.
    applicable_when: [designing or reviewing services deployed to VMs containers or cloud instances, migrating from static hosts to elastic infrastructure, diagnosing failures tied to a special machine]
    not_applicable_when: [dedicated physical appliances with contractual identity and hardware clocks]
    required_evidence: [instance replacement behavior under loss, work-assignment mechanism that requires no per-instance configuration, externalized storage credentials hostnames and ports, clock-sensitivity analysis]
    insufficient_evidence: [instances have been stable so far, a pet machine documented in a runbook, NTP configured as the only ordering guarantee]
    required_inputs: [deployment platform characteristics, state and storage topology, work-distribution mechanism]
    expected_outputs: [instance-loss tolerance verdict, externalization plan for identity-coupled state, ordering semantics that survive untrusted clocks]
    preservation_boundaries: [durable state outliving instances, event-ordering contracts, session continuity policy]
    safe_actions: [externalize storage credentials hostnames and ports from images, let instances volunteer via discovery or queues, use logical ordering instead of wall clocks across instances]
    unsafe_actions: [hold instance addresses in configuration files, depend on one irreplaceable machine, require whole-cluster synchronous responses, trust VM clocks for event ordering]
    common_failure_modes: [pet server whose loss is an outage, config drift between hand-managed instances, ordering bugs from non-monotonic VM clocks, containers baking secrets into images]
    counterexamples: [A licensed appliance bound to hardware identity is a constraint to isolate behind an interface, not a pattern to copy.]
    interactions: [Complements architecture-event-temporal-semantics - untrustworthy clocks strengthen its demand for explicit ordering; instance replacement side participates in conflict-live-control-vs-immutable-replacement.]
    conflicts: [conflict-live-control-vs-immutable-replacement]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/013-chapter-7-foundations.md :: Virtual Machines in the Cloud"
        contribution: States that individual cloud VMs have worse availability and ephemeral identity and IP than physical machines, so instances must volunteer for work via autoscaling, load balancers, or competing consumers rather than holding addresses in configuration files.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/013-chapter-7-foundations.md :: Virtual Machines in the Data Center"
        contribution: Warns that oversubscribed hosts make VM performance unpredictable and VM clocks non-monotonic and non-sequential, so designs must not require whole-cluster synchronous responses, special irreplaceable machines, event-ordering assumptions, or trusted OS clocks.
        relationship: refinement
