  - id: operations-integration-point-distrust
    title: Treat every integration point as a future failure
    category: architecture
    claim: Every out-of-process integration point - socket, HTTP call, database query, vendor client library - will eventually hang, fail slowly, or violate its protocol, so each one requires explicit timeouts, failure-mode handling, and validation of responses as untrusted data.
    decision_rule: For each remote call, specify its timeout, slow-response behavior, and protocol-violation handling; treat the response as data to validate rather than a trusted object, and verify the failure behavior with fault injection rather than functional tests alone.
    why_it_matters: Integration points are the leading killer of systems, and slow or protocol-violating failures are worse than fast clean ones because they tie up caller resources.
    applicable_when: [writing or reviewing code that calls another process or service, integrating a vendor client library, diagnosing hangs near a remote dependency]
    not_applicable_when: [pure in-process computation with no out-of-process calls]
    required_evidence: [inventory of remote calls with their timeout and failure behavior, evidence of how each dependency fails - refused hung slow or malformed, response validation at the boundary]
    insufficient_evidence: [the dependency has an SLA, functional tests against a healthy dependency, vendor documentation promising reliability]
    required_inputs: [integration inventory, caller latency and resource budgets, dependency failure characteristics]
    expected_outputs: [per-integration timeout and failure contract, validated response handling, fault-injection or harness coverage decision]
    preservation_boundaries: [caller resource budgets under dependency failure, existing integration contracts, data integrity when responses are partial or malformed]
    safe_actions: [add explicit timeouts to every blocking remote call, validate responses as untrusted data before use, exercise integrations against a hostile test harness under load]
    unsafe_actions: [call a remote dependency with no timeout, deserialize responses into trusted objects unchecked, assume a vendor library fails fast]
    common_failure_modes: [indefinite block inside a vendor library, slow dependency exhausting caller threads, protocol violation crashing the parser, cascading hang through undefended calls]
    counterexamples: [A deliberate fire-and-forget notification with accepted loss tolerance does not need a response contract, but it still needs a timeout on the send.]
    interactions: [Counters are catalogued as operations technique records - timeouts, circuit breaker, decoupling middleware, and the fault-injecting test harness.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Integration Points"
        contribution: Names integration points the number-one killer of systems and details their failure physics - slow socket failures worse than fast ones, HTTP-level protocol violations, vendor client libraries that block indefinitely - recommending responses be treated as data until validated.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Countering Integration Point Problems"
        contribution: Prescribes the counters for integration point failures - circuit breaker and decoupling middleware plus a controllable per-integration test harness exercised under substantial load - rather than trusting functional tests.
        relationship: refinement
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/014-chapter-10-the-standard-library.md :: 10.7 #81: Using the default HTTP client and server"
        contribution: "Shows that Go's default HTTP client has no request timeout and its default server omits protective phase limits, so production clients and servers need explicit timeout and resource policy."
        relationship: "refinement"
      - source_id: SRC-DDIA2
        locator: 'books/dokumen-pub-designing-data-intensive-applications-the-big-ideas-behind-reliable-scalable-and-maintainable-systems-2/chapters/009-chapter-5-encoding-and-evolution.md :: Dataflow Through Services: REST and RPC'
        contribution: Shows that remote calls add uncertain outcomes, variable latency, serialization boundaries, retries, and duplicate effects that a local call does not have, so callers must own explicit failure semantics.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system, monolith]
    retrieval_terms: [integration point, remote call, timeout, vendor library, protocol violation, untrusted response]
    routing:
