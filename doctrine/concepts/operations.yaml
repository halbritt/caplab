  - id: operations-designed-failure-modes
    title: Design failure modes deliberately
    category: architecture
    claim: Because faults can never be fully prevented, a system's failure modes must be deliberately designed - containment boundaries chosen like crumple zones to protect indispensable features - or dangerous unplanned failure modes will emerge on their own.
    decision_rule: Accept that faults will occur; trace the fault-error-failure chain for representative faults, choose the abstraction level (pool configuration, timeouts, partitioning, messaging) at which each crack is stopped, and loosen coupling where failure events must stay independent.
    why_it_matters: Tightly coupled layers make failure events non-independent, so a single fault accelerates through the system instead of being absorbed at a designed boundary.
    applicable_when: [designing or reviewing systems with external dependencies or shared resources, deciding where to contain a class of faults, post-incident hardening]
    not_applicable_when: [isolated pure computation with no shared resources or callers to protect]
    required_evidence: [representative fault scenarios and their propagation paths, indispensable features ranked by business impact, coupling map across layers and integration points]
    insufficient_evidence: [belief that review and testing will prevent the bug class, absence of past incidents, a redundancy claim without failure-mode analysis]
    required_inputs: [system topology and dependency map, business impact per capability, available containment mechanisms]
    expected_outputs: [named containment boundaries with the faults they stop, accepted residual failure modes, coupling changes with rationale]
    preservation_boundaries: [indispensable features under partial failure, data integrity across containment boundaries, accepted behavior of surviving components]
    safe_actions: [walk one real failure through every level where it could have been stopped, choose containment at the cheapest effective level, record which failures are deliberately not contained]
    unsafe_actions: [assume prevention makes containment unnecessary, add redundancy without analyzing shared failure modes, let failure modes emerge by accident]
    common_failure_modes: [crack propagation through tight coupling, containment declared but never exercised, every fault treated as equally worth stopping]
    counterexamples: [A single-user CLI may legitimately let any fault terminate the process; designed containment is for systems with consumers to protect.]
    interactions: [System-level complement of implementation-fail-fast-or-recover, which selects the per-call policy; the mechanism catalog lives in the operations technique records.]
    conflicts: [conflict-fault-tolerance-vs-let-it-crash]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md :: Failure Modes"
        contribution: States that accepting the inevitability of failure is what enables designing the system's reaction to specific failures, introducing crumple zones and crackstoppers as the design stance.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md :: Chain of Failure"
        contribution: Supplies the fault-error-failure chain vocabulary and the observation that coupled layers make failure events non-independent, so tight coupling accelerates crack propagation.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md :: Stopping Crack Propagation"
        contribution: Walks one real failure through every abstraction level at which the crack could have been stopped - pool configuration, socket timeouts, service partitioning, request/reply messaging - showing looser coupling acts as a shock absorber.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/007-chapter-2-case-study.md :: An Ounce of Prevention?"
        contribution: Argues from the airline outage that bugs of this class cannot all be prevented by review or testing, so they must be survived, and reframes the goal as preventing bugs in one system from propagating to others.
        relationship: corroboration
    confidence: strong
    roles: [architecture-agent, review-agent, debugging-and-repair-agent, coding-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system, monolith]
    retrieval_terms: [failure mode, crumple zone, crackstopper, fault error failure, containment boundary, crack propagation]
    routing:
