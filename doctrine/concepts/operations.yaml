  - id: operations-externalized-configuration
    title: Keep per-environment configuration outside the artifact
    category: implementation
    claim: Per-environment configuration must live outside the deployable artifact and its source repository so identical binaries promote across environments, with per-machine values separated, properties named by function, and a shared configuration service adopted only as an organization-level commitment whose unavailability instances can survive.
    decision_rule: Separate per-environment and per-machine values from code and image; name properties by function rather than implementation type; inject credentials and addresses at startup; and if a configuration service is used, require instances to start and keep working when it is unreachable, tolerating slightly stale configuration under partition.
    why_it_matters: Configuration baked into artifacts forces rebuilds per environment and leaks environment coupling, while a configuration service adopted casually becomes a severity-one hard dependency that can shut down the fleet from one partitioned node.
    applicable_when: [designing configuration and deployment layouts, moving identical images across environments, adopting or reviewing a configuration service, writing code that reads configuration]
    not_applicable_when: [single-environment tools with no promotion path]
    required_evidence: [identical-artifact promotion across environments, separation of per-environment and per-machine values, startup and steady-state behavior when the configuration source is unreachable]
    insufficient_evidence: [it works in staging, environment names branched inside code, a configuration service assumed always available]
    required_inputs: [environment inventory, configuration property catalog, deployment mechanism]
    expected_outputs: [externalized configuration layout, function-named property scheme, partition-tolerant configuration-service policy or a decision not to adopt one]
    preservation_boundaries: [identical binaries across environments, secrets never entering the source repository, availability independent of the configuration service]
    safe_actions: [inject environment values at startup, name properties for what they mean to the application, cache last-known-good configuration for partition survival]
    unsafe_actions: [bake credentials or addresses into images, keep production config in the application source repository, let a partitioned configuration node shut down the fleet]
    common_failure_modes: [rebuild-per-environment pipelines, config drift between machines, fleet outage caused by the configuration service, committed environment file overriding production]
    counterexamples: [Build-time feature flags compiled into an artifact are a release decision, not environment configuration, and may legitimately live with the source.]
    interactions: [Owns environment portability; operations-credential-custody owns secret protection - the two cross-reference rather than overlap.]
