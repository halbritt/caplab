  - id: operations-least-privilege
    title: Run with least privilege and least exposure
    category: implementation
    claim: Every service process runs as a dedicated non-administrative account with the least privilege its task requires and the smallest network exposure its role requires - isolated per application, and binding each listening socket to an explicitly configured interface rather than all interfaces on multihomed hosts.
    decision_rule: Give each major application its own OS account with no administrative rights - a service behind a load balancer can bind any port above 1024, removing the classic privileged-port excuse - and make listen addresses explicit configuration, because default any-interface binding silently bridges networks with different security roles.
    why_it_matters: Software running as root converts any vulnerability into full-host compromise, and default listening on every interface exposes production services to administrative and backup networks they were never meant to face.
    applicable_when: [configuring service accounts and process privileges, writing code that opens listening sockets, containerizing services, reviewing deployment manifests]
    not_applicable_when: [single-user developer tooling confined to a workstation]
    required_evidence: [per-application account with enumerated privileges, listen-address configuration per socket, network roles of each host interface, container base-image provenance and rebuild cadence]
    insufficient_evidence: [the service needs port 80 as a root justification, containers assumed to isolate everything, a hardening checklist run once]
    required_inputs: [process inventory with accounts, socket and interface topology, container build pipeline]
    expected_outputs: [least-privilege account layout, explicit bind configuration, exposure map of listening surfaces]
    preservation_boundaries: [service functionality under reduced privilege, separation of production backup and administrative traffic]
    safe_actions: [create one non-admin account per application, bind sockets to configured addresses, run behind a load balancer on unprivileged ports, rebuild containers from patched upstream bases on a timed schedule]
    unsafe_actions: [run services as root or administrator, listen on all interfaces of a multihomed host by default, share one account across applications, treat container isolation as a substitute for privilege reduction]
    common_failure_modes: [root service turning one bug into host compromise, production service reachable from the admin network, fat container images carrying their own attack surface, hostname-based interface guessing]
    counterexamples: [A packet-capture diagnostic genuinely requires elevated privilege; it gets a bounded, audited grant rather than a permanently privileged service.]
    interactions: [Exposure reduction complements operations-untrusted-request-handling; capability-is-not-authority framing follows agent-conduct-authority-bounded-action.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/017-chapter-11-security.md :: The Principle of Least Privilege"
        contribution: Mandates non-root and non-administrator execution with a separate OS user per major application, and removes the classic privileged-port excuse by noting a service behind a load balancer can bind any port above 1024.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/013-chapter-7-foundations.md :: Programming for Multiple Networks"
        contribution: Shows that default any-interface listening is wrong on multihomed production hosts and that servers need configurable bind addresses because the self-reported hostname cannot identify the correct interface.
        relationship: refinement
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/013-chapter-7-foundations.md :: NICs and Names"
        contribution: Establishes that machine hostname and DNS name are distinct many-to-many mappings and that data centers separate production, backup, and administrative traffic onto different NICs with different security requirements.
        relationship: corroboration
    confidence: strong
    roles: [coding-agent, review-agent, architecture-agent]
    languages: [language-independent]
    repository_archetypes: [service, distributed-system, deployed systems]
    retrieval_terms: [least privilege, non-root, bind address, multihomed host, service account, attack surface, container privilege]
    routing:
      activate_for_roles: [coding-agent, review-agent, architecture-agent]
      activate_for_tasks: [operational-hardening, implement-I-O, review-I-O, code-review]
      activate_for_repository_signals: [root process, listen on all interfaces, service account config, container manifest]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [security, operational]
      exclude_when: [workstation-confined developer tooling]
      prerequisites: [process and interface inventory]
