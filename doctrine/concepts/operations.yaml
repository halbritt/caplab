  - id: operations-synchronized-demand-dispersion
    title: Anticipate and disperse synchronized demand pulses
    category: performance
    claim: Synchronized stimuli - promotions and deep links, mass restarts, on-the-hour cron jobs, cache invalidation storms, and fixed retry intervals - concentrate demand into pulses that require far more than steady-state capacity; anticipate them and disperse the load with communication, waves, jitter, backoff, and pre-scaling.
    decision_rule: Before any synchronized stimulus - marketing event, fleet restart, scheduled job, config push - estimate the pulse it creates; add jitter to periodic work, increasing backoff to retries, waves to fleet operations, and static fallback paths to promotions, and pre-scale where the pulse is known in advance.
    why_it_matters: The organization can conspire against its own system - a marketing email or a midnight cron line can produce a dogpile no steady-state capacity plan survives.
    applicable_when: [writing schedulers cron jobs or retry logic, planning fleet restarts or config pushes, preparing for traffic events, reviewing periodic batch work]
    not_applicable_when: [demand is naturally uncorrelated and no synchronizing stimulus exists]
    required_evidence: [inventory of synchronized stimuli and their timing, pulse magnitude estimate versus steady-state capacity, retry and schedule interval distributions]
    insufficient_evidence: [steady-state capacity headroom alone, an assumption that caches absorb startup load, marketing plans not shared with engineering]
    required_inputs: [schedule and retry configuration, event calendar and communication channels, restart and deployment procedures]
    expected_outputs: [jittered schedules and backoff policies, wave plans for fleet operations, pre-scaling or fallback plans for known events]
    preservation_boundaries: [work correctness under dispersion - jitter must not violate ordering or deadline contracts, accepted freshness of caches being warmed]
    safe_actions: [randomize cron start times, replace fixed retry intervals with increasing backoff plus jitter, restart fleets in waves, serve static landing pages during promotion spikes]
    unsafe_actions: [schedule identical work at round times across a fleet, retry on fixed intervals from many clients, invalidate a shared cache everywhere at once, restart everything simultaneously after an outage]
    common_failure_modes: [dogpile at startup or midnight, thundering herd after cache flush, retry synchronization amplifying a blip into an outage]
    counterexamples: [A deadline-driven regulatory batch that must run at a fixed time needs capacity for its pulse rather than dispersion.]
    interactions: [Boot storms interact with operations-load-shedding at the edge; agents scheduling their own periodic work fall under this rule directly.]
    source_support:
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Self-Denial Attacks"
        contribution: Defines the self-denial attack - the organization conspiring against its own system via marketing events, deep links bypassing CDNs, and shared-resource hot spots - and prescribes communication, load-spreading waves, static landing pages, fallback modes, and pre-autoscaling.
        relationship: direct_support
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Dogpile"
        contribution: Adds the dogpile mechanism - startup and periodic load from boot storms, midnight cron, config pushes, and lockstep waits far exceeds steady state - and prescribes randomized slew and increasing backoff so callers desynchronize.
        relationship: refinement
    confidence: strong
