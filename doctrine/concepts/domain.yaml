  - id: domain-identity-entity
    title: Use Entity only for domain-significant identity
    category: domain
    claim: A domain Entity is justified when meaning depends on continuity and identity despite attribute changes; a primary key or mutable record alone is insufficient.
    decision_rule: Ask whether experts distinguish the same thing across time and attribute change, identify the identity authority and lifecycle, and use Entity semantics only when that continuity affects rules, references, or history.
    why_it_matters: Treating every row as an Entity adds mutable lifecycle and identity complexity, while modeling true identity as a value loses continuity and reference semantics.
    applicable_when: ["modeling identity, lifecycle, history, or references", "reviewing entity-versus-value semantics"]
    not_applicable_when: ["meaning is wholly the attributes", "identity exists only for storage convenience"]
    required_evidence: ["expert distinction of sameness over time", "identity source and comparison rules", "lifecycle or reference consequences"]
    insufficient_evidence: ["primary key", "mutable fields", "ORM entity annotation", "table existence"]
    required_inputs: ["domain scenarios", "identity authority", "lifecycle and reference use"]
    expected_outputs: ["Entity or Value Object decision", "identity operation and lifecycle rules"]
    preservation_boundaries: ["identity continuity", "authorization and audit linked to identity", "context-specific meaning"]
    safe_actions: ["define explicit identity equality", "keep descriptive attributes separate", "scope identity to a bounded context"]
    unsafe_actions: ["entity per table", "reuse one identity meaning across contexts automatically", "equate Entity with Aggregate"]
    common_failure_modes: ["persistence-driven entity", "identity leakage", "mutable value modeled as entity", "cross-context false identity"]
    counterexamples: ["A postal address can be a Value Object in one context even if another context tracks address records by identity."]
    interactions: ["Terminology differs from Clean Architecture enterprise-policy Entity and FSA entity trap; these are not equivalent.", "An Entity may be inside domain-aggregate-invariant-boundary but need not be an Aggregate root."]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/006-chapter-5-a-model-expressed-in-software.md :: Entities (a.k.a. Reference Objects)"
        contribution: "Defines Entity by continuity and identity rather than attributes."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/006-chapter-5-a-model-expressed-in-software.md :: Designing the Identity Operation"
        contribution: "Makes identity comparison and source explicit design work."
      - source_id: SRC-FSA
        relationship: tension
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/013-chapter-8-component-based-thinking.md :: Entity trap"
        contribution: "Warns that data entities do not define architectural components."
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, monolith, distributed-system]
    retrieval_terms: [Entity, identity, lifecycle, reference object, primary key, entity trap]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, review-agent]
      activate_for_tasks: [domain-modeling, entity-design, persistence-design, API-review]
      activate_for_repository_signals: [ORM entity, primary key, identity comparison, lifecycle, entity class]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [domain, correctness, data]
      exclude_when: [pure transport or persistence record with no domain identity]
      prerequisites: [domain-language-model-loop, identity scenarios]
      retrieval_priority: specialist
      retrieval_budget_hint: 300
      related_concepts: [domain-value-object, domain-aggregate-invariant-boundary, domain-language-model-loop]

  - id: domain-value-object
    title: Use Value Object for attribute-defined meaning
    category: domain
    claim: A Value Object is justified when meaning is entirely its attributes, equality is by value, and replacement is valid; immutability and whole-value invariants are preferred unless domain evidence requires controlled mutation.
    decision_rule: Test whether independent identity or lifecycle matters, define equality, units, precision, and invariants, choose immutable replacement by default, and account for mapping and performance without sacrificing meaning silently.
    why_it_matters: Explicit value semantics localize validation and eliminate identity noise, but indiscriminate copying or hidden mutability can create performance and correctness problems.
    applicable_when: ["modeling descriptive concepts, quantities, ranges, money, addresses, or measurements", "reviewing equality and mutability semantics"]
    not_applicable_when: ["continuity or identity is domain-significant", "mutation itself carries lifecycle meaning"]
    required_evidence: ["attribute-defined equality", "absence of independent identity", "units, precision, and invariant rules", "mutation and performance constraints"]
    insufficient_evidence: ["small class", "DTO shape", "immutable language feature alone"]
    required_inputs: ["domain examples", "equality and lifecycle semantics", "representation constraints"]
    expected_outputs: ["Entity or Value Object decision", "equality, invariant, mutability, and serialization rules"]
    preservation_boundaries: ["units and precision", "value equality", "serialization and persistence fidelity"]
    safe_actions: ["replace a whole immutable value", "validate at construction", "use a measured optimized representation behind semantic tests"]
    unsafe_actions: ["give storage identity domain meaning", "allow shared mutable value without evidence", "change precision for performance silently"]
    common_failure_modes: ["DTO mistaken for Value Object", "unit confusion", "hidden aliasing", "identity added by persistence"]
    counterexamples: ["An address may be an Entity in a property registry context and a Value Object in an order-delivery context."]
    interactions: ["Contrasts with domain-identity-entity.", "Can express invariants inside domain-aggregate-invariant-boundary and improve domain-intention-revealing-interface."]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/006-chapter-5-a-model-expressed-in-software.md :: Value Objects"
        contribution: "Defines objects by descriptive attributes rather than identity."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/006-chapter-5-a-model-expressed-in-software.md :: Special Cases: When to Allow Mutability"
        contribution: "Conditions the default immutability rule on domain and implementation forces."
    confidence: strong
    roles: [coding-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [Value Object, value equality, immutability, units, precision, descriptive object]
    routing:
      activate_for_roles: [coding-agent, review-agent]
      activate_for_tasks: [domain-modeling, value-design, API-design, persistence-mapping]
      activate_for_repository_signals: [primitive obsession, quantity, money, address, equality, mutable value]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [domain, correctness, data]
      exclude_when: [independent identity and lifecycle are material]
      prerequisites: [domain-language-model-loop, equality semantics]
      retrieval_priority: specialist
      retrieval_budget_hint: 300
      related_concepts: [domain-identity-entity, domain-aggregate-invariant-boundary, domain-intention-revealing-interface]

  - id: domain-service-operation
    title: Use Domain Service only for ownerless domain operations
    category: domain
    claim: A Domain Service expresses an important stateless domain operation that does not naturally belong to an Entity or Value Object; it is not an application service, deployable service, or microservice.
    decision_rule: Try to place behavior with the Entity or Value Object owning its data and invariant; use a Domain Service only when expert language names a cross-concept operation whose inputs and outputs remain domain concepts and whose side effects are explicit.
    why_it_matters: Domain Services can clarify genuine processes but easily become procedural dumping grounds that strip behavior from the model.
    applicable_when: ["an important domain operation spans concepts and has no natural object owner", "reviewing an anemic model or service layer"]
    not_applicable_when: ["behavior naturally belongs to an Entity or Value Object", "the service performs only technical orchestration"]
    required_evidence: ["expert-recognized domain operation", "domain inputs and outputs", "lack of natural Entity or Value owner", "explicit side-effect and transaction semantics"]
    insufficient_evidence: ["service suffix", "method does not fit current class layout", "application layer convention", "need for remote deployment"]
    required_inputs: ["domain language and behavior", "candidate object responsibilities", "side-effect and transaction needs"]
    expected_outputs: ["behavior placed on an object, Domain Service, or application mechanism", "service contract and state/side-effect semantics"]
    preservation_boundaries: ["domain invariants", "state authority", "terminology distinction from deployable services"]
    safe_actions: ["define a stateless domain calculation", "model a named domain process", "move naturally owned behavior back to an Entity"]
    unsafe_actions: ["create service per entity", "put all business logic in services", "infer microservice from Domain Service"]
    common_failure_modes: ["anemic domain model", "god service", "technical orchestration mislabeled domain", "service terminology collision"]
    counterexamples: ["A repository adapter or HTTP handler is not a Domain Service even when it invokes domain behavior."]
    interactions: ["Requires the terminology and ownership evidence of domain-language-model-loop.", "Must remain distinct from architecture distribution and service topology concepts."]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/006-chapter-5-a-model-expressed-in-software.md :: Services"
        contribution: "Defines stateless domain operations that do not fit an Entity or Value Object."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/006-chapter-5-a-model-expressed-in-software.md :: Partitioning Services into Layers"
        contribution: "Separates domain services from application and infrastructure services."
      - source_id: SRC-CA
        relationship: terminology_variant
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/038-chapter-27-services-great-and-small.md :: SERVICE ARCHITECTURE?"
        contribution: "Uses service primarily for a deployable runtime unit, requiring explicit terminology separation."
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, monolith, distributed-system]
    retrieval_terms: [Domain Service, stateless operation, anemic model, service layer, domain process]
    routing:
