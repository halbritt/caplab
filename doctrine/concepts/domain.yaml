  - id: domain-intention-revealing-interface
    title: Reveal domain intention and consequences in interfaces
    category: domain
    claim: A domain-facing API should express purpose, policy, result, state change, failure, and invariant in the Ubiquitous Language while hiding mechanism and limiting side effects.
    decision_rule: Review representative client code and ask whether an informed domain reader can predict the operation's intent and consequences without reading implementation; rename, split command and query, introduce a validated Value Object or Specification, or state assertions when the answer is no.
    why_it_matters: Mechanism-named or side-effect-obscuring APIs force callers to reconstruct hidden rules and make model changes unsafe.
    applicable_when: ["designing or reviewing core domain APIs", "client code cannot predict mutation, failure, or invariant"]
    not_applicable_when: ["the API is a low-level internal mechanism not presented as domain vocabulary"]
    required_evidence: ["representative client code", "validated domain language", "preconditions, postconditions, failures, and mutation scope", "caller knowledge burden"]
    insufficient_evidence: ["short method", "fluent syntax", "generic verb", "aesthetic naming preference"]
    required_inputs: ["domain use cases", "current API and client examples", "invariants and side effects"]
    expected_outputs: ["intention-revealing operation and types", "explicit command, query, failure, and assertion semantics"]
    preservation_boundaries: ["domain behavior and invariants", "public compatibility", "required performance and failure visibility"]
    safe_actions: ["use a domain verb", "return a Value Object", "separate calculation from mutation", "document an unavoidable side effect"]
    unsafe_actions: ["hide I/O or mutation behind a query name", "expose mechanism types", "invent domain names without expert validation"]
    common_failure_modes: ["generic service method", "hidden side effect", "mechanism leakage", "fluent but semantically vague API"]
    counterexamples: ["A private numerical kernel can use mathematical implementation vocabulary when its caller is a domain operation that supplies the semantic contract."]
    interactions: ["Operationalizes domain-language-model-loop.", "Uses domain-value-object and domain-explicit-concept where those semantics are earned.", "Refines universal-information-hiding for domain clients."]
