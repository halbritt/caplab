  - id: domain-anticorruption-layer
    title: Earn an Anticorruption Layer from semantic conflict
    category: domain
    claim: An Anticorruption Layer protects a valuable local model from a necessary, materially different foreign or legacy model through explicit semantic translation; it is not merely a transport client or generic facade.
    decision_rule: Verify required integration, concrete model conflict, local-model value, and ownership limits; compare Conformist, direct integration, Separate Ways, and translation; build local services, adapters, and translators only when semantic protection exceeds mapping and operational cost.
    why_it_matters: Foreign concepts can corrupt core meaning, but unnecessary translation creates a third model, duplicate data, latency, and permanent maintenance burden.
    applicable_when: ["a valuable local model must integrate with an uncontrolled legacy, vendor, or distinct context", "incremental legacy retirement needs a semantic seam"]
    not_applicable_when: ["models are materially the same", "the interface is small and acceptable", "integration value is lower than separation"]
