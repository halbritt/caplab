  - id: domain-bounded-context
    title: Bound one coherent model and language explicitly
    category: domain
    claim: A Bounded Context delimits where one model and Ubiquitous Language remain coherent under explicit ownership; it is not equivalent to a source module, team, database, architectural quantum, process, or service.
    decision_rule: Gather expert language, workflows, invariants, identity definitions, data authority, and ownership; identify internal coherence and external semantic discontinuity; test candidate boundaries with real changes; name each context and map every necessary crossing.
    why_it_matters: One unbounded model accumulates contradictions, while context-per-entity or context-per-service adds translation and coordination without semantic value.
