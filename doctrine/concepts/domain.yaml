  - id: domain-fitting-large-scale-structure
    title: Use only a fitting minimal large-scale domain structure
    category: domain
    claim: Large-scale domain structure should be the smallest organizing concept that currently fits and communicates the model, and it must evolve, simplify, or disappear when exceptions and learning show loss of fit.
    decision_rule: Identify coordination and cognitive pressure across model areas, propose a minimal metaphor, responsibility layer, knowledge level, or plugin structure, test it against real placement and change scenarios, and retain it only while it reduces total reasoning and exceptions.
    why_it_matters: A fitting structure coordinates large models, but a master plan or ceremonial metaphor suppresses discovery and forces local concepts into the wrong shape.
    applicable_when: ["a large domain model spans many modules or teams", "placement and communication lack a shared organizing concept"]
    not_applicable_when: ["one small coherent model needs no global structure", "the structure is imposed before enough model knowledge exists"]
    required_evidence: ["cross-model coordination or cognitive pressure", "candidate structure that fits current concepts", "placement and change scenarios", "exception and maintenance cost"]
    insufficient_evidence: ["desire for symmetry", "reference architecture", "enterprise master plan", "one successful metaphor analogy"]
    required_inputs: ["current contexts and core domain", "representative changes", "team communication needs"]
    expected_outputs: ["minimal structure or no structure", "fit evidence and exceptions", "evolution or deletion trigger"]
    preservation_boundaries: ["local context integrity", "domain discovery", "team ability to evolve the model"]
    safe_actions: ["adopt a simple responsibility layer", "refactor toward a demonstrated fit", "discard a metaphor that no longer helps"]
    unsafe_actions: ["freeze a master plan", "force every context into one hierarchy", "build a plugin framework before variation is demonstrated"]
    common_failure_modes: ["ceremonial architecture", "metaphor literalism", "global structure suppresses local model", "framework-first domain"]
    counterexamples: ["Several independent Bounded Contexts can share no single internal large-scale model structure beyond their explicit Context Map."]
    interactions: ["Domain-core-domain-priority guides where structure deserves effort.", "Domain-bounded-context protects local model integrity.", "Architecture-contextual-style-selection remains a separate technical topology decision."]
    conflicts: [conflict-upfront-vs-evolutionary-architecture, conflict-uniformity-vs-context-sensitive-design]
