      activate_for_tasks: [aggregate-design, domain-modeling, transaction-design, service-decomposition, consistency-review]
      activate_for_repository_signals: [aggregate root, transaction, invariant, concurrent update, saga, ORM cascade]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [domain, data, correctness, performance, durability]
      exclude_when: [read-only projection or grouping with no coordinated invariant]
      prerequisites: [domain-language-model-loop, explicit invariant scenarios]
