  - id: domain-aggregate-invariant-boundary
    title: Define Aggregates from invariants and consistency
    category: domain
    claim: An Aggregate is the smallest cluster whose domain invariants require one authorized consistency and transaction boundary; object composition, reachability, ORM cascade, or service topology do not define it.
    decision_rule: Express each invariant and violating command, determine what must be atomic and what may reconcile later, choose the smallest root that can enforce mutations, reference other aggregates by identity, and test concurrency, retry, failure, and contention.
    why_it_matters: Oversized aggregates cause contention and loading cost; undersized aggregates allow invalid states or hide distributed consistency changes.
    applicable_when: ["modeling transactional domain invariants", "reviewing aggregate size, consistency, or service decomposition"]
    not_applicable_when: ["no invariant requiring coordinated consistency is known", "the grouping exists only for navigation or persistence"]
    required_evidence: ["expert-validated invariants", "commands and mutation authority", "atomic versus eventual consistency decision", "concurrency and failure scenarios", "measured load when performance drives a split"]
    insufficient_evidence: ["object graph", "foreign-key composition", "ORM cascade", "one aggregate per entity", "microservice boundary"]
    required_inputs: ["domain commands and invariants", "transaction capabilities", "identity and reference semantics", "contention and consistency requirements"]
    expected_outputs: ["aggregate root and boundary", "invariant and transaction rules", "reference, concurrency, and failure tests"]
    preservation_boundaries: ["domain invariants", "identity continuity", "authorized consistency semantics", "retry and duplicate behavior"]
    safe_actions: ["route mutations through the root", "reference another aggregate by identity", "split only when semantics permit and evidence earns weaker consistency"]
    unsafe_actions: ["expose mutable internals", "derive aggregate from containment", "weaken consistency for scale folklore", "equate aggregate with service"]
    common_failure_modes: ["giant aggregate", "anemic aggregate root", "hidden cross-aggregate transaction", "eventual consistency without reconciliation"]
    counterexamples: ["A read projection can join data from several aggregates without becoming an aggregate or owning their invariants."]
    interactions: ["Specializes universal-explicit-invariants.", "Is scoped within domain-bounded-context.", "Constrains architecture-distribution-readiness when atomicity crosses a proposed service boundary."]
    conflicts: [conflict-model-fidelity-vs-performance-representation]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/007-chapter-6-the-life-cycle-of-a-domain-object.md :: Aggregates"
        contribution: "Defines Aggregate root, boundary, external references, and invariant protection."
      - source_id: SRC-FSA
        relationship: refinement
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/023-chapter-17-microservices-architecture.md :: Transactions and Sagas"
        contribution: "Exposes the consistency consequences of distributing a transaction."
      - source_id: SRC-CA
        relationship: corroboration
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/031-chapter-20-business-rules.md :: USE CASES"
        contribution: "Places application-specific invariant orchestration with explicit use-case policy."
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent, performance-agent]
    languages: [language-independent]
    repository_archetypes: [service, monolith, distributed-system]
    retrieval_terms: [Aggregate, aggregate root, invariant boundary, transaction boundary, consistency, saga]
