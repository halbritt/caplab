    expected_outputs: ["ACL, Conformist, direct, or Separate Ways decision", "translation contract and tests", "ownership and deletion or evolution trigger"]
    preservation_boundaries: ["local domain meaning", "identity and data fidelity", "ordering, error, retry, transaction, and audit semantics"]
    safe_actions: ["define local service vocabulary", "use stateless translators", "contract-test both directions", "phase out mappings with legacy retirement"]
    unsafe_actions: ["spread foreign primitives through the local model", "call a transport wrapper an ACL", "duplicate business rules ambiguously", "translate without failure semantics"]
    common_failure_modes: ["translation swamp", "third accidental model", "stale identity mapping", "unbounded bidirectional coupling"]
