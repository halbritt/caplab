  - id: domain-language-model-loop
    title: Evolve language, model, implementation, and learning together
    category: domain
    claim: A domain model is a working Ubiquitous Language bound to code, tests, examples, and continuous expert-developer learning, not a noun inventory or documentation-only abstraction.
    decision_rule: Use expert scenarios to establish terms, decisions, identities, policies, and invariants; express them in client-facing code and tests; challenge awkwardness and contradictions; revise language and implementation together when examples fail.
    why_it_matters: A model detached from code becomes aspirational, while code detached from expert language embeds accidental technical concepts and inconsistent business meaning.
    applicable_when: ["domain-modeling investment has been earned", "business terms or rules are ambiguous or contradictory"]
    not_applicable_when: ["generic technical mechanism has no meaningful domain language"]
    required_evidence: ["authoritative expert examples", "terms whose meanings affect decisions", "model expressed in executable behavior", "feedback from implementation and usage"]
    insufficient_evidence: ["class and table names", "a glossary without examples", "industry-standard vocabulary assumed locally", "diagram not reflected in code"]
    required_inputs: ["domain experts and scenarios", "current code and tests", "documents and operational language"]
    expected_outputs: ["context-scoped Ubiquitous Language", "executable model and examples", "known contradictions and experiments"]
    preservation_boundaries: ["accepted business meaning", "context-specific term definitions", "expert authority and observed behavior"]
    safe_actions: ["model out loud", "rename code with validated language", "prototype a disputed rule", "keep explanatory models distinct from executable models"]
    unsafe_actions: ["infer a model from database nouns", "force one language across contexts", "declare a technical abstraction a deeper model without expert validation"]
    common_failure_modes: ["noun-centric model", "documentation drift", "false cognates across contexts", "modeler detached from implementation"]
    counterexamples: ["A mathematical explanatory diagram can help discussion without becoming the executable domain model, provided the distinction is explicit."]
    interactions: ["Supplies semantic evidence to domain-bounded-context and invariant evidence to domain-aggregate-invariant-boundary.", "Architecture-policy-mechanism-separation protects an independently valuable model from contingent mechanism."]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/003-chapter-2-communication-and-the-use-of-language.md :: Ubiquitous Language"
        contribution: "Binds communication, modeling, and implementation to one context-specific language."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/004-chapter-3-binding-model-and-implementation.md :: Model-Driven Design"
        contribution: "Requires the implementation to express and test the selected model."
      - source_id: SRC-CA
        relationship: corroboration
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/032-chapter-21-screaming-architecture.md :: THE THEME OF AN ARCHITECTURE"
        contribution: "Requires application purpose and use cases to remain visible in structure."
    confidence: strong
    roles: [coding-agent, architecture-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
