  - id: domain-repository-lifecycle
    title: Use Repository for aggregate-root lifecycle access
    category: domain
    claim: A Repository is justified when domain code needs collection-like retrieval and reconstitution of Aggregate roots while persistence, query, consistency, transaction, and latency mechanics remain explicit to implementers.
    decision_rule: Create repositories only for globally retrieved Aggregate roots, define intention-revealing domain queries, make I/O and transaction semantics observable, and avoid generic CRUD surfaces that hide cost or expose aggregate internals.
    why_it_matters: A meaningful Repository isolates persistence mechanism without pretending queries are free; repository-per-table designs add abstraction while preserving a data-centric model.
    applicable_when: ["Aggregate roots require retrieval or reconstitution", "persistence mechanics would pollute domain use cases"]
    not_applicable_when: ["simple record access or read projection has no Aggregate lifecycle", "framework repository already exactly matches the accepted need"]
    required_evidence: ["Aggregate root and lifecycle", "domain-significant lookup operations", "query, transaction, and consistency semantics", "realistic scale and latency"]
    insufficient_evidence: ["one class or table", "uniform repository convention", "desire to mock persistence"]
    required_inputs: ["Aggregate design", "use-case queries", "persistence and transaction capabilities"]
    expected_outputs: ["Repository or direct gateway decision", "query contract, ownership, and performance semantics"]
    preservation_boundaries: ["Aggregate invariants and identity", "transaction and consistency behavior", "query result and failure semantics"]
    safe_actions: ["define an intention-revealing lookup", "use a test implementation with the same semantics", "optimize internals behind a stable domain query"]
    unsafe_actions: ["repository per class", "unbounded all operation", "hide N+1 or remote I/O", "return mutable aggregate internals"]
    common_failure_modes: ["generic CRUD domain", "persistence abstraction leak", "N+1 query", "session or transaction surprise"]
    counterexamples: ["A reporting projection can use a query gateway directly without pretending to reconstitute Aggregate roots."]
    interactions: ["Reconstitutes domain-aggregate-invariant-boundary and remains distinct from domain-factory-lifecycle.", "Architecture-policy-mechanism-separation can justify a persistence gateway even when Repository semantics do not fit."]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/007-chapter-6-the-life-cycle-of-a-domain-object.md :: Repositories"
        contribution: "Defines collection-like access and reconstitution for Aggregate roots."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/007-chapter-6-the-life-cycle-of-a-domain-object.md :: Querying a R***EPOSITORY"
        contribution: "Requires domain-relevant queries rather than uniform data access."
      - source_id: SRC-CA
        relationship: corroboration
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/034-chapter-23-presenters-and-humble-objects.md :: DATABASE GATEWAYS"
        contribution: "Separates business use cases from persistence mechanism through a gateway."
