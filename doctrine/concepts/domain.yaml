schema_version: agent-doctrine-concepts/1
concepts:
  - id: domain-modeling-investment-gate
    title: Earn strategic and tactical domain modeling investment
    category: domain
    claim: Deep domain modeling is justified by business-critical rule, identity, policy, and language complexity plus sustained expert-developer learning and sufficient product lifespan, not by tables, jargon, or architectural fashion.
    decision_rule: Classify the area as differentiating core, supporting, generic, or simple workflow; identify concrete ambiguity and rule defects; verify expert access and learning cadence; compare transaction script, modest domain module, and deep model; add only tactics whose semantics exist.
    why_it_matters: Domain modeling can concentrate insight in complex products, but in simple workflows it introduces vocabulary, layers, and lifecycle ceremony with no compensating value.
    applicable_when: ["rules, identity, invariants, or language are central and changing", "assessing whether DDD tactics or strategic context work is warranted"]
    not_applicable_when: ["simple CRUD, reporting, or short-lived utility", "authoritative domain experts are unavailable"]
    required_evidence: ["business differentiation and product lifespan", "recurring ambiguity, contradiction, or rule defect", "expert access and feedback cadence", "team capacity to sustain the model"]
    insufficient_evidence: ["many database tables", "industry jargon", "microservices", "object-oriented language", "desire for rich entities"]
    required_inputs: ["business strategy and workflows", "domain complexity examples", "expert and team availability"]
    expected_outputs: ["deep, modest, simple, or defer modeling decision by subdomain", "selected tactics and exclusions", "learning and reassessment trigger"]
    preservation_boundaries: ["accepted business behavior", "expert authority over domain meaning", "delivery simplicity where complexity is low"]
    safe_actions: ["prototype one difficult rule", "use a transaction script for a simple workflow", "concentrate model work on validated core capability"]
    unsafe_actions: ["apply an aggregate-repository-service package template", "infer complexity from schema size", "rename infrastructure with domain terms without expert validation"]
    common_failure_modes: ["DDD ceremony", "anemic rich-object facade", "model without experts", "prestige-driven core classification"]
    counterexamples: ["A simple internal data-entry application can rationally use Smart UI or transaction scripts while preserving a trigger for future complexity."]
    interactions: ["Specializes universal-evidence-before-intervention for domain design.", "Activates domain-language-model-loop and domain-core-domain-priority only after its gate clears.", "Universal-no-change-option remains valid when current simple structure fits."]
    conflicts: [conflict-domain-purity-vs-implementation-simplicity]
    source_support:
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/002-chapter-1-crunching-knowledge.md :: Knowledge Crunching"
        contribution: "Bases effective modeling on sustained expert and developer learning."
      - source_id: SRC-DDD
        relationship: tension
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: The Smart UI \"Anti-Pattern\""
        contribution: "Explicitly identifies conditions where simpler UI-centered design is a rational alternative."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/017-chapter-15-distillation.md :: Core Domain"
        contribution: "Concentrates deep design effort on differentiating capability."
    confidence: contextual
    roles: [coding-agent, architecture-agent, review-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [DDD investment, domain complexity, Smart UI, transaction script, rich domain model, domain expert]
    routing:
      activate_for_roles: [coding-agent, architecture-agent, review-agent, repository-assessment-agent]
      activate_for_tasks: [domain-assessment, model-design, architecture-planning, tactical-DDD-review]
      activate_for_repository_signals: [complex rules, domain experts, ambiguous terminology, CRUD system, proposed DDD layers]
      activate_for_languages: [language-independent]
