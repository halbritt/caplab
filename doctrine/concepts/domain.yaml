  - id: domain-association-constraint
    title: Constrain domain associations to required meaning
    category: domain
    claim: Domain associations should retain only the traversal, direction, multiplicity, qualification, and ownership that real use cases and invariants require.
    decision_rule: For each association, identify required traversal, lifecycle owner, synchronization, multiplicity, and query/update frequency; remove unused direction, qualify broad multiplicity with a domain rule, or replace navigation with identity and an explicit query.
    why_it_matters: Complete-looking bidirectional object graphs expand coupling, loading, mutation, and invariant uncertainty without necessarily expressing useful domain knowledge.
    applicable_when: ["designing domain object relationships", "reviewing ORM-driven or highly connected object graphs"]
    not_applicable_when: ["graph traversal itself is the core domain and the cost is characterized"]
    required_evidence: ["use-case traversal", "domain multiplicity and qualification rule", "lifecycle and mutation ownership", "query and update profile"]
    insufficient_evidence: ["real-world relationship exists", "foreign key exists", "ORM can map it", "diagram completeness"]
    required_inputs: ["domain scenarios", "association and ownership map", "access and scale characteristics"]
    expected_outputs: ["retained, directed, qualified, identity-based, or removed association", "query and mutation obligations"]
    preservation_boundaries: ["required navigation and behavior", "Aggregate invariants", "query correctness and performance"]
    safe_actions: ["remove unused back-reference", "replace cross-Aggregate object reference with identity", "name a qualified relationship"]
    unsafe_actions: ["bidirectional association by default", "load an entire graph for convenience", "infer Aggregate from reachability"]
    common_failure_modes: ["object graph explosion", "synchronization bug", "hidden N+1 query", "Aggregate leakage"]
    counterexamples: ["A graph-analysis domain may legitimately require broad bidirectional traversal when it is the modeled capability rather than ORM convenience."]
