      activate_for_tasks: [repository-design, persistence-design, domain-modeling, query-review]
      activate_for_repository_signals: [repository per class, generic repository, aggregate load, N+1, ORM session]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [domain, data, performance, correctness]
