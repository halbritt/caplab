  - id: domain-factory-lifecycle
    title: Use Factory only for complex valid creation
    category: domain
    claim: A Factory is justified only when creation or reconstitution must establish a complex valid whole or lifecycle transition that a clear constructor cannot express safely.
    decision_rule: Identify invariants that must hold at creation, distinguish new creation from reconstitution, use the simplest constructor when sufficient, and place Factory behavior where domain meaning and identity generation remain explicit.
    why_it_matters: Factories can protect invariant construction, but routine factory layers hide novelty, failure, identity, and lifecycle behind unnecessary indirection.
    applicable_when: ["creating an Aggregate or Value Object requires coordinated invariant establishment", "reconstitution differs materially from new creation"]
    not_applicable_when: ["a constructor can produce a valid object clearly", "the factory is only dependency injection or framework ceremony"]
    required_evidence: ["creation-time invariants", "complex coordinated parts", "identity and lifecycle semantics", "failure and idempotency requirements"]
    insufficient_evidence: ["object has dependencies", "framework convention", "constructor preference", "desire for uniform factories"]
    required_inputs: ["valid construction scenarios", "Aggregate and identity model", "persistence reconstitution needs"]
    expected_outputs: ["constructor, Factory, or Repository reconstitution decision", "creation contract and invariant tests"]
    preservation_boundaries: ["valid initial state", "identity novelty and audit semantics", "failure and retry behavior"]
    safe_actions: ["use a named Factory for a complex Aggregate", "keep a simple constructor", "separate new creation from reconstitution"]
    unsafe_actions: ["find-or-create that hides domain-significant novelty", "factory per class", "duplicate invariant logic across Factory and Aggregate"]
    common_failure_modes: ["factory ceremony", "invalid partially built object", "hidden identity creation", "confused reconstitution"]
    counterexamples: ["A small immutable Value Object with one validation rule normally needs only a validating constructor."]
    interactions: ["Constructs valid instances governed by domain-aggregate-invariant-boundary.", "Domain-repository-lifecycle handles retrieval and reconstitution access; the techniques are related but not synonyms."]
