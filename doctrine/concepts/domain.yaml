      activate_for_tasks: [domain-modeling, behavior-placement, service-review, API-design]
      activate_for_repository_signals: [domain service, god service, anemic entity, cross-entity operation]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [domain, maintainability, correctness]
      exclude_when: [pure technical orchestration or deployable-service design]
      prerequisites: [domain-language-model-loop, candidate responsibility analysis]
