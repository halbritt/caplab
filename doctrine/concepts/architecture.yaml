schema_version: agent-doctrine-concepts/1
concepts:
  - id: architecture-scoped-characteristics
    title: Scope measurable architecture characteristics
    category: architecture
    claim: A quality is architecturally significant only when it affects structure, is important to success, has a concrete scenario and threshold, and is scoped to the affected flow or architectural quantum.
    decision_rule: Derive candidate characteristics from accepted requirements and domain or operational concerns; define stimulus, environment, response, threshold, owner, and scope; retain only the smallest differentiating set whose structural consequences can be measured.
    why_it_matters: Unscoped adjectives such as scalable, secure, or maintainable encourage global overdesign and make tradeoffs unverifiable.
    applicable_when: ["selecting boundaries, topology, style, or architecture safeguards", "reviewing SLO, availability, security, durability, scalability, or maintainability claims"]
    not_applicable_when: ["the requirement is local implementation behavior with no structural consequence"]
    required_evidence: ["accepted quality concern and stakeholder priority", "stimulus, operating environment, response, and measurable threshold", "smallest affected flow, component, or quantum", "baseline or explicit baseline plan"]
    insufficient_evidence: ["a quality adjective without a scenario", "desire to maximize every quality", "a system-wide scope inferred by default", "a feature requirement with no structural effect"]
    required_inputs: ["accepted requirements and operational constraints", "current topology and dependency scope", "stakeholder tradeoff authority"]
    expected_outputs: ["prioritized characteristic scenarios and owners", "scope and measurement method", "explicit conflicts and rejected characteristics"]
    preservation_boundaries: ["accepted functional behavior", "qualities outside the authorized tradeoff", "scope not implicated by the characteristic"]
    safe_actions: ["narrow a characteristic to one flow", "establish a baseline fitness measure", "report an unmeasurable characteristic as a requirements gap"]
    unsafe_actions: ["redesign the whole system for an adjective", "treat a style rating as proof", "trade correctness, durability, or security without authority"]
    common_failure_modes: ["quality-attribute maximalism", "global scope inflation", "proxy metric substituted for stakeholder outcome"]
    counterexamples: ["A local input-validation rule is important but is not an architecture characteristic unless it changes system structure or cross-cutting constraints."]
    interactions: ["Specializes universal-evidence-before-intervention for architecture-quality claims.", "Provides drivers for architecture-earned-boundary and architecture-contextual-style-selection."]
    conflicts: [conflict-model-fidelity-vs-performance-representation]
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/009-chapter-4-architecture-characteristics-defined.md :: Influences some structural aspect of the design"
        contribution: "Defines structural influence and importance as tests for architectural significance."
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/012-chapter-7-scope-of-architecture-characteristics.md :: Architectural Quanta and Granularity"
        contribution: "Scopes architecture characteristics below the whole-system level."
      - source_id: SRC-CA
        relationship: refinement
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/026-chapter-15-what-is-architecture.md :: OPERATION"
        contribution: "Distinguishes operational effectiveness from development and maintenance structure."
    confidence: strong
    roles: [architecture-agent, performance-agent, review-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [architecture characteristic, quality attribute, SLO, quality scenario, architectural quantum, fitness]
    routing:
      activate_for_roles: [architecture-agent, performance-agent, review-agent, repository-assessment-agent]
      activate_for_tasks: [architecture-assessment, style-selection, boundary-selection, quality-review, architecture-planning]
      activate_for_repository_signals: [SLO, quality attribute, availability requirement, security boundary, scalability target, architecture fitness]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [architecture, operational, security, durability, performance]
      exclude_when: [purely local implementation decision with no structural consequence]
      prerequisites: [accepted requirement or domain concern, target scope]
      retrieval_priority: high
      retrieval_budget_hint: 390
      related_concepts: [universal-evidence-before-intervention, architecture-fitness-functions, architecture-contextual-style-selection, performance-measurable-objective]

  - id: architecture-feedback-loop
    title: Keep architecture and implementation in a closed feedback loop
    category: architecture
    claim: Architecture must evolve through implementation, domain learning, and runtime evidence; architecture detached from code loses feasibility feedback, while implementation without decision context erodes accepted constraints.
    decision_rule: Exercise significant proposals with representative implementation or operational evidence, return discoveries to the decision owner, and reopen rather than silently violate decisions whose assumptions no longer hold.
    why_it_matters: Static plans can freeze incorrect assumptions, while unrecorded local workarounds make the actual architecture diverge from its governing intent.
    applicable_when: ["making or implementing architecturally significant decisions", "new evidence challenges an accepted boundary, style, model, or quality assumption"]
    not_applicable_when: ["a fully mechanical local change has no architectural consequence"]
    required_evidence: ["representative implementation or runtime feedback", "decision owner and current status", "assumption or threshold affected by the evidence", "affected implementer and operator perspectives"]
    insufficient_evidence: ["a diagram handed off once", "title-based authority without implementation evidence", "a workaround with no analysis of the governing decision"]
    required_inputs: ["accepted architecture decision", "implementation and operational observations", "authority for proposal or supersession"]
    expected_outputs: ["confirmed, narrowed, or reopened decision", "recorded assumption and feedback", "implementation constraint or supersession proposal"]
    preservation_boundaries: ["accepted decision remains authoritative until superseded", "implementation evidence does not itself grant semantic or architectural authority"]
    safe_actions: ["build a representative slice", "record an invalidated assumption", "propose an ADR supersession", "keep architects and domain modelers close to implementation"]
    unsafe_actions: ["silently bypass an accepted boundary", "freeze a master plan against evidence", "treat implementation as automatic acceptance"]
    common_failure_modes: ["armchair architecture", "architecture drift", "artifact attachment", "implementation teams deprived of decision context"]
    counterexamples: ["A repository-wide rename conforming to an accepted contract need not reopen architecture merely because it touches many files."]
    interactions: ["Uses architecture-fitness-functions as one evidence channel, but human and domain feedback remain distinct.", "Works through architecture-decision-record when evidence warrants supersession."]
    conflicts: [conflict-upfront-vs-evolutionary-architecture]
    source_support:
      - source_id: SRC-FSA
        relationship: direct_support
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/007-chapter-2-architectural-thinking.md :: Balancing Architecture and Hands-On Coding"
        contribution: "Keeps architectural reasoning connected to implementation practice."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/019-chapter-17-bringing-the-strategy-together.md :: The decision process must absorb feedback"
        contribution: "Requires strategic design to change in response to implementation and model learning."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/004-chapter-3-binding-model-and-implementation.md :: Hands-On Modelers"
        contribution: "Makes implementation participation part of model authority and learning."
    confidence: strong
    roles: [architecture-agent, coding-agent, review-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [architecture feedback, implementation feedback, evolutionary architecture, architecture drift, hands-on architect]
    routing:
      activate_for_roles: [architecture-agent, coding-agent, review-agent, repository-assessment-agent]
      activate_for_tasks: [architecture-planning, architecture-implementation, ADR-review, architecture-verification]
      activate_for_repository_signals: [accepted ADR, architecture workaround, repeated exception, failed fitness function, implementation disagreement]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [architecture, change, operational]
      exclude_when: [fully mechanical local change under an accepted architecture]
      prerequisites: [decision context, representative feedback]
      retrieval_priority: high
      retrieval_budget_hint: 340
      related_concepts: [architecture-decision-record, architecture-fitness-functions, universal-reversible-reviewable-change, universal-measure-claimed-improvement]

  - id: architecture-selective-option-preservation
    title: Preserve architecture options selectively
    category: architecture
    claim: An architecture option is worth carrying only when plausible change, consequence, delay value, and reversal cost justify the complexity introduced to keep it open.
    decision_rule: Name the deferred commitment and trigger, estimate probability, impact, later separation cost, and current carrying cost, then choose direct code, a partial seam, or a full boundary proportionately.
    why_it_matters: Both premature commitment and maximum flexibility can create irreversible cost; speculative seams freeze untested variation and burden every current change.
    applicable_when: ["a design decision is expensive to reverse", "a future boundary or implementation variation is plausible but not yet fully demonstrated"]
    not_applicable_when: ["the option is cheap to recover later", "no credible trigger or beneficiary exists"]
    required_evidence: ["specific deferred commitment", "credible change trigger and consequence", "current carrying cost", "later migration or reversal cost"]
    insufficient_evidence: ["something might change", "generic extensibility", "preference to avoid all decisions"]
    required_inputs: ["candidate commitment", "time horizon and product trajectory", "available boundary strengths"]
    expected_outputs: ["commit, defer directly, add partial seam, or add full boundary", "review, completion, or deletion trigger"]
    preservation_boundaries: ["current simplicity and local reasoning", "accepted behavior and contracts", "reviewability of deferred decisions"]
    safe_actions: ["postpone a replaceable mechanism", "use a local facade with a deletion trigger", "record the last responsible decision point"]
    unsafe_actions: ["introduce interfaces for hypothetical implementations", "delay a blocking irreversible decision", "carry unused abstraction indefinitely"]
    common_failure_modes: ["speculative generality", "analysis paralysis", "partial boundary mistaken for actual independence"]
    counterexamples: ["A regulated data-retention decision that determines schema and procurement may require early explicit commitment rather than deferral."]
    interactions: ["Relies on universal-reversible-reviewable-change and specializes it for architectural commitments.", "Selects among strengths described by architecture-boundary-strength."]
    conflicts: [conflict-upfront-vs-evolutionary-architecture, conflict-full-vs-partial-vs-no-boundary]
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/026-chapter-15-what-is-architecture.md :: KEEPING OPTIONS OPEN"
        contribution: "Frames architecture as delaying irrelevant detail commitments."
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: SKIP THE LAST STEP"
        contribution: "Shows a lower-cost but incomplete way to reserve a boundary option."
      - source_id: SRC-DDD
        relationship: tension
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/019-chapter-17-bringing-the-strategy-together.md :: Beware the Master Plan"
        contribution: "Constrains advance option structure with humility and evolving evidence."
    confidence: contextual
    roles: [architecture-agent, coding-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [option preservation, reversible architecture, partial boundary, last responsible moment, deferred commitment]
    routing:
      activate_for_roles: [architecture-agent, coding-agent, review-agent]
      activate_for_tasks: [boundary-planning, architecture-planning, framework-adoption, migration-design]
      activate_for_repository_signals: [expensive commitment, uncertain future boundary, partial seam, migration horizon]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [architecture, migration, compatibility, cost]
      exclude_when: [option is inexpensive to recover or has no credible trigger]
      prerequisites: [reversal-cost estimate, explicit trigger]
      retrieval_priority: high
      retrieval_budget_hint: 360
      related_concepts: [universal-reversible-reviewable-change, architecture-earned-boundary, architecture-boundary-strength]

  - id: architecture-earned-boundary
    title: Earn architectural boundaries from independent forces
    category: architecture
    claim: A boundary is justified only by demonstrated independent policy, semantic, invariant, ownership, volatility, release, deployment, trust, or quality forces.
    decision_rule: State what must vary or be governed independently and why; identify what must remain cohesive; compare no boundary and lower-cost seams; create only the boundary whose protection exceeds translation, coordination, and operational cost.
    why_it_matters: Boundaries improve local reasoning and autonomy only when they hide or protect something real; otherwise they add navigation, contracts, mapping, and failure modes.
    applicable_when: ["proposing a module, interface, component, process, service, or context boundary", "repeated changes or ownership conflicts cross an existing structure"]
    not_applicable_when: ["responsibilities change together", "no stable semantic contract exists", "separation would weaken an invariant"]
    required_evidence: ["independent change, policy, semantic, ownership, release, trust, or quality force", "cohesive invariant and data ownership", "candidate contract and consumers", "cost comparison with direct collaboration"]
    insufficient_evidence: ["file size", "diagram symmetry", "one difficult test", "directory or team names", "desire to decouple without naming a coupling dimension"]
    required_inputs: ["representative changes and workflows", "dependency and ownership map", "accepted quality and preservation constraints"]
    expected_outputs: ["boundary or no-boundary decision", "protected force and cohesive interior", "contract owner and verification plan"]
    preservation_boundaries: ["domain invariants and authoritative data", "accepted behavior and compatibility", "information hiding and local reasoning"]
    safe_actions: ["introduce a narrow source seam", "keep cohesive data and behavior together", "return no boundary when pressure is absent"]
    unsafe_actions: ["service per entity", "interface per class", "split an atomic invariant for organizational symmetry", "infer a bounded context from a folder"]
    common_failure_modes: ["accidental indirection", "distributed monolith", "boundary without semantic contract", "false autonomy"]
    counterexamples: ["A large file with one cohesive responsibility and stable change pattern may need navigation improvement but no architectural boundary."]
    interactions: ["Specializes universal-information-hiding without duplicating the universal abstraction gate.", "Boundary existence is separate from architecture-boundary-strength.", "A domain-bounded-context can provide semantic evidence but never entails deployment."]
    conflicts: [conflict-full-vs-partial-vs-no-boundary, conflict-monolith-vs-distributed-services]
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/028-chapter-17-boundaries-drawing-lines.md :: WHICH LINES DO YOU DRAW, AND WHEN DO YOU DRAW THEM?"
        contribution: "Connects line drawing and timing to protection of policy from details."
      - source_id: SRC-FSA
        relationship: corroboration
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/013-chapter-8-component-based-thinking.md :: Component Granularity"
        contribution: "Makes component granularity an iterative responsibility and characteristic decision."
      - source_id: SRC-DDD
        relationship: refinement
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Bounded Context"
        contribution: "Provides semantic model integrity as one distinct boundary force."
    confidence: strong
    roles: [architecture-agent, coding-agent, refactoring-agent, legacy-code-agent, review-agent, repository-assessment-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [earned boundary, module boundary, service boundary, semantic boundary, ownership, independent change]
    routing:
      activate_for_roles: [architecture-agent, coding-agent, refactoring-agent, legacy-code-agent, review-agent, repository-assessment-agent]
      activate_for_tasks: [boundary-selection, module-design, service-decomposition, context-mapping, architecture-review]
      activate_for_repository_signals: [cross-module change, dependency cycle, ownership conflict, release coupling, semantic conflict, service proposal]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [architecture, maintainability, data, operational]
      exclude_when: [purely local implementation placement]
      prerequisites: [representative change or quality force, preservation boundary]
      retrieval_priority: core
      retrieval_budget_hint: 430
      related_concepts: [universal-information-hiding, architecture-boundary-strength, architecture-policy-mechanism-separation, domain-bounded-context]

  - id: architecture-boundary-strength
    title: Select boundary strength separately from boundary existence
    category: architecture
    claim: Source seams, facades, inverted interfaces, release components, local processes, network services, transaction boundaries, and semantic relationships provide different protection at different costs.
    decision_rule: After a force earns a boundary, compare crossing semantics, translation, versioning, latency, failure, observability, testing, release, data, and ownership costs; choose the cheapest strength that satisfies the current force and define strengthen, merge, or delete triggers.
    why_it_matters: Treating every boundary as an interface or service either under-protects important independence or imports distributed and compatibility costs unnecessarily.
    applicable_when: ["an architectural boundary has been earned", "reviewing whether a module should become a component, process, or service"]
    not_applicable_when: ["no independent force has earned a boundary"]
    required_evidence: ["required independence dimension", "crossing contract including failure and temporal semantics", "release and deployment requirements", "data ownership and transaction needs", "operational capability"]
    insufficient_evidence: ["a boundary exists in a diagram", "test substitution alone", "a separate repository", "future distribution without an operational driver"]
    required_inputs: ["earned boundary force", "candidate crossing mechanisms", "cost and reversal analysis"]
    expected_outputs: ["selected boundary kind and strength", "crossing semantics and owner", "migration, reversal, and verification triggers"]
    preservation_boundaries: ["semantic fidelity", "invariants and transaction scope", "latency, failure, durability, and compatibility contracts"]
    safe_actions: ["keep a semantic boundary in-process", "use a facade as an explicitly partial seam", "strengthen only one affected quantum"]
    unsafe_actions: ["equate interface with decoupling", "equate bounded context with service", "cross a network while assuming local failure semantics"]
    common_failure_modes: ["false independence", "partial boundary presented as full protection", "accidental distributed transaction", "unowned translation"]
    counterexamples: ["Two independently named packages can remain one architectural unit when they share data, release, failure, and change semantics."]
    interactions: ["Requires architecture-earned-boundary first.", "Uses architecture-distribution-readiness before selecting network strength.", "Can realize domain-bounded-context in-process without equating the concepts."]
    conflicts: [conflict-full-vs-partial-vs-no-boundary, conflict-monolith-vs-distributed-services]
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/029-chapter-18-boundary-anatomy.md :: BOUNDARY CROSSING"
        contribution: "Distinguishes source, component, process, and service boundary mechanisms."
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: FACADES"
        contribution: "Shows a low-cost boundary form with limited directional protection."
      - source_id: SRC-FSA
        relationship: corroboration
        locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/024-chapter-18-choosing-the-appropriate-architecture-style.md :: Monolith versus distributed"
        contribution: "Makes deployment topology a separate costed decision."
    confidence: strong
    roles: [architecture-agent, coding-agent, legacy-code-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith, distributed-system]
    retrieval_terms: [boundary strength, partial boundary, facade, process boundary, service boundary, deployment boundary]
    routing:
      activate_for_roles: [architecture-agent, coding-agent, legacy-code-agent, review-agent]
      activate_for_tasks: [boundary-selection, service-extraction, modularization, migration-design]
      activate_for_repository_signals: [interface proposal, package seam, separate deployment, remote call, partial boundary]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [architecture, data, operational, compatibility]
      exclude_when: [no boundary force is demonstrated]
      prerequisites: [architecture-earned-boundary, crossing semantics]
      retrieval_priority: high
      retrieval_budget_hint: 420
      related_concepts: [architecture-earned-boundary, architecture-distribution-readiness, architecture-modular-monolith, domain-bounded-context]

  - id: architecture-dependency-inversion-gate
    title: Earn dependency inversion from policy pressure
    category: architecture
    claim: Direct dependencies remain preferable until a stable consumer policy, asymmetric volatility, real substitution, legacy interception, ownership, release, or deployment need earns inversion.
    decision_rule: State the concrete harm of the current dependency, test whether moving ownership removes it, define the smallest consumer-needed contract, and introduce inversion only when independent-change value exceeds interface, adapter, lifecycle, navigation, and testing cost.
    why_it_matters: Interface-per-class design creates mock-shaped APIs and permanent indirection without protecting any stable policy.
    applicable_when: ["a volatile provider threatens stable policy", "multiple real implementations or independent deployment exist", "a legacy dependency requires an interception seam"]
    not_applicable_when: ["one stable implementation shares lifecycle and ownership", "the interface would mirror the provider", "a function or direct adapter is clearer"]
    required_evidence: ["consumer policy and provider volatility", "real implementation, substitution, release, or legacy-seam need", "narrow contract and owner", "net cost comparison"]
    insufficient_evidence: ["a concrete class exists", "a test wants a mock", "generic desire to decouple", "hypothetical future implementation"]
    required_inputs: ["current dependency and harm", "consumer use cases", "variation and ownership history"]
    expected_outputs: ["direct, adapter, facade, or inverted dependency decision", "contract owner and deletion or review trigger"]
    preservation_boundaries: ["behavior and failure semantics", "lifecycle and performance visibility", "repository language idioms"]
    safe_actions: ["define a consumer-owned narrow port", "inject a function where idiomatic", "retain direct coupling when stable"]
    unsafe_actions: ["interface per class", "provider-owned broad interface", "use network distribution as a DIP implementation without operational evidence"]
    common_failure_modes: ["speculative indirection", "mock-shaped production API", "cycle relocated rather than removed", "leaky contract"]
    counterexamples: ["A single stable standard-library implementation normally needs no project-owned interface solely for mocking."]
    interactions: ["Specializes universal-earned-abstraction for architectural dependency direction.", "May realize architecture-policy-mechanism-separation but is not synonymous with it."]
    conflicts: [conflict-dependency-inversion-vs-direct-coupling]
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/020-chapter-11-dip-the-dependency-inversion-principle.md :: STABLE ABSTRACTIONS"
        contribution: "Directs source dependencies toward stable abstractions protecting policy."
      - source_id: SRC-CA
        relationship: refinement
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: FACADES"
        contribution: "Shows that a facade may be sufficient when full inversion is unearned."
      - source_id: SRC-DDD
        relationship: tension
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/007-chapter-6-the-life-cycle-of-a-domain-object.md :: When a Constructor Is All You Need"
        contribution: "Provides a simplicity counterweight to automatic lifecycle abstractions."
    confidence: contextual
    roles: [architecture-agent, coding-agent, legacy-code-agent, review-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, monolith]
    retrieval_terms: [dependency inversion, interface pressure, consumer-owned interface, stable policy, adapter, direct coupling]
    routing:
      activate_for_roles: [architecture-agent, coding-agent, legacy-code-agent, review-agent]
      activate_for_tasks: [interface-design, dependency-breaking, boundary-design, legacy-seam]
      activate_for_repository_signals: [volatile dependency, multiple implementations, mock-heavy interface, dependency cycle, legacy static dependency]
      activate_for_languages: [language-independent]
      activate_for_risk_classes: [architecture, maintainability, compatibility]
      exclude_when: [one stable implementation with shared lifecycle and no policy pressure]
      prerequisites: [concrete dependency harm, consumer contract sketch]
      retrieval_priority: high
      retrieval_budget_hint: 390
