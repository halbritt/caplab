  - id: architecture-interaction-synchrony
    title: Choose synchronous or asynchronous interaction from temporal needs
    category: architecture
    claim: Synchronous calls and asynchronous events optimize different response, atomicity, availability, load, and recovery semantics; neither is a universal decoupling default.
    decision_rule: State when the initiator needs a result and what completion means, model normal and failure paths, use synchronous interaction while combined latency and availability fit the budget, and choose asynchronous progress only with authorized state and recovery semantics.
    why_it_matters: Choosing by fashion or throughput folklore can convert simple immediate behavior into eventual state, or create long synchronous failure chains.
    applicable_when: ["selecting communication between components or services", "reviewing request-reply versus event interaction"]
    not_applicable_when: ["the communication mechanism is fixed by an accepted external protocol and no change is proposed"]
    required_evidence: ["required response time and completion meaning", "atomicity and consistency need", "latency and availability budget", "load shape and capacity mismatch", "recovery semantics"]
    insufficient_evidence: ["async is faster", "sync is simpler", "events are more decoupled", "network topology alone"]
    required_inputs: ["critical workflow", "quality scenarios", "caller and consumer ownership"]
    expected_outputs: ["synchronous, asynchronous, or hybrid decision", "temporal and failure contract", "verification thresholds"]
    preservation_boundaries: ["user-visible completion", "transaction and consistency semantics", "latency, availability, and recovery expectations"]
    safe_actions: ["use synchronous request for a bounded immediate answer", "accept a command then expose async completion state", "buffer independent long-running work"]
    unsafe_actions: ["change eventuality without authorization", "build an unbounded synchronous call chain", "use async without reconciliation"]
    common_failure_modes: ["availability coupling", "hidden eventual consistency", "request disguised as event", "caller waits on nominally async work"]
    counterexamples: ["A payment authorization requiring an immediate accept or reject may remain synchronous even if downstream settlement is asynchronous."]
