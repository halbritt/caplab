  - id: architecture-policy-mechanism-separation
    title: Protect independent policy from contingent mechanism
    category: architecture
    claim: Independently valuable business or application policy should depend on stable semantic contracts rather than volatile delivery, persistence, framework, device, or deployment representations.
    decision_rule: Identify policy whose meaning and tests can evolve independently, list caller-visible mechanism semantics that cannot be hidden, and introduce only enough translation and dependency control to protect that policy.
    why_it_matters: Mechanism leakage amplifies framework, storage, device, and delivery changes through policy, while absolute detail claims can hide real consistency, latency, safety, or operational constraints.
    applicable_when: ["business or application policy is obscured by framework, database, web, or device types", "mechanism volatility repeatedly changes policy code"]
    not_applicable_when: ["the mechanism determines required domain semantics or quality", "the workflow is simple and separation costs more than it protects"]
    required_evidence: ["independently meaningful policy", "volatile or replaceable mechanism", "stable semantic crossing data", "mechanism semantics that callers must still observe"]
    insufficient_evidence: ["the source calls a technology a detail", "generic layering preference", "testability alone"]
    required_inputs: ["policy and mechanism map", "change and failure evidence", "crossing contract"]
    expected_outputs: ["protected policy boundary or justified direct integration", "explicit crossing data and exposed operational semantics"]
    preservation_boundaries: ["domain meaning and invariants", "required consistency, latency, failure, safety, and durability behavior", "repository framework commitments"]
    safe_actions: ["translate framework types at an edge", "keep domain policy independently testable", "expose caller-relevant failure and cost"]
    unsafe_actions: ["declare database or web universally irrelevant", "hide distributed consistency behind a local-looking port", "duplicate policy in adapters"]
    common_failure_modes: ["anemic pass-through layers", "mechanism types leaking inward", "operational semantics hidden by abstraction", "school-driven layering"]
    counterexamples: ["In an embedded controller, hardware timing or safety constraints may be policy inputs rather than replaceable details."]
    interactions: ["Refines universal-information-hiding at architectural scale.", "Architecture-dependency-inversion-gate is one possible mechanism, not an automatic requirement.", "Domain-language-model-loop supplies the local meaning of policy."]
    conflicts: [conflict-domain-purity-vs-implementation-simplicity, conflict-model-fidelity-vs-performance-representation]
    source_support:
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/033-chapter-22-the-clean-architecture.md :: THE DEPENDENCY RULE"
        contribution: "Directs architectural dependencies inward toward higher-level policy."
      - source_id: SRC-CA
        relationship: direct_support
        locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/033-chapter-22-the-clean-architecture.md :: WHICH DATA CROSSES THE BOUNDARIES"
        contribution: "Keeps external framework and database representations from crossing into policy."
      - source_id: SRC-DDD
        relationship: direct_support
        locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: The Domain Layer Is Where the Model Lives"
        contribution: "Protects domain meaning from user-interface and infrastructure concerns."
