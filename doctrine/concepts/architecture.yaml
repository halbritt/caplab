    expected_outputs: ["direct commitment, isolated adapter, extracted framework, or rejection", "ownership and exit strategy"]
    preservation_boundaries: ["application policy and domain meaning", "framework-required runtime behavior", "upgrade, security, and compatibility obligations"]
    safe_actions: ["isolate invasive types at an edge", "use framework features directly where they are the accepted platform", "generalize after multiple applications"]
