  - id: architecture-event-temporal-semantics
    title: Make event temporal and failure semantics explicit
    category: architecture
    claim: Asynchronous and event-driven interaction is safe only when completion, ordering, delivery, duplication, idempotency, retry, loss, replay, reconciliation, observability, and ownership semantics are explicit.
    decision_rule: Trace normal, timeout, duplicate, reordered, partial, poison-message, and recovery paths; choose broker choreography only for genuinely independent reactions and a mediator or process owner when completion, compensation, audit, or conditional recovery must be governed.
    why_it_matters: Messaging can move latency and failure out of the caller without eliminating them, producing silent loss, emergent workflows, and unverifiable completion.
    applicable_when: ["designing events, queues, pub-sub, sagas, or asynchronous workflows", "reviewing choreography versus orchestration"]
    not_applicable_when: ["a bounded synchronous call already meets response, availability, and load requirements"]
    required_evidence: ["business completion and temporal requirements", "delivery, ordering, and idempotency contract", "retry, replay, reconciliation, and recovery owner", "queue and end-to-end observability"]
    insufficient_evidence: ["async is decoupled", "a broker is available", "exactly-once is assumed", "producer success is treated as business completion"]
    required_inputs: ["workflow and state transitions", "failure scenarios", "consumer ownership and capacity", "durability requirements"]
    expected_outputs: ["interaction topology and completion owner", "delivery and recovery contract", "failure tests and telemetry"]
    preservation_boundaries: ["user-visible completion and consistency", "data durability and auditability", "ordering and duplicate semantics"]
    safe_actions: ["define an idempotency key", "persist process state", "add dead-letter and replay ownership", "keep independent reactions choreographed"]
    unsafe_actions: ["assume broker acknowledgment means domain completion", "hide commands as events", "retry non-idempotent work blindly", "claim exactly-once without end-to-end proof"]
    common_failure_modes: ["silent data loss", "poison-message loop", "emergent unowned workflow", "duplicate side effect", "unreconciled partial completion"]
    counterexamples: ["A fire-and-forget analytics signal can accept loss only when that loss tolerance is explicit and independent of business correctness."]
    interactions: ["Specializes architecture-interaction-synchrony for asynchronous choices.", "Requires architecture-distribution-readiness for production infrastructure and operations."]
