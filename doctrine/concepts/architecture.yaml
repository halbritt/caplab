  - id: architecture-framework-commitment
    title: Treat frameworks as asymmetric architecture commitments
    category: architecture
    claim: Framework adoption or extraction is a lifecycle-wide and often asymmetric commitment that is earned only by demonstrated consumers, stable extension needs, and benefits exceeding API control, upgrade, coupling, and replacement cost.
