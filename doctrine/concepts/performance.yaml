  - id: performance-cache-validity
    title: Cache only with validity, ownership, and bounds
    category: performance
    claim: A cache is an explicit time-space-consistency tradeoff requiring repeated expensive work, a valid key and freshness policy, bounded retention, concurrency semantics, and measured system benefit.
    decision_rule: Identify determinism, key identity, invalidation/freshness, cardinality, memory, tenant/authorization scope, concurrent fill, failure caching, and lifecycle before caching; prefer bounded mechanisms and validate macro effects.
    why_it_matters: Caching can reduce computation while introducing stale or cross-context data, memory growth, stampedes, and hidden ownership.
    applicable_when:
      - proposing or reviewing memoization, cached properties, shared caches, or precomputed results
    required_evidence:
      - profiled repeated work and expected/observed hit rate
      - validity and invalidation/freshness contract
      - key completeness including tenant, policy, and version where relevant
      - memory/cardinality bounds and concurrency behavior
      - representative benchmark and correctness tests
    insufficient_evidence:
      - function looks expensive
      - decorator or cache library is available
      - hit-path microbenchmark only
    required_inputs:
      - workload, result semantics, and ownership boundary
      - memory/consistency budgets
    expected_outputs:
      - no-cache, local bounded cache, or shared cache design
      - validity, capacity, monitoring, and regression evidence
    preservation_boundaries:
      - freshness, authorization/tenant isolation, errors, and mutable-result ownership
      - process memory and lifecycle
    safe_actions:
      - use bounded LRU/TTL where policy permits
      - include every validity dimension in the key
      - expose cache metrics without unsafe cardinality
    unsafe_actions:
      - unbounded process cache on uncontrolled keys
      - mutable cached object shared unexpectedly
      - cache failures or authorization results without explicit policy
    common_failure_modes:
      - stale or cross-tenant result
      - out-of-memory
      - thundering herd
      - key omits a policy dimension
    conflicts:
      - conflict-caching-vs-recomputation-freshness
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/015-chapter-9-decorators-and-closures.md :: Using lru_cache"
