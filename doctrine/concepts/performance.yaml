  - id: performance-specialization-evidence
    title: Specialize only a proven critical path
    category: performance
    claim: Duplicated or lower-level specialized code is justified only for a stable profiled hot path whose material end-to-end benefit exceeds added maintenance and portability cost.
    decision_rule: Keep the general path as reference/fallback when practical, make the specialization narrow, and require controlled micro plus relevant macro evidence and equivalence tests.
    why_it_matters: Specialization can unlock performance an abstraction cannot provide, but it duplicates knowledge and narrows portability, clarity, and future change options.
    applicable_when:
      - a general implementation is a measured bottleneck after higher-level work reduction
    required_evidence:
      - stable hot path and target workload
      - measured material benefit beyond noise at appropriate experiment levels
      - semantic equivalence and portability/support boundary
      - maintenance owner and rollback path
    insufficient_evidence:
      - belief that generic code is slow
      - microbenchmark win without system effect
      - one caller or hypothetical future scale
    required_inputs:
      - general implementation and profiled bottleneck
      - candidate specialized mechanism
    expected_outputs:
      - retain general path or narrow specialization decision
      - tradeoff, fallback, and regression evidence
    preservation_boundaries:
      - output, errors, ordering, aliasing, and resource lifetime
      - supported platforms and toolchains
      - maintainable fallback/reference behavior
    safe_actions:
      - isolate specialization behind a small internal boundary
      - compare with the general path using equivalence/property tests
      - document measured reason and removal condition
    unsafe_actions:
      - spread unsafe or platform-specific tricks across callers
      - delete the reference path before confidence and support warrant it
      - present specialized duplication as universally cleaner
    common_failure_modes:
      - benchmark-specific overfitting
      - semantic drift between paths
      - later general-path change missed in specialization
    conflicts:
      - conflict-performance-specialization-vs-abstraction
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/014-chapter-10-optimization-examples.md :: Standard Functions Might Not Be Perfect for All Cases"
