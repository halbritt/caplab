  - id: performance-benchmark-validity
    title: Benchmark validity precedes interpretation
    category: performance
    claim: Benchmark results support only claims for which the harness, workload, correctness, environment, repetition, and variance are controlled and inspectable.
    decision_rule: Validate the benchmark itself before comparing candidates; reject dead-work elimination, setup leakage, unstable shared environments, unrepresentative inputs, or statistical summaries that conceal instability.
    why_it_matters: A precise number from an invalid harness creates false confidence and can reward a transformation that harms the real system.
    applicable_when:
      - designing or reviewing microbenchmarks, macrobenchmarks, load tests, or stress tests
    required_evidence:
      - correctness assertions and work that cannot be optimized away
      - setup/measurement boundary and warmup policy
      - representative input distribution and resource limits
      - repeated raw results, variance, and environment stability
    insufficient_evidence:
      - fastest single run
      - benchmark code that does not check its result
      - shared noisy CI without a noise characterization
      - statistics used without stable underlying samples
    required_inputs:
      - performance claim and appropriate experiment level
      - benchmark source and execution environment
    expected_outputs:
      - valid comparison, bounded exploratory result, or invalid-evidence finding
      - raw result and harness provenance
    preservation_boundaries:
      - benchmark correctness and workload meaning
      - candidate functional behavior
      - honest uncertainty reporting
    safe_actions:
      - inspect implausible iteration rates
      - retain raw data and exact versions
      - add correctness checks and representative cases
    unsafe_actions:
      - extrapolate production capacity from a toy microbenchmark
      - compare different harnesses as one experiment
      - hide regressions in non-target resources
    common_failure_modes:
      - compiler-eliminated work
      - setup dominating measurement
      - benchmark-specific data favoring one candidate
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md :: Benchmarks Lie"
        contribution: Frames benchmark interpretation as a primary source of error.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md :: Test Your Benchmark for Correctness!"
        contribution: Requires correctness of the benchmarked work itself.
        relationship: corroboration
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/023-chapter-15-case-study-trampled-by-your-own-customers.md :: The Testing Gap"
        contribution: Case-study evidence that load tests scripted only around intended polite usage systematically overstate capacity - production traffic included cookie-less search spiders, scrapers, and repeated hits the rule-following scripts never modeled - so a representative load workload must include noise, protocol-violating clients, and hostile access patterns.
        relationship: refinement
    confidence: strong
