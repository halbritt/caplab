schema_version: agent-doctrine-concepts/1
concepts:
  - id: performance-measurable-objective
    title: Performance claims require measurable objectives
    category: performance
    claim: Performance work is justified only against a named operation, representative workload, environment, correctness precondition, metric, target, resource boundary, and owner.
    decision_rule: Rewrite requests such as faster or less memory as a falsifiable workload-relative objective; if the objective cannot be owned and measured, gather requirements or stop before changing code.
    why_it_matters: Undefined performance lets agents optimize a favorable proxy, move cost elsewhere, and claim improvement without user or operational value.
    applicable_when:
      - performance, capacity, cost, latency, throughput, or resource use is a stated goal
      - a defect may actually be a resource or termination failure
    not_applicable_when:
      - a purely functional defect has already violated an accepted behavior independent of performance
    required_evidence:
      - accepted workload and operation boundary
      - latency percentile, throughput, CPU, memory, I/O, network, cost, or other metric with a target
      - environment, input distribution and scale, concurrency, and success/failure population
      - owner for the objective and any quality tradeoff
    insufficient_evidence:
      - slow or high CPU without a time, capacity, and workload boundary
      - an average without distribution or tail requirement
      - a benchmark result selected before the target
    required_inputs:
      - complaint, SLO, incident, capacity forecast, or cost goal
      - current system and operational boundary
    expected_outputs:
      - measurable objective and baseline plan
      - repair, monitor, experiment, optimization, or no-action classification
    preservation_boundaries:
      - functional correctness and accepted failure behavior
      - workload meaning and measurement population
      - untraded quality attributes
    safe_actions:
      - disambiguate accuracy, speed, and resource efficiency
      - request missing target or workload evidence
      - perform read-only exploratory profiling with bounded claims when authorized
    unsafe_actions:
      - select a convenient metric after seeing results
      - optimize every operation without priority
      - infer authority to trade correctness, freshness, fairness, or durability
    common_failure_modes:
      - metric substitution
      - benchmark theater
      - improving a cold or irrelevant operation
    counterexamples:
      - An infinite loop that violates termination is first a defect repair, although performance evidence may help diagnose it.
    interactions:
      - Feeds proc-decide-performance-justified and constrains every optimization procedure.
    conflicts:
      - conflict-performance-specialization-vs-abstraction
      - conflict-efficiency-vs-resilience-margin
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/005-chapter-1-software-efficiency-matters.md :: Clarify When Someone Uses the Word \"Performance\""
        contribution: Separates accuracy, speed, and resource efficiency before acting on a performance claim.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/007-chapter-3-conquering-efficiency.md :: Resource-Aware Efficiency Requirements"
        contribution: Formalizes workload- and resource-bound efficiency targets.
        relationship: corroboration
    confidence: strong
    roles: [performance-agent, architecture-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [library, service, CLI, embedded-system, distributed-system]
    retrieval_terms: [performance objective, SLO, RAER, latency, throughput, resource budget, capacity]
    routing:
      activate_for_roles: [performance-agent, architecture-agent, review-agent, debugging-and-repair-agent]
      activate_for_tasks: [performance-triage, capacity-planning, optimization, performance-review]
      activate_for_repository_signals: [benchmark directories, SLOs, profiler artifacts, performance incident, cost target]
