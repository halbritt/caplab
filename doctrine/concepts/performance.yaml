  - id: performance-representative-baseline
    title: Preserve a representative baseline
    category: performance
    claim: An improvement claim requires a reproducible pre-change baseline over the workload, environment, build, and metric named by the objective.
    decision_rule: Capture versioned raw results and enough harness/environment configuration to rerun the baseline; reject comparisons whose workload or measurement boundary changed materially.
    why_it_matters: Without a stable baseline, natural variance, compiler/runtime drift, caching, or workload changes can masquerade as improvement.
    applicable_when:
      - beginning deliberate optimization or validating a regression
      - comparing implementations, releases, or configurations
    required_evidence:
      - exact code, dependency, build, benchmark, data, and environment versions
      - repeated raw measurements and variance
      - correctness validation for the measured workload
      - known resource limits and warmup/cache state
    insufficient_evidence:
      - one wall-clock observation
      - a historical number without its harness and environment
      - separate runs with several uncontrolled changes
    required_inputs:
      - measurable objective
      - executable representative workload
    expected_outputs:
      - retained baseline artifacts
      - bounded statement of repeatability and noise
    preservation_boundaries:
      - workload equivalence
      - build and environment comparability
      - functional results
    safe_actions:
      - version the harness and data
      - capture raw samples and configuration
      - label an exploratory result as non-decisive
    unsafe_actions:
      - delete outliers without a causal reason
      - change the workload after seeing candidate performance
      - compare across unrelated hardware or configurations as if controlled
    common_failure_modes:
      - unreproducible gains
      - cache or thermal artifacts
      - workload overfitting
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md :: Reliability of Experiments"
        contribution: Requires stable versions, repeated nearby comparison, and explicit nondeterminism.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md :: Reproducing Production"
        contribution: Connects benchmark validity to representative production conditions.
        relationship: corroboration
    confidence: strong
    roles: [performance-agent, coding-agent, review-agent]
