  - id: performance-algorithm-and-work-first
    title: Remove work and improve algorithms before micro-tuning
    category: performance
    claim: The highest-leverage performance changes usually eliminate work, change asymptotic behavior, reduce data movement, or choose a better representation before low-level specialization.
    decision_rule: For a profiled bottleneck, evaluate avoidance, batching, streaming, precomputation, algorithm/data structure, I/O and movement, allocation/layout, then code/runtime/hardware tuning; verify constants on the target distribution.
    why_it_matters: Micro-tuning a poor algorithm or unnecessary work adds complexity while preserving the dominant cost.
    applicable_when:
      - selecting a performance candidate after profiling
    required_evidence:
      - profile contribution and input distribution/scale
      - complexity and work-count model
      - representative empirical comparison
      - memory, latency, and semantic tradeoffs
    insufficient_evidence:
      - Big-O notation without target sizes and constants
      - a clever instruction-level change before work-count analysis
      - assumed zero-cost abstraction
    required_inputs:
      - causal bottleneck hypothesis
      - candidate algorithms, representations, or work-elimination options
    expected_outputs:
      - ranked intervention ladder
      - selected one-variable experiment
    preservation_boundaries:
      - output and error semantics
      - precision, ordering, memory, and latency/resource trade space
    safe_actions:
      - remove redundant conversions, calls, or materialization
      - compare algorithm and data representation on representative inputs
      - stop if a simpler candidate meets the target
    unsafe_actions:
      - optimize cold complexity
      - hide a semantic change as work elimination
      - introduce unsafe or nonportable code before higher-level options
    common_failure_modes:
      - optimizing constants while asymptotics dominate
      - shifting cost to memory or I/O
      - data distribution mismatch
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/011-chapter-7-data-driven-efficiency-assessment.md :: Practical Applications"
        contribution: Combines asymptotic and empirical analysis for real workloads.
