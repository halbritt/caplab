  - id: performance-resource-lifecycle
    title: Own task, goroutine, and resource lifecycles
    category: performance
    claim: Every concurrent task, goroutine, executor, connection, file, queue, buffer, or pool must have an owner, capacity, completion/error path, cancellation or shutdown mechanism, and cleanup semantics.
    decision_rule: Trace creation to release and stop/wait behavior; reject background work or reusable resources whose lifetime, capacity, errors, or retention cannot be bounded.
    why_it_matters: Resource leaks and unbounded work commonly appear as performance failures but are also correctness, availability, and durability failures.
    applicable_when:
      - code creates asynchronous work or acquires external/scarce resources
      - reuse, caching, pooling, or background processing is proposed
    required_evidence:
      - ownership and lifecycle map
      - capacity/backpressure and error propagation
      - cancellation, shutdown, and cleanup tests
      - retention and contention measurement where reused
    insufficient_evidence:
      - garbage collection eventually runs
      - fire-and-forget syntax
      - a pool or cache has a standard-library implementation
    required_inputs:
      - resource/task topology and failure policy
      - operational shutdown and recovery constraints
    expected_outputs:
      - explicit owner and lifecycle contract
      - bounded implementation or leak finding
    preservation_boundaries:
      - completion and durability
      - cancellation, errors, shutdown order, and cleanup
      - memory, file descriptor, connection, and scheduler budgets
    safe_actions:
      - use lexical/structured context management
      - wait or join owned work and propagate errors
      - bound queues, workers, pools, and cached state
    unsafe_actions:
      - abandon durable work without acknowledgement
      - rely on finalizers as primary cleanup
      - create unbounded tasks, goroutines, queues, or pools
    common_failure_modes:
      - goroutine/task leak
      - lost errors or writes
      - retained buffer/pool memory
      - shutdown deadlock or partial completion
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/015-chapter-11-optimization-patterns.md :: Control the Lifecycle of Your Goroutines"
        contribution: Requires explicit goroutine start, stop, wait, and error ownership.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/025-chapter-18-context-managers-and-else-blocks.md :: Context Managers and with Blocks"
        contribution: Provides deterministic lexical setup and cleanup semantics.
        relationship: corroboration
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/029-chapter-22-asynchronous-programming.md :: Asynchronous Context Managers"
        contribution: Extends structured lifecycle to asynchronous resources.
        relationship: corroboration
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Blocked Threads"
        contribution: Adds production-failure evidence that pooled resources and blocking calls without checkout timeouts are the proximate cause of most system failures, and warns against hand-rolled pools and synchronization added in subclasses that callers cannot see.
        relationship: corroboration
      - source_id: SRC-RI
