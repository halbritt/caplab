  - id: performance-earned-bounded-concurrency
    title: Earn and bound concurrency
    category: performance
    claim: Concurrency is a workload-specific performance and correctness tradeoff that must be measured, capacity-bounded, and given explicit state, ordering, cancellation, error, and lifecycle ownership.
    decision_rule: Prefer sequential execution until waiting or parallelizable work demonstrably limits the objective; select the runtime-appropriate model and smallest worker/task count meeting the target, then validate tail latency and resource contention.
    why_it_matters: Threads, processes, goroutines, and async tasks add scheduling, coordination, memory, nondeterminism, and failure paths that can make the system slower or incorrect.
    applicable_when:
      - proposing or reviewing threads, processes, goroutines, worker pools, async tasks, or sharding
    required_evidence:
      - workload decomposition and profile of waiting versus CPU work
      - runtime/interpreter/dependency constraints
      - ordering, state-sharing, cancellation, backpressure, idempotency, and error contract
      - representative benchmark across worker counts and resource limits
    insufficient_evidence:
      - core count alone
      - async syntax or goroutine availability
      - throughput improvement without tail/resource/correctness evidence
      - dated runtime assumptions without current toolchain verification
    required_inputs:
      - measurable objective, causal bottleneck, and capacity boundary
      - current runtime and deployment topology
    expected_outputs:
      - sequential or concurrency-model decision
      - bounded topology and lifecycle/error contract
      - benchmark and semantic verification
    preservation_boundaries:
      - ordering, atomicity, consistency, fairness, idempotency, and error propagation
      - cancellation, cleanup, and resource limits
      - public API and durability semantics
    safe_actions:
      - benchmark bounded worker counts
      - use semaphores, queues, or capacity limits tied to downstream resources
      - keep an explicit sequential fallback where practical
    unsafe_actions:
      - unbounded fan-out
      - CPU work on an event-loop thread
      - process pools for tiny serialized work
      - fire-and-forget durable operations
    common_failure_modes:
      - contention and scheduler overhead
      - task/goroutine leak
      - event-loop starvation
      - lost errors or nondeterministic repair
    conflicts:
      - conflict-concurrency-vs-sequential-simplicity
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/008-chapter-4-how-go-uses-the-cpu-resource-or-two.md :: Adding Concurrency Should Be One of Our Last Deliberate Optimizations to Try"
