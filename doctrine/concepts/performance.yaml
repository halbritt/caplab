      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Steady State"
        contribution: Adds the stability-side requirements - any cache over an unbounded key space needs an enforced size limit and an invalidation strategy, monitored hit rates to prove benefit, and in managed runtimes weak references so the collector can reclaim payloads.
