  - id: performance-metric-semantics
    title: Define measurement semantics before interpretation
    category: performance
    claim: A metric or profile is usable evidence only when its boundary, unit, population, aggregation, granularity, collection method, and observer cost are known.
    decision_rule: Document what begins and ends the measurement, which outcomes it includes, how it aggregates and samples, and what system boundary it represents before using the value to choose or validate work.
    why_it_matters: Similar labels can represent CPU versus wall time, heap versus resident memory, instantaneous versus cumulative state, or averages that hide tails.
    applicable_when:
      - interpreting metrics, logs, traces, profiles, dashboards, or benchmark output
    required_evidence:
      - instrumentation definition and configuration
      - unit, aggregation window, population, and sampling behavior
      - sanity check against actual runtime behavior
      - instrumentation overhead and data-loss limits
    insufficient_evidence:
      - a dashboard label or metric name
      - heap bytes reported as total process memory
      - CPU percentage without interval, quota, and core semantics
      - percentiles without population and window
    required_inputs:
      - signal and collection path
      - target operation and system boundary
    expected_outputs:
      - evidence statement with explicit limitations
      - valid comparison or rejected signal
    preservation_boundaries:
      - privacy and sensitive runtime data
      - production reliability under instrumentation
      - metric meaning across before/after comparisons
    safe_actions:
      - record signal semantics and version
      - compare compatible samples only
      - use bounded temporary high-detail instrumentation when authorized
    unsafe_actions:
      - average away a tail requirement
      - compare incompatible memory or time measures
      - create unbounded metric cardinality
    common_failure_modes:
      - wrong-boundary optimization
      - observer effect
      - false trend caused by aggregation or instrumentation changes
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/010-chapter-6-efficiency-observability.md :: Efficiency Metrics Semantics"
        contribution: Makes metric boundary and meaning prerequisites to efficiency analysis.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/010-chapter-6-efficiency-observability.md :: High Metric Cardinality"
        contribution: Identifies instrumentation cost and cardinality as part of measurement safety.
        relationship: corroboration
      - source_id: SRC-RI
        locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/012-chapter-6-case-study-phenomenal-cosmic-powers-itty-bitty-living-space.md :: Vital Signs"
        contribution: Incident evidence that latency averages computed only over completed requests hide timeouts - response time is a lagging indicator that can read nominal while effectively infinite, because requests that never finish are never averaged in.
        relationship: refinement
    confidence: strong
    roles: [performance-agent, review-agent, debugging-and-repair-agent]
    languages: [language-independent]
    repository_archetypes: [service, CLI, embedded-system, distributed-system, library]
    retrieval_terms: [metric semantics, profile semantics, percentile, CPU time, wall time, RSS, heap, cardinality]
