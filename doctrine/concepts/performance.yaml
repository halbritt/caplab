        contribution: Exposes cache placement and invalidation semantics for computed attributes.
        relationship: corroboration
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/015-chapter-11-optimization-patterns.md :: Reuse Memory"
        contribution: Frames reuse as a measured tradeoff with memory-retention risks.
