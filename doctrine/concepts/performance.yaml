  - id: performance-memory-lifecycle
    title: Diagnose memory by metric, ownership, and lifetime
    category: performance
    claim: Heap, allocation rate, resident/working-set memory, mappings, retained objects, and garbage-collection cost are different signals; optimization must follow ownership and lifetime to the retained resource.
    decision_rule: Identify the memory measure and system boundary, profile allocations and in-use retention, trace references/ownership and resource lifetime, then reduce work or retention before pooling or runtime tuning.
    why_it_matters: Allocation microbenchmarks can improve while process memory, GC pauses, or retained capacity worsens.
    applicable_when:
      - diagnosing memory growth, allocation pressure, GC cost, OOM, or process footprint
    required_evidence:
      - precise memory metric and interval
      - allocation and in-use/retention evidence
      - owner/reference/lifetime path
      - representative macro memory behavior
    insufficient_evidence:
      - allocations per operation alone
      - heap profile presented as RSS
      - pointer use assumed to reduce memory
      - GC tuning without retention diagnosis
    required_inputs:
      - memory objective or incident
      - runtime/OS/container accounting and profiles
    expected_outputs:
      - causal retention/allocation model
      - reduce, reuse, recycle, limit, or no-action decision
    preservation_boundaries:
      - object identity and aliasing
      - lifetime, cleanup, cache freshness, and concurrency
      - latency/CPU tradeoffs
    safe_actions:
      - eliminate unnecessary allocation or materialization
      - bound caches, queues, pools, and goroutine/task growth
      - validate process-level effects after local changes
    unsafe_actions:
      - pool without retention and contention analysis
      - use unsafe zero-copy conversion without lifetime/aliasing proof
      - raise memory limits instead of diagnosing leaks
    common_failure_modes:
      - retained capacity hidden by reuse
      - pool increases live memory
      - aliasing extends lifetime or corrupts data
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/009-chapter-5-how-go-uses-memory-resource.md :: Go Memory Management"
        contribution: Separates Go heap/allocation/escape/GC mechanisms and memory-accounting concerns.
        relationship: direct_support
