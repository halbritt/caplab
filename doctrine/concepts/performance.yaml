  - id: performance-profile-causal-bottleneck
    title: Profile representative work before changing a bottleneck
    category: performance
    claim: Resource consumption observed near a symptom is not necessarily its root cause; select and interpret a representative profile before choosing an intervention.
    decision_rule: Choose CPU, allocation, in-use heap, goroutine/task, block/lock, trace, I/O, or off-CPU evidence by symptom; inspect direct and cumulative cost and follow the causal resource path across concurrency boundaries.
    why_it_matters: Optimizing the hottest visible frame can move work, miss upstream causes, or address sampling artifacts rather than the objective.
    applicable_when:
      - deliberate optimization or unexplained CPU, memory, latency, contention, or task growth
    required_evidence:
      - representative workload, version, and profile interval
      - profile type and sampling/granularity semantics
      - direct versus cumulative contribution and concurrency boundary analysis
      - reproducibility or independent corroboration
    insufficient_evidence:
      - one stack sample
      - top frame without call/resource context
      - sampled percentage treated as exact absolute time
      - profile from a different workload or build
    required_inputs:
      - measurable objective and reproducer
      - profiling capability appropriate to the runtime
    expected_outputs:
      - ranked causal bottleneck hypotheses
      - next discriminating experiment or bounded candidate
    preservation_boundaries:
      - sensitive profile data and production overhead
      - workload and build equivalence
    safe_actions:
      - retain raw profile and interpretation limits
      - correlate with source/runtime and other metrics
      - bound always-on or production profiling
    unsafe_actions:
      - optimize a frame merely because it is visually prominent
      - expose secrets or personal data in profile artifacts
      - merge incompatible profiles
    common_failure_modes:
      - profiler blind spot
      - asynchronous attribution error
      - observer perturbation
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/013-chapter-9-data-driven-bottleneck-analysis.md :: Root Cause Analysis, but for Efficiency"
        contribution: Treats performance analysis as causal diagnosis rather than local symptom tuning.
