  - id: performance-target-based-stop
    title: Stop optimization when the authorized target is met
    category: performance
    claim: Meeting the accepted objective is a positive stop condition; further optimization requires a new benefit case and authority.
    decision_rule: After every controlled iteration, rerun correctness and performance gates; retain the change only if it improves the target materially without violating other budgets, and stop once the target is satisfied.
    why_it_matters: Endless optimization consumes options and maintainability for benefits nobody requested, while shifting goalposts destroys causal comparison.
    applicable_when:
      - conducting a deliberate optimization campaign
    required_evidence:
      - accepted objective and baseline
      - controlled before/after result with uncertainty
      - semantic and non-target resource gates
      - remaining gap to target
    insufficient_evidence:
      - code can still be made faster
      - microbenchmark improvement after the system target is already met
      - sunk effort in the campaign
    required_inputs:
      - optimization iteration result
      - objective owner and tradeoff constraints
    expected_outputs:
      - retain, revert, continue, or escalate decision
      - final regression protection and residual limits
    preservation_boundaries:
      - objective definition and comparison harness
      - correctness and other resource/quality budgets
      - authority for additional complexity
    safe_actions:
      - revert a failed or immaterial hypothesis
      - stop at the target and document bounded result
      - monitor production drift when appropriate
    unsafe_actions:
      - move the target after seeing results
      - keep complexity for an immaterial gain
      - continue into unapproved tradeoffs
    common_failure_modes:
      - benchmark vanity
      - local maximum chasing
      - forgotten removal of experimental complexity
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/007-chapter-3-conquering-efficiency.md :: 5. Are we within RAERs?"
        contribution: Makes target satisfaction the decision point for release or another measured iteration.
        relationship: direct_support
