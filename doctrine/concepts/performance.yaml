  - id: performance-experiment-level-fit
    title: Match experiment level to the claim
    category: performance
    claim: Microbenchmarks, process/system benchmarks, and production observations answer different questions and cannot substitute for one another.
    decision_rule: Use the lowest level that isolates the causal hypothesis, then require a higher-level gate whenever the local change can interact with allocation, GC, scheduling, I/O, dependencies, or end-to-end resource limits.
    why_it_matters: A local speed or allocation win can become a system latency, memory, throughput, or reliability loss.
    applicable_when:
      - selecting or interpreting a performance experiment
    required_evidence:
      - exact claim and system boundary
      - known interactions omitted by the chosen level
      - escalation gate for relevant system effects
    insufficient_evidence:
      - allocations per operation used to claim peak resident memory
      - macro throughput without a validated load generator and correctness
      - production averages without controlled comparison
    required_inputs:
      - candidate hypothesis and measurable objective
      - available micro, macro, and runtime harnesses
    expected_outputs:
      - chosen experiment level and limits
      - required follow-on regression gate
    preservation_boundaries:
      - end-to-end semantics and dependency behavior
      - resource interactions outside the local unit
    safe_actions:
      - use a microbenchmark for a profiled local decision
      - add macro validation when runtime interactions are plausible
    unsafe_actions:
      - generalize an isolated result to full-system capacity
      - omit dependency, scheduler, or GC behavior from the claim
    common_failure_modes:
      - local win and system loss
      - harness bottleneck mistaken for application bottleneck
      - warm-cache result generalized to cold behavior
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md :: Benchmarking Levels"
        contribution: Separates production, macro, and micro measurement roles.
        relationship: direct_support
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/012-chapter-8-benchmarking-versus-stress-and-load-tests.md :: Microbenchmarks Versus Memory Management"
