  - id: performance-semantic-preservation
    title: Performance transformations preserve semantics unless tradeoffs are authorized
    category: performance
    claim: A faster or smaller implementation is unacceptable if it silently changes results, precision, ordering, freshness, fairness, errors, identity, durability, or resource ownership.
    decision_rule: Establish semantic and non-target resource baselines before optimization; treat any intended quality tradeoff as a separate owner decision and change classification.
    why_it_matters: Many high-yield transformations rely on caching, streaming, concurrency, unsafe conversion, pooling, approximation, or batching that can change behavior subtly.
    applicable_when:
      - executing or reviewing any deliberate optimization
    required_evidence:
      - explicit preservation matrix
      - behavior tests including boundaries and errors
      - concurrency/order/lifetime tests where relevant
      - before/after checks of non-target resources and quality
    insufficient_evidence:
      - benchmark correctness on one happy input
      - passing unrelated tests
      - an assertion that internal behavior is not observable
    required_inputs:
      - optimization candidate and measurable objective
      - accepted semantics and tradeoff authority
    expected_outputs:
      - semantic equivalence proof or explicit authorized tradeoff
      - regression and rollback plan
    preservation_boundaries:
      - functional output and error policy
      - precision, ordering, freshness, fairness, identity, concurrency, and durability
      - public API and operational behavior
    safe_actions:
      - property/equivalence testing against a reference implementation
      - retain fallback during validation
      - report unverified dimensions
    unsafe_actions:
      - relabel approximation or stale caching as an internal optimization
      - ignore changed errors or cancellation
      - use unsafe aliasing without ownership proof
    common_failure_modes:
      - faster wrong result
      - tail or memory regression hidden by average speed
      - concurrency changes ordering or error propagation
    source_support:
      - source_id: SRC-EGO
        locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/007-chapter-3-conquering-efficiency.md :: Functionality Phase"
