schema_version: agent-doctrine-concepts/1
concepts:
- id: repository-assessment-complexity-trend
  title: Repository-relative structural trajectory
  category: review
  claim: A consistent relative trajectory or unusual delta is more actionable than an absolute universal complexity threshold.
  decision_rule: Use a stable proxy and sampling method, inspect trend over relevant revisions, correlate increases with change purpose and function hotspots, and emit investigation prompts only.
  why_it_matters: Language, formatting, generated code, and local style bias absolute values.
  applicable_when:
  - active large code
  - rising hotspot
  - normalization-of-deviance check
  not_applicable_when:
  - metric cannot be compared consistently across revisions
  required_evidence:
  - consistent cleaned samples
  - relevant window
  - current source inspection
  insufficient_evidence:
  - one current number
  - arbitrary ten-percent rule
  required_inputs:
  - historical revisions
  - metric definition
  expected_outputs:
  - stable
  - rising
  - falling
  - step-change
  - or noisy hypothesis
  preservation_boundaries:
  - A warning does not block or demand refactoring.
  safe_actions:
  - review steep growth in active already-large code
  unsafe_actions:
  - universal CI ceiling
  - infer design improvement from a fall alone
  common_failure_modes:
  - formatting effects
  - necessary behavior
  - complexity moved elsewhere
  counterexamples:
  - A well-tested essential branching algorithm may be high but stable.
  interactions:
  - refactoring-hotspot-prioritization
  - repository-assessment-behavioral-early-warning
  conflicts: []
  source_support:
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/007-chapter-2-identify-code-with-high-interest-rates.md :: Evaluate Hotspots with Complexity Trends'
    contribution: Trends and repository-relative deltas reveal accumulation while avoiding noisy universal thresholds; language/style biases remain.
    relationship: direct_support
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/007-chapter-2-identify-code-with-high-interest-rates.md :: Know the Biases in Complexity Trends'
    contribution: Trends and repository-relative deltas reveal accumulation while avoiding noisy universal thresholds; language/style biases remain.
    relationship: direct_support
  confidence: contextual
  roles:
