- id: repository-assessment-behavioral-boundary-candidate
  title: Co-change-nominated domain boundary candidate
  category: domain
  claim: Historical clusters can nominate a component or bounded-context candidate, but semantic language, invariants, data/authority ownership, transactions, and experts establish the boundary.
  decision_rule: Inspect stable co-change across technical layers, repeated policy and names, consult experts, map ownership and transactions, compare alternative cuts, and prototype before migration.
  why_it_matters: History reveals how work traverses current structure but commits can reflect convenience, rollout, or process artifacts.
  applicable_when:
  - layered monolith modularization
  - cross-layer co-change
  - context discovery
  not_applicable_when:
  - directory or graph clustering without domain evidence
  required_evidence:
  - co-change support
  - source policy
  - domain vocabulary
  - invariants
  - data and team ownership
  insufficient_evidence:
  - graph cluster
  - shared noun
  - folders
  - layer crossing alone
  required_inputs:
  - temporal cluster
  - current domain model and contracts
  expected_outputs:
  - boundary candidate
  - alternatives
  - costs
  - confidence
  preservation_boundaries:
  - Candidate status does not grant architecture or data migration authority.
  safe_actions:
  - prototype behind current facade
  - validate deletion/independence
  unsafe_actions:
  - declare bounded context from Git
  - merge semantically distinct features
  common_failure_modes:
  - shared infrastructure mistaken domain
  - feature-bundle commits
  - ignored transactions
  counterexamples:
  - An accepted ADR and domain model can outweigh a weak recent co-change pattern.
  interactions:
  - domain-bounded-context
  - refactoring-cochange-evidence
  - architecture-team-topology-force
  - architecture-change-locality-cohesion
  conflicts: []
  source_support:
