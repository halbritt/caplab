- id: repository-assessment-code-age
  title: Code-age stability clue
  category: review
  claim: Time since modification can suggest stable or active regions but cannot establish quality, safety, use, cohesion, or deadness.
  decision_rule: Choose a meaningful reference date, exclude generated content, interpret age within domain boundaries, and combine it with product activity, runtime use, incidents, roadmap, support, tests, and ownership.
  why_it_matters: Stable modules reduce cognitive load, while paused, abandoned, dead, or feared code can look equally old.
  applicable_when:
  - mature repository
  - stability or dead-code assessment
  not_applicable_when:
  - inactive repository without an appropriate reference event
  required_evidence:
  - reference date
  - product activity
  - runtime/dependency use
  - domain and support context
  insufficient_evidence:
  - age histogram
  - no recent commits
  required_inputs:
  - age map
  - current product/use context
  expected_outputs:
  - stability hypothesis and leave
  - isolate
  - characterize
  - delete-investigate
  - or migrate option
  preservation_boundaries:
  - Age never authorizes deletion or extraction.
  safe_actions:
  - downrank inactive low-risk code
  - verify deadness before deletion
  unsafe_actions:
  - declare old code good/dead/reusable
  common_failure_modes:
  - paused repo
  - latent vulnerability
  - dead package mistaken library
  counterexamples:
  - Old cryptographic code may require standards-driven migration.
  interactions:
  - refactoring-leave-unattractive-code
  - architecture-metrics-as-signals
  conflicts:
  - conflict-refactor-now-vs-leave-alone
  source_support:
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/010-chapter-5-the-principles-of-code-age.md :: Stabilize Code by Age'
    contribution: Last-change age distinguishes active and stable regions only after reference date, product activity, domain, generated content, tests, and dead-code alternatives are considered.
    relationship: direct_support
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/010-chapter-5-the-principles-of-code-age.md :: Dead Code Is Stable Code'
    contribution: Last-change age distinguishes active and stable regions only after reference date, product activity, domain, generated content, tests, and dead-code alternatives are considered.
    relationship: direct_support
  confidence: contextual
  roles:
  - repository-assessment-agent
  - architecture-agent
  - refactoring-agent
  languages:
  - language-independent
  repository_archetypes:
  - mature stable products
  retrieval_terms:
  - code age
  - stable code
