- id: repository-assessment-logical-change-set
  title: Cross-commit logical change grouping
  category: architecture
  claim: Co-change across split commits or repositories requires a defensible grouping of commits into one logical task.
  decision_rule: Prefer explicit ticket/task identifiers; otherwise use a documented same-author/team temporal window with reduced confidence, normalized identity, clocks, and repository roots.
  why_it_matters: Same-commit analysis misses distributed work, while temporal windows create false positives.
  applicable_when:
  - multi-repo
  - microservice
  - split-commit workflow
  not_applicable_when:
  - atomic monorepo task commits unless one task still spans commits
  required_evidence:
  - repo inventory
  - task linkage or window rationale
  - support
  - source/protocol inspection
  insufficient_evidence:
  - same-day change
  - shared filename
  required_inputs:
  - multi-repo logs
  - task data
  - identity normalization
  expected_outputs:
  - logical changes with confidence and grouping rule
  preservation_boundaries:
  - Grouping does not establish semantic dependency or authority.
  safe_actions:
  - use ticket-linked clusters for planning
  - report heuristic confidence
  unsafe_actions:
  - infer coupling solely from time proximity
  - hide grouping assumptions
  common_failure_modes:
  - release train
  - dependency bump
  - timezone error
  - batch formatting
  counterexamples:
  - Explicit ticket IDs spanning repositories provide much stronger grouping evidence.
  interactions:
  - refactoring-cochange-evidence
  - repository-assessment-behavioral-data-fitness
  conflicts: []
  source_support:
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/015-chapter-9-systems-of-systems-analyzing-multiple-repositories-and-microservices.md :: Use Logical Change Sets to Group Commits'
    contribution: Cross-repository or split-commit coupling requires grouping by ticket/task ID where possible, or a lower-confidence same-author/team time window.
    relationship: direct_support
