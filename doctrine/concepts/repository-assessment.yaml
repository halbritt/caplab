- id: repository-assessment-behavioral-early-warning
  title: Nonblocking behavioral review warning
  category: review
  claim: Rising hotspot rank, steep relative complexity growth, or missing expected co-change should focus review and allow intentional divergence.
  decision_rule: Compare against a clean repository-relative baseline, suppress small/noisy cases, show the pattern, inspect the diff and explanation, and record accepted, changed, or escalated disposition.
  why_it_matters: Early evidence can catch risk before it hardens, but forced historical conformity prevents healthy refactoring.
  applicable_when:
  - CI or review with stable behavioral baseline
  not_applicable_when:
  - dirty baseline
  - generated churn
  - no meaningful support
  required_evidence:
  - clean baseline
  - minimum support
  - meaningful delta
  - current diff and context
  insufficient_evidence:
  - universal percentage or rank threshold
  required_inputs:
  - pending diff
  - trend and coupling baseline
  expected_outputs:
  - warning
  - rationale
  - disposition
  preservation_boundaries:
  - Warning remains a prompt unless an independent repository contract makes it a blocker.
  safe_actions:
  - bypass with reason
  - update baseline as coupling disappears
  unsafe_actions:
  - force companion edit
  - freeze complexity ceiling
  - score authors
  common_failure_modes:
  - alert fatigue
  - gaming
  - fossilized coupling
  - bad baseline
  counterexamples:
  - A generated companion file can be mandatory under an explicit generator contract
  - independent of history.
  interactions:
  - refactoring-cochange-evidence
  - repository-assessment-complexity-trend
  - architecture-metrics-as-signals
  conflicts: []
  source_support:
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/016-chapter-10-an-extra-team-member-predictive-and-proactive-analyses.md :: Detect Future Hotspots'
    contribution: Rising hotspot rank, relative complexity increase, or absent expected co-change should focus early review while permitting intentional divergence.
    relationship: direct_support
