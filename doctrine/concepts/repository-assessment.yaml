- id: repository-assessment-behavioral-data-fitness
  title: Version-history evidence fitness gate
  category: agent-conduct
  claim: Behavioral inference is admissible only after checking whether repository practice preserves the entity, time, task, and author relationships the analysis assumes.
  decision_rule: Audit moves/imports/squashes/merges, generation/vendor/migrations, aliases/bots/pairing, branch scope, organizational dates, and logical-task linkage; mark each metric usable, corrected, limited, or invalid.
  why_it_matters: Plausible charts can encode false provenance and socially harmful attribution.
  applicable_when:
  - any history
  - hotspot
  - co-change
  - ownership
  - or age analysis
  not_applicable_when:
  - snapshot-only review making no historical claim
  required_evidence:
  - sample raw commits
  - repository policy and event history
  - exclusions
  insufficient_evidence:
  - tool success
  - commit volume
  - plausible output
  required_inputs:
  - raw history
  - analysis claim
  - repository practices
  expected_outputs:
  - fitness ledger by metric
  - corrections
  - exclusions
  - confidence
  preservation_boundaries:
  - Never silently invent uncertain identity or attribution.
  safe_actions:
  - exclude generated/noncode
  - consolidate verified aliases
  - downgrade social metrics
  unsafe_actions:
  - present biased author data as fact
  - repair uncertain history silently
  common_failure_modes:
  - copy-paste repository credit
  - squash erasure
  - pairing attributed to one
  - formatting noise
  counterexamples:
  - Static source review does not require history fitness if it makes no temporal claim.
  interactions:
  - architecture-metrics-as-signals
  - repository-assessment-logical-change-set
  - architecture-team-topology-force
  conflicts: []
  source_support:
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/016-chapter-10-an-extra-team-member-predictive-and-proactive-analyses.md :: Know the Biases and Workarounds for Behavioral Code Analysis'
    contribution: Aliases, pair/mob work, squashes, copied history, generated/noncode files, organizational shifts, and task grouping can invalidate social or technical inference.
    relationship: direct_support
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/013-chapter-7-beyond-conway-s-law.md :: Watch Out for Authors with Multiple Aliases'
    contribution: Aliases, pair/mob work, squashes, copied history, generated/noncode files, organizational shifts, and task grouping can invalidate social or technical inference.
    relationship: direct_support
  confidence: strong
