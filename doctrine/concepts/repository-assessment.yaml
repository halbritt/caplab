- id: repository-assessment-metrics-not-performance
  title: Prohibit individual performance scoring from behavioral code data
  category: agent-conduct
  claim: Commit, LOC, ownership, defect-attribution, hotspot, and knowledge-map data must never be converted into individual productivity or performance judgments.
  decision_rule: Restrict these data to communication, risk simulation, knowledge transfer, and system/team investigation under privacy policy; refuse ranking, scoring, or blame.
  why_it_matters: Measurement changes behavior, destroys the evidence source, discourages help/deletion/risky work, and cannot see task context.
  applicable_when:
  - any proposal to evaluate contributors from repository data
  not_applicable_when:
  - concrete code review of a specific contribution
  - maintainer routing
  required_evidence:
  - No evidence threshold makes individual performance scoring admissible from these signals.
  insufficient_evidence:
  - clean history
  - large sample
  - normalized score
  - managerial request
  required_inputs:
  - proposed use
  - privacy and authority context
  expected_outputs:
  - allowed communication/risk use or explicit refusal
  preservation_boundaries:
  - Protect individual privacy, team dynamics, and non-evaluative purpose.
  safe_actions:
  - find likely expert and ask
  - simulate knowledge-loss risk
  unsafe_actions:
  - rank employees by commits
  - LOC
  - bugs
  - ownership
  - hotspot work
  common_failure_modes:
  - covert scoring under risk
  - public shame
  - biased attribution
  counterexamples:
  - Review routing identifies familiarity and is not a performance evaluation.
  interactions:
  - architecture-team-topology-force
  - agent-conduct-authority-bounded-action
  conflicts: []
  source_support:
  - source_id: SRC-SDX
    locator: 'books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/017-appendix-a1-the-hazards-of-productivity-and-performance-metrics.md :: Adaptive Behavior and the Destruction of a Data Source'
