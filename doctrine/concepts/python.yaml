  - id: python-bounded-async
    title: Keep Python async nonblocking, bounded, and owned
    category: performance
    claim: Async code must keep the event loop free of unbounded blocking work, bound fan-out and queues, own every task and resource, and make cancellation and failure propagation explicit.
