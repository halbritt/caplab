  - id: python-compatible-property-evolution
    title: Evolve Python attributes through compatible properties
    category: implementation
    claim: A plain public attribute can evolve to a property when real validation or computation appears, provided ordinary caller and framework behavior remains compatible; speculative getters and setters are unnecessary.
    decision_rule: Start with the simplest public attribute allowed by the contract, add a property only when an earned rule exists, verify assignment access introspection serialization and framework behavior, and avoid surprising work or I/O behind attribute access.
    why_it_matters: Python properties preserve a useful evolution option without imposing boilerplate up front, but can also hide expensive work and compatibility changes.
    applicable_when: [Python public attribute, validation, derived value, compatibility-preserving API evolution]
    not_applicable_when: [external schema or framework requires a fixed descriptor or field mechanism]
    required_evidence: [current callers, new validation or computation, framework and serialization behavior, compatibility tests]
    insufficient_evidence: [possible future validation, Java-style encapsulation habit, desire for symmetry]
    required_inputs: [attribute contract, callers, new rule, repository and framework constraints]
    expected_outputs: [retained attribute or compatible property with behavior tests]
    preservation_boundaries: [read and assignment syntax, errors, introspection, dataclass and serialization behavior, performance expectations]
    safe_actions: [property for a real invariant, cached or computed value only with explicit cost and validity, deprecation when compatibility cannot hold]
    unsafe_actions: [speculative getter and setter, hidden remote I/O in property, change writable attribute to read-only silently]
