    expected_outputs: [bounded async topology with explicit task resource cancellation and shutdown behavior]
    preservation_boundaries: [result order, error aggregation, cancellation, connection and file lifetime, memory and concurrency limits]
    safe_actions: [semaphore or bounded queue, structured task ownership, explicit executor for bounded blocking work]
    unsafe_actions: [create one task per unbounded item, block the event loop, abandon tasks, swallow cancellation]
    common_failure_modes: [event-loop starvation, task leak, unhandled exception, memory explosion, shutdown hang]
