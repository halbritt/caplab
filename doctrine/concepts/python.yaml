  - id: python-runtime-static-boundary
    title: Keep Python static evidence distinct from runtime guarantees
    category: implementation
    claim: Type hints, TypedDict, cast, and structural checks are static evidence; they do not validate untrusted data, enforce business invariants, prove behavior, or replace executable tests.
    decision_rule: Add annotations where the configured checker consumes them and they clarify a stable boundary or catch a demonstrated mistake class; validate at trust boundaries and test runtime behavior regardless of annotation coverage.
    why_it_matters: Treating green static analysis as runtime proof creates false security and lets invalid external data or business states pass unchecked.
    applicable_when: [typed or gradually typed Python, external input, public API, cast or Any review]
    not_applicable_when: [a repository intentionally has no static checking and annotations add no maintained contract]
    required_evidence: [configured checker and Python version, boundary trust model, observed defect class, runtime invariant, annotation maintenance cost]
    insufficient_evidence: [green checker alone, TypedDict declaration, cast, annotation percentage, runtime-checkable protocol]
    required_inputs: [tooling contract, input trust, runtime behavior and invariants]
    expected_outputs: [appropriate annotation, runtime validation, behavioral test, or explicit omission]
    preservation_boundaries: [runtime API and behavior, import and annotation evaluation, supported dynamic use]
    safe_actions: [annotate stable boundaries, narrow Any with evidence, validate external data, retain behavior tests]
    unsafe_actions: [cast away uncertainty, treat TypedDict as parsing, contort runtime design solely for checker appeasement]
    common_failure_modes: [false security, checker-specific lock-in, suppressed type uncertainty, missing business validation]
    counterexamples: [An internal pure transformation can gain substantial value from strict annotations while still retaining behavioral tests.]
    interactions: [Static findings may justify investigation but do not by themselves prove a runtime defect or authorize a behavior change.]
    conflicts: [conflict-static-typing-vs-runtime-validation]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/014-chapter-8-type-hints-in-functions.md :: Flawed Typing and Strong Testing"
        contribution: Explicitly separates static type evidence from runtime behavior and testing.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/022-chapter-15-more-about-type-hints.md :: TypedDict"
        contribution: Shows that TypedDict constrains static shape without constructing or validating runtime records.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, review-agent, debugging-and-repair-agent]
    languages: [Python]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [Python typing, runtime validation, TypedDict, cast, Any, gradual typing]
    routing:
