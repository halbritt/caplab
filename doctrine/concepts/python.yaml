schema_version: agent-doctrine-concepts/1
concepts:
  - id: python-repository-shaped-idiom
    title: Make Python idiom repository-shaped
    category: implementation
    claim: Pythonic form is contextual interoperability with the repository's supported interpreter, dependencies, tooling, neighboring code, and public behavior, not permission for style-only modernization.
    decision_rule: Use a Python feature or idiom when the supported matrix accepts it and it makes the authorized behavior clearer or easier to integrate; preserve an established alternative when changing it widens compatibility, review, or migration risk without task benefit.
    why_it_matters: A valid modern idiom can still break supported runtimes, violate API commitments, or create an isolated local dialect.
    applicable_when: [all Python implementation and review]
    not_applicable_when: [generated or vendored Python whose producing workflow is out of scope]
    required_evidence: [Python and dependency version matrix, formatter linter and type-checker configuration, adjacent code, public API and tests]
    insufficient_evidence: [newness, elegance, isolated REPL success, a book's preferred idiom]
    required_inputs: [task behavior, repository toolchain, compatibility and API commitments]
    expected_outputs: [compatible Python implementation and explicit note for any version-sensitive construct]
    preservation_boundaries: [runtime and import compatibility, serialization, public signatures, formatting policy]
    safe_actions: [reuse established constructs, use supported standard protocols, follow local typing and error conventions]
    unsafe_actions: [raise the Python floor silently, introduce newer syntax without CI proof, perform drive-by modernization]
    common_failure_modes: [cargo-cult idiom, compatibility regression, isolated style migration, runtime-version assumption]
    counterexamples: [Greenfield code with an explicit current-version floor may adopt current idioms immediately.]
    interactions: [Universal repository precedence governs; this lens supplies Python-specific evidence to check.]
    conflicts: [conflict-uniformity-vs-context-sensitive-design]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/018-chapter-11-a-pythonic-object.md :: Chapter Summary"
        contribution: Frames Pythonic object design in relation to application and library requirements rather than syntax alone.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/002-preface.md :: Preface"
        contribution: Makes source-version and language evolution assumptions explicit.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, review-agent, debugging-and-repair-agent]
    languages: [Python]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [Pythonic, version floor, pyproject, compatibility, idiom, modernization]
    routing:
      activate_for_roles: [coding-agent, review-agent, debugging-and-repair-agent]
      activate_for_tasks: [implement-Python, review-Python, modernize-Python]
      activate_for_repository_signals: [pyproject.toml, tox.ini, version guard, compatibility shim, formatter]
      activate_for_languages: [Python]
      activate_for_risk_classes: [compatibility, maintainability, runtime-semantics]
      exclude_when: [the target is generated or vendored and its workflow is out of scope]
      prerequisites: [repository toolchain inspection]
      retrieval_priority: core
      retrieval_budget_hint: 300
