  - id: python-data-carrier-versus-domain-object
    title: Distinguish Python data carriers from domain objects
    category: implementation
    claim: A behaviorless record is appropriate for interchange, snapshots, or scaffolding and becomes a domain restructuring candidate only when cohesive policy or invariants manipulating its fields are recurring and scattered.
    decision_rule: Retain a carrier when its role is boundary transport or intermediate representation; move behavior toward a domain owner when operations share its fields, change together, and form a coherent responsibility without compromising serialization or generation contracts.
    why_it_matters: Treating every record as an anemic smell creates ceremony, while leaving real policy scattered duplicates invariants and ownership.
    applicable_when: [dataclass, NamedTuple, TypedDict, DTO, event or schema record]
    not_applicable_when: [generated records whose generator or adapter is the authority]
    required_evidence: [call sites, invariant ownership, recurring field-oriented policy, co-change, lifecycle and serialization role]
    insufficient_evidence: [presence of dataclass, getters, no methods, object-oriented preference]
    required_inputs: [record role, behavior map, ownership and compatibility constraints]
    expected_outputs: [retain-carrier or move-behavior decision with preservation plan]
    preservation_boundaries: [wire and schema compatibility, equality ordering and hash, mutability, generated workflow]
    safe_actions: [keep immutable boundary records, centralize recurring invariant policy, validate at the owning boundary]
    unsafe_actions: [add domain behavior to generated models, assume annotations validate inputs, refactor from smell alone]
    common_failure_modes: [anemic domain, overstuffed entity, serialization coupled to behavior, generated-code edits]
    counterexamples: [A JSON import record should often remain a simple boundary carrier.]
    interactions: [Domain doctrine may strengthen the ownership evidence; technical type shape alone never establishes a domain object.]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/010-chapter-5-data-class-builders.md :: Data class as a code smell"
        contribution: Treats a data class as a smell only when domain behavior remains scattered around it.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/010-chapter-5-data-class-builders.md :: Data class as intermediate representation"
        contribution: Establishes boundary and intermediate records as valid behaviorless structures.
        relationship: refinement
    confidence: contextual
