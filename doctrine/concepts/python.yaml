    insufficient_evidence: [generator syntax is concise, lower peak memory in isolation, one successful full consumption]
    required_inputs: [consumer contract, data size, lifetime and failure semantics]
    expected_outputs: [stream or materialize decision with exhaustion cleanup and replay tests]
    preservation_boundaries: [ordering, side effects, failure timing, resource lifetime, replay and snapshot semantics]
    safe_actions: [return a fresh iterator from a reusable iterable, scope resources to consumption, materialize at an explicit boundary]
    unsafe_actions: [make an iterable its own one-shot iterator unintentionally, return a generator tied to a closed resource, ignore partial consumption]
    common_failure_modes: [exhausted reusable object, resource leak, delayed exception, hidden repeated query, stale live view]
