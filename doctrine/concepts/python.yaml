  - id: python-text-bytes-boundary
    title: Make Python text and bytes conversion a policy boundary
    category: implementation
    claim: Decode bytes to text at a known ingress and encode text at egress with an explicit codec, error, normalization, and loss policy; leave opaque binary payloads uninterpreted.
    decision_rule: Establish the producer's encoding and the domain's comparison and display requirements, decode once near ingress, operate on str, normalize or casefold only for an authorized purpose, and encode once near egress.
    why_it_matters: Defaults and ASCII-only samples conceal mojibake, cross-platform corruption, and identifier or security collisions.
    applicable_when: [files, subprocesses, sockets, databases, serialization, filesystem names]
    not_applicable_when: [opaque hashes, images, compressed streams, or other binary payloads]
    required_evidence: [protocol or file metadata, representative non-ASCII data, round-trip and failure tests, normalization requirements]
    insufficient_evidence: [platform default, successful ASCII sample, encoding guess treated as certainty]
    required_inputs: [byte-source contract, domain text policy, compatibility requirements]
    expected_outputs: [explicit codec error and normalization behavior with boundary tests]
    preservation_boundaries: [exact bytes where required, visible characters, normalization-sensitive identifiers, loss policy]
    safe_actions: [set encoding explicitly, fail strictly by default, allow replacement only when product policy accepts loss]
    unsafe_actions: [silent lossy decoding, indiscriminate accent removal, default-encoding dependence, mixing str and bytes]
    common_failure_modes: [mojibake, platform-specific behavior, lossy round trip, normalization collision]
    counterexamples: [A binary digest should remain bytes instead of being decoded for convenience.]
    interactions: [Failure policy decides whether invalid input is rejected, replaced, quarantined, or reported.]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/009-chapter-4-text-versus-bytes.md :: Handling Text Files"
        contribution: Establishes a Unicode sandwich with explicit decoding at ingress and encoding at egress.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/009-chapter-4-text-versus-bytes.md :: Beware of Encoding Defaults"
        contribution: Demonstrates why environment defaults are insufficient evidence for portable text handling.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, debugging-and-repair-agent, review-agent]
    languages: [Python]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [Unicode, text, bytes, encoding, normalization, mojibake]
    routing:
