  - id: python-interface-mechanism-selection
    title: Select the least powerful Python interface mechanism that proves the contract
    category: implementation
    claim: Direct coupling, duck typing, static Protocol, ABC, and concrete type constraints provide different evidence and runtime behavior; choose the least powerful mechanism real consumers and enforcement needs justify.
    decision_rule: Start from consumer operations and implementation ownership; keep direct concrete coupling when no variation or hiding pressure exists, use duck typing for runtime behavioral openness, Protocol for static structural checking, and ABC only when nominal runtime membership or shared implementation is required.
    why_it_matters: Unnecessary interfaces add indirection and false substitutability, while an overly concrete boundary can duplicate adapters or block demonstrated variation.
    applicable_when: [Python API design, dependency substitution, plugin or framework boundary, test seam]
    not_applicable_when: [a local concrete dependency with no independent variation or policy boundary]
    required_evidence: [consumer operation set, implementation ownership, number and evolution of implementations, static versus runtime enforcement need]
    insufficient_evidence: [test-double convenience alone, interface fashion, one implementation, desire to avoid imports]
    required_inputs: [consumers and implementations, repository typing policy, runtime registration needs]
    expected_outputs: [direct, duck, Protocol, ABC, or concrete decision with minimal contract]
    preservation_boundaries: [runtime behavior, isinstance and registration semantics, public compatibility, error behavior]
    safe_actions: [consumer-shaped Protocol, simple duck-typed contract, direct concrete dependency when honest]
    unsafe_actions: [ABC hierarchy for hypothetical variants, runtime protocol check as semantic proof, interface mirroring every implementation method]
    common_failure_modes: [accidental indirection, false runtime guarantee, oversized Protocol, nominal lock-in]
    counterexamples: [A plugin framework may require ABC registration and shared lifecycle even when structural typing is possible.]
    interactions: [Protocol conformance concerns behavior; this rule concerns the enforcement and coupling mechanism.]
