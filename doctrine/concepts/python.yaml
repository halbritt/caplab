  - id: python-mutable-ownership
    title: Make Python mutable ownership explicit
    category: implementation
    claim: Because Python assignment and calls share object references, every stored or mutated input needs an explicit borrowed, consumed, copied, shared, or owned contract.
    decision_rule: Determine whether caller-visible mutation and identity are intended; copy at the boundary when internal ownership is required, retain an alias only when sharing is explicit and tested, analyze nested structure before claiming isolation, and never use a mutable default as per-call state.
    why_it_matters: Implicit aliasing creates action at a distance, cross-call ghost state, retention, and race-prone shared caches.
    applicable_when: [constructors, mutable parameters, caches, nested collections, shared buffers, concurrency]
    not_applicable_when: [immutable scalar-only paths]
    required_evidence: [mutation sites, identity and equality contract, nested object graph, lifetime and size, concurrency]
    insufficient_evidence: [type hint alone, shallow copy without nested analysis, tuple assumed deeply immutable]
    required_inputs: [ownership contract, object graph, mutation and lifetime evidence]
    expected_outputs: [explicit copy borrow consume or share behavior with aliasing tests]
    preservation_boundaries: [intentional identity and sharing, performance boundaries, sensitive data lifetime]
    safe_actions: [use a None sentinel then allocate, convert an incoming iterable to owned storage, document in-place behavior]
    unsafe_actions: [store then silently mutate a caller list, shallow-copy nested data while claiming isolation, compare values with is]
    common_failure_modes: [mutable-default state leak, unexpected caller mutation, false isolation, expensive defensive copying]
    counterexamples: [A memoryview deliberately shares storage and should make that lifetime and mutation contract explicit.]
    interactions: [Memory profiling may show retention pressure, but ownership semantics constrain every remedy.]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/011-chapter-6-object-references-mutability-and-recycling.md :: Defensive Programming with Mutable Parameters"
        contribution: Requires deliberate alias or copy behavior for mutable arguments stored by an object.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/011-chapter-6-object-references-mutability-and-recycling.md :: Mutable Types as Parameter Defaults: Bad Idea"
        contribution: Identifies shared default objects as cross-call state and prescribes per-call creation.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, debugging-and-repair-agent, performance-agent, review-agent]
    languages: [Python]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [Python mutability, aliasing, mutable default, copy, ownership, identity]
    routing:
      activate_for_roles: [coding-agent, debugging-and-repair-agent, performance-agent, review-agent]
      activate_for_tasks: [design-constructor, repair-aliasing, review-mutation, diagnose-retention]
      activate_for_repository_signals: [mutable default, stored argument, shallow copy, in-place operator, shared cache]
