  - id: python-function-over-stateless-class
    title: Prefer a Python function for stateless single-operation behavior
    category: implementation
    claim: A named function or callable is usually a clearer implementation of a single-operation strategy with no independent identity, state, lifecycle, or related operations than a parallel one-method class hierarchy.
    decision_rule: Inventory variant state, lifecycle, discovery, and framework obligations; use a function for a stable call shape without independent state, a callable object when encapsulated state is real, and a class when identity, multiple cohesive operations, substitution, or framework integration earns it.
    why_it_matters: One-method hierarchies can add registration and inheritance machinery without hiding useful complexity, while closures can also hide state when overused.
    applicable_when: [callback, transformation, policy function, simple strategy or command]
    not_applicable_when: [accepted class-based plugin contract, cohesive stateful object]
    required_evidence: [variant state and lifecycle, call sites, discovery and configuration needs, extension contract]
    insufficient_evidence: [line count, dislike of classes, design-pattern name, function availability]
    required_inputs: [behavior variants, state and lifecycle, framework and repository conventions]
    expected_outputs: [function, callable object, or class decision with rationale]
    preservation_boundaries: [configuration, strategy identity, errors, discoverability, test seams]
    safe_actions: [named function, explicit registry with owner, callable object for real state]
    unsafe_actions: [complex anonymous lambda, import-time global registration without ownership, closure hiding mutable lifecycle]
    common_failure_modes: [boilerplate hierarchy, inscrutable closure, global registry coupling, object with no abstraction]
    counterexamples: [A retry policy with state, metrics, and lifecycle may deserve an object.]
    interactions: [The earned-abstraction rule governs both class and function indirection.]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/016-chapter-10-design-patterns-with-first-class-functions.md :: Function-Oriented Strategy"
        contribution: Replaces stateless one-method strategy objects with first-class functions while retaining behavior selection.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/013-chapter-7-functions-as-first-class-objects.md :: User-Defined Callable Types"
        contribution: Refines when a stateful callable object is appropriate.
        relationship: refinement
