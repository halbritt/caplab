  - id: python-streaming-iteration
    title: Preserve Python iterator, exhaustion, and lifetime semantics
    category: implementation
    claim: Generators and iterators are appropriate only when single-pass deferred execution, exception timing, and resource lifetime satisfy consumers; reusable iterables must remain distinct from their iterators.
    decision_rule: Choose streaming for large, unbounded, or naturally one-pass input when consumers accept deferred failure and scoped resource ownership; materialize for replay, random access, eager validation, stable snapshot, or lifetime independence.
    why_it_matters: Lazy iteration can reduce memory while silently changing when work, errors, cleanup, and side effects occur.
