  - id: python-representation-fit
    title: Choose Python representations by semantic and workload fit
    category: implementation
    claim: Lists, tuples, deques, sets, mappings, flat arrays, views, and generators should be selected from ordering, uniqueness, mutability, access, ownership, size, and materialization needs rather than habit.
    decision_rule: Specify required operations and semantic laws first; choose the simplest built-in representation that satisfies them, and require representative measurement before adopting lower-level or third-party storage for performance.
    why_it_matters: A mismatched container can lose ordering or duplicates, create quadratic operations, retain backing storage, or leak representation into public APIs.
    applicable_when: [collection-heavy Python, data pipelines, queues, numeric data, boundary conversion]
    not_applicable_when: [small fixed constants where alternatives have no material semantic difference]
    required_evidence: [ordering and uniqueness, mutation and ownership, access profile, cardinality, materialization need, benchmark for efficiency claims]
    insufficient_evidence: [container familiarity, theoretical compactness, microbenchmark excluding conversion and downstream work]
    required_inputs: [data semantics, workload and scale, lifetime, public contract]
    expected_outputs: [representation decision and tests for ordering, aliasing, mutation, and conversion]
    preservation_boundaries: [order, duplicates, precision, equality, identity and shared storage, API compatibility]
    safe_actions: [use deque for demonstrated endpoint queues, flat numeric storage for homogeneous measured workloads, views for intentional sharing]
    unsafe_actions: [set conversion when order matters, zero-copy view without lifetime analysis, premature third-party array dependency]
    common_failure_modes: [accidental quadratic operation, retained buffer, premature NumPy, representation leakage]
    counterexamples: [A short configuration list should favor familiar clarity over compactness.]
    interactions: [The universal representation rule supplies semantics first; performance doctrine supplies measurement and preservation gates.]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/007-chapter-2-an-array-of-sequences.md :: When a List Is Not the Answer"
        contribution: Compares standard sequence and array representations against access and workload needs.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/008-chapter-3-dictionaries-and-sets.md :: Practical Consequences of How dict Works"
        contribution: Refines mapping choices with ordering, key, memory, and behavior consequences.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, performance-agent, review-agent]
    languages: [Python]
    repository_archetypes: [library, service, CLI, monolith, distributed-system]
    retrieval_terms: [Python container, list, deque, set, dict, array, memoryview, generator]
    routing:
      activate_for_roles: [coding-agent, performance-agent, review-agent]
      activate_for_tasks: [choose-Python-container, optimize-data-path, review-representation]
      activate_for_repository_signals: [large list, pop zero, numeric loop, memoryview, cardinality]
      activate_for_languages: [Python]
