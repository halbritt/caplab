  - id: python-protocol-conformance
    title: Earn interoperability through complete Python protocols
    category: implementation
    claim: A custom type should implement the smallest semantically complete standard protocol that real clients consume instead of inventing a parallel API or adding decorative special methods.
    decision_rule: Inventory required built-in and library operations, identify the corresponding protocol, and implement only the methods whose conventional return, error, mutation, exhaustion, equality, and fallback semantics can be honored and tested.
    why_it_matters: Protocol conformance enables native interoperability, while partial or surprising emulation makes generic-looking operations unsafe.
    applicable_when: [custom collection, numeric or domain value, iterable, callable, context manager, library integration]
    not_applicable_when: [a named domain action communicates intent better than a standard protocol]
    required_evidence: [actual client operations, standard protocol behavior, edge-case tests, mutation and failure semantics]
    insufficient_evidence: [method-name symmetry, hypothetical reuse, ability to implement a dunder]
    required_inputs: [consumer operation inventory, Python protocol contract, repository compatibility]
    expected_outputs: [protocol-conformant type with behavioral tests or a deliberate named API]
    preservation_boundaries: [return types, fallback and dispatch, exhaustion and slicing, mutation, equality and hash]
    safe_actions: [delegate to proven built-ins, call built-ins rather than dunders, implement the minimal complete protocol]
    unsafe_actions: [invent undocumented double-underscore methods, partially emulate a protocol, mask missing attributes broadly]
    common_failure_modes: [feature-parade object, surprising operator, partial iterator, public implementation leakage]
    counterexamples: [A domain command such as approve should remain a named operation instead of being disguised as an operator.]
    interactions: [Interface-mechanism selection decides how a contract is enforced; protocol conformance decides whether behavior follows Python's laws.]
    source_support:
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/005-chapter-1-the-python-data-model.md :: How Special Methods Are Used"
        contribution: Explains how Python invokes protocol methods through language-level operations rather than direct dunder calls.
        relationship: direct_support
      - source_id: SRC-FP
        locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/020-chapter-13-interfaces-protocols-and-abcs.md :: Designing a static protocol"
        contribution: Refines protocol design around the smallest useful operation set and consumer semantics.
        relationship: refinement
    confidence: strong
    roles: [coding-agent, review-agent, architecture-agent]
    languages: [Python]
    repository_archetypes: [library, service, CLI, monolith]
    retrieval_terms: [Python protocol, special method, dunder, duck typing, interoperability]
    routing:
      activate_for_roles: [coding-agent, review-agent, architecture-agent]
      activate_for_tasks: [design-custom-type, implement-protocol, review-special-method]
      activate_for_repository_signals: [dunder method, custom collection, built-in operation failure, adapter code]
      activate_for_languages: [Python]
      activate_for_risk_classes: [correctness, compatibility, maintainability]
      exclude_when: [no Python protocol behavior is required by clients]
      prerequisites: [consumer operation inventory]
      retrieval_priority: high
      retrieval_budget_hint: 340
