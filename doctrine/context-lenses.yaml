schema_version: agent-doctrine-context-lenses/1
application_rule: Apply every lens whose activation evidence is present. Lenses refine universal doctrine; they do not grant authority or override accepted repository contracts. When lenses conflict, rank explicit risk/operational constraints over archetype defaults and record the conflict.

lenses:
  - id: lens-greenfield
    title: Greenfield system
    activation_evidence:
      - no deployed compatibility or durable-state obligations yet exist
      - architecture and domain decisions remain owner-selectable
    default_bias:
      - establish the smallest end-to-end spine that tests the highest-risk assumptions
      - preserve options only where later evidence can change an expensive commitment
      - use representative scenarios to create contracts and fitness checks early
    emphasize_concepts:
      - universal-minimize-simultaneous-uncertainty
      - universal-earned-abstraction
      - architecture-feedback-loop
      - architecture-selective-option-preservation
    modify_decisions:
      - alternatives can be tested before compatibility hardens, but speculative scale and framework needs still require evidence
      - characterization is unnecessary for nonexistent behavior; acceptance tests define intended behavior instead
    contraindications:
      - complete speculative platform before a vertical slice
      - using greenfield status to ignore deployment, data, security, or operational constraints
    routing:
      roles: [coding-agent, architecture-agent, domain-design-agent]
      tasks: [system-bootstrap, initial-architecture, initial-domain-model]
      risk_classes: [design-uncertainty, option-cost]

  - id: lens-legacy
    title: Legacy or poorly characterized system
    activation_evidence:
      - behavior is incompletely understood or feedback is insufficient for safe change
      - dependencies prevent focused execution or observation
    default_bias:
      - identify the change point and characterize current behavior before redesign
      - introduce the smallest sensing/separation seam and break one dependency at a time
      - preserve undocumented behavior until an authorized owner releases it
    emphasize_concepts:
      - legacy-characterization-surfaces
      - legacy-seams-and-enabling-points
      - legacy-sensing-and-separation
      - universal-minimize-simultaneous-uncertainty
    modify_decisions:
      - temporary local ugliness is acceptable when it creates safe feedback and has a containment/removal rule
      - a broad target design has lower priority than the next required safe change
    contraindications:
      - rewrite for testability before the requested change point is known
      - replace surprising behavior with a cleaner interpretation without semantic authority
    routing:
      roles: [legacy-code-agent, refactoring-agent, debugging-and-repair-agent]
      tasks: [legacy-change, characterization, dependency-breaking, constrained-modernization]
      risk_classes: [unknown-behavior, regression]

  - id: lens-library
    title: Reusable library
    activation_evidence:
      - code is consumed by independent callers or repositories
      - API compatibility, portability, or versioning is an explicit obligation
    default_bias:
      - keep the public surface minimal, coherent, conventional, and explicit about ownership, errors, cost, and thread/concurrency behavior
      - hide volatile implementation while avoiding lowest-common-denominator abstractions unsupported by consumers
      - treat dependency additions, language/runtime floors, and breaking changes as architectural decisions
    emphasize_concepts:
      - implementation-minimal-coherent-api
      - universal-information-hiding
      - architecture-earned-boundary
      - universal-reversible-reviewable-change
    modify_decisions:
      - current known consumers outweigh imagined reuse; broad frameworks require multiple proven applications
      - public specialization or caching needs stronger semantic and compatibility proof than an internal fast path
    contraindications:
      - API designed around one implementation's internals
      - exposing test seams as permanent public surface without consumer need
    routing:
      roles: [coding-agent, architecture-agent, review-agent, performance-agent]
      tasks: [API-design, compatibility-review, library-optimization]
      risk_classes: [compatibility, ecosystem, portability]

  - id: lens-service
    title: Networked service
    activation_evidence:
      - a long-running process serves remote or asynchronous clients
      - deployment, availability, observability, and recovery are owned concerns
    default_bias:
      - make latency, partial failure, timeout, cancellation, retry, idempotency, backpressure, and shutdown explicit
      - bound all concurrency, queues, caches, and dependency resource use
      - verify behavior at API, data, and operational boundaries, not only unit level
    emphasize_concepts:
      - implementation-explicit-failure-policy
      - performance-resource-lifecycle
      - performance-earned-bounded-concurrency
      - architecture-earned-boundary
    modify_decisions:
      - in-process clarity does not erase runtime dependency, deployment, or failure coupling
      - performance objectives should emphasize tail latency, load shape, and saturation behavior
    contraindications:
      - unbounded retry or fan-out
      - hiding remote I/O or failure as an ordinary cheap method call
    routing:
      roles: [coding-agent, architecture-agent, performance-agent, debugging-and-repair-agent]
      tasks: [service-feature, resilience, API-review, production-performance]
      risk_classes: [availability, partial-failure, operational]

  - id: lens-cli
    title: Command-line application
    activation_evidence:
      - primary contract is command invocation, streams/files, exit status, and human or scripted output
    default_bias:
      - keep startup and control flow direct; separate parsing, domain action, and presentation only when each has a real contract
      - treat stdout/stderr, exit codes, filesystem effects, signals, and interrupt cleanup as APIs
      - prefer bounded synchronous code unless concurrency materially improves a measured workload
    emphasize_concepts:
      - implementation-obvious-control-flow
      - implementation-explicit-failure-policy
      - performance-resource-lifecycle
    modify_decisions:
      - process-lifetime caches or resources may be simpler when key space and duration are bounded
      - a small one-shot CLI rarely needs service-style framework or distributed abstractions
    contraindications:
      - library-hostile global exits inside reusable core logic
      - changing output or exit behavior under a nominal refactor
    routing:
      roles: [coding-agent, review-agent, debugging-and-repair-agent]
      tasks: [CLI-feature, CLI-repair, output-contract-review]
      risk_classes: [automation-compatibility, filesystem, interrupt]

  - id: lens-embedded
    title: Embedded or resource-constrained system
    activation_evidence:
      - hardware timing, memory, power, storage, real-time, or safety constraints materially shape behavior
    default_bias:
      - treat device, timing, interrupt, memory-layout, and recovery behavior as architectural drivers rather than incidental details
      - quantify resource budgets and preserve deterministic failure/safe-state behavior
      - isolate hardware where policy can genuinely vary independently, but do not hide required timing or physical semantics
    emphasize_concepts:
      - performance-measurable-objective
      - performance-memory-lifecycle
      - architecture-scoped-characteristics
      - universal-explicit-invariants
    modify_decisions:
      - allocation, data layout, and concurrency may deserve earlier evidence than in ordinary application code
      - reversal and observability constraints may require stronger up-front design and simulation/hardware-in-loop proof
    contraindications:
      - generic framework abstraction that obscures timing or resource cost
      - treating hardware as a replaceable detail when it defines policy or safety
    routing:
      roles: [coding-agent, architecture-agent, performance-agent, review-agent]
      tasks: [embedded-design, resource-optimization, safety-review]
      risk_classes: [safety, real-time, memory, power, hardware]

  - id: lens-stable-product
    title: Stable product
    activation_evidence:
      - compatibility and operational obligations dominate new discovery
      - change rate and domain semantics are relatively stable
    default_bias:
      - preserve established contracts, avoid broad churn, and require concrete payoff for new abstraction or architecture
      - favor incremental retirement, dependency maintenance, observability, and risk reduction
    emphasize_concepts:
      - refactoring-leave-unattractive-code
      - universal-preserve-behavior-by-default
      - universal-no-change-option
    modify_decisions:
      - old stable units may be left alone after dead-code and latent-risk checks
      - migrations need explicit mixed-version and support-window proof
    contraindications:
      - modernization for fashion
      - inferred permission to break compatibility because consumers are quiet
    routing:
      roles: [refactoring-agent, architecture-agent, review-agent, coding-agent]
      tasks: [maintenance, modernization-assessment, dependency-upgrade]
      risk_classes: [compatibility, regression, operational]

  - id: lens-rapidly-converging-product
    title: Rapidly converging product
    activation_evidence:
      - problem/solution fit and domain requirements change frequently
      - architecture must learn from short implementation cycles
    default_bias:
      - use thin vertical slices, reversible choices, direct code, and current-needs abstractions
      - distinguish requirements churn from structural defect before refactoring
    emphasize_concepts:
      - universal-minimize-simultaneous-uncertainty
      - universal-earned-abstraction
      - architecture-feedback-loop
    modify_decisions:
      - high churn alone is weak refactoring evidence
      - temporary duplication may preserve learning until variation axes stabilize
    contraindications:
      - platformization before repeated needs
      - long-lived shortcuts without explicit expiry or debt decision
    routing:
      roles: [coding-agent, architecture-agent, refactoring-agent]
      tasks: [product-iteration, early-feature, architecture-learning]
      risk_classes: [requirements-uncertainty, option-cost]

  - id: lens-monolith
    title: Monolithic deployment
    activation_evidence:
      - one process/deployment and usually one operational envelope contains the system
    default_bias:
      - use in-process modules and compiler/build constraints for semantic boundaries
      - preserve transactional simplicity and local observability while preventing uncontrolled internal access
    emphasize_concepts:
      - architecture-boundary-strength
      - architecture-change-locality-cohesion
      - architecture-earned-boundary
    modify_decisions:
      - module/context boundaries need not be services
      - distribution must be justified by an operational force, not by poor modularity alone
    contraindications:
      - shared mutable database access that makes module ownership fictional
      - remote-service semantics simulated needlessly inside one process
    routing:
      roles: [architecture-agent, coding-agent, refactoring-agent]
      tasks: [modularize-monolith, boundary-review, service-extraction-assessment]
      risk_classes: [coupling, transaction, deployment]

  - id: lens-distributed
    title: Distributed system
    activation_evidence:
      - behavior spans independently failing processes, services, repositories, regions, or administrative owners
    default_bias:
      - model latency, partial failure, retries, duplication, ordering, consistency, version skew, observability, and ownership explicitly
      - prefer coarse contracts and data authority; avoid chatty or shared-database coupling
    emphasize_concepts:
      - architecture-distribution-readiness
      - architecture-earned-boundary
      - architecture-event-temporal-semantics
      - performance-earned-bounded-concurrency
    modify_decisions:
      - network/deployment boundaries require stronger preservation and migration proof than source-level inversion
      - co-change across services may reveal a distributed monolith but requires product/process interpretation
    contraindications:
      - treating a remote call as an ordinary local method
      - choreography without causal ordering, idempotency, and failure ownership
    routing:
      roles: [architecture-agent, coding-agent, performance-agent, review-agent]
      tasks: [distributed-feature, service-boundary, eventing, migration]
      risk_classes: [partial-failure, consistency, availability, versioning]

  - id: lens-domain-heavy
    title: Domain-heavy code
    activation_evidence:
      - complex policies, identities, invariants, terminology, and model disagreements drive change
      - sustained domain-expert access and differentiating domain value exist
    default_bias:
      - bind model, language, tests, and implementation; make policy and invariants explicit
      - identify model-consistency contexts and protect the differentiating core domain
    emphasize_concepts:
      - domain-language-model-loop
      - domain-aggregate-invariant-boundary
      - domain-bounded-context
    modify_decisions:
      - domain forces may justify broader refactoring or architecture when local code cannot express a coherent model
      - technical convenience does not automatically define contexts or aggregates
    contraindications:
      - noun-to-class modeling without behavioral scenarios
      - context or service per entity
    routing:
      roles: [domain-design-agent, architecture-agent, coding-agent, refactoring-agent]
      tasks: [domain-modeling, context-mapping, aggregate-design, model-refactoring]
      risk_classes: [semantic-integrity, policy, data]

  - id: lens-infrastructure-heavy
    title: Infrastructure-heavy code
    activation_evidence:
      - orchestration, adapters, protocols, storage, scheduling, transport, or generic mechanisms dominate over rich business policy
    default_bias:
      - use explicit technical contracts, resource/failure semantics, and deep modules rather than ceremonial domain objects
      - isolate external volatility while keeping operational cost and behavior visible
    emphasize_concepts:
      - universal-information-hiding
      - architecture-policy-mechanism-separation
      - performance-resource-lifecycle
      - implementation-explicit-failure-policy
    modify_decisions:
      - domain modeling is earned only where vocabulary or policy actually adds leverage
      - technical constraints may legitimately shape architecture and representation
    contraindications:
      - introducing entities, aggregates, repositories, or services only to imitate DDD vocabulary
      - hiding resource or failure behavior behind overly domain-pure interfaces
    routing:
      roles: [coding-agent, architecture-agent, performance-agent, review-agent]
      tasks: [infrastructure-design, adapter-review, platform-code]
      risk_classes: [operational, protocol, resource]

  - id: lens-performance-sensitive
    title: Performance-sensitive system
    activation_evidence:
      - accepted latency, throughput, resource, cost, or real-time target is material to success
    default_bias:
      - retain representative baselines, profile causal bottlenecks, and preserve semantics
      - prefer work/algorithm/data improvements before specialization and concurrency
    emphasize_concepts:
      - performance-measurable-objective
      - performance-benchmark-validity
      - performance-profile-causal-bottleneck
      - performance-target-based-stop
    modify_decisions:
      - abstraction and representation choices must expose enough cost for callers and measurement
      - measured specialization may outweigh uniformity after higher-level options
    contraindications:
      - speculative tuning or benchmark-only architecture
      - trading quality without owner authority
    routing:
      roles: [performance-agent, coding-agent, architecture-agent, review-agent]
      tasks: [performance-design, optimization, performance-review]
      risk_classes: [performance, cost, real-time]

  - id: lens-safety-durability-sensitive
    title: Safety- or durability-sensitive system
    activation_evidence:
      - failure can cause irreversible data loss, physical harm, legal breach, or material security impact
    default_bias:
      - require explicit invariants, fault models, recovery states, independent evidence, and authority
      - favor simple analyzable flows, defense in depth at trust boundaries, staged changes, and rehearsed recovery
    emphasize_concepts:
      - universal-explicit-invariants
      - universal-preserve-behavior-by-default
      - universal-reversible-reviewable-change
      - review-severity-confidence-separation
    modify_decisions:
      - higher formality, characterization, representative failure tests, and rollback proof are proportionate
      - no-change may be unsafe when latent high-impact risk exists despite low churn
    contraindications:
      - relying on one test class or one tool for acceptance
      - defining away caller-relevant failure information
    routing:
      roles: [architecture-agent, coding-agent, review-agent, debugging-and-repair-agent]
      tasks: [safety-review, durability-change, migration, operational-hardening]
      risk_classes: [safety, durability, security, compliance]

  - id: lens-weakly-tested
    title: Weakly tested system
    activation_evidence:
      - relevant paths lack fast trustworthy protection or tests do not prove their coverage
    default_bias:
      - narrow claims and scope; characterize before structural movement; add sensing/separation at stable boundaries
      - prefer reversible steps and compilation/static/runtime feedback in combination
    emphasize_concepts:
      - legacy-characterization-surfaces
      - refactoring-behavior-preservation
      - universal-minimize-simultaneous-uncertainty
    modify_decisions:
      - passing unrelated suites cannot support refactoring or repair confidence
      - automated refactoring tools are trusted only for properties they model
    contraindications:
      - broad rewrite justified by absence of tests
      - tests exposing internals publicly for convenience
    routing:
      roles: [legacy-code-agent, refactoring-agent, debugging-and-repair-agent, coding-agent]
      tasks: [add-protection, repair, refactor, legacy-change]
      risk_classes: [regression, unknown-behavior]

  - id: lens-generated-code
    title: Generated code
    activation_evidence:
      - files declare generation provenance or are reproducibly emitted by a generator
    default_bias:
      - edit the authoritative input/generator, not generated output
      - exclude mechanical size, duplication, churn, and co-change from human design conclusions unless generator behavior is the question
    emphasize_concepts:
      - universal-repository-contract-precedence
      - universal-evidence-before-intervention
    modify_decisions:
      - generated repetition may be correct and cheaper than runtime abstraction
      - validation should regenerate and diff deterministically
    contraindications:
      - manual cleanup of emitted files
      - letting generated inventories dominate maintainer-facing doctrine or review
    routing:
      roles: [coding-agent, review-agent, repository-assessment-agent]
      tasks: [generator-change, generated-output-review, repository-assessment]
      risk_classes: [provenance, reproducibility]

  - id: lens-vendored-code
    title: Vendored code
    activation_evidence:
      - code is copied or synchronized from an external upstream and governed by a vendor/update contract
    default_bias:
      - treat upstream source, local patches, provenance, license, and update path as authority
      - prefer adapters or narrowly documented patches over stylistic local rewrites
    emphasize_concepts:
      - universal-repository-contract-precedence
      - universal-reversible-reviewable-change
    modify_decisions:
      - local refactoring or formatting usually increases future merge cost without owning the design
      - defects may require upstream report/fix or a minimal carried patch
    contraindications:
      - infer dead code from local static use only
      - erase provenance or patch boundaries
    routing:
      roles: [coding-agent, review-agent, dependency-agent]
      tasks: [vendor-update, local-patch, dependency-repair]
      risk_classes: [supply-chain, license, mergeability]

  - id: lens-go
    title: Go language lens
    activation_evidence:
      - affected production code is Go and repository toolchain/version is known
    default_bias:
      - keep packages cohesive and exported surface minimal
      - define small interfaces from consumer needs when real substitution or policy boundaries exist; otherwise use direct concrete dependencies
      - handle or propagate material errors explicitly with repository-standard context
      - prefer composition and simple control flow; avoid framework-style abstraction without demonstrated variation
      - add goroutines/channels only after workload evidence and give each lifecycle/capacity ownership
      - use current compiler/runtime profiles before changing allocation, pointer, layout, GC, or scheduler behavior
    emphasize_concepts:
      - implementation-repository-language-conformance
      - universal-earned-abstraction
      - performance-earned-bounded-concurrency
      - performance-memory-lifecycle
    modify_decisions:
      - do not assume pointers, generics, interfaces, or Go itself are faster; measure current toolchain behavior
      - package boundaries and internal visibility are useful enforcement mechanisms before process distribution
    contraindications:
      - one interface per implementation by rule
      - ignored errors, unbounded goroutines, reflection-heavy framework emulation
    current-verification_required:
      - go.mod toolchain and supported versions
      - compiler escape/inlining behavior when performance matters
      - runtime container, GOMAXPROCS, GC, and profiling behavior
    routing:
      roles: [coding-agent, performance-agent, review-agent, architecture-agent]
      tasks: [Go-implementation, Go-API, Go-performance, Go-concurrency]
      risk_classes: [language-semantics, concurrency, performance]

  - id: lens-python
    title: Python language lens
    activation_evidence:
      - affected production code is Python and interpreter/version/dependency matrix is known
    default_bias:
      - use standard data-model protocols only when consumers need their conventional semantics
      - choose representation by operations, ownership, mutability, text/bytes boundary, and workload
      - prefer functions or composition when behavior has no independent mutable state
      - select direct duck typing, static Protocol, ABC, or concrete coupling by enforcement and consumer need
      - treat annotations as static communication, not runtime validation or performance
      - stream only when single-pass deferred behavior and resource lifetime fit
      - escalate property, decorator, descriptor, subclass hook, and metaclass mechanisms only for demonstrated repeated/framework needs
      - choose threads, processes, or async from current interpreter/dependency/workload evidence; keep event loops nonblocking and concurrency bounded
    emphasize_concepts:
      - implementation-repository-language-conformance
      - implementation-representation-fit
      - performance-earned-bounded-concurrency
      - performance-resource-lifecycle
      - performance-cache-validity
    modify_decisions:
      - public attributes can evolve compatibly into properties when actual validation/computation appears
      - operator, equality, hash, iteration, context, and representation methods must obey Python's conventional algebra
    contraindications:
      - metaprogramming for one-off application behavior
      - mutable defaults, hidden aliasing, blocking calls in event-loop paths, unbounded memoization
    current-verification_required:
      - supported Python implementations and versions
      - typing/tool behavior and dependency API versions
      - GIL/threading, cached_property, async, and runtime semantics that may have changed since the source edition
    routing:
      roles: [coding-agent, performance-agent, review-agent, architecture-agent]
      tasks: [Python-implementation, Python-API, Python-performance, Python-concurrency]
      risk_classes: [language-semantics, dynamic-behavior, concurrency, performance]
