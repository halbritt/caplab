          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Unifying an Elephant", contribution: "Shows both the attraction and the failure risk of forcing multiple viewpoints into one supposedly unified model.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD directly examines the unified-model position rather than assuming it is always attainable."}
      - id: bounded-models
        claim: Multiple internally coherent models preserve distinct meanings, rules, ownership, and evolution.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Catering to Special Needs with Distinct Models", contribution: "Supports distinct bounded models where one representation cannot remain coherent across specialized needs.", relationship: direct_support}
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/024-chapter-16-adaptation.md :: Information Architecture", contribution: "Adds operational and data-interchange evidence for plural contexts - each group defines customer differently with different lifecycles and permissions, so federated zones of authority exchanging common representations beat a single system of record.", relationship: corroboration}
        basis: {kind: source-supported, rationale: "DDD directly supports distinct models at demonstrated semantic discontinuities; Release It! corroborates from operational data interchange."}
    hidden_assumptions:
      - Unification assumes terms and invariants are genuinely the same and shared governance is affordable.
      - Bounded models assume translation and duplication cost less than a compromised universal model.
    evidence_favoring_each_position:
      unified-model: [same language and invariants, high cross-context atomicity, one owner, low semantic variation]
      bounded-models: [term/rule conflict, distinct expert groups, independent cadence, legacy/external model, specialized performance model]
    decision_rule: Attempt unification only within a scope where one language and model remain coherent; preserve distinct models across demonstrated semantic discontinuities and choose an explicit relationship for every necessary crossing.
