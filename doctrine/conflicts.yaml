        claim: Let independently owned event handlers react without a central workflow controller.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Broker Topology", contribution: "Describes broker topology as decentralized event choreography without a central workflow mediator.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "FSA directly formulates broker-based choreography and its coordination tradeoffs."}
      - id: orchestration
        claim: Give one mediator explicit responsibility for workflow state, ordering, compensation, and completion.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Mediator Topology", contribution: "Describes mediator topology as centralized coordination of event workflow and process state.", relationship: direct_support}
