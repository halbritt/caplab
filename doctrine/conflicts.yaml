      - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/015-chapter-9-interconnect.md :: Solutions at Different Scales"}

  - conflict_id: conflict-synchronous-vs-asynchronous-interaction
    disagreement_kind: contextual
    positions:
      - id: synchronous
        claim: Direct request/response preserves simple causal completion and immediate failure propagation.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Choosing Between Request-Based and Event-Based", contribution: "Describes request-based interaction as a direct response and completion model with simpler causal flow.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "FSA directly compares request-based and event-based interaction."}
      - id: asynchronous
        claim: Events or queues can isolate availability, shape load, and support independent temporal progress.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Choosing Between Request-Based and Event-Based", contribution: "Describes event-based interaction as temporally decoupled progress with different responsiveness and availability tradeoffs.", relationship: direct_support}
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Decoupling Middleware", contribution: "Weights the stability axis toward asynchrony - message-oriented middleware decouples endpoints in space and time and cannot produce cascading failure, while synchronous request/reply amplifies shocks - while conceding asynchronous design is inherently harder and the choice is a nearly irreversible early decision.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "FSA directly compares event-based and request-based interaction; Release It! adds stability-weighted support for asynchronous decoupling."}
    hidden_assumptions:
      - Synchronous interaction assumes latency and availability coupling are acceptable.
      - Asynchronous interaction assumes completion, ordering, retries, idempotency, replay, and reconciliation can be owned.
    evidence_favoring_each_position:
      synchronous: [caller needs immediate result, atomicity, low latency path, manageable dependency availability]
      asynchronous: [load smoothing, long work, partial availability, event semantics, explicit eventual consistency]
    decision_rule: Choose from response timing, atomicity, coupling, load shape, loss/retry semantics, and recovery ownership; do not treat topology as the decision.
    unresolved_questions: [Hybrid workflows often require explicit phase boundaries and dual failure models.]
    roles_affected: [architecture-agent, coding-agent, debugging-and-repair-agent, review-agent]
    related_concepts: [architecture-event-temporal-semantics, architecture-interaction-synchrony]
    source_support:
      - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Choosing Between Request-Based and Event-Based"}
      - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Decoupling Middleware"}

  - conflict_id: conflict-concurrency-vs-sequential-simplicity
    disagreement_kind: contextual
    positions:
