  - conflict_id: conflict-shared-kernel-vs-acl-vs-conformist
    disagreement_kind: contextual
    positions:
      - id: shared-kernel
        claim: Jointly own a small stable overlap when teams can coordinate every change closely.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Shared Kernel", contribution: "Defines a small jointly owned model subset whose changes require close coordination between teams.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD directly defines Shared Kernel and its cooperation obligations."}
      - id: anticorruption-layer
        claim: Translate between materially different models to protect valuable local semantics.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Anticorruption Layer", contribution: "Defines an owned translation layer that protects a local model from an external model's semantics.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD directly defines Anticorruption Layer and its model-protection tradeoff."}
      - id: conformist
        claim: Adopt an upstream model when leverage is absent and local translation has insufficient value.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Conformist", contribution: "Defines conforming to an upstream model when the downstream team lacks influence and a separate translation model has insufficient payoff.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD directly defines Conformist as a deliberate relationship under asymmetric control."}
    hidden_assumptions:
      - Shared Kernel assumes high trust, synchronized change, and truly shared semantics.
      - Anticorruption Layer assumes local model value repays translation and operational cost.
      - Conformist assumes upstream semantics are adequate and dependency risk is accepted.
    evidence_favoring_each_position:
      shared-kernel: [small overlap, strong cooperation, aligned cadence, shared tests, mutual influence]
      anticorruption-layer: [semantic mismatch, valuable local core, necessary integration, controlled translation ownership]
      conformist: [no upstream influence, acceptable model, low differentiating value, translator cost exceeds benefit]
    decision_rule: Select relationship from control, cooperation, semantic distance, local strategic value, and integration economics; never choose from diagram symmetry or reuse desire alone.
    unresolved_questions: [Relationships can change as leverage, trust, and strategic importance evolve.]
