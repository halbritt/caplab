schema_version: agent-doctrine-conflicts/1
interpretation: Conflict records preserve incompatible recommendations until repository evidence selects a position. A decision rule is not permission to execute the selected change.
conflicts:
  - conflict_id: conflict-deep-modules-vs-small-units
    disagreement_kind: contextual
    positions:
      - id: deep-module
        claim: Concentrate related complexity behind a small stable interface so callers reason locally.
        source_support:
          - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/009-4-modules-should-be-deep.md :: 4: Modules Should Be Deep", contribution: "Defines module depth as substantial hidden functionality behind a comparatively simple interface.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "APOSD directly advances the deep-module position."}
      - id: small-unit
        claim: Extract small cohesive routines or classes so each operation has one clear purpose and can be changed or tested independently.
        source_support:
          - {source_id: SRC-CC, locator: "books/code-complete-2nd-edition-v413hav/chapters/013-chapter-7-high-quality-routines.md :: 7.1 Valid Reasons to Create a Routine", contribution: "Supports extraction when a routine creates a cohesive abstraction, hides detail, or isolates change.", relationship: direct_support}
          - {source_id: SRC-REF, locator: "books/refactoring-improving-the-design-of-existing-code/chapters/007-chapter-3-bad-smells-in-code.md :: Long Method", contribution: "Corroborates smaller focused operations as a response to long methods when extraction improves understanding.", relationship: corroboration}
        basis: {kind: source-supported, rationale: "CC and Refactoring directly support cohesive extraction, subject to an earned seam."}
    hidden_assumptions:
      - Deep-module advice assumes hidden functionality remains semantically cohesive and the interface actually simplifies callers.
      - Small-unit advice assumes extraction creates meaningful concepts rather than navigation and pass-through cost.
    evidence_favoring_each_position:
      deep-module: [many callers repeat policy or knowledge, interface cost dominates, extracted units would leak the same decision]
      small-unit: [responsibilities evolve independently, extraction creates a stable named seam, tests or ownership need isolation]
    decision_rule: Compare caller simplification and hidden benefit against interface, navigation, change, and review cost; select the smallest number of cohesive units that minimizes total reasoning and change amplification, not a target size.
    unresolved_questions: [How module depth should be measured across languages and repository scales remains contextual.]
    roles_affected: [coding-agent, architecture-agent, refactoring-agent, review-agent]
    related_concepts: [refactoring-smells-as-hypotheses, universal-local-reasoning, legacy-current-work-responsibility-discovery, testing-humble-object-testability-split]
    source_support:
      - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/009-4-modules-should-be-deep.md :: 4: Modules Should Be Deep"}
      - {source_id: SRC-CC, locator: "books/code-complete-2nd-edition-v413hav/chapters/013-chapter-7-high-quality-routines.md :: 7.1 Valid Reasons to Create a Routine"}
      - {source_id: SRC-REF, locator: "books/refactoring-improving-the-design-of-existing-code/chapters/007-chapter-3-bad-smells-in-code.md :: Long Method"}

  - conflict_id: conflict-abstraction-vs-duplication
    disagreement_kind: contextual
    positions:
      - id: abstract-shared-knowledge
        claim: Centralize one authoritative piece of knowledge so a conceptual change has one implementation authority.
        source_support:
          - {source_id: SRC-PP, locator: "books/the-pragmatic-programmer/chapters/007-chapter-2-a-pragmatic-approach.md :: The Evils of Duplication", contribution: "Treats duplicated knowledge as multiple authorities that can diverge under change.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "The Pragmatic Programmer directly supports centralizing one knowledge authority."}
      - id: tolerate-local-duplication
        claim: Keep similar code local when semantics, owners, contexts, or future change can diverge.
        source_support:
          - {source_id: SRC-SDX, locator: "books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/008-chapter-3-coupling-in-time-a-heuristic-for-the-concept-of-surprise.md :: The Dirty Secret of Copy-Paste", contribution: "Uses actual co-change to distinguish clones that share evolution from similar code that changes independently.", relationship: refinement}
        basis: {kind: source-supported, rationale: "Software Design X-Rays conditions consolidation on observed shared evolution rather than syntax."}
    hidden_assumptions:
      - Abstraction assumes the duplicated material represents the same knowledge and will coevolve.
      - Duplication assumes the extra edit/review burden is lower than coordination and interface cost.
    evidence_favoring_each_position:
      abstract-shared-knowledge: [same invariant or policy, repeated coordinated changes, stable shared contract, one legitimate owner]
      tolerate-local-duplication: [different bounded contexts, independent release or ownership, syntax-only similarity, abstraction needs conditionals or parameter flags]
    decision_rule: Abstract only when semantic identity and coevolution are demonstrated and the shared interface reduces total change/reasoning cost; otherwise retain local duplication and record the revisit trigger.
    unresolved_questions: [How many examples are needed depends on reversal cost and semantic stability, not a universal count.]
    roles_affected: [coding-agent, architecture-agent, refactoring-agent, review-agent]
    related_concepts: [architecture-change-locality-cohesion, architecture-framework-commitment, universal-earned-abstraction, implementation-duplication-as-evidence]
    source_support:
      - {source_id: SRC-PP, locator: "books/the-pragmatic-programmer/chapters/007-chapter-2-a-pragmatic-approach.md :: The Evils of Duplication"}
      - {source_id: SRC-SDX, locator: "books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/008-chapter-3-coupling-in-time-a-heuristic-for-the-concept-of-surprise.md :: The Dirty Secret of Copy-Paste"}

  - conflict_id: conflict-dependency-inversion-vs-direct-coupling
    disagreement_kind: contextual
    positions:
      - id: invert-dependency
        claim: Protect stable policy from volatile details through an abstraction controlled by the consumer.
        source_support:
          - {source_id: SRC-CA, locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/020-chapter-11-dip-the-dependency-inversion-principle.md :: STABLE ABSTRACTIONS", contribution: "Advances stable abstractions and dependency direction that protect policy from volatile details.", relationship: direct_support}
          - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/034-chapter-25-dependency-breaking-techniques.md :: Extract Interface", contribution: "Supplies interface extraction as a dependency-breaking seam when a concrete dependency blocks safe change.", relationship: refinement}
          - source_id: "SRC-100GO"
            locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.6 #6: Interface on the producer side"
            contribution: "Locates the minimal behavioral interface with the consuming package, supplying Go-specific support for consumer-controlled inversion when an actual consumer contract exists."
            relationship: "refinement"
        basis: {kind: source-supported, rationale: "Clean Architecture supplies the policy argument and WELC supplies a constrained legacy mechanism."}
      - id: direct-dependency
        claim: Keep one stable implementation directly coupled until independent evolution or substitution earns indirection.
        source_support:
          - source_id: "SRC-100GO"
            locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.5 #5: Interface pollution"
            contribution: "Treats an interface without common behavior, actual decoupling, or intentional restriction as pollution, directly supporting continued concrete coupling until abstraction pressure exists."
            relationship: "direct_support"
        basis: {kind: source-supported, rationale: "100 Go Mistakes directly supports retaining a concrete dependency when an interface does not improve current consumers; the position remains conditional on shared lifecycle and volatility evidence."}
    hidden_assumptions:
      - Inversion assumes stable policy can be separated cleanly and the abstraction will not mirror the detail.
      - Direct coupling assumes the dependency shares lifecycle, authority, and volatility with its consumer.
    evidence_favoring_each_position:
      invert-dependency: [asymmetric volatility, multiple implementations, deployment or ownership boundary, legacy interception, stable policy/mechanism split]
      direct-dependency: [one controlled implementation, coordinated change, wrapper would pass through, substitution exists only for a mock]
    decision_rule: Name the protected policy and coupling dimension; introduce the least costly seam whose protection exceeds its interface and lifecycle cost, otherwise retain direct coupling.
    unresolved_questions: [Future volatility can be estimated but never established solely by architectural taste.]
    roles_affected: [architecture-agent, coding-agent, legacy-code-agent, review-agent]
    related_concepts: [architecture-dependency-inversion-gate, refactoring-compatibility-migration]
    source_support:
      - {source_id: SRC-CA, locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/020-chapter-11-dip-the-dependency-inversion-principle.md :: STABLE ABSTRACTIONS"}
      - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/034-chapter-25-dependency-breaking-techniques.md :: Extract Interface"}
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.6 #6: Interface on the producer side"
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.5 #5: Interface pollution"

  - conflict_id: conflict-domain-purity-vs-implementation-simplicity
    disagreement_kind: contextual
    positions:
      - id: protect-domain-model
        claim: Keep domain language, policy, and invariants free from contingent infrastructure representations.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: The Domain Layer Is Where the Model Lives", contribution: "Locates the domain model in an isolated layer protected from application and infrastructure concerns.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD directly supports isolation where a domain model carries material policy."}
      - id: accept-direct-implementation
        claim: Use simple transaction scripts, framework representations, or direct data operations when a rich model adds translation and ceremony without value.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: The Smart UI \"Anti-Pattern\"", contribution: "Describes a direct Smart UI approach as a viable tradeoff for simple applications despite its limits for rich domain logic.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD explicitly preserves a simpler direct option for systems whose domain complexity does not repay modeling."}
    hidden_assumptions:
      - Purity assumes domain complexity and lifespan repay modeling and translation costs.
      - Simplicity assumes rules are shallow, stable, or adequately expressed in direct workflows.
    evidence_favoring_each_position:
      protect-domain-model: [business-critical rule complexity, recurring semantic errors, multiple workflows, expert language, model breakthrough potential]
      accept-direct-implementation: [simple CRUD, short-lived product, infrastructure-heavy logic, weak expert feedback, translation dominates behavior]
    decision_rule: Invest in model isolation only where domain decisions and invariant density create demonstrated reasoning leverage; choose the simplest direct form elsewhere and keep operational constraints visible.
    unresolved_questions: [A domain may move between these conditions as product knowledge grows.]
    roles_affected: [architecture-agent, coding-agent, review-agent, refactoring-agent]
    related_concepts: [architecture-policy-mechanism-separation, domain-modeling-investment-gate, testing-output-based-style-preference]
    source_support:
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: The Domain Layer Is Where the Model Lives"}
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/005-chapter-4-isolating-the-domain.md :: The Smart UI \"Anti-Pattern\""}

  - conflict_id: conflict-upfront-vs-evolutionary-architecture
    disagreement_kind: methodological
    positions:
      - id: decide-up-front
        claim: Resolve high-cost, safety-critical, procurement, data, or topology decisions before implementation makes them expensive or impossible.
        source_support:
          - {source_id: SRC-CC, locator: "books/code-complete-2nd-edition-v413hav/chapters/008-chapter-3-measure-twice-cut-once-upstream-prerequisites.md :: Iterative Approaches' Effect on Prerequisites", contribution: "Retains consequential upstream prerequisites even when development is iterative.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Code Complete directly argues that iteration does not remove every early consequential decision."}
      - id: evolve-from-feedback
        claim: Delay reversible decisions and evolve structure through implementation, domain, and runtime feedback.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/003-preface-invalidating-axioms.md :: Axiom", contribution: "Rejects timeless architecture axioms in favor of contextual tradeoff analysis.", relationship: direct_support}
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/019-chapter-17-bringing-the-strategy-together.md :: The plan must allow for evolution", contribution: "Requires strategic design plans to absorb learning and permit evolution.", relationship: corroboration}
        basis: {kind: source-supported, rationale: "FSA and DDD independently support architecture evolution from contextual feedback."}
    hidden_assumptions:
      - Up-front design assumes drivers and consequences are knowable before delivery.
      - Evolution assumes feedback arrives before the last responsible moment and reversal remains affordable.
    evidence_favoring_each_position:
      decide-up-front: [irreversible commitment, regulatory proof, safety boundary, durable schema/protocol, long procurement lead, catastrophic failure cost]
      evolve-from-feedback: [uncertain product/domain, reversible structure, cheap experiment, unvalidated scale, rapid convergence]
    decision_rule: Classify decisions by reversibility, consequence, information value, and decision deadline; decide only the irreversible/high-consequence minimum early and establish feedback plus revisit triggers for the rest.
    unresolved_questions: [The last responsible moment is repository- and market-specific.]
    roles_affected: [architecture-agent, coding-agent, repository-assessment-agent]
    related_concepts: [architecture-feedback-loop, architecture-selective-option-preservation, domain-fitting-large-scale-structure, universal-no-change-option]
    source_support:
      - {source_id: SRC-CC, locator: "books/code-complete-2nd-edition-v413hav/chapters/008-chapter-3-measure-twice-cut-once-upstream-prerequisites.md :: Iterative Approaches' Effect on Prerequisites"}
      - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/003-preface-invalidating-axioms.md :: Axiom"}
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/019-chapter-17-bringing-the-strategy-together.md :: The plan must allow for evolution"}

  - conflict_id: conflict-generalized-reuse-vs-local-clarity
    disagreement_kind: contextual
    positions:
      - id: generalized-reuse
        claim: A reusable mechanism can amortize design and maintenance across stable consumers.
        source_support:
          - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/017-chapter-15-distillation.md :: Generic Subdomains", contribution: "Supports reuse or acquisition of stable generic capabilities that are not the differentiating core domain.", relationship: refinement}
          - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/011-6-general-purpose-modules-are-deeper.md :: 6: General-Purpose Modules are Deeper", contribution: "Argues that appropriately general-purpose mechanisms can provide deeper, simpler interfaces across current uses.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "DDD and APOSD support reuse when a stable common mechanism is demonstrated."}
      - id: local-clarity
        claim: Direct purpose-built code preserves context and avoids a lowest-common-denominator interface.
        source_support:
          - source_id: "SRC-100GO"
            locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.9 #9: Being confused about when to use generics"
            contribution: "Recommends introducing generics for demonstrated type variation or imminent repeated boilerplate rather than speculative future reuse, directly supporting local clarity before earned generalization."
            relationship: "direct_support"
        basis: {kind: source-supported, rationale: "100 Go Mistakes directly supports the local-purpose position until present type variation or repeated boilerplate earns generalization."}
    hidden_assumptions:
      - Reuse assumes multiple proven consumers share semantics and lifecycle.
      - Local clarity assumes duplicated evolution and inconsistent fixes remain affordable.
    evidence_favoring_each_position:
      generalized-reuse: [multiple current consumers, stable common policy, coordinated governance, extension/replacement economics]
      local-clarity: [one consumer, diverging contexts, release independence, generic API needs flags or callbacks, speculative framework]
    decision_rule: Generalize only the stable semantic core demonstrated across current consumers; leave context-specific policy local and treat framework extraction as a separate lifecycle commitment.
    unresolved_questions: [Consumer count is not enough without semantic and governance alignment.]
    roles_affected: [coding-agent, architecture-agent, review-agent]
    related_concepts: [universal-earned-abstraction, implementation-duplication-as-evidence]
    source_support:
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/017-chapter-15-distillation.md :: Generic Subdomains"}
      - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/011-6-general-purpose-modules-are-deeper.md :: 6: General-Purpose Modules are Deeper"}
      - source_id: "SRC-100GO"
        locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/006-chapter-2-code-and-project-organization.md :: 2.9 #9: Being confused about when to use generics"

  - conflict_id: conflict-temporary-seam-vs-long-term-design
    disagreement_kind: contextual
    positions:
      - id: temporary-seam
        claim: A minimal interception point can make an urgent legacy change protectable without redesigning the system.
        source_support:
          - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/011-chapter-4-the-seam-model.md :: Seams", contribution: "Defines seams and enabling points as controlled ways to vary behavior without redesigning the target logic.", relationship: direct_support}
          - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/014-chapter-6-i-don-t-have-much-time-and-i-have-to-change-it.md :: Summary", contribution: "Corroborates sprout and wrap techniques as bounded ways to create testable change under time pressure.", relationship: corroboration}
        basis: {kind: source-supported, rationale: "WELC directly supports provisional dependency-breaking structures for safe change."}
      - id: durable-boundary
        claim: Production indirection should meet long-term API, encapsulation, ownership, and operability standards.
        source_support: []
        basis: {kind: local-policy, rationale: "The durable-boundary standard comes from this doctrine's repository contract and lifecycle obligations, not a direct claim in the cited WELC sections."}
    hidden_assumptions:
      - Temporary seams assume the short-term risk reduction exceeds added complexity and reassessment will occur.
      - Durable design assumes enough behavior and time are known to choose the lasting boundary safely.
    evidence_favoring_each_position:
      temporary-seam: [required change blocked by dependency, weak feedback, deadline, narrow enabling point, explicit provisional status]
      durable-boundary: [repeated use, stable independent responsibility, multiple consumers, long lifespan, public or security-sensitive surface]
    decision_rule: Use the smallest controlled seam that creates feedback; declare its production default and lifecycle, then promote or remove it based on repeated pressure rather than omission.
    unresolved_questions: [Some safe seams are also good permanent boundaries; status must remain explicit until reviewed.]
    roles_affected: [legacy-code-agent, refactoring-agent, coding-agent, review-agent]
    related_concepts: [legacy-seams-and-enabling-points, legacy-provisional-dependency-break, legacy-sprout-wrap, testing-shared-dependency-substitution, testing-mock-unmanaged-dependencies-only, testing-testability-as-design-signal, testing-no-test-privileged-access]
    source_support:
      - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/011-chapter-4-the-seam-model.md :: Seams"}
      - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/014-chapter-6-i-don-t-have-much-time-and-i-have-to-change-it.md :: Summary"}

  - conflict_id: conflict-comments-vs-self-documenting-structure
    disagreement_kind: substantive
    positions:
      - id: improve-code-first
        claim: Names and structure should make operations obvious; comments that narrate code rot and mask poor design.
        source_support:
          - {source_id: SRC-CC, locator: "books/code-complete-2nd-edition-v413hav/chapters/043-chapter-32-self-documenting-code.md :: Repeat of the Code", contribution: "Rejects comments that merely restate implementation and favors clearer executable structure.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Code Complete directly supports improving code rather than narrating it."}
      - id: preserve-nonobvious-information
        claim: Comments carry contract, rationale, invariants, units, ownership, and cross-module information code cannot state economically.
        source_support:
          - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/018-13-comments-should-describe-things-that-arent-obvious-from-the-code.md :: 13: Comments Should Describe Things that Aren’t Obvious from the Code", contribution: "Assigns comments responsibility for non-obvious contracts, rationale, invariants, and cross-module information.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "APOSD directly supports comments that preserve information code cannot express clearly."}
    hidden_assumptions:
      - Code-first assumes the information is expressible locally in executable structure.
      - Comment support assumes maintenance keeps prose adjacent and authoritative.
    evidence_favoring_each_position:
      improve-code-first: [comment repeats statements, renaming or extraction removes it, prose contradicts current code]
      preserve-nonobvious-information: [why rather than what, external constraint, informal contract, invariant, deliberate tradeoff, surprising limitation]
    decision_rule: First improve safe local structure; retain concise comments for verified information not obvious from the code, place them at the authority boundary, and test or review drift where consequential.
    unresolved_questions: [Some languages can encode contracts directly; others need prose.]
    roles_affected: [coding-agent, review-agent, refactoring-agent]
    related_concepts: [refactoring-smells-as-hypotheses, implementation-non-obvious-commentary, implementation-comments-first-design-probe]
    source_support:
      - {source_id: SRC-CC, locator: "books/code-complete-2nd-edition-v413hav/chapters/043-chapter-32-self-documenting-code.md :: Repeat of the Code"}
      - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/018-13-comments-should-describe-things-that-arent-obvious-from-the-code.md :: 13: Comments Should Describe Things that Aren’t Obvious from the Code"}

  - conflict_id: conflict-performance-specialization-vs-abstraction
    disagreement_kind: contextual
    positions:
      - id: preserve-abstraction
        claim: Maintain clear general interfaces and representations to contain complexity and change.
        source_support:
          - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/025-20-designing-for-performance.md :: 20: Designing for Performance", contribution: "Argues that clean high-level design and performance are often compatible and that complexity should not be added without evidence.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "APOSD directly preserves design clarity as the default performance posture."}
      - id: specialize-hot-path
        claim: A measured critical path may need direct data layout, fused work, batching, or specialized code.
        source_support:
          - {source_id: SRC-EGO, locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/014-chapter-10-optimization-examples.md :: Optimize One Thing at a Time", contribution: "Supports a measured, isolated optimization of one causal bottleneck at a time.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Efficient Go directly supports bounded specialization after measurement."}
    hidden_assumptions:
      - Abstraction assumes its overhead is immaterial to the target.
      - Specialization assumes representative measurement and semantic equivalence are reliable.
    evidence_favoring_each_position:
      preserve-abstraction: [target already met, path cold, effect within noise, specialization duplicates policy, operational cost rises]
      specialize-hot-path: [profiled causal bottleneck, target miss, significant repeatable gain, narrow containment, equivalence and regression gates]
    decision_rule: Specialize only the measured critical path, hide it behind the existing semantic boundary when possible, compare end-to-end resource effects, and remove it when gain no longer clears complexity cost.
    unresolved_questions: [Hardware and runtime changes can reverse the tradeoff.]
    roles_affected: [performance-agent, coding-agent, review-agent, architecture-agent]
    related_concepts: [performance-measurable-objective, performance-specialization-evidence, universal-earned-abstraction]
    source_support:
      - {source_id: SRC-EGO, locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/014-chapter-10-optimization-examples.md :: Optimize One Thing at a Time"}
      - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/025-20-designing-for-performance.md :: 20: Designing for Performance"}

  - conflict_id: conflict-broad-redesign-vs-incremental-transformation
    disagreement_kind: methodological
    positions:
      - id: broad-redesign
