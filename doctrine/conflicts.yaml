      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Conformist"}

  - conflict_id: conflict-fault-tolerance-vs-let-it-crash
    disagreement_kind: contextual
    positions:
      - id: fault-tolerant-containment
        claim: Catch faults and contain the resulting errors in place so components degrade or recover without losing service continuity.
        source_support:
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md :: Chain of Failure", contribution: "Records the fault-tolerance camp's position - create fault-tolerant software that catches exceptions and contains the resulting errors before they become failures - alongside the camps' common ground that faults will happen and must be kept from becoming errors.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Release It! records the fault-tolerance camp as one of two positions in a community split it deliberately does not resolve."}
      - id: let-it-crash-restart
        claim: Error recovery is difficult and unreliable, so crash a bounded component and restart from a clean known state under supervision.
        source_support:
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Let It Crash", contribution: "Advances crash-and-restart under four preconditions - limited crash granularity, replacement measured in milliseconds, hierarchical supervision distinct from the service consumer, and automatic reintegration - and explicitly disqualifies slow-starting monolithic processes.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Release It! directly formulates let-it-crash with its preconditions and restart-density escalation rule."}
    hidden_assumptions:
      - Containment assumes recovery code can actually return the component to a trustworthy state after an unexpected error.
      - Let-it-crash assumes a crash boundary, fast replacement, supervision, and reintegration exist; without them a crash is an outage.
    evidence_favoring_each_position:
      fault-tolerant-containment: [slow-starting or monolithic processes, unreplicated in-process state, no supervisor exists, error classes with well-understood safe recovery, availability contract forbids visible restarts]
      let-it-crash-restart: [bounded crash granularity, restart measured in milliseconds, supervisor distinct from the consumer, automatic reintegration into pools or discovery, error recovery paths that are untested or untrustworthy]
    decision_rule: Choose per component from the let-it-crash preconditions - crash granularity, replacement speed, supervision, and reintegration; where all four hold, restart from known state beats in-place recovery, and where any fails, invest in containment and explicit recovery; supervisors must escalate when restarts are too dense rather than restart forever.
    unresolved_questions: [Mixed systems need a per-boundary decision, and in-flight work at crash time needs an explicit durability contract either way.]
    roles_affected: [architecture-agent, coding-agent, debugging-and-repair-agent, review-agent]
    related_concepts: [operations-designed-failure-modes, implementation-fail-fast-or-recover]
    source_support:
      - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/008-chapter-3-stabilize-your-system.md :: Chain of Failure"}
      - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/010-chapter-5-stability-patterns.md :: Let It Crash"}

  - conflict_id: conflict-live-control-vs-immutable-replacement
    disagreement_kind: contextual
    positions:
      - id: live-runtime-control
        claim: Instances need pre-built, scriptable, access-restricted control interfaces for targeted runtime intervention - resetting breakers, resizing pools, disabling integrations, reloading configuration, draining load.
        source_support:
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md :: Command and Control", contribution: "Prescribes scriptable admin interfaces on non-public ports for targeted runtime intervention, scoped to slow-starting instances where full restarts under load take hours.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Release It! directly prescribes live control surfaces for slow-starting instances."}
      - id: immutable-replacement
        claim: Instances are disposable images built from known state; changes ship as new images and outdated instances are deleted, never mutated in place.
        source_support:
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Automated Deployments", contribution: "Presents the immutable-infrastructure position - convergence from an unknown accumulated state never reliably works, so always start from a known master image, inject configuration at startup, and delete outdated machines instead of mutating them.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Release It! directly presents the immutable-infrastructure camp's argument against in-place convergence."}
    hidden_assumptions:
      - Live control assumes the intervention surface is rehearsed, secured, and cheaper than replacement given slow startup.
      - Immutable replacement assumes fast image build and boot, externalized state and configuration, and a platform that reschedules work.
    evidence_favoring_each_position:
      live-runtime-control: [instance startup or warm-up measured in many minutes, working sets that take long to reload, stateful services where replacement loses expensive context, incidents resolved by targeted reconfiguration]
      immutable-replacement: [startup measured in seconds, externalized state and configuration, platform-managed scheduling and discovery, configuration drift or unreproducible machine state as a recurring failure]
    decision_rule: Decide per service from measured startup and warm-up time and state externalization - fast-restarting stateless instances are replaced rather than controlled, slow-starting or expensive-warm-up instances earn a scripted control surface; never build both a mutable pet and an immutable image pipeline for the same instance class.
    unresolved_questions: [Warm-up time can dominate boot time for cache-heavy services, moving them back toward live control even on fast platforms.]
    roles_affected: [architecture-agent, debugging-and-repair-agent, review-agent]
    related_concepts: [operations-runtime-control-surface, operations-ephemeral-instance-design]
    source_support:
      - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/016-chapter-10-control-plane.md :: Command and Control"}
      - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/020-chapter-13-design-for-deployment.md :: Automated Deployments"}

  - conflict_id: conflict-efficiency-vs-resilience-margin
    disagreement_kind: contextual
    positions:
      - id: efficient-utilization
        claim: Capacity and resources should be used efficiently against measured objectives; symmetric overprovisioning and idle margin are capital costs that need justification.
        source_support:
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/009-chapter-4-stability-antipatterns.md :: Unbalanced Capacities", contribution: "Rejects evenly matched front-end and back-end capacity as a gross misuse of capital, requiring resilience mechanisms rather than symmetric overprovisioning to absorb demand mismatches.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Release It! itself argues against overprovisioning as the answer to capacity mismatch, anchoring the efficiency side from within the same source."}
      - id: retain-resilience-margin
        claim: Systems optimized toward maximal utilization and specialization drift toward their safety boundary and fail abruptly; deliberately retained margin, flexibility, and routine tolerable stress are required for resilience.
        source_support:
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/025-chapter-17-chaos-engineering.md :: Antecedents of Chaos Engineering", contribution: "Imports drift-into-failure - economic plus workload pressure push systems toward the safety boundary - and the regulator paradox - a well-working protection stops producing evidence of its own quality - observing that highly efficient systems break all at once.", relationship: direct_support}
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/024-chapter-16-adaptation.md :: Team-Scale Autonomy", contribution: "Argues full utilization slows flow and value-stream optimization specializes the system to today's tasks at the cost of future flexibility.", relationship: refinement}
          - source_id: "SRC-CIG"
            locator: "books/concurrency-in-go/chapters/009-chapter-5-concurrency-at-scale.md :: Replicated Requests"
            contribution: "Makes the resilience side's resource cost explicit: replicated requests trade additional handler and downstream capacity for tail-latency and fault-tolerance margin and require cancellation of losing work."
            relationship: "refinement"
        basis: {kind: source-supported, rationale: "Release It! directly advances retained margin and routine tolerable stress as the counterweight to efficiency-driven drift."}
    hidden_assumptions:
      - Efficiency assumes demand and failure behavior stay near their measured envelope so consumed headroom is never suddenly needed.
      - Margin assumes its carrying cost is affordable and that retained slack will actually absorb the disruption classes that matter.
    evidence_favoring_each_position:
      efficient-utilization: [measured stable demand, failure cost limited to rework rather than service obligation, cost objectives with owners, resilience mechanisms - shedding breakers back pressure - already protecting the boundary]
      retain-resilience-margin: [utilization trending toward the limit under cost pressure, abrupt-collapse failure history, service obligations whose violation outweighs the margin's carrying cost, protection mechanisms no longer producing evidence they work]
    decision_rule: Name availability margin as an explicit quality attribute with an owner and a floor before pursuing utilization or efficiency objectives toward the limit; efficiency work may consume headroom only down to that owned floor, and quiet periods count as missing evidence - not proof of safety - under the regulator paradox.
    unresolved_questions: [How much margin a given service class needs is repository- and obligation-specific, and the tradeoff moves as platforms make capacity more elastic.]
    roles_affected: [performance-agent, architecture-agent, review-agent, repository-assessment-agent]
