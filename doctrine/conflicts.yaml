  - conflict_id: conflict-monolith-vs-distributed-services
    disagreement_kind: contextual
    positions:
      - id: modular-monolith
        claim: In-process modules minimize latency, consistency, deployment, and operational costs while preserving semantic boundaries.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/015-chapter-9-foundations.md :: Monolithic Versus Distributed Architectures", contribution: "Identifies lower network, consistency, deployment, and operational costs of monolithic topology.", relationship: direct_support}
          - {source_id: SRC-CA, locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/038-chapter-27-services-great-and-small.md :: THE DECOUPLING FALLACY", contribution: "Corroborates that service boundaries do not by themselves create semantic decoupling.", relationship: corroboration}
          - {source_id: SRC-RI, locator: "books/release-it-design-and-deploy-production-ready-software-pdfdrive/chapters/015-chapter-9-interconnect.md :: Solutions at Different Scales", contribution: "Corroborates the operational-cost side - dynamic service discovery pays off only with many services, high instance churn, and a platform team, while small low-change estates are better served by static DNS with logical names; distribution's supporting services are themselves operational surface area.", relationship: corroboration}
        basis: {kind: source-supported, rationale: "FSA compares topology costs directly, Clean Architecture limits unsupported service-decoupling claims, and Release It! corroborates the operational surface area of distribution-support services."}
      - id: distributed-services
        claim: Independent processes can satisfy required scale, isolation, technology, release, ownership, or geographic drivers.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/015-chapter-9-foundations.md :: Monolithic Versus Distributed Architectures", contribution: "Identifies independent deployment, elasticity, isolation, and other drivers that can favor distributed topology.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "The FSA comparison directly attributes distinct benefits and costs to distribution."}
    hidden_assumptions:
      - Monolith assumes one operational and consistency envelope remains adequate.
      - Distribution assumes the organization can own partial failure, data authority, contracts, observability, security, and recovery.
    evidence_favoring_each_position:
      modular-monolith: [shared transaction, synchronous workflow, one team/release, insufficient operations capability, low latency]
      distributed-services: [irreducible isolation or scale, independent release ownership, geographic boundary, distinct trust zone, mature operations]
    decision_rule: Prefer the least distributed topology meeting current drivers; distribute only the flows for which a hard driver and operational readiness exceed network, data, and coordination cost.
    unresolved_questions: [A modular monolith can be an end state or a staging state; do not assume either.]
    roles_affected: [architecture-agent, performance-agent, review-agent]
    related_concepts: [architecture-earned-boundary, architecture-boundary-strength, architecture-modular-monolith, architecture-distribution-readiness, architecture-contextual-style-selection, architecture-team-topology-force, domain-bounded-context]
    source_support:
