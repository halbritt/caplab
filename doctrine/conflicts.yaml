            contribution: "Supports channel-based coordination and ownership transfer for concurrent work while leaving the choice conditional on workload, lifecycle, and current runtime evidence."
            relationship: "refinement"
        basis: {kind: source-supported, rationale: "Efficient Go and Fluent Python directly support conditional concurrency model selection."}
      - id: sequential
        claim: Sequential execution minimizes scheduling, ownership, ordering, cancellation, race, and debugging cost.
        source_support:
          - {source_id: SRC-EGO, locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/008-chapter-4-how-go-uses-the-cpu-resource-or-two.md :: When to Use Concurrency", contribution: "Warns that concurrency adds cost and should not be introduced when the workload and target do not justify it.", relationship: direct_support}
          - source_id: "SRC-100GO"
            locator: "books/100-go-mistakes-and-how-to-avoid-them-teiva-harsanyi-bibis-ir/chapters/012-chapter-8-concurrency-foundations.md :: 8.2 #56: Thinking concurrency is always faster"
            contribution: "Shows scheduling and coordination overhead can dominate small work and recommends a sequential baseline before a profiled and benchmarked concurrent alternative."
            relationship: "direct_support"
        basis: {kind: source-supported, rationale: "Efficient Go's use conditions retain sequential execution as the lower-cost default."}
    hidden_assumptions:
      - Concurrency assumes exploitable independent work and downstream capacity.
      - Sequential simplicity assumes one execution path can meet the required objective.
    evidence_favoring_each_position:
      concurrent: [profiled parallel work, target miss, bounded cardinality, owned lifecycle, repeatable end-to-end gain]
      sequential: [target met, work serial by invariant, contention dominates, downstream bottleneck, gain within noise]
    decision_rule: Remove unnecessary work first; add the smallest bounded concurrency model only when representative measurement predicts and confirms a material target benefit while preserving ordering and lifecycle contracts.
