        source_support:
          - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/025-20-designing-for-performance.md :: 20: Designing for Performance", contribution: "Preserves simple, clean interfaces and representations as the default because performance and design clarity are often compatible.", relationship: refinement}
