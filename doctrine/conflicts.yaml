        basis: {kind: source-supported, rationale: "FSA supports strong component separation when the forces justify its granularity costs."}
      - id: partial-boundary
        claim: Preserve a cheaper facade or one-dimensional seam until stronger independent evolution is demonstrated.
        source_support:
          - {source_id: SRC-CA, locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/035-chapter-24-partial-boundaries.md :: Chapter 24: Partial Boundaries", contribution: "Presents partial boundaries as deliberate lower-cost alternatives that preserve selected separation benefits.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Clean Architecture directly formulates partial boundaries and their costs."}
      - id: no-boundary
        claim: Keep direct cohesive coupling when separation cost exceeds the evidenced force.
        source_support: []
        basis: {kind: derived-inference, rationale: "The cited sources compare boundary strengths but do not directly prescribe the absence of a boundary; this is the explicit no-boundary option when no protecting force is established."}
    hidden_assumptions:
      - Full boundaries assume the protected force is durable enough to repay lifecycle and crossing cost.
      - Partial boundaries assume retained scaffolding provides useful options without false confidence.
