  - conflict_id: conflict-architectural-constraint-vs-team-autonomy
    disagreement_kind: contextual
    positions:
      - id: enforced-constraint
        claim: Consequential structural, compatibility, security, or quality rules should be automatically enforced across teams.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/011-chapter-6-measuring-and-governing-architecture-characteristics.md :: Governing Architecture Characteristics", contribution: "Supports automated governance for accepted, measurable architecture characteristics whose violations have system consequences.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "FSA directly advances governance and automated enforcement for consequential architecture characteristics."}
      - id: contextual-team-autonomy
        claim: Teams should choose local implementation and structure where their drivers differ and global enforcement would freeze detail.
        source_support: []
        basis: {kind: local-policy, rationale: "The cited chapters do not directly formulate team autonomy; this position follows the doctrine's authority boundary that leaves reversible local implementation choices to their accepted owner."}
    hidden_assumptions:
      - Enforcement assumes the rule is accepted, stable, measurable, and worth coordination/tooling cost.
