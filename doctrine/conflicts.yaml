  - conflict_id: conflict-uniformity-vs-context-sensitive-design
    disagreement_kind: contextual
    positions:
      - id: repository-uniformity
        claim: Consistency lowers cognitive load, tool cost, and accidental variation.
        source_support:
          - {source_id: SRC-APOSD, locator: "books/dokumen-pub-a-philosophy-of-software-design-2nd-edition-2nbsped-173210221x-9781732102217/chapters/022-17-consistency.md :: 17: Consistency", contribution: "Treats consistency as cognitive leverage and requires significant benefit before introducing inconsistency.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "APOSD directly supports repository consistency as the default."}
      - id: local-fit
        claim: Different quality, domain, runtime, or language forces may require intentionally different structures.
        source_support:
          - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/009-chapter-4-architecture-characteristics-defined.md :: Trade-Offs and Least Worst Architecture", contribution: "Requires architecture choices to fit locally ranked characteristics and tradeoffs rather than universal uniformity.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "FSA directly supports context-specific structure where drivers differ."}
    hidden_assumptions:
      - Uniformity assumes the convention remains fit and exceptions cost more than benefits.
      - Local fit assumes divergence is explainable and will not fragment the repository.
    evidence_favoring_each_position:
      repository-uniformity: [same forces and language, established tooling, broad contributor base, low migration benefit]
      local-fit: [measurably different risk or runtime constraints, bounded context, platform idiom, convention blocks correctness or operability]
    decision_rule: Conform by default; introduce a documented local exception or migration only when distinct forces produce material benefit exceeding ecosystem and review cost.
    unresolved_questions: [A local exception can become the next convention only through explicit adoption.]
