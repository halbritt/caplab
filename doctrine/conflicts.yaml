  - conflict_id: conflict-broad-vs-narrow-characterization
    disagreement_kind: contextual
    positions:
      - id: broad-safety-net
        claim: A high-level characterization test can protect a wide poorly understood effect surface quickly.
        source_support:
          - {source_id: SRC-SDX, locator: "books/dokumen-pub-software-design-x-rays-fix-technical-debt-with-behavioral-code-analysis-1nbsped-1680502727-978-1680502725/chapters/009-chapter-4-pay-off-your-technical-debt.md :: Introduce Provisional End-to-End Tests", contribution: "Uses provisional end-to-end tests to establish broad feedback before risky changes in poorly characterized code.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Software Design X-Rays directly advances provisional broad protection when local understanding is weak."}
      - id: narrow-local-test
        claim: A focused test gives faster diagnosis, lower brittleness, and clearer preservation claims.
        source_support:
          - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/021-chapter-13-i-need-to-make-a-change-but-i-don-t-know-what-tests-to-write.md :: A Heuristic for Writing Characterization Tests", contribution: "Provides a heuristic for targeted characterization around the behavior and effect surface that an imminent change can disturb.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "WELC directly supports focused characterization as understanding and seams permit."}
    hidden_assumptions:
      - Broad protection assumes the harness is stable and its coarse oracle detects the relevant regressions.
      - Narrow protection assumes dependencies can be separated and effects identified safely.
    evidence_favoring_each_position:
      broad-safety-net: [unknown internal effects, urgent change, stable external boundary, no local seam yet]
      narrow-local-test: [known effect surface, enabling point available, fast repeated campaign, high diagnosis value]
    decision_rule: Establish the cheapest test that detects the authorized change's relevant effects; use broad protection provisionally, then add narrower tests as understanding and seams improve.
    unresolved_questions: [Some integration behavior is inherently only observable at a broad boundary.]
    roles_affected: [legacy-code-agent, refactoring-agent, debugging-and-repair-agent]
