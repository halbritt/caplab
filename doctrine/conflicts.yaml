  - conflict_id: conflict-classical-vs-london-test-isolation
    disagreement_kind: contextual
    positions:
      - id: london-mock-collaborators
        claim: Isolate the unit under test from all mutable collaborators with test doubles, verifying one class at a time so failures localize to a single class; in legacy code, substituting any dependency at a seam is a legitimate enabling move to obtain feedback.
        source_support:
          - {source_id: SRC-UT, locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/007-chapter-2-what-is-a-unit-test.md :: 2.1 The definition of \"unit test\"", contribution: "Documents the London school's reading of the contested isolation attribute - isolate the unit from all mutable collaborators and test one class at a time with doubles standing in for its neighbors - alongside the classical reading, in a split the chapter presents as live.", relationship: direct_support}
          - {source_id: SRC-WELC, locator: "books/programming-working-effectively-with-legacy-code/chapters/011-chapter-4-the-seam-model.md :: Seams", contribution: "Supplies the legacy-context variant of the substitute-freely position - any dependency, including private in-process collaborators, may be replaced at a seam to gain feedback on untested code without redesigning it.", relationship: refinement}
        basis: {kind: source-supported, rationale: "Unit Testing documents the London position as one side of a split it does not treat as settled, and WELC directly supports seam substitution as legacy-context pragmatics."}
      - id: classical-mock-unmanaged-only
        claim: Mock only shared or unmanaged out-of-process dependencies whose communications form externally observable contracts; keep private in-process collaborators and managed dependencies real, because pinning intra-system communications makes tests fragile.
        source_support:
          - {source_id: SRC-UT, locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/011-chapter-5-mocks-and-test-fragility.md :: 5.4 The classical vs. London schools of unit testing, revisited", contribution: "Advances the classical position through the fragility lens - only communications that cross the application boundary and carry backward-compatibility obligations should be verified with mocks, while intra-system communications stay real.", relationship: direct_support}
          - {source_id: SRC-UT, locator: "books/manning-unit-testing-principles-practices-and-patterns-2020-1/chapters/011-chapter-5-mocks-and-test-fragility.md :: 5.3 The relationship between mocks and test fragility", contribution: "Supplies the fragility argument - communications between classes inside the application are implementation details, so mocks that verify them couple tests to internal structure, framed through hexagonal architecture's intra- versus inter-system distinction.", relationship: direct_support}
        basis: {kind: source-supported, rationale: "Unit Testing directly argues the classical position; it is the book's advocated side and is recorded as an argued position, not neutral ground."}
    hidden_assumptions:
      - The London and seam-based position assumes internal communication patterns are stable enough to pin, or that pins are provisional with explicit status and retirement conditions.
      - The classical position assumes a codebase the team is free to design for testability, with real collaborators affordable in tests and a production-fidelity managed environment available.
    evidence_favoring_each_position:
      london-mock-collaborators: [untested legacy code where only a seam yields feedback, defect localization to a single class is the dominant need, collaborators are unbuildable or nondeterministic in the test environment, provisional status and retirement conditions are recorded]
      classical-mock-unmanaged-only: [greenfield or tested code free to keep collaborators real, managed dependencies with production-fidelity instances available for tests, refactoring resistance ranked above single-class defect localization, the communications under test cross the application boundary]
    decision_rule: Select by codebase state and dependency class - in greenfield or tested code, mock only shared or unmanaged out-of-process dependencies and keep in-process collaborators and managed dependencies real; in legacy untested code, a seam-based substitution of any dependency is a legitimate provisional enabling move whose scar carries explicit status and retirement conditions; a substitution retained past its enabling purpose is re-adjudicated as a temporary-seam-versus-durable-design question rather than promoted by omission.
    unresolved_questions: [Where a provisional legacy seam should be promoted or retired is adjudicated per conflict-temporary-seam-vs-long-term-design, and the managed/unmanaged boundary itself moves as system ownership and external consumers change.]
