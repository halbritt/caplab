  - conflict_id: conflict-caching-vs-recomputation-freshness
    disagreement_kind: contextual
    positions:
      - id: cache
        claim: Store expensive results to reduce repeated work and latency.
        source_support:
          - {source_id: SRC-FP, locator: "books/fluent-python-2nd-edition-z-lib-org/chapters/015-chapter-9-decorators-and-closures.md :: Memoization with functools.cache", contribution: "Presents memoization as a way to avoid repeated computation by retaining results under stable call arguments.", relationship: direct_support}
          - {source_id: SRC-EGO, locator: "books/efficient-go-data-driven-performance-optimization-bartlomiej-plotka-z-library/chapters/015-chapter-11-optimization-patterns.md :: Trading Space for Time", contribution: "Refines caching as an explicit exchange of memory and lifecycle complexity for reduced repeated work.", relationship: refinement}
        basis: {kind: source-supported, rationale: "Fluent Python directly demonstrates memoization and Efficient Go makes its resource tradeoff explicit."}
      - id: recompute
        claim: Recompute to preserve freshness, bound memory, and avoid invalidation/ownership complexity.
        source_support: []
        basis: {kind: derived-inference, rationale: "The cited sections support caching and its space-for-time tradeoff but do not directly prescribe recomputation; this position is retained as the explicit no-cache alternative when cache obligations are not met."}
    hidden_assumptions:
      - Caching assumes stable keys, acceptable staleness, bounded cardinality, and favorable hit rate.
      - Recompute assumes source availability and work cost meet the objective.
    evidence_favoring_each_position:
      cache: [profiled repeated cost, stable validity rule, bounded capacity, high hit rate, observable invalidation]
      recompute: [cheap work, volatile inputs, sensitive/tenant data, low reuse, retention or stampede risk]
    decision_rule: Cache only when measured avoided work exceeds memory, invalidation, consistency, privacy, and failure costs; specify key, owner, lifetime, capacity, invalidation, and fallback before implementation.
    unresolved_questions: [Distributed caches introduce a separate consistency and availability boundary.]
