  - conflict_id: conflict-choreography-vs-orchestration
    positions:
      - id: choreography
        claim: Let independently owned event handlers react without a central workflow controller.
      - id: orchestration
        claim: Give one mediator explicit responsibility for workflow state, ordering, compensation, and completion.
    hidden_assumptions:
      - Choreography assumes no actor needs authoritative global completion and emergent flow remains observable.
      - Orchestration assumes central workflow ownership is legitimate and the mediator's capacity and availability are manageable.
    evidence_favoring_each_position:
      choreography: [independent reactions, simple fan-out, no global transaction, strong event governance and observability]
      orchestration: [conditional multi-step workflow, compensation, audit, deadlines, completion query, explicit recovery owner]
    decision_rule: Choose from causal ownership and recovery semantics rather than broker fashion; use orchestration when global process state is a real domain/operational responsibility, and choreography only when local reactions remain independently correct.
    unresolved_questions: [Hybrid workflows must mark where responsibility transfers between mediator and autonomous reactions.]
    roles_affected: [architecture-agent, coding-agent, review-agent, debugging-and-repair-agent]
    source_support:
      - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Broker Topology"}
      - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/020-chapter-14-event-driven-architecture-style.md :: Mediator Topology"}

  - conflict_id: conflict-architectural-constraint-vs-team-autonomy
    positions:
      - id: enforced-constraint
        claim: Consequential structural, compatibility, security, or quality rules should be automatically enforced across teams.
      - id: contextual-team-autonomy
        claim: Teams should choose local implementation and structure where their drivers differ and global enforcement would freeze detail.
    hidden_assumptions:
      - Enforcement assumes the rule is accepted, stable, measurable, and worth coordination/tooling cost.
      - Autonomy assumes local divergence does not violate shared contracts or externalize operational cost.
    evidence_favoring_each_position:
      enforced-constraint: [cross-team invariant, regulated boundary, repeated violation, cheap reliable check, explicit owner]
      contextual-team-autonomy: [local reversible detail, distinct driver, check creates false positives, central rule has no measured consequence]
    decision_rule: Enforce only accepted consequential outcomes or forbidden dependencies at the cheapest reliable boundary; leave replaceable implementation choices local and provide an explicit exception/supersession path.
    unresolved_questions: [The same rule may be architectural for one scope and implementation detail for another.]
    roles_affected: [architecture-agent, review-agent, coding-agent, repository-assessment-agent]
    source_support:
      - {source_id: SRC-FSA, locator: "books/oreilly-fundamentals-of-software-architecture-2020-1/chapters/011-chapter-6-measuring-and-governing-architecture-characteristics.md :: Governing Architecture Characteristics"}
      - {source_id: SRC-CA, locator: "books/clean-architecture-a-craftsman-guide-to-software-structure-and-design/chapters/046-chapter-34-the-missing-chapter.md :: ENCAPSULATION"}

  - conflict_id: conflict-unified-model-vs-bounded-contexts
    positions:
      - id: unified-model
        claim: One shared model can eliminate translation and keep enterprise concepts consistent.
      - id: bounded-models
        claim: Multiple internally coherent models preserve distinct meanings, rules, ownership, and evolution.
    hidden_assumptions:
      - Unification assumes terms and invariants are genuinely the same and shared governance is affordable.
      - Bounded models assume translation and duplication cost less than a compromised universal model.
    evidence_favoring_each_position:
      unified-model: [same language and invariants, high cross-context atomicity, one owner, low semantic variation]
      bounded-models: [term/rule conflict, distinct expert groups, independent cadence, legacy/external model, specialized performance model]
    decision_rule: Attempt unification only within a scope where one language and model remain coherent; preserve distinct models across demonstrated semantic discontinuities and choose an explicit relationship for every necessary crossing.
    unresolved_questions: [Context boundaries can merge or split as domain understanding and ownership change.]
    roles_affected: [architecture-agent, domain-design-agent, coding-agent, review-agent]
    source_support:
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Unifying an Elephant"}
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Catering to Special Needs with Distinct Models"}

  - conflict_id: conflict-shared-kernel-vs-acl-vs-conformist
    positions:
      - id: shared-kernel
        claim: Jointly own a small stable overlap when teams can coordinate every change closely.
      - id: anticorruption-layer
        claim: Translate between materially different models to protect valuable local semantics.
      - id: conformist
        claim: Adopt an upstream model when leverage is absent and local translation has insufficient value.
    hidden_assumptions:
      - Shared Kernel assumes high trust, synchronized change, and truly shared semantics.
      - Anticorruption Layer assumes local model value repays translation and operational cost.
      - Conformist assumes upstream semantics are adequate and dependency risk is accepted.
    evidence_favoring_each_position:
      shared-kernel: [small overlap, strong cooperation, aligned cadence, shared tests, mutual influence]
      anticorruption-layer: [semantic mismatch, valuable local core, necessary integration, controlled translation ownership]
      conformist: [no upstream influence, acceptable model, low differentiating value, translator cost exceeds benefit]
    decision_rule: Select relationship from control, cooperation, semantic distance, local strategic value, and integration economics; never choose from diagram symmetry or reuse desire alone.
    unresolved_questions: [Relationships can change as leverage, trust, and strategic importance evolve.]
    roles_affected: [architecture-agent, domain-design-agent, legacy-code-agent, review-agent]
    source_support:
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Shared Kernel"}
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Anticorruption Layer"}
      - {source_id: SRC-DDD, locator: "books/domain-driven-design-tackling-complexity-in-the-heart-of-software-eric-evans/chapters/016-chapter-14-maintaining-model-integrity.md :: Conformist"}
