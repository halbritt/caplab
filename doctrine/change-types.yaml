schema_version: agent-doctrine-change-types/1

classification_rule: Classify work by its intended externally observable effect and risk, not by the mechanics used or the label in a ticket. If a change spans types, split it or declare a composite change with every type's authority and protection requirements.

types:
  - id: change-feature-implementation
    name: Feature implementation
    purpose: Add or deliberately alter user-, operator-, or system-visible capability.
    allowable_semantic_change: Only behavior named by accepted requirements; unrelated behavior remains protected.
    required_authority:
      - execution authority for the named feature and repository scope
      - owner selection for unresolved product, compatibility, architecture, data, or operational tradeoffs
    evidence_threshold:
      - accepted outcome and non-goals
      - repository contracts and current architecture
      - integration points, invariants, failure behavior, and compatibility surface
    required_protection:
      - tests demonstrating new behavior and material edge/failure cases
      - regression protection for affected existing contracts
      - migration and rollback evidence when state or compatibility changes
    typical_scope: Smallest coherent vertical slice that can be integrated and verified without speculative infrastructure.
    invalid_bundling:
      - unrelated cleanup or refactoring
      - dependency upgrades not required by the feature
      - silent architectural restructuring
      - unrequested behavior repair
    reclassify_when:
      - an existing accepted behavior must change
      - ownership, deployment, persistence, or public compatibility changes
    completion_proof:
      - accepted scenarios pass in the intended integration environment
      - existing preservation gates pass

  - id: change-defect-repair
    name: Defect repair
    purpose: Restore behavior to an accepted contract after identifying a causal failure.
    allowable_semantic_change: The defective behavior may change to the accepted behavior; unrelated observable behavior must remain stable.
    required_authority:
      - diagnosis authority to investigate
      - separate repair execution authority for the affected surface
      - owner decision when intended behavior is ambiguous
    evidence_threshold:
      - reproducible failure or strong incident evidence
      - accepted expected behavior
      - falsifiable causal explanation linking fault to symptom
    required_protection:
      - regression test or equivalent probe that fails before and passes after
      - checks for adjacent paths sharing the cause
      - rollback for risky operational repairs
    typical_scope: Smallest causal repair plus the minimum protection needed to prevent recurrence.
    invalid_bundling:
      - broad redesign justified only by the defect's existence
      - behavior-preserving refactoring that obscures the causal diff
      - speculative fixes for unrelated symptoms
    reclassify_when:
      - expected behavior is intentionally redefined
      - repair requires a new architectural boundary or migration
    completion_proof:
      - original symptom is absent under the reproducer
      - the causal path is exercised
      - relevant regression gates pass

  - id: change-refactoring
    name: Refactoring
    purpose: Improve internal structure while preserving the defined observable behavior boundary.
    allowable_semantic_change: None inside the declared preservation boundary; test-only or diagnostic observability may change only if explicitly allowed.
    required_authority:
      - structural write authority for the named scope
      - explicit permission for any public API, data, timing, resource, ordering, or failure-semantic change
    evidence_threshold:
      - demonstrated change, comprehension, review, defect, or operational pressure
      - recognizable structural seam and bounded target state
      - adequate preservation evidence or a characterization plan
    required_protection:
      - fast feedback for the changed surface
      - baseline for behavior, interfaces, data, and material non-functional properties
      - small reversible steps and clean checkpoints
    typical_scope: One coherent campaign that reduces a named pressure without absorbing semantic work.
    invalid_bundling:
      - feature behavior
      - defect repair hidden inside moves or renames
      - optimization without a performance contract
      - dependency upgrades or formatting churn that widen review uncertainty
    reclassify_when:
      - externally observable behavior changes
      - the campaign changes system boundaries, ownership, deployment, or persistence
    completion_proof:
      - preservation gates pass at each stable checkpoint
      - named structural pressure is measurably reduced
      - no unrelated semantic diff remains

  - id: change-architectural-restructuring
    name: Architectural restructuring
    purpose: Change system-level boundaries, dependency direction, ownership, deployment, data authority, or quality-attribute strategy.
    allowable_semantic_change: Only explicitly authorized architectural and behavioral consequences; compatibility and operational effects must be named.
    required_authority:
      - owner selection and authorization for affected architectural drivers
      - execution authority spanning every affected repository, service, data store, and environment
    evidence_threshold:
      - concrete architectural driver expressed as scenarios or recurring change pressure
      - current-boundary failure and no-change analysis
      - alternatives, introduced costs, reversal cost, and operational consequences
    required_protection:
      - decision record and fitness criteria
      - staged compatibility and data plan
      - observability, rollback, and failure-containment proof
      - representative end-to-end validation
    typical_scope: Incremental architectural slice or strangler boundary with an independently verifiable outcome; broad rewrites require exceptional evidence.
    invalid_bundling:
      - cosmetic package reorganization presented as architecture
      - feature work that silently establishes a permanent platform
      - migration without dual-state and rollback semantics
      - mass cleanup that makes causal review impossible
    reclassify_when:
      - only local internal structure changes
      - deployment or data transition dominates the work, requiring migration classification too
    completion_proof:
      - fitness criteria and preservation scenarios pass
      - ownership and operations are executable, not merely diagrammed
      - obsolete path has an authorized retirement state

  - id: change-migration
    name: Migration
    purpose: Move code, data, traffic, protocol, runtime, or users between representations or operating states.
    allowable_semantic_change: Transition behavior and compatibility may change only according to the migration contract; business semantics remain protected unless separately authorized.
    required_authority:
      - authority over source, destination, transition mechanism, and retirement
      - data/operations owner approval for irreversible or production transitions
    evidence_threshold:
      - source and target invariants
      - compatibility window and mixed-version behavior
      - volume, duration, failure, retry, and rollback scenarios
    required_protection:
      - rehearsal or representative fixture
      - idempotency or explicit non-repeatability controls
      - reconciliation and integrity checks
      - observable progress, pause, rollback, and recovery
    typical_scope: Staged prepare, transition, verify, and retire phases with explicit dual-state duration.
    invalid_bundling:
      - unrelated domain redesign
      - cleanup of the old path before transition acceptance
      - dependency upgrade whose failure cannot be distinguished from migration failure
    reclassify_when:
      - data meaning changes
      - the target introduces new architecture, operations, or public behavior
    completion_proof:
      - target invariants and reconciliation pass
      - traffic/users/data are at the declared state
      - rollback or retirement decision is recorded

  - id: change-optimization
    name: Optimization
    purpose: Improve a measured resource or service objective while preserving required semantics.
    allowable_semantic_change: None unless the owner explicitly selects a quality tradeoff such as precision, freshness, fairness, ordering, durability, or resource cost.
    required_authority:
      - profiling and benchmark authority for the target environment
      - execution authority for the optimized surface
      - owner selection for quality or cost tradeoffs
    evidence_threshold:
      - quantified objective and representative baseline
      - profile locating relevant resource consumption
      - benchmark capable of detecting the target improvement and regressions
    required_protection:
      - semantic regression tests
      - statistically defensible before/after measurement
      - resource and tail-behavior checks, not only average speed
    typical_scope: Highest-leverage measured bottleneck, preferring algorithm/data-flow improvements before fragile micro-specialization.
    invalid_bundling:
      - speculative performance cleanup
      - concurrency introduced without a workload and correctness model
      - broad refactoring whose performance effect cannot be isolated
    reclassify_when:
      - visible behavior or quality is traded
      - the main change is deployment or architecture rather than implementation
    completion_proof:
      - objective improves beyond noise on representative workloads
      - semantics and non-target resource budgets pass
      - regression threshold is retained where stable

  - id: change-cleanup
    name: Cleanup
    purpose: Remove low-risk local friction that does not alter intended behavior or architecture.
    allowable_semantic_change: None.
    required_authority:
      - write authority for the named cleanup scope
      - generated or vendored ownership rules must permit edits
    evidence_threshold:
      - concrete local defect such as dead artifact, stale comment, mechanical inconsistency, or obsolete reference
      - evidence that the item is not authoritative or used
    required_protection:
      - repository checks proportionate to the surface
      - search for references and generation provenance
    typical_scope: Small, mechanically reviewable, and separable from functional work.
    invalid_bundling:
      - taste-driven rewrites
      - large formatting churn with behavior changes
      - deletion or dependency changes without their stronger gates
    reclassify_when:
      - behavior, public API, dependency graph, or architecture changes
      - removal has compatibility or operational consequences
    completion_proof:
      - target friction is gone
      - repository gates pass
      - no authoritative/generated source was bypassed

  - id: change-deletion
    name: Deletion
    purpose: Remove code, data, configuration, dependency, API, or operational path that is demonstrably obsolete.
    allowable_semantic_change: Only removal explicitly covered by the retirement or compatibility contract.
    required_authority:
      - ownership authority for the removed surface
      - compatibility/data/operations approval where consumers or recovery paths may exist
    evidence_threshold:
      - reference and runtime-use analysis
      - ownership and support-window status
      - replacement, archive, or recovery obligations
    required_protection:
      - consumer checks across static, dynamic, generated, and external references
      - backup or recovery proof for durable state
      - staged disablement for high-risk paths
    typical_scope: One retirement unit with proof that its callers, data, and operations have transitioned.
    invalid_bundling:
      - deletion inferred solely from static unreachability
      - old-path removal in the same unverified step as migration
      - unrelated cleanup obscuring what was retired
    reclassify_when:
      - replacement behavior is introduced
      - persistent data is transformed rather than simply retired
    completion_proof:
      - no authorized consumer requires the surface
      - recovery/retention obligations are met
      - monitoring shows no forbidden fallback or use

  - id: change-dependency-upgrade
    name: Dependency upgrade
    purpose: Change a direct or transitive dependency version, provenance, configuration, or provider.
    allowable_semantic_change: Only documented and accepted compatibility changes; application behavior remains protected by default.
    required_authority:
      - dependency and lockfile write authority
      - security, legal, platform, or operations approval when relevant
    evidence_threshold:
      - reason for upgrade and affected dependency paths
      - release notes, compatibility, advisory, license, and runtime requirements
      - repository-specific usage and migration impact
    required_protection:
      - deterministic resolution and provenance checks
      - tests exercising repository use rather than package installation alone
      - rollback or pin strategy
    typical_scope: One coherent dependency family or required compatibility set.
    invalid_bundling:
      - opportunistic mass upgrades
      - source refactoring that hides compatibility failures
      - migration or runtime changes not required by the upgrade
    reclassify_when:
      - provider replacement changes architecture or operations
      - update requires data/protocol migration
    completion_proof:
      - resolved artifacts match intent
      - relevant behavior and build/release targets pass
      - new requirements are documented

  - id: change-operational-hardening
    name: Operational hardening
    purpose: Improve detection, containment, recovery, durability, security, or safe operation under failure.
    allowable_semantic_change: Failure behavior may change only according to explicit operational and product policy; happy-path semantics remain protected.
    required_authority:
      - execution authority for code and operational surfaces
      - owner approval for alerting, retention, security, availability, cost, and failure-policy changes
    evidence_threshold:
      - named threat or failure scenario
      - current detection/recovery gap
      - operational ownership and response capability
    required_protection:
      - failure injection or controlled scenario test where safe
      - observability and runbook proof
      - rollback and blast-radius controls
    typical_scope: One failure mode or control loop from detection through recovery.
    invalid_bundling:
      - adding telemetry without an owner or action
      - retry, timeout, or concurrency changes without causal and load analysis
      - security theater unsupported by a threat model
    reclassify_when:
      - normal product behavior changes
      - deployment topology or data ownership changes architecturally
    completion_proof:
      - named scenario is detected, contained, and recoverable within criteria
      - operations can execute the documented response

  - id: change-documentation-repair
    name: Documentation repair
    purpose: Align human- or machine-facing documentation with accepted current behavior and contracts.
    allowable_semantic_change: Documentation semantics may change; implementation behavior and accepted decisions do not change merely because prose changes.
    required_authority:
      - documentation write authority
      - owner approval when changing a normative contract rather than repairing drift
    evidence_threshold:
      - current executable or accepted source of truth
      - identified contradiction, omission, stale instruction, or broken reference
    required_protection:
      - commands, paths, API names, links, and examples verified where feasible
      - normative versus explanatory text distinguished
    typical_scope: Smallest coherent document set needed to remove contradiction.
    invalid_bundling:
      - implementation change smuggled in to make documentation true
      - changing accepted policy under a drift-repair label
      - generated documentation edited outside its generator
    reclassify_when:
      - the accepted contract itself changes
      - examples require functional implementation
    completion_proof:
      - documentation agrees with current accepted evidence
      - references and executable examples pass applicable checks

bundling_rules:
  - rule: Defect repair and refactoring should be separate checkpoints; if preparatory structure is unavoidable, preserve the failing reproducer and show the repair in a distinct diff.
  - rule: Optimization must be isolated from broad refactoring so benchmark causality remains interpretable.
  - rule: Migration preparation, transition, verification, and deletion are distinct states; do not retire the source path before transition acceptance.
  - rule: Dependency upgrades should be isolated from feature and cleanup work unless an indivisible compatibility set is documented.
  - rule: Architectural restructuring may contain local refactoring, migration, or deletion, but each embedded type retains its own authority and verification gates.
  - rule: Documentation repair may accompany a change only when the documentation diff clearly distinguishes description of the authorized change from unrelated drift cleanup.
