schema_version: agent-doctrine-traceability/1
corpus_snapshot_date: 2026-07-10
coverage_definition:
  unit: Every Markdown file under each registered source's chapters directory, including front matter, part dividers, indexes, bibliographies, and other files that may be classified as non-substantive evidence.
  expected_units: 378
  covered_units: 378
  exclusions: []
  note: The 520 Markdown files under books include 19 per-book README files plus books/README.md; those repository navigation files are not source chapters, and the chapter files of the seven converted-but-unregistered books are outside doctrine coverage until their sources are registered.

